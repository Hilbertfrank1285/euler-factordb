// A snapshot of every function in sandbox 1, taken the moment it is built.
//
// no-stub-leaks compared only sandbox 2, so a stub left behind in sandbox 1 — which
// is where loadECM, factorizeSmall, getCofactor and tryResolveCompositeViaFDB all
// live — went unnoticed until some later group failed for a reason that had nothing
// to do with it. That is a long way from the stub to the symptom.
//
// Snapshotting is what makes the check independent of try/finally. Fifteen groups
// restore on their last line, so any of them throwing leaks; asking each author to
// remember try/finally is a rule that gets forgotten, whereas comparing against a
// snapshot catches the leak however it happened.
const SANDBOX1_SNAPSHOT = new Map(
  Object.entries(sandbox).filter(([, v]) => typeof v === 'function'));

const { parseFactorExpr, isProbablePrime, isPrime, labelFactor, applyFdbResult, replayFDBCache, migrateBogusCofactorFactors, runDataIntegrityCheck, fixIntegrityIssues, sieveSmallFactors, ensurePrimeTree, markVerifiedComplete, clearVerifiedComplete, isVerifiedComplete, markSubmitted, reconcileSubmitted, loadSubmitted, factorDividesValue, recordEcmFactor,
        ecmOptimalCurves, ecmProbability, curvesForProb, optimalB1,
        dickmanRho, pm1Probability, bestPm1Prob, ecmProbForDigit, factorizeSmall } = sandbox;

// factorizeSmall: splits composites into primes, products check out
{
  const f = factorizeSmall(53359696078967n);
  const prod = f.reduce((a, b) => a * b, 1n);
  ok(prod === 53359696078967n, 'factorizeSmall product equals input');
  ok(f.every(p => isProbablePrime(p)), 'factorizeSmall returns only primes');
  ok(f.length === 3, 'factorizeSmall splits 53359696078967 into 3 primes');
}
{
  const p = factorizeSmall(999999999989n); // a prime
  ok(p.length === 1 && p[0] === 999999999989n, 'factorizeSmall leaves a prime intact');
  const pw = factorizeSmall(60n);
  ok(pw.reduce((a,b)=>a*b,1n) === 60n, 'factorizeSmall handles small composites (60)');
}

