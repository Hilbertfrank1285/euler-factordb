    // Read from index.html, not hard-coded, so a change to a target reaches the tests.
    extractConst('COST_TARGET_LO'),
    extractConst('COST_TARGET_HI'),
    extractFn('ecmLevels'),
    'const _dickmanCache = new Map();',
  'let _yieldCalibCache = null;',
  extractConst('YIELD_CALIB_MIN_FINDS'),
  extractConst('COMPLETION_CONF'),
  extractConst('DATA_DIR'),
  extractConst('CHUNK_N'),
  extractConst('META_PATH'),
  extractConst('PER_N_MAPS'),
  extractConst('PER_N_ROWS'),
  extractConst('inRanges'),
    'const PM1_LEVEL_TARGET = 0.63;',
    'let _calibFactorCache = 1;',
    // calibration is tested separately; 1 unless a test sets a machine's own factor
    'let _calibForTest = 1; function calibFactor(){ return _calibForTest; } function setCalibForTest(x){ _calibForTest = x; }',
    'function loadCalib(){ return { s: [] }; }',
    'function logSwallowed(){}',
    'function timeCorrections(){ return null; }',      // nothing learned: the overall factor applies
    ...names.map(extractFn),
    // Also expose an un-truncated variant. recommendNextRun returns only the top
