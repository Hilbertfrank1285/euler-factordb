    'ecmProbability','ecmProbabilityWithI','ecmProbForDigit','curvesForProb','optimalB1',
    '_pm1ProbabilityRaw','pm1Probability','bestPm1Prob','b1ToDigits','pm1ToDigits','pFactorExists','ecmDefaultB2','pm1DefaultB2',
    'estimateCpuSecondsRaw','estimateCpuSeconds','attemptCpuSeconds','allMeasured','computeCostToFinish','ecmLevels','ecmProbForDigit','bestPm1Prob','parseRunBudget','fillRunBudget','fmtCpuTime','yieldCalibration','yieldCalibFor','pFactorExistsCalibrated','invalidateYieldCalib','scheduleYieldCalibWarm','setYieldCalib',
    'fmtB1','fmtCurves','fmtPct','fmtCpuTime','recommendNextRun'];
  const body = [
    'const _b1EffMemo = new Map(); const B1EFF_MEMO_MAX = 200000; const _pm1ProbMemo = new Map(); const PM1PROB_MEMO_MAX = 200000; ' + (src.match(/const RHO_H = [^;]+;/) || [''])[0] + ' let _rhoLog = null;',
    (src.match(/const ECM_TABLE = \[[\s\S]*?\];/) || [''])[0],
