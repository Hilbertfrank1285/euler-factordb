// ── importing FactorDB results: each E(n) converted once ───────────────────────
// A full import took ~5 minutes: every factor check converted the entry's E(n) — up to
// 60,000 digits, ~2.6 ms each — from scratch, a dozen times per entry. 70% of the time.
group('import-converts-each-value-once', () => {
  if (!needs(PURE, 'bigOfDecimal')) return;
  const f = PURE.bigOfDecimal;
  f._m = new Map();
  const long = '9'.repeat(400) + '7';
  ok(f('12345') === 12345n, 'a short decimal converts exactly');
  ok(f(long) === BigInt(long), 'and so does a long one');
  ok(f('12x45') === null && f('9'.repeat(300) + 'x') === null, 'anything that is not a decimal number is null, short or long');
  // BigInt itself accepts these — '' even becomes 0, which every factor "divides".
  ok(f('0x1F') === null && f('') === null && f(' 12') === null, 'nor hex, an empty value or spaces, which BigInt itself would accept');
  f._m = new Map();
  f(long); f(long); f(long);
  eq(f._m.size, 1, 'a long value asked for again is remembered, not converted again');
  for (let i = 0; i < 20; i++) f('8'.repeat(300) + String(i).padStart(2, '0'));
  ok(f._m.size <= 8, 'and only the last few are kept, so memory stays small');
  const srcI = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  ok(/const v = bigOfDecimal\(valStr\);\s*\n\s*if \(v == null\) return null;/.test(srcI) && !/return BigInt\(valStr\) % b === 0n;/.test(srcI),
     'checking a factor uses the remembered E(n), not a fresh conversion');
  ok(/const v = bigOfDecimal\(valStr\);\s*\n\s*if \(v == null\) return \{ factors: list \|\| \[\], clamped: 0, dropped: 0 \};/.test(srcI),
     'so does checking factor powers');
  ok(/if \(\+\+done % 250 === 0\) \{\s*\n\s*setStatus\('Importing FactorDB results — '[\s\S]{0,160}await new Promise\(r => setTimeout\(r, 0\)\);/.test(srcI),
     'the import says how far it has got, and keeps the page alive');
});

// ── a composite answer never erases your factors ───────────────────────────────
// FactorDB answered C — "composite, nothing known" — for 114 entries whose factors your
// ECM had found the day before (FactorDB had not heard of them yet). The import kept the
// factors but took C as given, and a push leaves a C record's factors out: the push
// guard caught 121 factors about to be erased from GitHub. Its "restore from GitHub
// first" could not have helped — the restore kept C — and the push then went ahead
// without checking again.
group('composite-answer-never-erases-factors', () => {
  if (!needs(M, 'mergeFactorRecords', 'buildSyncPayload', 'saveFDBCache', 'repairCompositeRecords')) return;
  if (!needs(PURE, 'pushLosses', 'factorsFromPayload')) return;
  // This group borrows both sandboxes' records and storage — and gives them back.
  const keep = {
    ls1: Object.assign({}, sandbox.__ls), entries: sandbox.allEntries.slice(), cache1: Object.assign({}, sandbox.fdbCache),
    ls2: Object.assign({}, sb2.__ls), cache2: sb2.fdbCache, factors2: sb2.fdbFactors,
    ev: Object.fromEntries([42, 44, 46, 48, 50, 52, 54].map(n => [n, [n in sb2.eulerValues, sb2.eulerValues[n]]])),
    // The stored records sit behind an in-memory copy (_kv), so they are put back
    // through kvSet as well — restoring the storage object alone leaves that copy
    // holding this group's records, and a later load would pause all saving.
    kv2: M.kvGet('eulerFDB_v1'),
    kv1: typeof sandbox.kvGet === 'function' ? sandbox.kvGet('eulerFDB_v1') : undefined,
  };
  try {
    const f = '1000003';
    const V = (1000003n * (10n ** 59n + 1n)).toString();
    const fresh = (entry, rec) => {
      sandbox.allEntries.length = 0; for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
      sandbox.allEntries.push(entry); if (rec) sandbox.fdbCache[V] = rec;
    };
    // the import
    fresh({ n: 9998, val: V, status: 'partial', factors: [f] }, { status: 'CF', factors: [f], n: 9998, timestamp: 1 });
    applyFdbResult({ status: 'C', factors: [[V, 1]] }, 9998, V);
    eq(sandbox.fdbCache[V].status, 'CF', "FactorDB's C while your own factor is kept is recorded as CF");
    eq(sandbox.fdbCache[V].factors, [f], 'with your factor — and without the number itself as a "factor"');
    ok(sandbox.allEntries[0].factors.includes(f), 'and the entry keeps it too');
    fresh({ n: 9998, val: V, status: 'composite', factors: [] });
    applyFdbResult({ status: 'C', factors: [[V, 1]] }, 9998, V);
    eq([sandbox.fdbCache[V].status, sandbox.fdbCache[V].factors], ['C', []],
       'with nothing known, C stays C — and no "factor" equal to the number is stored');
    // the merge
    const m = M.mergeFactorRecords({ status: 'C', factors: [f], timestamp: 2000 }, { status: 'CF', factors: [f], timestamp: 1000 }, V);
    eq([m.status, m.factors], ['CF', [f]], 'a merge holding factors is CF, even when the newer side said C');
    // the push
    sb2.eulerValues[42] = V; sb2.fdbFactors = {};
    M.saveFDBCache({ [V]: { n: 42, status: 'C', timestamp: 5, factors: [f] } });
    let rec = M.buildSyncPayload().fdbCache['42'];
    eq([rec.status, rec.factors], ['CF', [f]], 'a C record holding factors goes out as CF, WITH them');
    const none = { runs: new Set(), entries: new Set() };
    eq(PURE.pushLosses({ ecm: {}, factors: { '42': [f] } }, {}, PURE.factorsFromPayload(M.buildSyncPayload()), none).factors.length, 0,
       'so the push guard finds nothing lost — this was the 121-factor alarm');
    M.saveFDBCache({ [V]: { n: 42, status: 'C', timestamp: 5, factors: [V] } });
    rec = M.buildSyncPayload().fdbCache['42'];
    ok(rec.status === 'C' && !rec.factors, 'a C record holding only the number itself still goes out as plain C');
    // the repair at start
    const V2 = (7n * (10n ** 61n + 1n)).toString(), V3 = (13n * (10n ** 63n + 1n)).toString(), P = '1000000007';
    sb2.fdbFactors = {};
    const V4 = (17n * (10n ** 65n + 1n)).toString(), V5 = (19n * (10n ** 67n + 1n)).toString(), V6 = (23n * (10n ** 69n + 1n)).toString();
    sb2.eulerValues[44] = V2; sb2.eulerValues[46] = V3; sb2.eulerValues[48] = P;
    sb2.eulerValues[50] = V4; sb2.eulerValues[52] = V5; sb2.eulerValues[54] = V6;
    sb2.fdbCache = {
      [V4]: { status: 'CF', factors: ['17', V4], n: 50 },
      [V5]: { status: 'FF', factors: ['19', V5], n: 52 },
      [V6]: { status: 'CF', factors: [V6], n: 54 },
      [V]:  { status: 'C',  factors: [f], n: 42 },
      [V2]: { status: 'C',  factors: [V2], n: 44 },
      [V3]: { status: 'CF', factors: ['13'], n: 46 },
      [P]:  { status: 'P',  factors: [P], n: 48 },
    };
    const r = M.repairCompositeRecords();
    eq([sb2.fdbCache[V].status, sb2.fdbCache[V].factors], ['CF', [f]], 'the repair makes a C record holding factors CF');
    eq([sb2.fdbCache[V2].status, sb2.fdbCache[V2].factors], ['C', []], 'and removes the number itself listed as a "factor"');
    eq([sb2.fdbCache[V3].status, sb2.fdbCache[P].status, sb2.fdbCache[P].factors], ['CF', 'P', [P]], 'leaving everything else alone — a prime included');
    // E(n) itself beside real factors — 90 CF records on GitHub carried one, ~57,000
    // digits each, after going C [E(n)] and then gaining sieve or ECM finds.
    eq([sb2.fdbCache[V4].status, sb2.fdbCache[V4].factors], ['CF', ['17']], 'E(n) itself beside a real factor goes from a CF record…');
    eq([sb2.fdbCache[V5].status, sb2.fdbCache[V5].factors], ['FF', ['19']], '…and from any other status');
    eq([sb2.fdbCache[V6].status, sb2.fdbCache[V6].factors], ['C', []], 'a CF record holding only E(n) itself knows nothing: it is C');
    eq([r.fixed, r.selfDropped], [1, 4], 'and says what it did');
    // Read back from storage, as a reload would — a repair kept only in memory would
    // be undone at the next start.
    M.flushFDBCache(); sb2.fdbFactors = {};
    const back = M.loadFDBCache();
    eq([back[V].status, back[V].factors, back[V2].factors || [], back[V4].factors], ['CF', [f], [], ['17']], 'and saves it, so the repair survives a reload');
    eq(M.repairCompositeRecords().fixed, 0, 'running it again changes nothing');
    const srcR = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
    ok(/try \{ repairCompositeRecords\(\); \}/.test(srcR), 'it runs at every start');
    // the guard checks again after restoring
    ok(/pullBothFromGitHub\(\)\) return stop\('Push stopped: could not fetch GitHub\\'s version to restore from[^\n]*\n[\s\S]{0,260}const L2 = pushLosses\([\s\S]{0,120}if \(L2\.runs\.length \|\| L2\.factors\.length\) \{\s*\n\s*return stop\(/.test(srcR),
       'after restoring from GitHub, the guard checks again and refuses to push a loss that is still there');
  } finally {
    try { if (typeof sandbox.flushFDBCache === 'function') sandbox.flushFDBCache(); } catch (e) {}
    try { M.flushFDBCache(); } catch (e) {}
    for (const k of Object.keys(sandbox.__ls)) delete sandbox.__ls[k];
    Object.assign(sandbox.__ls, keep.ls1);
    sandbox.allEntries.length = 0; sandbox.allEntries.push(...keep.entries);
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    Object.assign(sandbox.fdbCache, keep.cache1);
    sb2.__ls = keep.ls2; sb2.fdbCache = keep.cache2; sb2.fdbFactors = keep.factors2;
    for (const [n, [had, v]] of Object.entries(keep.ev)) { if (had) sb2.eulerValues[n] = v; else delete sb2.eulerValues[n]; }
    M.kvSet('eulerFDB_v1', keep.kv2 == null ? '{}' : keep.kv2);
    if (keep.kv1 !== undefined) sandbox.kvSet('eulerFDB_v1', keep.kv1 == null ? '{}' : keep.kv1);
  }
});

// ── commands to run: one line each, with a Copy button ─────────────────────────
// The exports showed their commands in a browser alert, split with a backslash over
// two lines — awful to copy, and a backslash continuation does not paste into Windows.
groupAsync('run-commands-copy-cleanly', async () => {
  if (!needs(PURE, 'runDialogHtml', 'copyCommand')) return;
  const { runDialogHtml, copyCommand } = PURE;
  const cmds = ['python3 euler.py check a.txt -o b.json --limit 5', 'python3 euler.py check a.txt -o b.json --resume'];
  const html = runDialogHtml('Exported <2> entries', cmds.map((c, i) => ({ label: 'Step ' + i, cmd: c })), 'Then import.');
  for (const c of cmds) {
    eq(html.split('<code class="run-cmd" title="Click to select it all">' + c + '</code>').length - 1, 1, 'each command is shown once, in its own box: ' + c.slice(-9));
    ok(html.includes('data-cmd="' + c + '"'), 'with a Copy button holding exactly that command');
  }
  ok(html.includes('Exported &lt;2&gt; entries'), 'the text around them is escaped');
  ok(runDialogHtml('', [{ label: 'x', cmd: 'echo <b>"hi"</b>' }], '').includes('data-cmd="echo &lt;b&gt;&quot;hi&quot;&lt;/b&gt;"'), 'and so is a command');
  // the copy button
  const btn = { dataset: { cmd: cmds[1] }, textContent: 'Copy' };
  let got = null;
  await copyCommand(btn, { writeText: async (s) => { got = s; } }, 0);
  eq([got, btn.textContent], [cmds[1], 'Copied ✓'], 'Copy puts exactly the command on the clipboard, and says so');
  const b2 = { dataset: { cmd: cmds[0] }, textContent: 'Copy' };
  await copyCommand(b2, null, 0);
  eq(b2.textContent, 'Press Ctrl+C', 'with no clipboard it selects the command instead, and says what to press');
  const b3 = { dataset: { cmd: cmds[0] }, textContent: 'Copy' };
  await copyCommand(b3, { writeText: async () => { throw new Error('denied'); } }, 0);
  eq(b3.textContent, 'Press Ctrl+C', 'and when the clipboard refuses, it never claims a copy');
  // the two exports
  const srcC = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const fnBody = (name) => { const a = srcC.indexOf('function ' + name + '('); return srcC.slice(a, srcC.indexOf('\n}\n', a)); };
  const list = fnBody('exportFDBCheckList'), sub = fnBody('exportFDBSubmission');
  const m = /const check = '([^'\n\\]+)';/.exec(list);
  ok(m && /^python3 euler\.py check fdb_numbers\.txt --labels fdb_labels\.txt -o fdb_results\.json$/.test(m[1]),
     'the check command is one line, with no backslash');
  ok(/\[\{ label: 'Run it — on any machine with Python 3:', cmd: check \}\]/.test(list) && !/--limit 5/.test(list) && !/cmd: check \+ ' --resume'/.test(list),
     'one command — no trial run, and no --resume, which would reuse the answers of an old results file left in the folder');
  ok(/if it is interrupted, run the same line with --resume added to carry on/.test(list), '--resume is mentioned only for what it is for: carrying on after an interruption');
  ok(/showRunDialog\('FactorDB check list exported'/.test(list) && /showRunDialog\('FactorDB submission exported'/.test(sub),
     'both exports show a dialog with Copy buttons…');
  ok(!/alert\('Exported ' \+ entries\(picked\.length\)/.test(list) && !/alert\(msg \+/.test(sub), '…not a browser alert');
  ok(/cmd: 'python3 euler\.py submit factordb_submission\.txt --commit'/.test(sub), 'the submit command is one line too, --commit included');
  ok(/\.run-cmd \{[^}]*white-space: nowrap;[^}]*user-select: all;/.test(srcC), 'a command never wraps, and one click selects all of it');
});

// ── running an ECM export: per machine, and copyable ──────────────────────────
// RUN_ON_SERVER.txt used machine 1's file names with the TOTAL core count: for
// "24,16,8" it copied only machine 1's files, expected 96 where 48 exist, started
// workers 1–48 on a 24-core box, and never mentioned machines 2 and 3. And the export
// showed no dialog at all, so its commands had to be copied out of that file.
group('ecm-run-steps-per-machine', () => {
  if (!needs(PURE, 'serverNotes', 'ecmRunSteps', 'runDialogHtml')) return;
  const { serverNotes, ecmRunSteps, runDialogHtml } = PURE;
  const sh3 = serverNotes(true, [24, 16, 8], '.sh');
  ok(/MACHINE 2 OF 3 — 16 CORES/.test(sh3) && /MACHINE 3 OF 3 — 8 CORES/.test(sh3), 'several machines: a section each');
  ok(/scp ecm_numbers_m2_c\*\.txt ecm_worker_m2_c\*\.sh you@server/.test(sh3) && /scp you@server:~\/ecm\/ecm_import_m3_c\*\.txt \./.test(sh3),
     "each copies up its own files, and brings back its own results");
  ok(['1', '2', '3'].every(m => sh3.includes('for f in ecm_worker_m' + m + '_c*.sh; do setsid bash "$f"'))
     && /pgrep -c ecm\s+# expect 24\n/.test(sh3) && /pgrep -c ecm\s+# expect 16\n/.test(sh3) && /pgrep -c ecm\s+# expect 8\n/.test(sh3)
     && !/pgrep -c ecm\s+# expect 48/.test(sh3),
     'each machine starts its own worker files, and expects its own count — never 48 on a 24-core box');
  ok(/expect 48\n/.test(sh3) && /expect 32\n/.test(sh3) && /expect 16\n/.test(sh3) && !/expect 96/.test(sh3), 'and expects its own file count');
  eq((sh3.match(/Do NOT re-run these scripts/g) || []).length, 1, 'the closing advice is said once');
  const win2 = serverNotes(false, [4, 2], '.bat');
  ok(/start "" ecm_worker_m2_c2\.bat/.test(win2) && !/ecm_worker_m1_c5\.bat/.test(win2) && /\(4 files\)/.test(win2),
     'Windows too: machine 2 starts its own two workers, and no file that does not exist');
  // the dialog's steps
  const cmds = (st) => st.filter(x => x.cmd).map(x => x.cmd);
  const one = ecmRunSteps(true, [8], '.sh');
  ok(!one.some(x => x.heading), 'one machine: no headings');
  ok(cmds(one).includes('for f in ecm_worker_m1_c*.sh; do setsid bash "$f" > "${f%.sh}.log" 2>&1 < /dev/null & done'),
     'all eight workers start from one line, detached, each logging to a file named after it');
  ok(cmds(one).every(c => !/\n|\\$/.test(c)), 'every command is one line, with no backslash continuation');
  for (const c of cmds(one))
    ok(serverNotes(true, [8], '.sh').includes(c), 'and says what RUN_ON_SERVER.txt says: ' + c.slice(0, 28));
  const three = ecmRunSteps(true, [24, 16, 8], '.sh');
  eq(three.filter(x => x.heading).map(x => x.heading), ['Machine 1 of 3 — 24 cores', 'Machine 2 of 3 — 16 cores', 'Machine 3 of 3 — 8 cores'], 'several machines: a heading each');
  ok(cmds(three).includes('for f in ecm_worker_m2_c*.sh; do setsid bash "$f" > "${f%.sh}.log" 2>&1 < /dev/null & done'), "machine 2's own loop, over its own files");
  const w4 = ecmRunSteps(false, [4], '.bat');
  eq(cmds(w4), ['for /L %i in (1,1,4) do start "" ecm_worker_m1_c%i.bat'], 'Windows: one line starts every worker');
  ok(w4.some(x => /Command Prompt/.test(x.label || '') && /not PowerShell/.test(x.label || '')), 'and says where to type it — it does not work in PowerShell');
  eq(cmds(ecmRunSteps(false, [1], '.bat')), ['start "" ecm_runs.bat'], 'a one-core export starts its plain-named script');
  eq(cmds(ecmRunSteps(false, [4, 1], '.bat'))[1], 'start "" ecm_worker_m2_c1.bat', "a one-core machine in a larger export starts its own file");
  const sh1 = cmds(ecmRunSteps(true, [1], '.sh'));
  ok(sh1.includes('scp ecm_numbers.txt ecm_runs.sh you@server:~/ecm/') && sh1.includes('for f in ecm_runs.sh; do setsid bash "$f" > "${f%.sh}.log" 2>&1 < /dev/null & done') && !sh1.some(c => /_m1_c/.test(c)),
     'one core on Linux: the plain names, nothing per-core');
  // shown as a dialog
  const html = runDialogHtml('x', three, 'y');
  eq((html.match(/class="run-copy"/g) || []).length, cmds(three).length, 'a Copy button for every command, and none for plain text');
  ok(html.includes('<div class="run-heading">Machine 2 of 3 — 16 cores</div>'), 'headings are shown');
  ok(runDialogHtml('', [{ heading: 'm <1>' }], '').includes('<div class="run-heading">m &lt;1&gt;</div>'), 'and escaped like everything else');
  ok(runDialogHtml('', [{ label: 'a <b>' }], '').includes('<p class="run-text">a &lt;b&gt;</p>'), 'a step with nothing to run is plain, escaped text');
  const srcE = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  ok(/setStatus\(msg, 'ok'\);\s*\n\s*\/\/[^\n]*\n\s*showRunDialog\('ECM runs exported', msg \+ '\.', ecmRunSteps\(isSh, coresPerMachine, ext, \{ login, localWin \}\),/.test(srcE),
     'the ECM export shows them, built from the same platform, cores and extension as its scripts — and your server and computer');
});

// ── P±1 finds on the yield report's P±1 row ───────────────────────────────────
// They are recorded as 'p' since the log import learned to tell, and the report
// skipped every 'p' before reaching its P±1 count — the row showed too few finds,
// so too high a cost per find.
group('yield-counts-pm1-finds', () => {
  if (!needs(M, 'computeYieldByLevel', 'recordDiscovery', 'saveHistory', 'loadHistory')) return;
  const keep = { hist: M.loadHistory().slice(), loadECM: sb2.loadECM, entries: sb2.allEntries, cache: sb2.fdbCache };
  try {
    M.saveHistory([]);
    sb2.allEntries = [{ n: 6, val: '9'.repeat(200), factors: ['1000003', '10000019'] }];
    sb2.fdbCache = {};
    sb2.loadECM = () => ({ '6': [
      { method: 'ECM', b1: '250000', curves: '100', date: '2026-08-01' },
      { method: 'P-1', b1: '1000000000', curves: '1', date: '2026-09-01' } ] });
    M.recordDiscovery(6, '1000003', 'p');     // a P±1 find, saying so
    M.recordDiscovery(6, '10000019', 'e');    // an ECM find on the same number
    const y = M.computeYieldByLevel();
    eq(y.pm1.finds, 1, 'a P±1 find counts on the P±1 row');
    eq(y.levels.reduce((s, L) => s + L.finds, 0), 1, 'and is not credited to an ECM level — only the ECM find is');
    eq(y.totalFinds, 2, 'both are your finds');
  } finally {
    M.saveHistory(keep.hist); sb2.loadECM = keep.loadECM; sb2.allEntries = keep.entries; sb2.fdbCache = keep.cache;
  }
});

// ── the push guard: E(n) itself is never a loss ───────────────────────────────
// The repair removes E(n) itself from records that hold it beside real factors. GitHub
// still holds it until the next push — without the values, the guard would call each
// one a lost factor and stop the push, the same warning as before, for 90 "factors".
group('push-guard-ignores-the-number-itself', () => {
  if (!needs(PURE, 'pushLosses')) return;
  const V = '9'.repeat(80) + '1', none = { runs: new Set(), entries: new Set() };
  const base = { ecm: {}, factors: { '42': ['7', V] } };
  eq(PURE.pushLosses(base, {}, { '42': ['7'] }, none, { '42': V }).factors.length, 0, 'E(n) itself missing here is no loss');
  eq(PURE.pushLosses(base, {}, { '42': ['7'] }, none).factors.length, 1, 'without the values it would look like one');
  eq(PURE.pushLosses({ ecm: {}, factors: { '42': ['7', '11'] } }, {}, { '42': ['7'] }, none, { '42': V }).factors.map(x => x.f), ['11'],
     'and a real factor going missing is still caught');
  const srcG = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  eq((srcG.match(/pushLosses\(_syncBase, loadECM\(\), factorsFromPayload\(buildSyncPayload\(\)\), deletedHere\(\), eulerValues\)/g) || []).length, 2,
     'both of the guard\'s checks are given the values');
});

// ── merging: three bugs found by random testing ────────────────────────────────
group('merge-checks-what-a-peer-sends', () => {
  if (!needs(M, 'mergeFactorRecords')) return;
  const C = 10n ** 61n + 1n;                   // a big cofactor, never listed
  const V = (5n * 31n * C).toString();         // 31 divides it ONCE
  // 1. A higher exponent on a factor already here is checked like a new factor.
  //    Counting distinct factors missed it: 31 and 31^2 collapse to one.
  const m1 = M.mergeFactorRecords({ status: 'CF', factors: ['5', '31'], timestamp: 1 },
                                  { status: 'CF', factors: ['31^2'], timestamp: 2 }, V);
  eq(m1.factors, ['5', '31'], "a peer's 31^2 is checked against E(n) — it divides once, so 31 it stays");
  // 2. When the check refuses everything, nothing refused is kept.
  const m2 = M.mergeFactorRecords({ status: 'U', factors: [], timestamp: 1 },
                                  { status: 'C', factors: ['1000033'], timestamp: 2 }, V);
  ok(!m2.factors && m2.status === 'C', 'a refused factor is not kept — the record is plain C, not "C holding a factor"');
  // 3. A completeness claim survives only with exactly its own factors.
  const V2 = (5n * 31n).toString();
  const m3 = M.mergeFactorRecords({ status: 'CF', factors: ['5'], timestamp: 1 },
                                  { status: 'FF', factors: ['5', '31^2'], timestamp: 2 }, V2);
  eq([m3.status, m3.factors], ['CF', ['5', '31']], 'an FF claiming 31^2, checked down to 31, is no longer proven: CF');
  const m4 = M.mergeFactorRecords({ status: 'CF', factors: ['5'], timestamp: 1 },
                                  { status: 'FF', factors: ['5', '31'], timestamp: 2 }, V2);
  eq([m4.status, m4.factors], ['FF', ['5', '31']], 'while a genuine FF arriving in a merge keeps FF');
  eq(M.mergeFactorRecords({ status: 'FF', factors: ['5', '31'], timestamp: 3 }, { status: 'FF', factors: ['5', '31'], timestamp: 3 }, V2).status,
     'FF', 'and merging two identical FF records changes nothing');
});

// ── adding a factor by hand ─────────────────────────────────────────────────────
// Untested until now. It stored the factor exactly as typed, so "00123" came back as
// "123" after a reload and its history entry, keyed on "00123", no longer matched —
// the factor then read "before tracking began". Driven end to end: the real function,
// with a stand-in page, and a record of whether anything was saved.
groupAsync('manual-factor-add', async () => {
  const srcA = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const grab = (name) => { const m = new RegExp('\\n(async )?function ' + name + '\\(').exec(srcA); const a = m.index + 1; return srcA.slice(a, srcA.indexOf('\n}\n', a) + 2); };
  const canon = new Function(grab('canonicalFactor') + '; return canonicalFactor;')();
  const c = (raw) => canon(parseFactorExpr(raw));
  eq(['00123', '05^02', '5^1', '5^5', '2*3', '123'].map(c), ['123', '5^2', '5', '5^5', '6', '123'], 'a typed factor is stored in canonical form');
  const V = (5n * 7n * (10n ** 61n + 1n)).toString();     // 5 and 7 once each
  const helpers = ['_parseFactorTerm', 'factorProduct', 'divideOutFactors', 'canonicalFactor', 'verifyAndAddFactor'].map(grab).join('\n');
  const tryAdd = async (known, typed) => {
    const env = { input: { value: typed }, msg: { innerHTML: '' }, saved: [] };
    const entry = { n: 9, val: V, factors: known.slice() };
    const run = new Function('document', 'entryByN', 'parseFactorExpr', 'commitKnownFactor', helpers + '; return verifyAndAddFactor;')(
      { getElementById: (id) => id.startsWith('manualFactorInput_') ? env.input : id.startsWith('factorVerifyMsg_') ? env.msg : null },
      (n) => (n === 9 ? entry : null), parseFactorExpr,
      (n, e, factorStr) => env.saved.push(factorStr));
    await run(9);
    return env;
  };
  let r = await tryAdd(['5'], '35');
  ok(r.saved.length === 0 && /already accounted for/.test(r.msg.innerHTML), '35 with 5 already known is refused — nothing is saved');
  r = await tryAdd(['5'], '007');
  eq(r.saved, ['7'], '007 is saved as 7');
  r = await tryAdd([], '05^01');
  eq(r.saved, ['5'], '05^01 is saved as 5');
  r = await tryAdd(['5'], '4');
  ok(r.saved.length === 0 && /does not divide/.test(r.msg.innerHTML), 'a number that does not divide E(n) is refused');
  r = await tryAdd(['5'], '1');
  ok(r.saved.length === 0 && /Must be ≥ 2/.test(r.msg.innerHTML), '1 is refused');
  r = await tryAdd(['5'], '5');
  ok(r.saved.length === 0 && /already listed/.test(r.msg.innerHTML), 'a factor already listed is refused');
  r = await tryAdd([], '');
  ok(r.saved.length === 0 && /Enter a factor/.test(r.msg.innerHTML), 'an empty box asks for a factor');
});

// ── random tests of the core data functions ───────────────────────────────────
// Rules that must hold for EVERY input, checked on seeded random cases (a failure is
// reproducible). They found three merge bugs the example tests had missed: a peer's
// overclaimed exponent went in unchecked, refused factors were kept labelled C, and an
// FF claim survived a merge that changed its factors.
group('data-invariants-random', () => {
  if (!needs(M, 'mergeFactorRecords', '_encodeFactor', '_decodeFactor')) return;
  if (!needs(PURE, 'splitMainPayload', 'joinMainParts', 'splitEcm', 'joinEcmParts', 'pushLosses')) return;
  let seed = 20261001;
  const rng = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
  const pick = (a) => a[Math.floor(rng() * a.length)];
  const digits = (n) => { let s = String(1 + Math.floor(rng() * 9)); while (s.length < n) s += Math.floor(rng() * 10); return s; };
  const copy = (x) => JSON.parse(JSON.stringify(x));
  const PR = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n, 41n, 43n, 47n, 53n, 61n, 97n, 1000003n, 10000019n];
  const powOf = (f) => { const m = /^(\d+)(?:\^(\d+))?$/.exec(String(f)); return m ? [BigInt(m[1]), m[2] ? parseInt(m[2]) : 1] : null; };
  const bad = {}; const note = (k, ex) => { if (!(k in bad)) bad[k] = ex; };
  const says = (k, rule) => ok(!(k in bad), rule + (k in bad ? ' — first counterexample: ' + JSON.stringify(bad[k]).slice(0, 320) : ''));
  // merging: realistic records — C knows nothing (or, as old data does, holds factors),
  // CF knows some, U is a marker — with junk arriving only from the other side
  for (let it = 0; it < 600; it++) {
    const parts = []; let v = 1n;
    for (let i = 0, k = 1 + Math.floor(rng() * 5); i < k; i++) { const p = pick(PR), e = 1 + Math.floor(rng() * 3); if (parts.some(x => x[0] === p)) continue; v *= p ** BigInt(e); parts.push([p, e]); }
    v *= BigInt(digits(40 + Math.floor(rng() * 40)) + '1');
    const V = v.toString();
    const rec = (remote) => {
      const fs = [];
      for (const [p, e] of parts) if (rng() < 0.6) { const c = (remote && rng() < 0.2) ? e + 1 : 1 + Math.floor(rng() * e); fs.push(c === 1 ? p.toString() : p + '^' + c); }
      if (remote && rng() < 0.12) fs.push(V); if (remote && rng() < 0.08) fs.push('1000033');
      return { status: fs.length ? pick(['CF', 'CF', 'U', 'C']) : pick(['C', 'U']), factors: fs, timestamp: Math.floor(rng() * 1e12) };
    };
    const a = rng() < 0.15 ? { status: pick(['C', 'U']), factors: [], timestamp: Math.floor(rng() * 1e12) } : rec(false);
    const b = rec(true);
    if (rng() < 0.15) b.factors = [pick(['1000033', V])];     // a peer sending only junk
    const m = M.mergeFactorRecords(copy(a), copy(b), V), mm = M.mergeFactorRecords(copy(m), copy(m), V);
    const out = m.factors || [];
    let prod = 1n, divides = true;
    for (const f of out) { const pe = powOf(f); if (!pe) { divides = false; break; } const q = pe[0] ** BigInt(pe[1]); if (v % q !== 0n) divides = false; prod *= q; }
    if (!divides || v % prod !== 0n) note('A1', { a, b, out });
    const bases = new Set(out.map(f => String(f).split('^')[0]));
    for (const f of [...a.factors, ...b.factors]) { const pe = powOf(f); if (pe && pe[0] > 1n && String(pe[0]) !== V && v % pe[0] === 0n && !bases.has(String(pe[0]))) { note('A2', { a, b, out, f }); break; } }
    const c1 = rec(false), c2 = rec(false);
    const set = (x) => JSON.stringify([...new Set((x.factors || []).map(String))].sort());
    const n1 = M.mergeFactorRecords(copy(c1), copy(c2), V), n2 = M.mergeFactorRecords(copy(c2), copy(c1), V);
    if (c1.timestamp !== c2.timestamp && (set(n1) !== set(n2) || n1.status !== n2.status)) note('A3', { c1, c2, n1, n2 });
    if (set(mm) !== set(m) || mm.status !== m.status) note('A4', { m, mm });
    if (m.status === 'C' && out.length) note('A5', { a, b, m });
    if (out.length > 1 && bases.has(V)) note('A6', { a, b, m });
  }
  says('A1', 'merging: every factor kept divides E(n), and so does their product');
  says('A2', 'merging: no genuine factor is ever lost');
  says('A3', 'merging: the order of the two records does not matter');
  says('A4', 'merging: merging the result again changes nothing');
  says('A5', 'merging: C never holds factors');
  says('A6', 'merging: E(n) itself never sits beside real factors');
  // splitting into data/ pieces and joining back
  for (let it = 0; it < 150; it++) {
    const pl = { fdbCache: {}, cofactorDigits: {}, sieveDepth: {}, history: [], changelog: [1, 2], flags: { x: rng() < 0.5 }, updatedAt: 5 };
    for (let i = 0, k = 1 + Math.floor(rng() * 30); i < k; i++) { const n = String(Math.floor(rng() * 25000)); pl.fdbCache[n] = { status: 'CF', factors: [String(Math.floor(rng() * 1e6))] }; if (rng() < 0.5) pl.cofactorDigits[n] = Math.floor(rng() * 9e4); if (rng() < 0.5) pl.sieveDepth[n] = 1e6; pl.history.push([Number(n), Math.floor(rng() * 2e9), 7, pick(['e', 'f', 's', 'p']), 'h' + i]); }
    if (rng() < 0.2) pl.fdbCache['odd'] = { status: 'U' };
    if (rng() < 0.2) pl.history.push(['x', 1, 1, 'e', 'odd']);
    const files = PURE.splitMainPayload(pl), back = PURE.joinMainParts(Object.values(files));
    const want = copy(pl); delete want.updatedAt;
    const norm = (x) => JSON.stringify(Object.keys(x).filter(k => !(x[k] && typeof x[k] === 'object' && Object.keys(x[k]).length === 0)).sort().map(k => [k, k === 'history' ? x[k].map(r => JSON.stringify(r)).sort() : (x[k] && typeof x[k] === 'object' && !Array.isArray(x[k]) ? Object.keys(x[k]).sort().map(q => [q, x[k][q]]) : x[k])]));
    if (norm(back) !== norm(want)) note('B1', { want: norm(want).slice(0, 200), back: norm(back).slice(0, 200) });
    for (const [pth, part] of Object.entries(files)) { const mm = /main-(\d+)\.json$/.exec(pth); if (!mm) continue; const lo = parseInt(mm[1], 10); for (const n of Object.keys(part.fdbCache || {})) if (!(Number(n) >= lo && Number(n) < lo + 1000)) note('B2', { pth, n }); }
    const ecm = {}; for (let i = 0, k = Math.floor(rng() * 20); i < k; i++) ecm[String(Math.floor(rng() * 25000))] = [{ method: 'ECM', b1: '50000', curves: String(1 + Math.floor(rng() * 99)) }];
    if (rng() < 0.2) ecm['odd'] = [];
    const eb = PURE.joinEcmParts(Object.values(PURE.splitEcm(ecm)));
    if (JSON.stringify(Object.keys(eb).sort().map(k => [k, eb[k]])) !== JSON.stringify(Object.keys(ecm).sort().map(k => [k, ecm[k]]))) note('C1', { ecm });
  }
  says('B1', 'data/ pieces: split then joined, the main data comes back exactly');
  says('B2', 'data/ pieces: every entry lands in its own thousand');
  says('C1', 'data/ pieces: the ECM runs come back exactly too');
  // factor encoding, across the 2,000-digit limit
  for (let it = 0; it < 800; it++) {
    const r = rng(); let x;
    if (r < 0.55) x = digits(1 + Math.floor(rng() * (rng() < 0.15 ? 2600 : 120)));
    else if (r < 0.7) x = digits(1 + Math.floor(rng() * 30)) + '^' + (2 + Math.floor(rng() * 5));
    else if (r < 0.8) x = '~' + digits(1 + Math.floor(rng() * 20));
    else if (r < 0.9) x = '~~' + digits(3);
    else x = pick(['', '0', 'abc', '-5', ' 7', '1e5']);
    if (M._decodeFactor(M._encodeFactor(x)) !== x) note('D1', { x: x.slice(0, 40), len: x.length });
    const z = '00' + digits(1 + Math.floor(rng() * 30));
    if (M._decodeFactor(M._encodeFactor(z)) !== BigInt(z).toString()) note('D2', { z });
  }
  says('D1', 'factor encoding: every stored form comes back exactly');
  says('D2', 'factor encoding: a decimal with leading zeros (old data) comes back as the same number, canonical');
  // the push guard
  for (let it = 0; it < 300; it++) {
    const base = { ecm: {}, factors: {} }, local = {};
    for (let i = 0, k = 1 + Math.floor(rng() * 6); i < k; i++) { const n = String(i * 2 + 4); const fs = [...new Set(Array.from({ length: 1 + Math.floor(rng() * 4) }, () => String(pick(PR))))]; base.factors[n] = fs; local[n] = fs.slice(); }
    const none = { runs: new Set(), entries: new Set() };
    if (PURE.pushLosses(base, {}, local, none).factors.length) note('F1', { base });
    const n = pick(Object.keys(local)), gone = local[n].pop();
    if (!PURE.pushLosses(base, {}, local, none).factors.some(x => x.f === gone && String(x.n) === n)) note('F2', { base, local, gone });
    if (PURE.pushLosses(base, {}, local, { runs: new Set(), entries: new Set([n]) }).factors.length) note('F3', { n });
  }
  says('F1', 'push guard: identical data is never a loss');
  says('F2', 'push guard: every factor that really went missing is caught');
  says('F3', 'push guard: a deliberate deletion is never reported as a loss');
});

// ── P±1 time model: fitted to measured runs ───────────────────────────────────
// Two real P-1 runs at B1=3e6: E(3524), 10,272 digits — step 1 415 s, step 2 186 s;
// E(9778), 32,848 digits — step 1 2,029 s, step 2 1,380 s. Stage 1 was already right;
// stage 2 was estimated 4.5-6x too long, so every large P±1 estimate was 2-3x high.
group('pm1-model-matches-measured-runs', () => {
  if (!needs(PURE, 'estimateCpuSeconds')) return;
  const cost = PURE.estimateCpuSeconds, CAL = 2.574;    // the machine's measured calibration
  const small = cost('P-1', 3e6, null, 1, 10272), large = cost('P-1', 3e6, null, 1, 32848);
  const near = (a, b, tol) => Math.abs(a / b - 1) <= tol;
  ok(near(small * CAL, 415.031 + 186.329, 0.15), 'E(3524) P-1 B1=3e6: the estimate is within 15% of the real 601 s (got ' + Math.round(small * CAL) + ' s)');
  ok(near(large * CAL, 2028.516 + 1380.359, 0.15), 'E(9778) P-1 B1=3e6: within 15% of the real 3,409 s (got ' + Math.round(large * CAL) + ' s)');
  if (needs(PURE, 'estimateCpuSecondsRaw')) {
    const share = (d) => { const s1 = 0.5 * 9.06e-11 * 3e6 * Math.pow(d, 1.5); return (PURE.estimateCpuSecondsRaw('P-1', 3e6, null, 1, d) - s1) / s1; };
    ok(near(share(10272), 186.329 / 415.031, 0.02) && near(share(32848), 1380.359 / 2028.516, 0.02),
       'stage 2 is 0.45x and 0.68x stage 1, as measured — the ECM-shaped formula said 2.3x and 4.1x');
  }
  // ECM is untouched: its estimate is still the formula it was
  const d = 1000, b1 = 11e6, s1 = 2.0 * 9.06e-11 * b1 * Math.pow(d, 1.5);
  const tblE = (src.match(/const ECM_TABLE = (\[[\s\S]*?\]);/) || [])[1];
  const ecmB2 = Function('const ECM_TABLE = ' + tblE + '; return ' + (src.match(/function ecmDefaultB2\(b1\)[\s\S]*?\n}/) || [''])[0] + ';')();
  ok(typeof ecmB2 === 'function' && near(cost('ECM', b1, null, 1, d), s1 + s1 * Math.sqrt(ecmB2(b1) / b1) / 285.97 * Math.sqrt(d / 100), 1e-9),
     'ECM estimates are unchanged');
});

// ── no -maxmem until B2 is handled with it ─────────────────────────────────────
// A per-worker cap was tried and measured with GMP-ECM 7.0.5: a default-B2 P-1 stage 2
// on a 10,000- or 33,000-digit number was refused outright under 2,184 MB ("cannot
// choose suitable P value"), so every large P-1 run would have failed; and real memory
// ran 1.7x GMP-ECM's own estimate. The scripts must not pass it on its own.
group('no-maxmem-until-b2-fits', () => {
  const srcM = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const nested = (name) => { const a = srcM.indexOf('  function ' + name + '(r, label, total, importFile, numbersFile, idx) {'); return a < 0 ? null : srcM.slice(a, srcM.indexOf('\n  }\n', a) + 4); };
  for (const [name, platform] of [['runLinesSh', 'Linux'], ['runLines', 'Windows']]) {
    const body = nested(name);
    ok(!!body, platform + ': its command builder can be read');
    if (!body) continue;
    const build = new Function('b1int', 'fmtCpuTime', body + '; return ' + name + ';')((r) => String(r.rawB1), (x) => x + 's');
    const base = { cpuTime: 60, gain: 0.0123, digits: 32848, targetDigits: 30 };
    const out = [{ ...base, method: 'P-1', rawB1: 3000000, n: 9778, curves: '1' },
                 { ...base, method: 'ECM', rawB1: 11000000, n: 3524, curves: '72', rawCurves: 72 }]
      .map(r => build(r, '1/1', 1, 'imp.txt', 'nums.txt', 0).join('\n')).join('\n');
    ok(/-v -pm1 3000000/.test(out) && /-v -c 72 11000000/.test(out), platform + ': the ecm command lines are as before');
    ok(!/-maxmem/.test(out), platform + ': and carry no -maxmem — GMP-ECM refuses large P-1 runs under it');
  }
  ok(!/-maxmem/.test(srcM.slice(srcM.indexOf('function exportNextRuns('), srcM.indexOf('\nfunction serverNotes('))) || /No -maxmem\. Measured with GMP-ECM 7\.0\.5/.test(srcM),
     'nothing in the export adds it back without the measured reason in view');
});

// ── P-1/P+1 on at most a sixth of the cores ────────────────────────────────────
// Twelve P-1 runs on large numbers at once took more than 32 GB. Each worker runs its
// list one run at a time, so if only a sixth of the workers are ever given P±1 runs
// (2 of 12), no more than that many can be in stage 2 at once — and every run keeps
// its full B2.
group('pm1-runs-on-a-sixth-of-the-cores', () => {
  if (!needs(PURE, 'dealRunsToWorkers')) return;
  const deal = PURE.dealRunsToWorkers;
  const isPm1 = (r) => r.method === 'P-1' || r.method === 'P+1';
  const runs = [];
  for (let i = 0; i < 60; i++) runs.push({ id: i, method: i % 3 === 0 ? 'P-1' : i % 7 === 0 ? 'P+1' : 'ECM', cpuTime: 600 + (i * 977) % 7200 });
  const w12 = deal(runs, [12]);
  eq(w12.filter(w => w.pm1).map(w => w.localCore), [1, 2], '12 cores: cores 1 and 2 may take P-1/P+1 — a sixth');
  ok(w12.every(w => w.pm1 || !w.runs.some(isPm1)), 'no other core is given one, so at most 2 can run at once');
  ok(w12.some(w => w.runs.some(r => r.method === 'P+1')) && w12.every(w => w.pm1 || !w.runs.some(r => r.method === 'P+1')), 'P+1 is held to the same cores — its stage 2 is just as hungry');
  const dealtIds = w12.flatMap(w => w.runs.map(r => r.id)).sort((a, b) => a - b);
  eq(dealtIds, runs.map(r => r.id), 'every run is dealt exactly once');
  ok(w12.every(w => w.runs.every((r, k) => k === 0 || w.runs[k - 1].id < r.id)), "each core's list stays in ranked order");
  // the other cores take the ECM work first
  // ranked ECM first: dealt in one pass, the ECM runs would land on the P±1 cores too,
  // and the long P-1 runs would then stack on top of them
  const tiny = Array.from({ length: 10 }, (_, k) => ({ id: k, method: 'ECM', cpuTime: 3600 }))
    .concat([{ id: 10, method: 'P-1', cpuTime: 36000 }, { id: 11, method: 'P-1', cpuTime: 36000 }]);
  const wt = deal(tiny, [12]);
  ok(wt.slice(0, 2).every(w => w.runs.length === 1 && isPm1(w.runs[0])) && wt.slice(2).every(w => w.runs.length === 1 && w.runs[0].method === 'ECM'),
     'with two long P-1 runs, the ECM runs go to the other ten cores, not on top of them');
  // a P±1 core that also takes an ECM run ranked above its P-1 keeps ranked order
  const mix = deal([0, 1, 2, 3].map(k => ({ id: k, method: 'ECM', cpuTime: 3600 })).concat([{ id: 4, method: 'P-1', cpuTime: 3600 }]), [4]);
  eq(mix[0].runs.map(r => r.id), [3, 4], "a core holding both kinds lists them in ranked order — the ECM run ranked above its P-1 comes first");
  const ecmOnly = deal(runs.filter(r => !isPm1(r)), [12]);
  const loads = ecmOnly.map(w => w.load), maxRun = Math.max(...runs.map(r => r.cpuTime));
  ok(ecmOnly.every(w => w.runs.length > 0) && Math.max(...loads) - Math.min(...loads) <= maxRun,
     'with no P±1 runs every core shares the ECM work, balanced to within one run');
  // several machines, and small ones
  const m3 = deal(runs, [24, 16, 8]);
  eq([1, 2, 3].map(m => m3.filter(w => w.machine === m && w.pm1).length), [4, 2, 1], '"24,16,8": 4, 2 and 1 cores may take P±1');
  ok(m3.every(w => w.pm1 === (w.localCore <= [0, 4, 2, 1][w.machine])), "and they are each machine's own first cores");
  eq([[1], [5], [6], [11], [12], [18]].map(c => deal([], c).filter(w => w.pm1).length), [1, 1, 1, 1, 2, 3], 'a sixth, rounded down — and a small machine still gets one, never zero');
  const srcD = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  ok(/const dealt = dealRunsToWorkers\(top, coresPerMachine\);\s*\n\s*const coreRuns = dealt\.map\(w => w\.runs\);/.test(srcD) && !/coreRuns\[i % totalCores\]/.test(srcD),
     'the export deals its runs this way, not round-robin');
  ok(/'P-1\/P\+1: ' \+ pm1Runs \+ ' run\(s\), on at most '/.test(srcD), 'and its summary says how many P±1 runs, on how many cores, and how long they keep them busy');
});

// ── time estimates learned from your runs ──────────────────────────────────────
// One factor (2.57) corrected every estimate, but on 6,494 measured runs ECM took
// 1.8-2.6x the estimates at every size, and the error depends on B1. Learned per
// method, size and B1 from the older 3,838 runs, the typical error on the 2,656 newer
// ones fell from 1.63x to 1.11x.
group('time-estimates-learned-from-runs', () => {
  if (!needs(PURE, 'halfDecade', 'buildTimeCorrections', 'correctionFor')) return;
  const { halfDecade: hd, buildTimeCorrections: build, correctionFor: corr } = PURE;
  eq([hd(10272), hd(32848), hd(3e6), hd(999), hd(1000), hd(0)], [8, 9, 12, 5, 6, null], 'sizes and B1s fall into half-decades');
  const mk = (n, o) => Array.from({ length: n }, (_, i) => ({ method: 'ECM', digits: 40000, b1: 2420, ratio: 4, at: 1000 + i, ...o }));
  ok(!build(mk(7)).ECM && build(mk(8)).ECM, 'a group needs at least 8 runs');
  const tbl = build(mk(9, { ratio: 2 }).concat(mk(9, { ratio: 6, at: 5000 })), { keep: 9 });
  eq(tbl.ECM.factor, 6, 'and uses its most recent runs, so it follows a change in how you run');
  eq(build(mk(8).concat([{ method: 'ECM', digits: 40000, b1: 2420, ratio: 500, at: 99999 }])).ECM.runs, 8, 'an absurd ratio is ignored');
  const t2 = build(mk(8, { ratio: 3 }).concat(mk(8, { digits: 500, b1: 50000, ratio: 7 })));
  eq([corr(t2, 'ECM', 40000, 2420, 1), corr(t2, 'ECM', 40000, 11000, 1), corr(t2, 'ECM', 600, 2420, 1)], [3, 3, 7],
     'the most specific group with enough runs: same size and B1, then size, then B1');
  // as on your 30,000+-digit numbers, where B1=532 and B1=2,420 run differently
  const t3 = build(mk(8, { ratio: 2 }).concat(mk(8, { b1: 532, ratio: 6 })));
  eq([corr(t3, 'ECM', 40000, 2420, 1), corr(t3, 'ECM', 40000, 532, 1), corr(t3, 'ECM', 40000, 110000, 1)], [2, 6, 4],
     'same size, different B1: each B1 its own correction — the size alone (4) only when its B1 has no runs');
  eq([corr(t2, 'ECM', 9, 9, 1), corr(t2, 'P-1', 40000, 3e6, 2.57), corr(null, 'ECM', 40000, 2420, 2.57)].map(x => +x.toFixed(2)), [5, 2.57, 2.57],
     'then the whole method — and with nothing learned, the overall factor');
  // gathering: only runs whose number has not changed size since
  const srcT = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const grab = (n) => { const a = srcT.indexOf('function ' + n + '('); return srcT.slice(a, srcT.indexOf('\n}\n', a) + 2); };
