// ── the stylesheet stays well-formed ──────────────────────────────────────────
// Removing a CSS rule line by line once left a multi-line rule's body stranded at the
// top level. That is not just untidy: a browser's error recovery swallows everything
// up to the next "{" into a garbage selector, silently dropping the rule after it —
// there, the Reset button's styling. No other test could see it.
const cssProblems = (htmlText) => {
  const out = [];
  for (const m of htmlText.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/g)) {
    const css = m[1].replace(/\/\*[\s\S]*?\*\//g, '');
    let depth = 0;
    for (const line of css.split('\n')) {
      const t = line.trim();
      if (depth === 0 && /^[a-z-]+\s*:[^{]*;\s*$/.test(t)) out.push('declaration outside any rule: ' + t.slice(0, 60));
      depth += (line.match(/\{/g) || []).length - (line.match(/\}/g) || []).length;
      if (depth < 0) { out.push('unbalanced }'); depth = 0; }
    }
    if (depth !== 0) out.push('unclosed { at end of stylesheet');
  }
  return out;
};
group('stylesheet-well-formed', () => {
  eq(cssProblems(html), [], 'every CSS declaration sits inside a rule, and braces balance');
  // The check itself must catch the failure it exists for: a multi-line rule whose
  // opening line alone was removed.
  const broken = '<style>\n  .a { color: red; }\n    border: 1px solid;\n    padding: 2px;\n  }\n  .b { color: blue; }\n</style>';
  ok(cssProblems(broken).length > 0, 'and it flags a rule body stranded by a line-by-line removal');
});

