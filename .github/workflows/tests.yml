  f._memo.delete('planted');
});

group('yield-calibration-warms-in-background', () => {
  const srcY = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const at = srcY.indexOf('function scheduleYieldCalibWarm(');
  let fn = '';
  if (at >= 0) for (let j = srcY.indexOf('{', at), d = 0; j < srcY.length; j++) {
    if (srcY[j] === '{') d++; else if (srcY[j] === '}' && --d === 0) { fn = srcY.slice(at, j + 1); break; } }
  ok(!!fn, 'the background build can be located');
  if (!fn) return;
  const world = (o) => {
    const timers = [], cleared = [], idles = [], built = [];
    const api = new Function('window', 'setTimeout', 'clearTimeout', 'yieldCalibFor', 'ECM_MIN_LEVEL', 'logSwallowed', 'W',
      'let _yieldCalibCache = W.cache;\n' + fn + '\nreturn { schedule: scheduleYieldCalibWarm };')(
      o.noWindow ? undefined : { requestIdleCallback: (cb) => idles.push(cb) },
      (cb, ms) => { timers.push({ cb, ms }); return timers.length; }, (id) => cleared.push(id),
      (d) => built.push(d), 10, () => {}, { cache: o.cache || null });
    return { api, timers, cleared, idles, built };
  };
  let w = world({});
  w.api.schedule();
  eq(w.timers.length, 0, 'off until the page switches it on — so the tests start no timers');
  w = world({}); w.api.schedule.enabled = true;
  w.api.schedule(500);
  eq(w.timers[0].ms, 500, 'once on, a build is scheduled');
  w.api.schedule();
  eq([w.timers.length, w.cleared.length, w.timers[1].ms], [2, 1, 2000], 'each new save restarts the wait — no build in the middle of a burst of saves');
  w.timers[1].cb();
  eq(w.idles.length, 1, 'when the wait ends, it waits for the page to be idle');
  w.idles[0]();
  eq(w.built.length, 1, 'and then builds the calibration, before anyone opens an entry');
  w = world({ cache: { 10: {} } }); w.api.schedule.enabled = true; w.api.schedule(0); w.timers[0].cb(); w.idles[0]();
  eq(w.built.length, 0, 'unless it was already built on demand meanwhile');
  w = world({ noWindow: true }); w.api.schedule.enabled = true; w.api.schedule();
  eq(w.timers.length, 0, 'and never outside a page');
  ok(/function invalidateYieldCalib\(\) \{ _yieldCalibCache = null; scheduleYieldCalibWarm\(\); \}/.test(srcY),
     'clearing the calibration schedules a background rebuild');
  ok(/scheduleYieldCalibWarm\.enabled = true;\s*\n\s*scheduleYieldCalibWarm\(500\);/.test(srcY), 'and the page switches it on at the end of startup');
});

