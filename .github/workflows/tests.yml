group('completion-odds', () => {
  if (!needs(PURE, 'completionOdds')) return;
  const C = PURE.completionOdds;

  // A probability, always.
  for (const [cof, f] of [[57000, 20], [1000, 30], [120, 30], [50, 40], [1, 0]]) {
    const p = C(cof, f);
    ok(p > 0 && p <= 1, 'cofactor ' + cof + 'd: odds are a probability (' + p + ')');
  }

  // Smaller cofactors are worth far more — the point of the whole option.
  ok(C(120, 30) > C(57000, 20) * 500,
     'a 120-digit cofactor is hundreds of times more completable than a 57,000-digit one');
  ok(C(300, 30) > C(1000, 30), 'and the ordering is monotone in cofactor size');
  ok(C(1000, 30) > C(5000, 30), 'at every scale');

  // A bigger factor leaves less behind, so it completes more often.
  ok(C(400, 100) > C(400, 30),
     'finding a larger factor of the same cofactor is worth more — less is left');

  // Degenerate inputs must not produce Infinity or NaN: this multiplies a ranking,
  // and a non-finite weight would sort every other run into nonsense.
  for (const [a, b] of [[0, 0], [30, 30], [30, 100], [-5, 2], [NaN, 1], [1, NaN]]) {
    const p = C(a, b);
    ok(typeof p === 'number' && isFinite(p) && p > 0,
       'degenerate (' + a + ',' + b + ') still gives a finite positive weight');
  }
  // Specifically: a factor at least as large as the cofactor must not divide by zero.
  ok(isFinite(C(30, 30)) && isFinite(C(30, 45)), 'no division by zero when nothing remains');

  // ── what we KNOW, not what a random number would be ──────────────────────
  // 1/ln(N) is the density for a RANDOM number. The remainder is not random: ECM to
  // 10^t has cleared every factor below it.
  //
  // CERTAINTY first. A composite remainder needs TWO factors above 10^t, so
  // anything under 2t digits is prime outright — no density argument. At t25 that
  // proves primality for every cofactor under 50 digits.
  eq(C(70, 30, 25), PURE.COMPLETION_CONF,
     'under 2t digits the remainder is prime — but only to the confidence the curve '
     + 'count bought, not as a proof');
  eq(C(49, 0, 25), PURE.COMPLETION_CONF,
     'a 49-digit cofactor with everything below 10^25 excluded is prime at that '
     + 'confidence — ECM never excludes anything with certainty');
  ok(C(200, 0, 25) < 1, 'while 200 digits is still only a probability');

  // CONDITIONING second. Mertens: rough numbers have density e^-gamma / ln B, so
  // knowing there is no factor below 10^t lifts the naive odds by e^gamma * ln B —
  // about 103x at t25. Using 1/ln(N) alone was wrong by two orders of magnitude.
  {
    const naive = 1 / (2.302585 * 970);
    const lifted = C(1000, 30, 25);
    ok(lifted > naive * 50 && lifted < naive * 200,
       'a t25 search lifts the odds ~100x over the random-number density');
  }
  // …and DEEPER searching is worth more, which the naive formula could not express.
  // The conditioning depth is the DEEPER of what was cleared and the size of the
  // factor being removed — ECM finds small factors first, so a find at f digits
  // leaves a remainder rough to roughly f. Measured against 2,846 simulated cases:
  // predicted 24.2%, empirical 24.2%, ratio 1.00.
  // 40 vs 30 is a 1.33x lift, not the 1.5x the old semantics gave: the depth is now
  // max(cleared, factor), so a cleared depth below the factor size adds nothing.
  ok(C(530, 30, 60) > C(530, 30, 30) * 1.9,
     'a cleared depth deeper than the factor size raises the odds proportionally');
  ok(C(530, 30, 40) > C(530, 30, 30),
     'and any depth above the factor size still helps');
  eq(C(530, 30, 15), C(530, 30, 0),
     'a cleared depth shallower than the factor being removed adds nothing — the '
     + 'find itself already establishes that much');
  ok(C(530, 30, 0) > 0 && C(530, 30, 0) < 1,
     'and with no cleared depth at all the factor size still conditions it');
  ok(C(530, 60, 0) > C(530, 30, 0),
     'removing a BIGGER factor conditions harder, so completion is likelier');

  // Still a probability under every combination.
  for (const t of [0, 5, 15, 25, 40, 100]) {
    for (const d of [1, 50, 500, 57000]) {
      const p = C(d, 0, t);
      ok(p > 0 && p <= 1, 'depth t' + t + ' on ' + d + 'd stays a probability (' + p + ')');
    }
  }

  // ── what the search has already ruled out ────────────────────────────────
  // 1/ln(N) is the density of primes among ALL integers. Once every factor below
  // 10^t has been excluded, a prime is far likelier — by e^gamma * ln(10^t), about
  // 100x at t25. Ignoring that understates completion odds by two orders of
  // magnitude, and understates them MOST for the entries already worth finishing.
  {
    const naive = C(300, 0, 0);          // unsearched
    const searched = C(300, 0, 25);      // same cofactor, factors below 10^25 excluded
    ok(searched > naive * 50,
       'excluding small factors raises the odds by ~2 orders of magnitude, not a nudge');
    ok(C(300, 0, 30) > C(300, 0, 25), 'and a deeper search raises them further');
  }

  // ── the case that is a CERTAINTY, not a probability ──────────────────────
  // A composite with no factor below 10^t needs TWO of them, each above t digits.
  // So a remainder shorter than 2t digits cannot be composite — it is prime and the
  // entry completes. This is the case that actually finishes numbers, and a pure
  // probability model misses it entirely.
  eq(C(45, 0, 25), PURE.COMPLETION_CONF,
     '45 digits with everything below 25 excluded, to the same confidence');
  eq(C(49, 0, 25), PURE.COMPLETION_CONF,
     'a 49-digit cofactor with everything below 10^25 excluded is prime at that '
     + 'confidence — ECM never excludes anything with certainty');
  eq(C(55, 0, 30), PURE.COMPLETION_CONF, 'the rule scales with the level searched');
  ok(C(51, 0, 25) < 1, 'while 51 digits could still be two 26-digit factors');

  // …and it applies to what REMAINS after the find, not the original cofactor.
  eq(C(80, 35, 25), PURE.COMPLETION_CONF, 'an 80-digit cofactor minus a 35-digit factor leaves 45 — prime');

  // Never exceeds 1, whatever the inputs.
  for (const [d, f, t] of [[100, 0, 60], [50, 0, 40], [10, 0, 99], [300, 290, 25]]) {
    const p = C(d, f, t);
    ok(p > 0 && p <= 1, 'stays a probability at (' + d + ',' + f + ',' + t + ') = ' + p);
  }

  // Unsearched entries fall back to the unconditioned density — no free boost for
  // work that was never done.
  ok(C(300, 0, 0) < C(300, 0, 10), 'an unsearched entry is not credited as if searched');
});

group('bulk-ecm-normalises', () => {
  if (!needs(M, 'normalizeEcmAttempts')) return;
  const n = (list) => M.normalizeEcmAttempts(list);

  // The suffix case — the one the old parseFloat could not see.
  {
    const r = n([{ method: 'ECM', b1: '250000', curves: '100' },
                 { method: 'ECM', b1: '250k',   curves: '100' }]);
    eq(r.length, 1, '"250k" and "250000" are the same bound, not two');
  }

  // The identity rule: an attempt IS method + B1. More curves at the same bound is
  // the same attempt, extended.
  {
    const r = n([{ method: 'ECM', b1: '250000', curves: '100' },
                 { method: 'ECM', b1: '250000', curves: '200' }]);
    eq(r.length, 1, 'the same bound twice is one attempt');
    eq(r[0].curves, '200', 'with the larger curve count — MAX, since these are two '
       + 'reports of the same work, and summing would double-count');
  }

  // What must stay separate.
  eq(n([{ method: 'ECM', b1: '250000', curves: '100' },
        { method: 'ECM', b1: '1000000', curves: '50' }]).length, 2,
     'different bounds are different attempts');
  eq(n([{ method: 'ECM', b1: '250000', curves: '100' },
        { method: 'P-1', b1: '250000', curves: '' }]).length, 2,
     'and so are different methods at the same bound');
});

group('ecm-run-stats', () => {
  if (!needs(sandbox, 'ecmRunStats', 'ecmRunSummary')) return;
  const realLoadECM = sandbox.loadECM;
  const realHist = sandbox.loadHistory;
  try {
    sandbox.allEntries.length = 0;
    sandbox.__ls = {};
    const V = '9'.repeat(300);
    for (const n of [100, 102, 104]) sandbox.allEntries.push({ n, val: V, status: 'partial', factors: [] });
    sandbox.loadECM = () => ({
      // measured: 100s and 10s
      '100': [{ method: 'ECM', b1: '250000', curves: '50', ms: 100000 },
              { method: 'ECM', b1: '1000000', curves: '10', ms: 10000 }],
      // measured: 5s, but far more curves
      '102': [{ method: 'ECM', b1: '11000', curves: '900', ms: 5000 }],
      // no ms at all — priced by the model
      '104': [{ method: 'ECM', b1: '250000', curves: '20' }],
    });
    sandbox.loadHistory = () => [[100, 1780000000, 12, 'e', 'h1']];   // only E(100) found anything

    // ── longest single runs ──────────────────────────────────────────────
    {
      const r = sandbox.ecmRunStats('longest', 10);
      eq(r.length, 4, 'every attempt is a row');
      eq(r[0].n, 100, 'the longest run is first');
      eq(r[0].sec, 100, 'measured time is used verbatim, in seconds');
      ok(r[0].measured, 'and flagged as measured');
      const est = r.find(x => x.n === 104);
      ok(est && !est.measured, 'an attempt with no recorded time is flagged as estimated');
      ok(est && est.sec > 0,
         'and PRICED — a fallback that returns zero makes unmeasured work vanish from '
         + 'every total, which is worse than an approximate figure');
      ok(r[0].sec >= r[1].sec && r[1].sec >= r[2].sec, 'sorted descending');
    }

    // ── per-entry totals ─────────────────────────────────────────────────
    {
      const r = sandbox.ecmRunStats('entry-cpu', 10);
      eq(r[0].n, 100, 'the entry with the most CPU is first');
      eq(r[0].sec, 110, 'summing its attempts, not just the largest');
      eq(r[0].curves, 60, 'and its curves too');
      ok(!r[0].measured === false, 'measured when every attempt of it was');
      const e104 = r.find(x => x.n === 104);
      ok(e104 && !e104.measured, 'an entry with any unmeasured attempt is not marked measured');
    }

    // ── P±1 is included, and counted in its OWN units ────────────────────
    // A P-1 run can be, and on the real dataset IS, among the longest single runs —
    // third overall. But it has no curves: it is one pass. Counting it as "1 curve"
    // and adding that to an ECM curve total mixes two units, and the magnitude is
    // small enough (10,046 passes against 596,000 curves) that nothing would ever
    // have flagged it.
    {
      sandbox.loadECM = () => ({
        '100': [{ method: 'ECM', b1: '250000', curves: '50', ms: 100000 },
                { method: 'P-1', b1: '850000000', curves: '', b2: '1300000000', ms: 200000 }],
      });
      const runs = sandbox.ecmRunStats('longest', 10);
      eq(runs.length, 2, 'a P±1 attempt is a row like any other');
      eq(runs[0].method, 'P-1', 'and can be the longest single run');
      eq(runs[0].curves, null, 'with no curve count — it is a pass, not a curve');
      eq(runs[1].curves, 50, 'while the ECM row keeps its own');

      const per = sandbox.ecmRunStats('entry-cpu', 10);
      eq(per[0].curves, 50, 'per-entry curves count ECM only');
      eq(per[0].passes, 1, 'and P±1 passes are counted separately');
      eq(per[0].sec, 300, 'while CPU sums both, because seconds ARE the same unit');
    }

    // An entry worked only with P±1 still counts as effort spent.
    {
      sandbox.loadECM = () => ({ '100': [{ method: 'P-1', b1: '1000000', curves: '' }] });
      sandbox.loadHistory = () => [];
      const b = sandbox.ecmRunStats('barren', 10);
      eq(b.length, 1, 'an entry with only P±1 work and no finds is still barren');
      eq(b[0].curves, 0, 'with zero curves');
      eq(b[0].passes, 1, 'and one pass');
    }

    // Restore the main fixture for the assertions that follow.
    sandbox.loadECM = () => ({
      '100': [{ method: 'ECM', b1: '250000', curves: '50', ms: 100000 },
              { method: 'ECM', b1: '1000000', curves: '10', ms: 10000 }],
      '102': [{ method: 'ECM', b1: '11000', curves: '900', ms: 5000 }],
      '104': [{ method: 'ECM', b1: '250000', curves: '20' }],
    });
    sandbox.loadHistory = () => [[100, 1780000000, 12, 'e', 'h1']];

    // ── and the column counts only our own ECM/P±1 ───────────────────────
    {
      sandbox.loadECM = () => ({ '400': [{ method: 'ECM', b1: '250000', curves: '10' }] });
      sandbox.loadHistory = () => [
        [400, 1780000000, 12, 'e', 'h1'],   // ours — counts
        [400, 1780000001, 9,  's', 'h2'],   // sieve — does not
        [400, 1780000002, 15, 'f', 'h3'],   // FactorDB — does not
      ];
      const r = sandbox.ecmRunStats('entry-cpu', 10);
      eq(r[0].finds, 1,
         'only the ECM find counts — a sieve hit is not evidence the curves worked, '
         + 'and neither is a factor FactorDB already had');
    }

    // Restore for what follows.
    sandbox.loadECM = () => ({
      '100': [{ method: 'ECM', b1: '250000', curves: '50', ms: 100000 },
              { method: 'ECM', b1: '1000000', curves: '10', ms: 10000 }],
      '102': [{ method: 'ECM', b1: '11000', curves: '900', ms: 5000 }],
      '104': [{ method: 'ECM', b1: '250000', curves: '20' }],
    });
    sandbox.loadHistory = () => [[100, 1780000000, 12, 'e', 'h1']];

    // ── curves, and barren effort ────────────────────────────────────────
    {
      eq(sandbox.ecmRunStats('curves', 10)[0].n, 102, 'most curves is a different entry from most CPU');
      const b = sandbox.ecmRunStats('barren', 10);
      ok(!b.some(x => x.n === 100), 'an entry that found something is not called barren');
      eq(b[0].n, 102, 'and the barren list leads with the most curves spent for nothing');
    }

    // ── the limit is honoured, and 0 means everything ────────────────────
    // A summary that caps and then totals the slice reports the CAP back as the
    // answer: "500 entries have found nothing" when the real figure was 7,728, and
    // a concentration ratio over 500 rows instead of 9,998.
    {
      eq(sandbox.ecmRunStats('longest', 1).length, 1, 'a limit of 1 gives one row');
      eq(sandbox.ecmRunStats('longest', 2).length, 2, 'and 2 gives two');
      eq(sandbox.ecmRunStats('longest', 0).length, 4, 'while 0 means no cap at all');
      eq(sandbox.ecmRunStats('barren', 0).length, 2, 'including for the filtered modes');
    }

    // ── the summary totals the WHOLE set ─────────────────────────────────
    // Fixture deliberately larger than the internal 500 cap. With three entries
    // the difference between "total" and "first 500" is invisible, and the bug this
    // pins reported the cap back as the answer: 500 barren entries when the real
    // figure was 7,728.
    {
      const many = { ...sandbox.loadECM() };
      for (let i = 0; i < 600; i++) {
        const n = 5000 + i;
        sandbox.allEntries.push({ n, val: V, status: 'partial', factors: [] });
        many[String(n)] = [{ method: 'ECM', b1: '11000', curves: '3' }];
      }
      sandbox.loadECM = () => many;
      const big = sandbox.ecmRunSummary();
      ok(big.barren > 500,
         'the barren count exceeds the internal cap (' + big.barren + ') rather than reporting it');
      eq(big.worked, 603, 'and every worked entry is counted');
      eq(big.attempts, 604, 'as is every attempt');
      // Trim back for the assertions below.
      sandbox.allEntries.length = 3;
      sandbox.loadECM = () => ({
        '100': [{ method: 'ECM', b1: '250000', curves: '50', ms: 100000 },
                { method: 'ECM', b1: '1000000', curves: '10', ms: 10000 }],
        '102': [{ method: 'ECM', b1: '11000', curves: '900', ms: 5000 }],
        '104': [{ method: 'ECM', b1: '250000', curves: '20' }],
      });
      const sum = sandbox.ecmRunSummary();
      eq(sum.attempts, 4, 'every attempt is counted');
      eq(sum.measured, 3, 'and the measured ones distinguished');
      eq(sum.measuredSec, 115, 'with their real total');
      eq(sum.worked, 3, 'three entries have ECM work');
      eq(sum.barren, 2, 'two of them have found nothing — the true count, not a cap');
      ok(sum.concentration > 0 && sum.concentration <= 1, 'concentration is a fraction');
    }
  } finally {
    sandbox.loadECM = realLoadECM;
    sandbox.loadHistory = realHist;
    sandbox.allEntries.length = 0;
    sandbox.__ls = {};
    // saveHistory([]), not just clearing storage: _provIndex is DERIVED from the
    // history and memoised, and only saveHistory nulls it. Wiping the store while
    // leaving the index populated meant the next group's recordDiscovery saw keys
    // for records that no longer existed and refused to write them.
    try { sandbox.saveHistory([]); } catch (e) {}
  }
});

group('ecm-frontier', () => {
  if (!needs(sandbox, 'ecmFrontier', 'belowFrontier')) return;
  // try/finally, not a trailing assignment: when this group threw, it skipped its
  // own restore and left loadECM stubbed for every group after it. A restore that
  // only runs on the happy path is not a restore.
  const realLoadECM = sandbox.loadECM;
  try {
  sandbox.allEntries.length = 0;
  sandbox.__ls = {};
  const V = '9'.repeat(120);
  const e = (n, status) => ({ n, val: V, status, factors: [] });
  sandbox.allEntries.push(e(100, 'partial'), e(102, 'partial'), e(104, 'partial'),
                          e(106, 'partial'), e(108, 'full'), e(2, 'partial'));
  sandbox.loadECM = () => ({
    // t10 only — the cheapest backlog
    '100': [{ method: 'ECM', b1: '532',     curves: '20' }],
    // reached t25, via a lower run too: the HIGHEST is what counts
    '102': [{ method: 'ECM', b1: '532',     curves: '20' },
            { method: 'ECM', b1: '50000',   curves: '200' }],
    // P-1 only — not an ECM frontier at all
    '104': [{ method: 'P-1',  b1: '1000000', curves: '' }],
    // finished entries are excluded even with deep work
    '108': [{ method: 'ECM', b1: '1000000', curves: '900' }],
  });

  const f = sandbox.ecmFrontier();
  const at = (d) => (f.rows.find(r => r.d === d) || {}).entries;
  eq(f.total, 4, 'only unfinished entries above E(2) are counted');
  eq(at(10), 1, 'an entry with only t10 work sits at t10');
  eq(at(25), 1, 'and one that reached t25 sits there, not at its lowest run');
  eq(f.none, 2, 'entries with no ECM at all are counted separately');
  ok(!f.bestFor.has(108), 'a finished entry has no frontier to advance');
  ok(!f.bestFor.has(2), 'and neither do the trivial low entries');

  // ── the backlog below a level ────────────────────────────────────────────
  {
    const below20 = sandbox.belowFrontier(20).map(x => x.n).sort((a, b) => a - b);
    eq(below20, [100, 104, 106],
       'below t20 = the t10 entry plus both with no ECM — the ones with work to do');
    const below30 = sandbox.belowFrontier(30).map(x => x.n).sort((a, b) => a - b);
    eq(below30, [100, 102, 104, 106], 'raising the bar pulls the t25 entry in too');
    eq(sandbox.belowFrontier(10).map(x => x.n).sort((a, b) => a - b), [104, 106],
       'below t10 leaves only the entries nothing has touched');
  }

  // The two views must agree about which level a run belongs to, or the frontier
  // and the yield table would describe the same work differently.
  {
    sandbox.loadECM = () => ({ '100': [{ method: 'ECM', b1: '2420', curves: '10' }] });
    const g = sandbox.ecmFrontier();
    eq((g.rows.find(r => r.d === 15) || {}).entries, 1,
       'a B1 of 2420 lands on t15 in the frontier, as it does in the yield table');
  }

  } finally {
    sandbox.loadECM = realLoadECM;   // see no-stub-leaks
    sandbox.allEntries.length = 0;
    sandbox.__ls = {};
  }
});

// ── long runs are quoted in years ───────────────────────────────────────────
// "4,380.0 days" is a number you have to divide in your head before you know
// whether a run is worth considering, and the deep levels of cost-to-finish are
// full of them.
group('fmt-years', () => {
  if (!needs(PURE, 'fmtCpuTime')) return;
  const f = PURE.fmtCpuTime;
  const DAY = 86400;
  eq(f(364 * DAY), '364.0 days', 'just under a year is still days');
  eq(f(365 * DAY), '1.0 yr', 'and a year exactly is the boundary');
  eq(f(400 * DAY), '1.1 yr', 'a little over reads as a fraction');
  ok(/^9\.\d yr$/.test(f(365 * DAY * 9.5)), 'one decimal below ten');
  eq(f(365 * DAY * 10), '10 yr', 'and none above, where the decimal is noise');
  eq(f(365 * DAY * 1234), '1,234 yr', 'with a thousands separator so the scale reads');

  // The shorter units are untouched — this is an extra band, not a rescale.
  eq(f(45), '45 s');
  eq(f(600), '10.0 min');
  eq(f(3700), '1.0 hr');
  eq(f(90000), '1.0 days');
  eq(f(0.4), '0.40 s', 'and sub-second still works');
});

// ── the calibrated prior reaches the RANKING, not just the report ───────────
// pFactorExistsCalibrated was wired into cost-to-finish and nowhere else, so the
// correction was visible in a table and absent from every recommendation — the
// half that matters least. ECM and P±1 gains must also use the SAME prior as each
// other, or their value-per-hour figures are not comparable, which is the one
// thing the ranking depends on.
group('calibrated-prior-is-used-everywhere', () => {
  const code = fs.readFileSync('index.html', 'utf8');
  ok(!/const pExists  = pFactorExists\(d, digits\);/.test(code),
     'the ECM gain no longer uses the raw prior');
  ok(/const pExists  = pFactorExistsCalibrated\(d, digits, provenDigits\);/.test(code),
     'it uses the calibrated one');
  ok(/const contrib = pFactorExistsCalibrated\(d, digits, provenDigits\)/.test(code),
     'and so does the P±1 gain, so the two stay comparable');

  // The cache is derived from the ECM store and the history, so it has to be
  // dropped when either changes. It was computed once per session and never
  // invalidated — importing a log full of new finds left every recommendation
  // scored against the yield from before the import.
  ok(/function saveECM\(d\) \{[\s\S]{0,400}?invalidateYieldCalib\(\);/.test(code),
     'writing the ECM store drops the calibration');
  ok(/function saveHistory\(h\) \{[\s\S]{0,200}?invalidateYieldCalib\(\);/.test(code),
     'and so does writing the history');
});

group('yield-calibration', () => {
  if (!needs(PURE, 'yieldCalibration', 'pFactorExistsCalibrated')) return;
  const { yieldCalibration, pFactorExistsCalibrated, pFactorExists, invalidateYieldCalib } = PURE;

  // ── the ratio is observed over PREDICTED, not a raw rate ─────────────────
  // Raw finds-per-curve is P(exists) × P(found | exists); comparing it against
  // pFactorExists alone would be comparing two different quantities and calling
  // the gap an error.
  {
    const c = yieldCalibration([{ d: 10, finds: 120, expFinds: 60 }]);
    eq(Math.round(c[10].ratio * 100) / 100, 2,
       'twice as many finds as predicted gives a ratio of 2');
    ok(c[10].usable, '120 finds is enough to act on');
    eq(c[10].verdict, 'measured', 'and it says so');
    ok(c[10].lo < c[10].ratio && c[10].hi > c[10].ratio, 'the interval brackets the estimate');
    ok(c[10].lo > 1.5 && c[10].hi < 2.5, 'and is tight at this sample size');
  }

  // ── too few finds: reported, not applied ─────────────────────────────────
  {
    const c = yieldCalibration([{ d: 20, finds: 10, expFinds: 40 }]);
    ok(!c[20].usable, 'ten finds is not enough to correct a model with');
    ok(/too few finds/.test(c[20].verdict), 'and the reason is stated');
    ok(c[20].ratio > 0, 'the ratio is still computed, so it can be shown');
    ok((c[20].hi - c[20].lo) / c[20].ratio > 0.5,
       'with a band wide enough to show why it is not being used');
  }

  // ── zero finds is a BOUND, not a zero ────────────────────────────────────
  // A level with 287,650 curves and no finds is evidence of a small rate, not of
  // no rate. Treating it as ratio 0 would drive the model to predict nothing will
  // ever be found there, which is how a dataset talks itself out of exploring.
  {
    const c = yieldCalibration([{ d: 25, finds: 0, expFinds: 12 }]);
    eq(c[25].ratio, null, 'no ratio is claimed from zero finds');
    ok(!c[25].usable, 'and it is never applied');
    ok(/bound only/.test(c[25].verdict), 'it is reported as a bound');
    ok(c[25].hi > 0 && c[25].hi < 1, 'with a real upper bound, which is the useful part');
  }

  // ── a level with no runs at all ──────────────────────────────────────────
  {
    const c = yieldCalibration([{ d: 40, finds: 0, expFinds: 0 }]);
    ok(!c[40].usable, 'a level nothing has run at is not calibrated');
    ok(/no tracked runs/.test(c[40].verdict), 'and says so rather than reporting a bound');

    // Finds with no expectation behind them can only mean the numerator and the
    // denominator were measured over different windows — the fault that made t20
    // read 1,621x too low. Naming it beats reporting "no runs" next to 10 finds.
    const mism = yieldCalibration([{ d: 20, finds: 10, expFinds: 0 }]);
    ok(/windows disagree/.test(mism[20].verdict), 'a window mismatch is named, not silently zeroed');
    ok(!mism[20].usable, 'and never applied');
  }

  // ── the hybrid falls back cleanly ────────────────────────────────────────
  // With no yield data reachable — which is the case in this sandbox — every level
  // must return exactly the theoretical value. A calibration layer that changed
  // answers when it had nothing to say would be worse than none.
  {
    invalidateYieldCalib();
    for (const d of [10, 15, 20, 25, 30, 35]) {
      eq(pFactorExistsCalibrated(d, 1000), pFactorExists(d, 1000),
         't' + d + ' falls back to the model when nothing is measured');
    }
  }

  // ── the APPLYING path ────────────────────────────────────────────────────
  // The fallback above is exercised because this sandbox has no yield data, which
  // means the half that actually corrects anything was never run. Injecting the
  // cache directly is the only way to reach it — and it is the half that changes
  // the numbers, so leaving it untested would be testing the disclaimer instead of
  // the claim.
  {
    const base = pFactorExists(10, 1000);

    PURE.setYieldCalib({ 10: { d: 10, finds: 500, expected: 250, ratio: 2,
                               lo: 1.8, hi: 2.2, usable: true, verdict: 'measured' } });
    eq(pFactorExistsCalibrated(10, 1000), Math.min(0.5, base * 2),
       'a usable measurement multiplies the model by its ratio');

    // Not usable: reported, never applied.
    PURE.setYieldCalib({ 10: { d: 10, finds: 10, expected: 40, ratio: 0.25,
                               lo: 0.1, hi: 0.4, usable: false, verdict: 'too few finds (10 < 30)' } });
    eq(pFactorExistsCalibrated(10, 1000), base,
       'a measurement flagged unusable does not move the number');

    // CLAMPED. A calibration is a correction, not a licence to rewrite the model —
    // a ratio of 50 is far likelier to be a data problem than a real property of
    // the number field, and applying it would swamp everything else.
    PURE.setYieldCalib({ 10: { d: 10, finds: 5000, expected: 100, ratio: 50,
                               lo: 48, hi: 52, usable: true, verdict: 'measured' } });
    const wild = pFactorExistsCalibrated(10, 1000);
    ok(wild <= base * 4 + 1e-12, 'an absurd ratio is clamped rather than believed');
    ok(wild > base, 'while still moving in the direction the data points');

    PURE.setYieldCalib({ 10: { d: 10, finds: 5000, expected: 500000, ratio: 0.01,
                               lo: 0.009, hi: 0.011, usable: true, verdict: 'measured' } });
    ok(pFactorExistsCalibrated(10, 1000) >= base * 0.25 - 1e-12,
       'and clamped the other way too');

    PURE.setYieldCalib(null);
  }

  // ── and it stays a probability ───────────────────────────────────────────
  {
    for (const d of [10, 20, 40]) {
      const v = pFactorExistsCalibrated(d, 1000);
      ok(v >= 0 && v <= 0.5, 't' + d + ' stays inside the model\'s own bounds');
    }
  }
});

group('run-budget', () => {
  if (!needs(PURE, 'parseRunBudget', 'fillRunBudget')) return;
  const { parseRunBudget, fillRunBudget } = PURE;

  // ── a bare number is still a COUNT ───────────────────────────────────────
  // Every existing habit keeps working, and nothing silently changes meaning.
  eq(parseRunBudget('400', 1000), { kind: 'count', count: 400 }, 'a plain number is a run count');
  eq(parseRunBudget('', 1000), { kind: 'count', count: 1000 }, 'blank falls back to the remembered value');
  eq(parseRunBudget(null, 250), { kind: 'count', count: 250 }, 'and so does nothing at all');
  eq(parseRunBudget('7.9', 1000), { kind: 'count', count: 7 }, 'a fractional count truncates');

  // ── units ────────────────────────────────────────────────────────────────
  eq(parseRunBudget('8h', 1000),   { kind: 'time', seconds: 8 * 3600 },  'hours');
  eq(parseRunBudget('90m', 1000),  { kind: 'time', seconds: 90 * 60 },   'minutes');
  eq(parseRunBudget('2d', 1000),   { kind: 'time', seconds: 2 * 86400 }, 'days');
  eq(parseRunBudget('1.5h', 1000), { kind: 'time', seconds: 5400 },      'a fractional duration');
  eq(parseRunBudget('  8 HOURS ', 1000), { kind: 'time', seconds: 8 * 3600 },
     'spacing, case and the long form all read the same');

  // ── an unknown unit must NOT be guessed ──────────────────────────────────
  // Falling back to "count" here would silently export 8 runs when 8 furlongs was
  // asked for. Refusing is the only safe reading.
  eq(parseRunBudget('8x', 1000).kind, 'unknown', 'an unrecognised unit is refused, not guessed');
  eq(parseRunBudget('abc', 1000), { kind: 'count', count: 1000 },
     'while something with no number at all just falls back');
  eq(parseRunBudget('-5', 1000), { kind: 'count', count: 1000 }, 'a negative falls back too');
  eq(parseRunBudget('0h', 1000), { kind: 'count', count: 1000 }, 'and so does a zero budget');

  // ── filling ──────────────────────────────────────────────────────────────
  const runs = [
    { n: 1, cpuTime: 3600 },   // 1h
    { n: 2, cpuTime: 1800 },   // 30m
    { n: 3, cpuTime: 7200 },   // 2h
    { n: 4, cpuTime: 900  },   // 15m
  ];
  {
    const f = fillRunBudget(runs, { kind: 'time', seconds: 7200 });   // 2h
    eq(f.runs.map(r => r.n), [1, 2, 4], 'takes runs in RANKED order until the budget is spent');
    eq(f.seconds, 6300, 'and reports what it actually used');
    eq(f.spilled, 1, 'counting the ones passed over as too long to fit');
    ok(f.seconds <= 7200, 'never exceeding the budget');
  }
  {
    // Ranked order is preserved, not re-sorted to pack tighter: the list is already
    // sorted by value per CPU-second, so taking the best until time runs out IS the
    // optimal fill. Packing a gap with a cheaper run means preferring worse value.
    const f = fillRunBudget(runs, { kind: 'time', seconds: 3600 });
    eq(f.runs.map(r => r.n), [1], 'the best run is taken even when smaller ones would fit better');
  }
  {
    const f = fillRunBudget(runs, { kind: 'count', count: 2 });
    eq(f.runs.map(r => r.n), [1, 2], 'a count budget still just truncates');
  }
  {
    const f = fillRunBudget(runs, { kind: 'time', seconds: 60 });
    eq(f.runs, [], 'a budget too small for anything yields nothing');
    eq(f.spilled, 4, 'and says so rather than looking like there is no work');
  }
  {
    const f = fillRunBudget(runs, { kind: 'time', seconds: 86400 });
    eq(f.runs.length, 4, 'a budget larger than the work takes all of it');
    eq(f.spilled, 0, 'with nothing skipped');
  }
  // A run with no cost recorded must not be treated as free-and-infinite.
  {
    const f = fillRunBudget([{ n: 9 }], { kind: 'time', seconds: 60 });
    eq(f.runs.map(r => r.n), [9], 'a run with no time estimate is taken, not dropped');
  }
});

group('ahead-of-fdb', () => {
  if (!needs(M, 'factorsFdbLacks')) return;
  const p = 156937982257994989n, q = 1626524294689195079n, r = 1000003n;
  const VAL = (p * q * r).toString();
  const reset = () => {
    sb2.__ls = {}; M.saveHistory([]);
    sb2.allEntries.length = 0;
    for (const k of Object.keys(sb2.fdbCache)) delete sb2.fdbCache[k];
  };
  const entry = (factors) => ({ n: 1, val: VAL, status: 'partial', factors });

  // ── the case in the request: we have 3, FactorDB has 2 ───────────────────
  {
    reset();
    const e = entry([String(p), String(q), String(r)]);
    sb2.allEntries.push(e);
    sb2.fdbCache[VAL] = { n: 1, status: 'CF', source: 'import', timestamp: 1,
                          factors: e.factors, fdbHas: [String(p), String(q)] };
    eq(M.factorsFdbLacks(e), [String(r)], 'the one factor FactorDB does not have is identified');
  }

  // ── nothing to report when FactorDB has everything ───────────────────────
  {
    reset();
    const e = entry([String(p), String(q)]);
    sb2.allEntries.push(e);
    sb2.fdbCache[VAL] = { n: 1, status: 'CF', source: 'fdb', timestamp: 1,
                          factors: e.factors, fdbHas: [String(p), String(q)] };
    eq(M.factorsFdbLacks(e), [], 'an entry FactorDB fully covers is not "ahead"');
  }

  // ── no FactorDB record at all: everything we hold is ahead ───────────────
  // The strongest case, not the weakest — FactorDB knows nothing about the number,
  // so every factor we hold is news to it.
  {
    reset();
    const e = entry([String(p), String(r)]);
    sb2.allEntries.push(e);
    eq(M.factorsFdbLacks(e).slice().sort(), [String(p), String(r)].sort(),
       'with no FactorDB record every factor counts as ahead');
  }

  // ── provenance still covers entries with no fdbHas yet ───────────────────
  // fdbHas only appears once an entry has been re-checked. Until then provenance
  // is the only evidence, so it must still be honoured.
  {
    reset();
    const e = entry([String(p), String(r)]);
    sb2.allEntries.push(e);
    M.recordDiscovery(1, String(p), 'f');
    sb2.fdbCache[VAL] = { n: 1, status: 'CF', source: 'import', timestamp: 1, factors: e.factors };
    eq(M.factorsFdbLacks(e), [String(r)],
       'without fdbHas, provenance still identifies what FactorDB gave us');
  }

  // ── a power counts by its base ───────────────────────────────────────────
  {
    reset();
    const sq = (p * p * r).toString();
    const e = { n: 1, val: sq, status: 'partial', factors: [p + '^2', String(r)] };
    sb2.allEntries.push(e);
    sb2.fdbCache[sq] = { n: 1, status: 'CF', source: 'import', timestamp: 1,
                         factors: e.factors, fdbHas: [String(p)] };
    eq(M.factorsFdbLacks(e), [String(r)],
       'p^2 is recognised as the same factor FactorDB reported as p');
  }

  // ── the filter and the export cannot disagree ────────────────────────────
  // The whole reason for one shared function: what the filter lists is what the
  // export sends. Asserted by running both over the same entry.
  {
    reset();
    const e = entry([String(p), String(q), String(r)]);
    sb2.allEntries.push(e);
    sb2.eulerValues[1] = VAL;
    sb2.fdbCache[VAL] = { n: 1, status: 'CF', source: 'import', timestamp: 1,
                          factors: e.factors, fdbHas: [String(p), String(q)] };
    let written = '';
    const realBlob = sb2.Blob, realURL = sb2.URL, realDoc = sb2.document;
    sb2.Blob = function (parts) { written = parts.join(''); };
    sb2.URL = { createObjectURL: () => 'blob:x', revokeObjectURL() {} };
    sb2.document = { createElement: () => ({ set href(v) {}, set download(v) {}, click() {} }) };
    M.exportFDBSubmission();
    sb2.Blob = realBlob; sb2.URL = realURL; sb2.document = realDoc;

    const line = written.split('\n').filter(l => l && !l.startsWith('#'))[0] || '';
    const sent = line ? line.split('=')[1].split('*') : [];
    eq(sent.slice().sort(), M.factorsFdbLacks(e).slice().sort(),
       'the export sends exactly the factors the filter would list as ahead');
  }

  // ── the filter selects on it ─────────────────────────────────────────────
  // The rule above is tested directly; this checks the filter is actually wired to
  // it, and selects rather than passing everything through.
  {
    reset();
    const ahead  = { n: 1, val: VAL, status: 'partial', factors: [String(p), String(r)] };
    const level  = { n: 3, val: VAL, status: 'partial', factors: [String(p)] };
    const barren = { n: 5, val: VAL, status: 'composite', factors: [] };
    sb2.allEntries.push(ahead, level, barren);
    sb2.fdbCache[VAL] = { n: 1, status: 'CF', source: 'import', timestamp: 1,
                          factors: ahead.factors, fdbHas: [String(p)] };
    sb2.activeFilter = 'ahead-of-fdb';
    sb2.searchQuery = '';
    M.applyFilters();
    eq(sb2.filtered.map(e => e.n), [1],
       'only the entry holding a factor FactorDB lacks is shown');

    sb2.activeFilter = 'all';
    M.applyFilters();
    eq(sb2.filtered.length, 3, 'and the filter is doing the selecting, not the fixture');
  }

  sb2.activeFilter = 'all';
  sb2.__ls = {};
});

// ── a cached record's factors must survive a reload, whatever its status ────
// Reported on E(15880): results.json held
//   {"status":"CF", "factors":["5^2","41","5399","15881"], "source":"import"}
// and after a hard reload the modal showed "FDB Undetermined" with no factors at
// all. Importing a batch of fdb_check.py results took the unknown count from ~163
// to 430 the same way.
//
// The chain: FactorDB answers 'U' for a 56,702-digit number — plausible, it has no
// factorisation for it — and applyFdbResult correctly keeps our own factors,
// leaving a cache record of status 'U' WITH factors. Then replayFDBCache, which is
// the ONLY path that puts factors back on an entry after a rebuild, had branches
// for FF, C and CF and none for 'U'. So the factors sat in storage, correct and
// unreachable, the entry rebuilt empty at status 'unknown', and applyFdbUnknownSet
// then relabelled that 'fdb-unknown'. Everything the user saw.
//
// The general rule this pins: a status describes what FACTORDB knows; the factors
// are ours either way. Restoring them must never be conditional on FactorDB's
// verdict.
// ── saving the FDB cache is debounced, and that must be invisible ──────────
// A poll calls saveFDBCache once per number, and rebuilding the whole store each
// time costs ~270 ms against a 10,000-entry cache: 140 for the base36 encoding,
// 130 for stringifying 6.4 MB. Over a 500-number run that is two minutes of pure
// re-serialisation, every byte of it thrown away by the next call.
//
// Deferring it is only safe if no reader can observe the gap — the pull path
// re-reads the store immediately after merging, on purpose, so a stale read there
// would discard the merge outright.
group('fdb-save-debounce', () => {
  if (!needs(sandbox, 'flushFDBCache', 'saveFDBCache', 'loadFDBCache')) return;
  const V = '600851475143';
  sandbox.eulerValues[42] = V;

  // ── a read never sees a stale store ──────────────────────────────────────
  {
    sandbox.__ls = {};
    for (const k of Object.keys(sandbox.fdbFactors || {})) delete sandbox.fdbFactors[k];
    sandbox.saveFDBCache({ [V]: { n: 42, status: 'CF', timestamp: 1, factors: ['71', '839'] } });
    // No explicit flush: loadFDBCache has to do it, or the pull path loses data.
    const back = sandbox.loadFDBCache()[V];
    ok(!!back, 'a read immediately after a save sees the save');
    eq((back.factors || []).slice().sort(), ['71', '839'],
       'with its factors, not the previous version of the store');
  }

  // ── the flush is idempotent and safe when nothing is pending ─────────────
  {
    eq(sandbox.flushFDBCache(), false, 'flushing with nothing pending is a no-op');
    sandbox.saveFDBCache({ [V]: { n: 42, status: 'CF', timestamp: 2, factors: ['71'] } });
    eq(sandbox.flushFDBCache(), true, 'a pending save reports that it wrote');
    eq(sandbox.flushFDBCache(), false, 'and does not write twice');
  }

  // ── the last save wins ───────────────────────────────────────────────────
  // Coalescing means intermediate states are skipped, which is the point — but the
  // final state must be exactly what the last caller passed.
  {
    sandbox.__ls = {};
    for (const k of Object.keys(sandbox.fdbFactors || {})) delete sandbox.fdbFactors[k];
    sandbox.saveFDBCache({ [V]: { n: 42, status: 'CF', timestamp: 1, factors: ['71'] } });
    sandbox.saveFDBCache({ [V]: { n: 42, status: 'CF', timestamp: 2, factors: ['71', '839'] } });
    sandbox.saveFDBCache({ [V]: { n: 42, status: 'FF', timestamp: 3, factors: ['71', '839', '1471'] } });
    const back = sandbox.loadFDBCache()[V];
    eq(back.status, 'FF', 'the store holds the last state saved');
    eq((back.factors || []).length, 3, 'not an intermediate one');
  }

  // ── the memoised encoder returns what the plain one did ──────────────────
  // A cache that returned anything different would corrupt every factor on disk,
  // and the corruption would only show on the next load.
  {
    const cases = ['71', '5', '1', '5^3', '156937982257994989',
                   '9'.repeat(120), '9'.repeat(2500), 'not-a-number', ''];
    let allMatch = true;
    for (const f of cases) {
      const first  = sandbox._encodeFactor(f);
      const second = sandbox._encodeFactor(f);   // served from the memo
      if (first !== second) allMatch = false;
      if (/^\d+$/.test(f) && f.length <= 2000 && sandbox._decodeFactor(first) !== f) allMatch = false;
    }
    ok(allMatch, 'the memo returns identical results and every value still round-trips');
  }
});

group('cached-factors-survive-reload', () => {
  // A long value that the fixture's factors genuinely divide — applyFdbResult
  // rejects any factor that does not, and rightly so.
  const V = (25n * 41n * 5399n * 15881n * BigInt('9'.repeat(120))).toString();
  const setup = () => {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.__ls = {};
  };
  // What a rebuild produces: buildEntries yields bare entries, and replay is the
  // only thing that fills them back in.
  const reload = (n) => {
    const e = { n, val: V, status: 'unknown', factors: [] };
    sandbox.allEntries.length = 0;
    sandbox.allEntries.push(e);
    sandbox.replayFDBCache();
    if (sandbox.applyFdbUnknownSet) sandbox.applyFdbUnknownSet();
    return e;
  };

  // ── the reported case: FactorDB says U, we hold four factors ─────────────
  {
    setup();
    const held = ['5^2', '41', '5399', '15881'];
    sandbox.allEntries.push({ n: 15880, val: V, status: 'partial', factors: held.slice() });
    sandbox.applyFdbResult({ status: 'U', factors: [] }, 15880, V);

    // The record is right — this was never the broken part.
    eq((sandbox.fdbCache[V].factors || []).slice().sort(), held.slice().sort(),
       'a U result keeps the factors we already held, in the cache record');
    eq(sandbox.fdbCache[V].status, 'U', 'and records that FactorDB has no factorisation');

    const after = reload(15880);
    eq((after.factors || []).slice().sort(), held.slice().sort(),
       'and a reload puts them back on the entry');
    ok(after.status !== 'fdb-unknown',
       'so the entry does not come back reading as though nothing is known about it');
    ok(after._fdbUnknown === true,
       'while still recording that FactorDB itself has nothing — that is what makes the factors worth submitting');
  }

  // ── the same for a plain composite verdict ───────────────────────────────
  // 'C' means FactorDB confirmed composite with no factors of its own. Ours are
  // still ours.
  {
    setup();
    sandbox.allEntries.push({ n: 15882, val: V, status: 'partial', factors: ['41'] });
    sandbox.applyFdbResult({ status: 'C', factors: [] }, 15882, V);
    const after = reload(15882);
    eq(after.factors, ['41'], 'a C result does not lose our factors across a reload either');
  }

  // ── and the statuses that already worked keep working ────────────────────
  {
    setup();
    sandbox.allEntries.push({ n: 15884, val: V, status: 'unknown', factors: [] });
    sandbox.applyFdbResult({ status: 'CF', factors: [['41', 1], ['5399', 1]] }, 15884, V);
    const after = reload(15884);
    eq((after.factors || []).slice().sort(), ['41', '5399'], 'CF still restores');
    eq(after.status, 'partial', 'at the right status');
  }
  {
    setup();
    sandbox.allEntries.push({ n: 15886, val: V, status: 'unknown', factors: [] });
    sandbox.applyFdbResult({ status: 'U', factors: [] }, 15886, V);
    const after = reload(15886);
    eq(after.status, 'fdb-unknown',
       'and an entry with nothing of our own genuinely is FDB-undetermined');
    eq((after.factors || []).length, 0, 'with no factors invented for it');
  }

  // ── an ECM find on an FDB-undetermined entry, all the way round ──────────
  // Reported: uploading curves with factors took the fdb-unknown count 138 -> 98,
  // and a reload half a day later put it back to 115. Anything that survives the
  // session but not the reload is a persistence problem, so this walks the whole
  // path -- record the factor, save, load back through the slim store, rebuild,
  // replay, re-apply the fdb-unknown set -- rather than checking any one step.
  {
    setup();
    sandbox.__ls['eulerFDB_fdbUnknown_v1'] = JSON.stringify([15892]);
    // loadFDBCache maps its n-keyed slim records back to number strings through
    // eulerValues, so the value has to be present for the round trip to mean
    // anything — which is itself the hazard tested at the end of this group.
    sandbox.eulerValues[15892] = V;
    const e = { n: 15892, val: V, status: 'fdb-unknown', factors: [], _fdbUnknown: true };
    sandbox.allEntries.push(e);

    sandbox.recordEcmFactor(e, '5399');
    ok((e.factors || []).includes('5399'), 'the ECM factor lands on the entry');
    ok(e.status !== 'fdb-unknown', 'and the entry stops reading as FDB-undetermined');

    // Force the slim path: clear the in-memory factor map the way a reload does.
    sandbox.saveFDBCache(sandbox.fdbCache);
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    if (sandbox.fdbFactors) for (const k of Object.keys(sandbox.fdbFactors)) delete sandbox.fdbFactors[k];
    const reloaded = sandbox.loadFDBCache();
    for (const [k, v] of Object.entries(reloaded)) sandbox.fdbCache[k] = v;

    const after = reload(15892);
    ok((after.factors || []).includes('5399'),
       'and it is still there after a save, reload and replay');
    ok(after.status !== 'fdb-unknown',
       'so the entry does not drift back into the fdb-unknown count overnight');
  }

  // ── a missing Euler value silently deletes the record ────────────────────
  // loadFDBCache is keyed by n in storage and has to map back to the number string
  // through eulerValues. When that lookup fails the record is SKIPPED — so a
  // partial or failed value load does not degrade gracefully, it returns a cache
  // with those entries simply absent. Every factor on them disappears, the entries
  // rebuild bare, and applyFdbUnknownSet relabels them fdb-unknown.
  //
  // That is the shape of a count that drifts UP across a reload for no reason
  // anyone did: it depends on whether a chunk of values happened to load, so it
  // differs run to run. And because saveFDBCache writes whatever is in memory, the
  // next save PERSISTS the truncated cache over the good one — turning a transient
  // network failure into permanent loss.
  {
    setup();
    sandbox.eulerValues[15894] = V;
    const e = { n: 15894, val: V, status: 'partial', factors: ['41'] };
    sandbox.allEntries.push(e);
    sandbox.applyFdbResult({ status: 'U', factors: [] }, 15894, V);
    sandbox.saveFDBCache(sandbox.fdbCache);
    sandbox.flushFDBCache();

    // Now the value is unavailable, as it is when a chunk fails to load.
    delete sandbox.eulerValues[15894];
    const withoutValue = sandbox.loadFDBCache();
    eq(Object.keys(withoutValue).length, 0,
       'a record whose Euler value is missing is dropped from the loaded cache entirely');

    // And it comes back intact once the value is there again — the record on disk
    // was never the problem.
    sandbox.eulerValues[15894] = V;
    const withValue = sandbox.loadFDBCache();
    eq((withValue[V] && withValue[V].factors || []).slice(), ['41'],
       'and returns intact once the value is available, so the loss is in the lookup');
  }

  // ── and an incomplete load must never be written back ────────────────────
  // The drop above is survivable; saving on top of it is not. Every check, merge
  // and repair calls saveFDBCache with whatever is in memory, so without this the
  // first one after a failed value load writes the truncated cache over the
  // complete one and a transient network problem becomes permanent.
  {
    setup();
    sandbox.eulerValues[15896] = V;
    sandbox.allEntries.push({ n: 15896, val: V, status: 'partial', factors: ['41'] });
    sandbox.applyFdbResult({ status: 'CF', factors: [['41', 1]] }, 15896, V);
    sandbox.saveFDBCache(sandbox.fdbCache);
    sandbox.flushFDBCache();      // saving is debounced; this test reads the raw store
    const good = sandbox.__ls['eulerFDB_v1'];
    ok(good && good.includes('15896'), 'a complete cache saves normally');

    // Values unavailable: the load comes back short.
    delete sandbox.eulerValues[15896];
    sandbox.loadFDBCache();
    sandbox.saveFDBCache({});                     // what any check would do next
    sandbox.flushFDBCache();
    eq(sandbox.__ls['eulerFDB_v1'], good,
       'a save after an incomplete load is refused, leaving the stored cache untouched');

    // Once the values are back, saving works again — the guard must not latch.
    sandbox.eulerValues[15896] = V;
    sandbox.loadFDBCache();
    sandbox.saveFDBCache({ [V]: { n: 15896, status: 'CF', factors: ['41', '5399'], timestamp: 2 } });
    sandbox.flushFDBCache();
    ok(sandbox.__ls['eulerFDB_v1'] !== good, 'and saving resumes once the load is complete again');
  }

  // ── repairing an entry already stuck in the bad state ────────────────────
  // Anyone who reloaded while the bug was live has entries sitting at
  // 'fdb-unknown'. Replay puts their factors back, and this makes sure the label
  // follows: an entry with factors is 'partial' whatever the fdb-unknown set says,
  // because that set records what FACTORDB knows, not what we do. Tested by
  // calling applyFdbUnknownSet directly — through a normal reload replay has
  // already set 'partial', so the branch is unreachable from there.
  {
    setup();
    sandbox.__ls['eulerFDB_fdbUnknown_v1'] = JSON.stringify([15888]);
    const stuck = { n: 15888, val: V, status: 'fdb-unknown', factors: ['41', '5399'] };
    sandbox.allEntries.push(stuck);
    sandbox.applyFdbUnknownSet();
    eq(stuck.status, 'partial',
       'an entry holding factors is not labelled fdb-unknown, however it got there');
    eq(stuck.factors, ['41', '5399'], 'and its factors are untouched');
    ok(stuck._fdbUnknown === true, 'while the flag still records that FactorDB has nothing');

    const bare = { n: 15890, val: V, status: 'unknown', factors: [] };
    sandbox.allEntries.length = 0;
    sandbox.allEntries.push(bare);
    sandbox.__ls['eulerFDB_fdbUnknown_v1'] = JSON.stringify([15890]);
    sandbox.applyFdbUnknownSet();
    eq(bare.status, 'fdb-unknown', 'and an entry with nothing of its own still is fdb-unknown');
  }

  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.__ls = {};
});

// ── a factor is labelled by what it IS, not by whose cache key it collides with ─
// Reported on E(8946): the factor 61 displayed as "61 COMPOSITE?".
//
// fdbCache is keyed by NUMBER STRING, and the small Euler values are themselves
// small primes — E(4) = 5, E(6) = -61. So fdbCache['61'] is the record for the
// ENTRY E(6), not a statement about 61 as somebody else's factor. Our own code
// writes 'FF' for any entry it considers complete (recordEcmFactor and
// applySieveFindings both do), and E(6) is complete because 61 is prime. Every
// larger entry holding 61 then read that record, saw FF, and called it composite.
//
// 5 and 61 are among the most common small factors in the whole dataset, so this
// was mislabelling a lot of correct data — and mislabelling it in the direction
// that makes a user distrust the factor.
// ── the ECM export's priority weight must describe what it claims ───────────
// The prompt offering the weight says: "We asked and FactorDB came back with
// nothing." The code tested something else — whether we hold a cache record at all
// — and those diverge exactly where it matters.
//
// An entry nobody has queried has no record either, and for a 52,926-digit number
// that is permanent: it is far past the browser's query limit, so it can never
// acquire one. So the bonus meant for "nothing else is working on this" was going
// to every huge number purely for being too big to ask about, while the numbers
// that HAD been asked were the only ones excluded from it.
//
// Reported on E(510): 1,062 digits offering 1.25%/hr, beaten in the export by
// E(14934) at 52,926 digits offering 0.28%/hr — same odds, four and a half times
// the CPU, promoted by a x20 multiplier it had not earned.
group('fdb-undetermined-weight', () => {
  const set = (arr) => { sandbox.__ls['eulerFDB_fdbUnknown_v1'] = JSON.stringify(arr || []); };
  set([]);

  // ── asked, and FactorDB had nothing: this is what the bonus is for ───────
  ok(sandbox.isFdbUndetermined({ n: 1, _fdbUnknown: true }, null),
     'an entry flagged FDB-undetermined qualifies');
  ok(sandbox.isFdbUndetermined({ n: 2 }, { status: 'U' }),
     'and so does a cached U status — the same fact, recorded elsewhere');
  set([3]);
  ok(sandbox.isFdbUndetermined({ n: 3 }, null),
     'and membership of the persistent set, which survives a rebuild');
  set([]);

  // ── never asked: NOT the same fact ───────────────────────────────────────
  ok(!sandbox.isFdbUndetermined({ n: 4 }, null),
     'an entry with no record has simply never been asked, and earns nothing');
  ok(!sandbox.isFdbUndetermined({ n: 5, val: '9'.repeat(52926) }, null),
     'including one too large to ever query — being unaskable is not evidence');

  // ── asked, and FactorDB answered ─────────────────────────────────────────
  for (const st of ['FF', 'CF', 'C', 'P', 'PRP']) {
    ok(!sandbox.isFdbUndetermined({ n: 6 }, { status: st }),
       'a ' + st + ' answer means FactorDB does know something');
  }

  // ── a real answer from FactorDB retires the marker ───────────────────────
  // Reported on E(19836): its tile said "FDB has nothing on this — our factors are
  // new" while its own modal said "FactorDB has every factor we hold". Both were
  // reading the same entry.
  //
  // The marker means "we asked and FactorDB had nothing". Nothing ever removed an
  // n from that set — it was built to union cleanly across machines — so once
  // FactorDB answered, the marker stayed and said the opposite of the truth. It
  // was also still earning the export's priority boost for a number FactorDB has
  // fully described.
  {
    set([19836]);
    const e = { n: 19836, factors: ['5', '13', '37'] };
    ok(!sandbox.isFdbUndetermined(e, { status: 'CF' }),
       'a CF answer overrides an older fdb-unknown marker');
    ok(!sandbox.isFdbUndetermined(e, { status: 'FF' }), 'and so does FF');
    ok(!sandbox.qualifiesForEcmPriority(e, { status: 'CF' }),
       'so it stops collecting the export boost it had not earned');

    // The marker still stands where FactorDB genuinely has nothing.
    ok(sandbox.isFdbUndetermined({ n: 19836, factors: ['5'] }, { status: 'U' }),
       'a U answer keeps it');
    ok(sandbox.isFdbUndetermined({ n: 19836, factors: ['5'] }, null),
       'and so does having no record at all, since nothing contradicts it');
    set([]);
  }

  // ── and the marker is retired at the source ──────────────────────────────
  // Overriding at read time fixes the display; removing it on the answer stops the
  // set filling with markers its own cache records contradict.
  {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.__ls = {};
    const V = (5n * 13n * 37n * BigInt('9'.repeat(60))).toString();
    sandbox.allEntries.push({ n: 19836, val: V, status: 'fdb-unknown', factors: ['5'] });
    sandbox.addFdbUnknown(19836);
    ok(sandbox.loadFdbUnknownSet().has(19836), 'marked while FactorDB had nothing');

    sandbox.applyFdbResult({ status: 'CF', factors: [['5', 1], ['13', 1]] }, 19836, V);
    ok(!sandbox.loadFdbUnknownSet().has(19836),
       'and the marker is gone once FactorDB answers');
    sandbox.__ls = {};
  }

  // ── the boost covers BOTH categories ─────────────────────────────────────
  // Either reason is enough, and neither implies the other: an entry can hold
  // factors we found while FactorDB still has nothing, and an entry FactorDB has
  // fully described can be one we hold nothing for locally.
  ok(sandbox.qualifiesForEcmPriority({ n: 10, factors: [] }, { status: 'CF' }),
     'no known factors qualifies, even when FactorDB has answered');
  ok(sandbox.qualifiesForEcmPriority({ n: 11, factors: ['61'], _fdbUnknown: true }, { status: 'U' }),
     'and FDB-undetermined qualifies, even when we do hold factors');
  ok(!sandbox.qualifiesForEcmPriority({ n: 12, factors: ['61'] }, { status: 'CF' }),
     'an entry with factors that FactorDB has described gets no boost');
  ok(sandbox.qualifiesForEcmPriority({ n: 13, factors: ['1'] }, { status: 'CF' }),
     'a placeholder "1" is not a known factor');

  // ── the ranking consequence, from the real reported data ─────────────────
  // Both entries hold ZERO factors — checked in the user's results.json, not
  // assumed. E(510) is status C (FactorDB says composite, knows no factors) and
  // E(14934) is status U (FactorDB has nothing at all).
  //
  // The old rule asked only for FactorDB's opinion, and treated C as "FactorDB
  // knows something" — so E(510), with nothing known about it by anyone, was
  // excluded from the bonus while E(14934) got it. A run offering 4.5x the value
  // per hour ranked below one that did not.
  //
  // With "no known factors" in the rule both qualify, and the ranking falls back
  // to what it should have been all along: value per CPU-hour.
  {
    const W = 20;
    const e510   = { n: 510,   factors: [] };
    const e14934 = { n: 14934, factors: [] };
    sandbox.__ls['eulerFDB_fdbUnknown_v1'] = JSON.stringify([14934]);
    const eff = (gain, hours, e, rec) =>
      (gain / hours) * (sandbox.qualifiesForEcmPriority(e, rec) ? W : 1);

    ok(sandbox.qualifiesForEcmPriority(e510, { status: 'C' }),
       'an entry nothing is known about qualifies even when FactorDB has answered C');
    ok(sandbox.qualifiesForEcmPriority(e14934, { status: 'U' }),
       'and so does an FDB-undetermined one');

    const s510   = eff(1.27, 1.02, e510,   { status: 'C' });
    const s14934 = eff(1.25, 4.50, e14934, { status: 'U' });
    ok(s510 > s14934,
       'with both boosted, the cheaper run wins on value — which is the whole point');
    ok(s510 / s14934 > 4,
       'and by the margin its cost advantage deserves, not a token amount');
    sandbox.__ls = {};
  }

  sandbox.__ls = {};
});

group('factor-label-key-collision', () => {
  const cache = {};
  const label = (f, allVP) => sandbox.factorPrimalityLabel(f, allVP, cache);

  // ── the reported case ────────────────────────────────────────────────────
  cache['61'] = { n: 6, status: 'FF', factors: ['61'], timestamp: 1 };   // E(6)'s own record
  eq(label('61', false), 'prime',
     "61 is prime, whatever the cache record that happens to share its key says");
  cache['5'] = { n: 4, status: 'FF', factors: ['5'], timestamp: 1 };     // E(4)'s own record
  eq(label('5', false), 'prime', 'and so is 5, for exactly the same reason');

  // ── the inference FF was there for still works ───────────────────────────
  // A genuinely composite factor must still be caught — this is not a licence to
  // call everything prime.
  cache['91'] = { n: 999, status: 'FF', factors: ['7', '13'], timestamp: 1 };
  eq(label('91', false), 'composite', '91 = 7 x 13 is still reported composite');
  eq(label('4', false), 'composite', 'and so is a composite with no cache record at all');

  // ── past the local ceiling, FactorDB's verdict is all there is ───────────
  // Above LABEL_PRIMALITY_MAX_DIGITS the arithmetic is not attempted, so an FF
  // record remains the only evidence and is still used.
  {
    const huge = '9'.repeat(400);
    cache[huge] = { n: 1000, status: 'FF', factors: ['3', '7'], timestamp: 1 };
    eq(label(huge, false), 'composite',
       'a factor too large to test locally still trusts an FF record');
    const huge2 = '7'.repeat(400);
    eq(label(huge2, false), 'large', 'and one with no record is simply unknown');
  }

  // ── P/PRP is unaffected — it is a claim about the number itself ──────────
  cache['1000003'] = { n: 12, status: 'P', factors: [], timestamp: 1 };
  eq(label('1000003', false), 'prime', 'a P record still marks the factor prime');
  cache['1000033'] = { n: 14, status: 'PRP', factors: [], timestamp: 1 };
  eq(label('1000033', false), 'prp', 'and PRP is passed through as PRP');

  // ── an FF entry means every factor it listed is prime ────────────────────
  eq(label('91', true), 'prime',
     'when FactorDB proved the whole factorisation, its listed factors are prime by definition');
});

// ── two machines must end up seeing the same thing ──────────────────────────
// Reported: the same account showed 113 FDB-undetermined entries in one browser
// and 108 in another. The fdb-unknown set is a record of what FACTORDB said, but
// it lived only in localStorage and was never in the sync payload — so each
// machine knew only about the numbers it had happened to poll, and the counts
// drifted apart permanently.
//
// Two more were in the same position and change derived numbers just as quietly:
// the measured query limits (which decide what the check-list export contains) and
// the tracking start (which decides the yield report's attributable window).
//
// All three merge monotonically, so it does not matter which machine learned what
// first, or in what order the pulls happen.
// ── "Clear all local data" must not delete the only copy ────────────────────
// The dialog promises "Pull from GitHub afterwards to restore your data", and that
// is only true for data GitHub actually has. It checked nothing before deleting.
//
// The ECM log is the sharp edge: it is a SEPARATE file (results_ecm.json) pushed
// on its own 8-second debounce, so having just pushed factors is not evidence that
// the ECM log went too. Clear inside that window and 21,000 attempts are gone with
// no copy anywhere.
group('clear-refuses-to-destroy-unpushed-work', () => {
  if (!needs(M, 'unpushedWork')) return;
  const set = (dirty, ecmTimer, gh) => {
    sb2._dirty = dirty; sb2._ecmPushTimer = ecmTimer; sb2.__gh = gh || undefined;
  };

  set(false, null);
  eq(M.unpushedWork(), [], 'with everything pushed there is nothing to lose');

  set(true, null);
  eq(M.unpushedWork().length, 1, 'unpushed factor changes are reported');
  ok(/not been pushed/.test(M.unpushedWork()[0]), 'and said plainly');

  set(false, 1234);
  ok(/ECM log/.test(M.unpushedWork()[0] || ''),
     'an ECM push still inside its debounce counts — it is a separate file');

  set(true, 1234);
  eq(M.unpushedWork().length, 2, 'both are reported when both apply');

  // No repo at all is the worst case and must not read as "nothing to lose".
  set(false, null, { token: '', user: '', repo: '' });
  eq(M.unpushedWork().length, 1, 'an unconfigured repo means nothing has EVER been pushed');
  ok(/nothing has ever been pushed/i.test(M.unpushedWork()[0]), 'and that is what it says');

  set(false, null, null);
});

// ── a cofactor recorded before the stripping existed is still a cofactor ────
// Found by auditing a real store: 90 records held a factor of 300+ digits, every
// one of them CF and from the offline import path. E(16334) listed 1429, 291817,
// 17963623, 327206459 and a 58,523-digit "factor".
//
// applyFdbResult strips the cofactor from what FactorDB just SENT, but merges
// `priorOwn` — what the entry already held — untouched. So one recorded before
// that stripping existed survives every subsequent check forever.
//
// Neither cleanup can see it: the cofactor genuinely divides E(n) so
// clampExponentsToValue keeps it, and it is not the product of its neighbours so
// dedupeCompositeFactors keeps it. Primality would settle it and is unavailable at
// that size. But CF means "NOT fully factored", so if the stored factors multiply
// back to the whole number, the largest cannot be prime.
group('cf-cofactor-in-prior-factors', () => {
  const p1 = 1429n, p2 = 291817n, cof = 104729n * 104723n;   // stands in for the big one
  const VAL = (p1 * p2 * cof).toString();
  const setup = (factors) => {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.allEntries.push({ n: 16334, val: VAL, status: 'partial', factors: factors.slice() });
  };

  // The entry already carries the cofactor; FactorDB re-confirms only the primes.
  setup([String(p1), String(p2), String(cof)]);
  sandbox.applyFdbResult({ status: 'CF', factors: [[String(p1), 1], [String(p2), 1]] }, 16334, VAL);
  const after = sandbox.allEntries[0].factors || [];
  ok(!after.includes(String(cof)),
     'a cofactor already on the entry is dropped, not preserved through priorOwn');
  eq(after.slice().sort(), [String(p1), String(p2)].sort(), 'leaving only the real primes');

  // A provably PRIME largest factor must be kept — then the product matching means
  // the entry really is complete and FactorDB's CF is merely behind.
  {
    const v2 = (3n * 7n * 11n).toString();
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.allEntries.push({ n: 20, val: v2, status: 'partial', factors: ['3', '7', '11'] });
    sandbox.applyFdbResult({ status: 'CF', factors: [['3', 1], ['7', 1], ['11', 1]] }, 20, v2);
    eq((sandbox.allEntries[0].factors || []).slice().sort(), ['11', '3', '7'],
       'a provably prime largest factor is kept — arithmetic beats a stale verdict');
  }

  // And an entry whose factors do NOT account for the whole number is untouched:
  // there is no cofactor hiding in the list.
  //
  // The largest here is deliberately too big to prove prime — otherwise the
  // primality branch keeps it for the wrong reason and the product test is never
  // exercised. That is exactly how a mutation deleting the product test survived.
  {
    const huge = '9'.repeat(400);
    const bigVal = (BigInt(huge) * p1 * p2 * 7919n).toString();
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.allEntries.push({ n: 16336, val: bigVal, status: 'partial',
                              factors: [String(p1), huge] });
    sandbox.applyFdbResult({ status: 'CF', factors: [[String(p1), 1]] }, 16336, bigVal);
    const kept = sandbox.allEntries[0].factors || [];
    ok(kept.includes(huge),
       'a large unprovable factor is kept when the list does NOT account for the whole number');
    eq(kept.length, 2, 'and nothing else is dropped either');
  }
});

// ── a retraction must survive a pull ────────────────────────────────────────
// mergeVerifiedComplete had ONE reference in this file — effectively untested, in
// the same family as the factor merge where the same bug was found twice. It is a
// pure union over acknowledgements and nothing recorded a retraction, so the clear
// link in the integrity report was undone by the next pull from a machine that
// still held them.
//
// Third instance of the shape, after integrity repairs and the fdb-unknown marker.
// The first two could self-heal from arithmetic; this one cannot — an
// acknowledgement is somebody's judgement that they checked FactorDB by hand, so
// the retraction has to be recorded as a fact of its own.
// ── merging must converge, whichever machine does it ────────────────────────
// mergeHistory had 8 test references and one real hole: it keeps the EARLIEST
// timestamp, and on a tie "whichever I saw first" wins — but local is concatenated
// ahead of remote, so machine A keeps its record and machine B keeps its own, and
// each subsequent merge preserves that choice. The two disagree about provenance
// forever.
//
// A sync that cannot converge is worse than one that picks wrongly: the winner on
// a tie is arbitrary, but agreeing on it is not.
group('history-merge-converges', () => {
  if (!needs(M, 'mergeHistory', 'loadHistory', 'saveHistory')) return;
  const A = [[100, 1000, 9, 'e', 'h1']];
  const B = [[100, 1000, 9, 'f', 'h1']];

  const mergeFrom = (local, remote) => {
    sb2.__ls = {}; M.saveHistory(local); M.mergeHistory(remote);
    return JSON.stringify(M.loadHistory());
  };
  eq(mergeFrom(A, B), mergeFrom(B, A),
     'the same pair of records gives the same result on either machine');

  // Earliest still wins when the timestamps actually differ — the tie-break must
  // not have replaced the rule it is a fallback for.
  {
    const early = [[100, 500, 9, 'z', 'h1']];
    const late  = [[100, 900, 9, 'a', 'h1']];
    sb2.__ls = {}; M.saveHistory(late); M.mergeHistory(early);
    eq(M.loadHistory()[0][1], 500, 'an earlier discovery still wins on time');
    sb2.__ls = {}; M.saveHistory(early); M.mergeHistory(late);
    eq(M.loadHistory()[0][1], 500, 'whichever side it arrives from');
  }

  // Records for different factors of the same n are distinct, not deduped.
  {
    sb2.__ls = {};
    M.saveHistory([[100, 1000, 9, 'e', 'h1']]);
    M.mergeHistory([[100, 1000, 12, 'e', 'h2']]);
    eq(M.loadHistory().length, 2, 'two different factors of one n are both kept');
  }

  // Re-merging the same payload changes nothing.
  {
    sb2.__ls = {}; M.saveHistory(A); M.mergeHistory(B);
    const once = JSON.stringify(M.loadHistory());
    M.mergeHistory(B);
    eq(JSON.stringify(M.loadHistory()), once, 'merging the same history twice is a no-op');
  }
  sb2.__ls = {};
});

// ── the cofactor-digit cache is safe to take from a peer ────────────────────
// Its merge is `{ ...local, ...remote }` — remote wins wholesale — which looks
// dangerous until you see that every entry carries a fingerprint of the factor set
// it was computed for, and the read path refuses any entry whose fingerprint does
// not match. That makes it a pure function of (value, factors): whoever computed
// it, a matching entry is correct, and a stale one is simply recomputed.
//
// The safety rests entirely on that one check, and the cache had 3 test
// references, so it is worth pinning.
// ── a bad factor must not cost the good ones ────────────────────────────────
// getCofactor divides the value by the product of its factors. When that product
// does NOT divide — an overstated exponent, a duplicate, a factor that is simply
// wrong — it falls back to dividing one factor at a time so every GOOD factor is
// still removed. Skipping the fallback reports the FULL value as the cofactor,
// which inflates the apparent difficulty of the entry and distorts every
// recommendation that reads it.
//
// Found by a blind mutation survey: the branch had no test, and inverting its
// condition changed nothing the suite noticed.
// ── E(n) stored among its own factors ───────────────────────────────────────
// 90 live entries hold E(n) itself in their factor list. Nothing caught them:
//
//   * the wholeValue check requires factors.length === 1 — a LONE factor equal to
//     E(n) is a claim that E(n) is prime, which FactorDB may legitimately confirm.
//     With siblings it is never legitimate, and that case had no check at all.
//   * the scan walks allEntries in order and stops at its time budget. Entries are
//     ordered by n, so the largest are last — and all 90 are 57,000-digit monsters
//     at the tail. A partial scan reports "no inconsistencies" having never looked.
//
// So the check runs in a cheap pass over EVERY entry before the budget is spent:
// one string comparison per factor, no BigInt.
// groupAsync, not group: runDataIntegrityCheck is async, and returning its promise
// from a SYNC group defers the fixture restore until after later groups have begun —
// which wipes their entries out from under them. Four unrelated groups failed that
// way before this was caught.
groupAsync('whole-value-among-siblings', async () => {
  if (!needs(sandbox, 'runDataIntegrityCheck')) return;
  const V = '600851475143';
  const saved = sandbox.allEntries.slice();
  const done = (res) => (res.issues.wholeValue || []).map(x => x.n).sort((a, b) => a - b);
  try {
    sandbox.allEntries.length = 0;
    // The real shape: small primes plus the whole value.
    sandbox.allEntries.push({ n: 800, val: V, status: 'partial', factors: ['71', '839', V] });
    // Legitimate: a lone factor equal to E(n) claims E(n) is prime — handled by the
    // existing rule, and not this one's business.
    sandbox.allEntries.push({ n: 802, val: V, status: 'partial', factors: [V] });
    // Legitimate: ordinary partial factorisation.
    sandbox.allEntries.push({ n: 804, val: V, status: 'partial', factors: ['71', '839'] });
    // Legitimate: fully factored entries are excluded.
    sandbox.allEntries.push({ n: 806, val: V, status: 'full', factors: ['71', '839', '1471', '6857'] });
    // A FULL entry holding its own value: excluded deliberately. "Fully factored"
    // plus the whole value is a different claim, handled by the full-mismatch rule,
    // and flagging it here would double-report it under a name that does not fit.
    sandbox.allEntries.push({ n: 808, val: V, status: 'full', factors: ['71', V] });

    const res = await sandbox.runDataIntegrityCheck();
    const flagged = done(res);
    ok(flagged.includes(800),
       'E(n) alongside other factors is flagged — it cannot be prime AND have siblings');
    ok(!flagged.includes(804), 'an ordinary partial factorisation is not');
    ok(!flagged.includes(806), 'nor a fully factored entry');
    ok(!flagged.includes(808),
       'nor a full entry holding its own value — that is the full-mismatch rule\'s '
       + 'business, and claiming it here would double-report under the wrong name');
    eq(flagged.filter(x => x === 800).length, 1,
       'and reported once, not twice — two checks cover this case and the cheap one '
       + 'claims it so the expensive one defers');

    // ── the case that actually happened ──────────────────────────────────
    // The check was always correct. The scan simply ran out of time before reaching
    // these entries: it walks allEntries in order, they sit at the END (ordered by
    // n) and are the most expensive to reach. It reported "no inconsistencies
    // found" having never looked at them.
    //
    // A zero budget reproduces that exactly — the budgeted loop breaks on its first
    // deadline check, so anything still found came from the pass that runs BEFORE
    // the budget exists.
    // The fixture must EXCEED one chunk (200) with the target at the END, or the
    // budgeted loop finishes before its deadline is ever consulted and the two
    // passes cannot be told apart. A four-entry version of this "passed" against a
    // build with the cheap pass removed.
    for (let k = 0; k < 260; k++) {
      sandbox.allEntries.push({ n: 1000 + k * 2, val: V, status: 'partial', factors: ['71'] });
    }
    sandbox.allEntries.push({ n: 9998, val: V, status: 'partial', factors: ['71', '839', V] });

    sandbox.__setIntegrityBudget(0);
    try {
      const starved = await sandbox.runDataIntegrityCheck();
      ok(starved.timedOut, 'the budgeted loop does stop early with no budget');
      ok((starved.issues.wholeValue || []).some(x => x.n === 9998),
         'and the entry at the TAIL is still found — the cheap pass runs before the '
         + 'budget exists, which is the whole point of it');
      // No timedOut assertion here: with a four-entry fixture the loop finishes
      // before the deadline is ever consulted (it is checked once per 200-entry
      // chunk), so the flag is correctly false. Asserting it was an assumption,
      // not an observation.
    } finally {
      sandbox.__setIntegrityBudget(15000);
    }

  } finally {
    sandbox.allEntries.length = 0;
    for (const x of saved) sandbox.allEntries.push(x);
  }
});

group('cofactor-salvages-good-factors', () => {
  if (!needs(sandbox, 'getCofactor')) return;
  const r = 1471n, t = 6857n;
  const VAL = '600851475143';                      // 71 * 839 * 1471 * 6857
  const cof = (e) => sandbox.getCofactor(e).str;   // {big, str, digits}

  // Baseline: a clean list divides exactly.
  eq(cof({ n: 500, val: VAL, status: 'partial', factors: ['71', '839'] }),
     (r * t).toString(), 'a clean list leaves the true cofactor');

  // An OVERSTATED exponent: 71^2 when only one 71 divides. The product no longer
  // divides, but 839 is still a perfectly good factor and must come out.
  {
    const c = cof({ n: 502, val: VAL, status: 'partial', factors: ['71^2', '839'] });
    ok(c !== VAL,
       'the cofactor is not the whole value — a bad exponent must not discard the good factors');
    eq(String(BigInt(VAL) % BigInt(c)), '0', 'and what is left still divides the value');
    ok(BigInt(c) < BigInt(VAL) / 70n, 'with the good factors genuinely removed');
  }

  // A factor that does not divide at all, beside ones that do.
  eq(cof({ n: 504, val: VAL, status: 'partial', factors: ['13', '71', '839'] }),
     (r * t).toString(),
     'a non-dividing factor is skipped and the dividing ones still applied');

  // ── exponents must actually be applied ───────────────────────────────────
  // Every case above is one where dividing by p once and dividing by p^e happen to
  // give the same answer, because the exponent was overstated and the fallback
  // handled it. Three mutations walked straight through that — ignoring exponents,
  // and breaking the ^ parser entirely — because nothing distinguished them.
  //
  // This value has 71 SQUARED in it, so the exponent changes the result.
  {
    const V2 = (71n * 71n * 839n * 1471n).toString();
    eq(sandbox.getCofactor({ n: 510, val: V2, status: 'partial', factors: ['71^2', '839'] }).str,
       '1471', 'a genuine p^2 is divided out twice, not once');
    eq(sandbox.getCofactor({ n: 512, val: V2, status: 'partial', factors: ['71', '839'] }).str,
       (71n * 1471n).toString(), 'while a single 71 leaves the other one behind');
    // And the product builder itself.
    eq(String(sandbox.factorProduct(['71^2'])), String(71n * 71n), 'factorProduct applies the exponent');
    eq(String(sandbox.factorProduct(['71', '839'])), String(71n * 839n), 'and multiplies the terms');
    eq(String(sandbox.factorProduct([])), '1', 'an empty list has product 1');
  }

  // ── an unparseable factor is SKIPPED, not fatal ──────────────────────────
  // Returning early on one bad entry would discard every good factor beside it,
  // which is the same failure the fallback exists to prevent.
  {
    eq(sandbox.getCofactor({ n: 514, val: VAL, status: 'partial', factors: ['abc', '71'] }).str,
       (BigInt(VAL) / 71n).toString(),
       'a malformed factor is skipped and the good one still divides');
    eq(String(sandbox.factorProduct(['abc', '71'])), '71',
       'and factorProduct skips it rather than collapsing to 1');
    eq(String(sandbox.factorProduct(['71^abc', '839'])), '839',
       'including a malformed exponent');
  }

  // Nothing usable: the cofactor is the value, which is the honest answer.
  eq(cof({ n: 506, val: VAL, status: 'partial', factors: ['13'] }), VAL,
     'a list with nothing that divides leaves the value whole');
  eq(cof({ n: 508, val: VAL, status: 'partial', factors: [] }), VAL,
     'and so does an empty list');
});

group('cofactor-cache-fingerprint', () => {
  if (!needs(sandbox, 'getCofactorDigits', 'loadCofDigitsCache')) return;
  sandbox.__ls = {};
  const p = 156937982257994989n, q = 1626524294689195079n, r = 1000003n;
  const VAL = (p * q * r).toString();

  const e = { n: 300, val: VAL, status: 'partial', factors: [String(p)] };
  const real = sandbox.getCofactorDigits(e);
  ok(real > 0, 'a cofactor size is computed');

  // A peer entry with a MATCHING fingerprint is trusted — that is the whole point.
  {
    const e2 = { n: 300, val: VAL, status: 'partial', factors: [String(p)] };
    eq(sandbox.getCofactorDigits(e2), real,
       'the same factor set gives the same answer, cached or recomputed');
  }

  // A STALE entry — right n, wrong factor set — must be refused, not trusted.
  {
    const e3 = { n: 300, val: VAL, status: 'partial', factors: [String(p), String(q)] };
    const got = sandbox.getCofactorDigits(e3);
    ok(got !== real,
       'a cached value from a different factor set is not reused');
    ok(got > 0 && got < real, 'it is recomputed, and removing more factors leaves less');
  }

  // A corrupt entry, injected into the live cache object. This is what a stale
  // value from a peer looks like, and refusing it is the only thing that makes
  // "remote wins wholesale" safe in the merge.
  {
    const live = sandbox.loadCofDigitsCache();
    live[300] = [999999, 'not-a-real-fingerprint'];
    const e4 = { n: 300, val: VAL, status: 'partial', factors: [String(p)] };
    eq(sandbox.getCofactorDigits(e4), real,
       'a fingerprint that does not match is never believed — it recomputes');

    // …and a matching fingerprint IS believed, however implausible the value, which
    // is what makes the merge worth having at all.
    const key = sandbox._factorsFingerprint && sandbox._factorsFingerprint([String(p)]);
    ok(typeof key === 'string' && key.length > 0, 'the fingerprint helper is reachable');
    live[300] = [4242, key];
    const e5 = { n: 300, val: VAL, status: 'partial', factors: [String(p)] };
    eq(sandbox.getCofactorDigits(e5), 4242,
       'a matching fingerprint is trusted whichever machine computed it');
  }

  sandbox.__ls = {};
});

group('acknowledgement-retraction', () => {
  if (!needs(M, 'markVerifiedComplete', 'clearVerifiedComplete', 'mergeVerifiedComplete')) return;
  const reset = () => { sb2.__ls = {}; };

  // ── acknowledging, then clearing ─────────────────────────────────────────
  {
    reset();
    M.markVerifiedComplete([77]);
    ok(M.isVerifiedComplete(77), 'an acknowledgement takes effect');
    M.clearVerifiedComplete([77]);
    ok(!M.isVerifiedComplete(77), 'and clearing it takes effect too');
  }

  // ── and the clear survives a peer that never cleared ─────────────────────
  {
    reset();
    M.markVerifiedComplete([77]);
    const peerHolds = { 77: Math.floor(Date.now() / 1000) - 500 };   // acknowledged earlier
    M.clearVerifiedComplete([77]);
    M.mergeVerifiedComplete(peerHolds, null);
    ok(!M.isVerifiedComplete(77),
       "a peer's acknowledgement does not undo a retraction made here");
  }

  // ── a peer's retraction reaches us ───────────────────────────────────────
  {
    reset();
    M.markVerifiedComplete([88]);
    ok(M.isVerifiedComplete(88), 'acknowledged locally');
    M.mergeVerifiedComplete(null, { 88: Math.floor(Date.now() / 1000) + 10 });
    ok(!M.isVerifiedComplete(88), 'and a retraction pulled from a peer applies here');
  }

  // ── re-acknowledging after a retraction works ────────────────────────────
  // The tombstone must not be permanent, or an entry cleared once could never be
  // acknowledged again — which would be a worse bug than the one being fixed.
  {
    reset();
    M.markVerifiedComplete([99]);
    M.clearVerifiedComplete([99]);
    ok(!M.isVerifiedComplete(99), 'cleared');
    M.markVerifiedComplete([99]);
    ok(M.isVerifiedComplete(99), 'and can be acknowledged again afterwards');
    // …and the fresh acknowledgement is not undone by the old retraction arriving
    // again from a peer that has not seen it.
    M.mergeVerifiedComplete(null, { 99: Math.floor(Date.now() / 1000) - 100 });
    ok(M.isVerifiedComplete(99), 'an older retraction does not undo a newer acknowledgement');
  }

  // ── two retractions for one entry: the LATEST wins ───────────────────────
  // Every case above supplies a single retraction, so the max/min choice never
  // showed. It matters when an entry is acknowledged again between two machines'
  // clears: keeping the earlier timestamp would let a stale retraction outrank a
  // newer acknowledgement, which is the original bug wearing different clothes.
  {
    reset();
    const now = Math.floor(Date.now() / 1000);
    M.mergeVerifiedComplete(null, { 66: now - 1000 });     // an old clear
    M.mergeVerifiedComplete(null, { 66: now });            // and a newer one
    eq(M.loadVerifiedCleared()[66], now, 'the later retraction is the one kept');

    // …and arriving in the other order gives the same answer.
    reset();
    M.mergeVerifiedComplete(null, { 66: now });
    M.mergeVerifiedComplete(null, { 66: now - 1000 });
    eq(M.loadVerifiedCleared()[66], now, 'whichever order they arrive in');

    // With the newest retraction kept, an acknowledgement from BEFORE it stays
    // retracted — which is the whole point of tracking the timestamp.
    reset();
    M.mergeVerifiedComplete({ 66: now - 500 }, { 66: now });
    ok(!M.isVerifiedComplete(66),
       'an acknowledgement older than the retraction does not revive it');
    M.mergeVerifiedComplete({ 66: now + 500 }, null);
    ok(M.isVerifiedComplete(66), 'while a newer one does');
  }

  // ── the payload carries both halves ──────────────────────────────────────
  // A retraction merged perfectly but never SENT is the same as no retraction.
  {
    reset();
    sb2.eulerValues = sb2.eulerValues || {};
    M.markVerifiedComplete([55]);
    M.clearVerifiedComplete([55]);
    const p = M.buildSyncPayload();
    ok(p.verifiedCleared && p.verifiedCleared[55], 'the retraction is in the sync payload');
  }

  reset();
});

group('cross-machine-convergence', () => {
  if (!M) return;
  sb2.__quiet = true;   // mergeSyncPayload logs per-call stats
  const reset = () => { sb2.__ls = {}; M.saveHistory([]); sb2.fdbCache = {}; sb2.allEntries = []; };

  // ── the fdb-unknown set is carried and unioned ───────────────────────────
  {
    reset();
    M.saveFdbUnknownSet(new Set([2, 4, 6]));
    sb2.eulerValues = sb2.eulerValues || {};
    const sent = M.buildSyncPayload().fdbUnknown;
    eq((sent || []).slice().sort((a, b) => a - b), [2, 4, 6],
       'the fdb-unknown markers are in the payload at all — they used to be left out');

    M.mergeSyncPayload({ version: 3, fdbUnknown: [6, 8, 10] });
    eq(Array.from(M.loadFdbUnknownSet()).sort((a, b) => a - b), [2, 4, 6, 8, 10],
       'and merge as a union, so neither machine loses what the other learned');
  }

  // Order must not matter: pulling A-then-B and B-then-A give the same set.
  {
    reset(); M.saveFdbUnknownSet(new Set([1]));
    M.mergeSyncPayload({ version: 3, fdbUnknown: [2] });
    M.mergeSyncPayload({ version: 3, fdbUnknown: [3] });
    const one = Array.from(M.loadFdbUnknownSet()).sort((a, b) => a - b);
    reset(); M.saveFdbUnknownSet(new Set([1]));
    M.mergeSyncPayload({ version: 3, fdbUnknown: [3] });
    M.mergeSyncPayload({ version: 3, fdbUnknown: [2] });
    eq(Array.from(M.loadFdbUnknownSet()).sort((a, b) => a - b), one,
       'the result does not depend on which machine pulled first');
  }

  // ── the union must not resurrect a retired marker ────────────────────────
  // A peer that has not re-checked still carries markers for numbers FactorDB has
  // since described. A plain union reinstates them — the same shape as a stale
  // peer undoing an integrity repair. The cache record is the check, so this heals
  // whichever machine is behind.
  {
    reset();
    sb2.eulerValues[500] = '600851475143';
    M.saveFDBCache({ '600851475143': { n: 500, status: 'CF', timestamp: 9,
                                       factors: ['71', '839'], source: 'fdb' } });
    for (const [k, v] of Object.entries(M.loadFDBCache())) sb2.fdbCache[k] = v;
    M.saveFdbUnknownSet(new Set());
    M.mergeSyncPayload({ version: 3, fdbUnknown: [500, 777] });
    const after = M.loadFdbUnknownSet();
    ok(!after.has(500),
       "a peer's marker is refused for a number our own records say FactorDB answered");
    ok(after.has(777), 'while a marker we have nothing against is taken');
  }

  // The same heal applies to markers already sitting in our own set.
  {
    reset();
    sb2.eulerValues[500] = '600851475143';
    M.saveFDBCache({ '600851475143': { n: 500, status: 'FF', timestamp: 9,
                                       factors: ['71', '839'], source: 'fdb' } });
    for (const [k, v] of Object.entries(M.loadFDBCache())) sb2.fdbCache[k] = v;
    M.saveFdbUnknownSet(new Set([500]));
    M.mergeSyncPayload({ version: 3, fdbUnknown: [] });
    ok(!M.loadFdbUnknownSet().has(500),
       'and a stale marker of our own is retired by any merge');
  }

  // Re-pulling the same payload changes nothing.
  {
    reset(); M.saveFdbUnknownSet(new Set([5]));
    M.mergeSyncPayload({ version: 3, fdbUnknown: [7] });
    const after = Array.from(M.loadFdbUnknownSet()).sort((a, b) => a - b);
    M.mergeSyncPayload({ version: 3, fdbUnknown: [7] });
    eq(Array.from(M.loadFdbUnknownSet()).sort((a, b) => a - b), after,
       'and pulling the same payload twice is a no-op');
  }

  // ── a record's FactorDB metadata survives a sync round trip ──────────────
  // fdbHas and fdbId were persisted locally and left out of the payload, so a push
  // dropped them and "clear all local data" destroyed the only copies. Silent
  // both ways: the export quietly goes back to re-sending FactorDB its own small
  // factors, and huge entries lose the id that is the only cheap way to re-check
  // them. Found by auditing a real pushed results.json — zero records carried
  // either field.
  {
    reset();
    sb2.eulerValues[300] = '600851475143';
    for (const k of Object.keys(sb2.fdbFactors || {})) delete sb2.fdbFactors[k];
    M.saveFDBCache({ '600851475143': { n: 300, status: 'CF', timestamp: 1,
                                       factors: ['71', '839'], source: 'import',
                                       fdbHas: ['71'], fdbIdExact: '9912' } });
    const rec = M.buildSyncPayload().fdbCache['300'];
    eq((rec.fdbHas || []).slice(), ['71'], "FactorDB's own factor list is carried by the push");
    eq(rec.fdbIdExact, '9912', 'and so is the FactorDB id');
  }

  // ── all three are actually IN the payload ────────────────────────────────
  // Testing the merge alone is not enough: a fact that is merged correctly but
  // never sent is exactly the bug being fixed, and looks identical from the
  // receiving side. Both halves have to be pinned.
  {
    reset();
    M.saveFdbUnknownSet(new Set([12]));
    M.saveQueryLimits({ maxOk: 65478, minFail: 65486 });
    sb2.__ls['eulerFDB_histStart_v1'] = String(1750000000);
    const p2 = M.buildSyncPayload();
    eq((p2.fdbUnknown || []).slice(), [12], 'fdb-unknown markers are sent');
    eq([(p2.queryLimits || {}).maxOk, (p2.queryLimits || {}).minFail], [65478, 65486],
       'measured query limits are sent');
    eq(Number(p2.historyStart), 1750000000, 'and the tracking start is sent');
  }

  // ── query limits take the widest evidence ────────────────────────────────
  // Both machines are measuring the same server, so whichever hit the boundary
  // first is right for all of them.
  {
    reset();
    M.saveQueryLimits({ maxOk: 60000, minFail: 0 });
    M.mergeSyncPayload({ version: 3, queryLimits: { maxOk: 65478, minFail: 65486 } });
    const l = M.loadQueryLimits();
    eq(l.maxOk, 65478, 'the largest size seen to work wins');
    eq(l.minFail, 65486, 'and a rejection recorded anywhere is adopted');
    eq(M.confirmedQueryDigits(), 65485,
       'so both machines export the same check list instead of two different ones');
  }
  {
    reset();
    M.saveQueryLimits({ maxOk: 0, minFail: 70000 });
    M.mergeSyncPayload({ version: 3, queryLimits: { maxOk: 0, minFail: 65486 } });
    eq(M.loadQueryLimits().minFail, 65486, 'the SMALLEST rejection wins — the tighter bound is the true one');
  }
  {
    reset();
    M.saveQueryLimits({ maxOk: 65478, minFail: 65486 });
    M.mergeSyncPayload({ version: 3, queryLimits: { maxOk: 0, minFail: 0 } });
    const l = M.loadQueryLimits();
    eq([l.maxOk, l.minFail], [65478, 65486],
       'a machine that has measured nothing does not erase what another measured');
  }

  // ── tracking start takes the earliest ────────────────────────────────────
  // A later start silently shrinks the yield report's window, so the same data
  // would read differently on each machine.
  {
    reset();
    sb2.__ls['eulerFDB_histStart_v1'] = String(Math.floor(new Date('2026-07-01').getTime() / 1000));
    M.mergeSyncPayload({ version: 3, historyStart: Math.floor(new Date('2026-01-15').getTime() / 1000) });
    eq(M.historyStartDate(), '2026-01-15', 'an earlier tracking start is adopted');
    M.mergeSyncPayload({ version: 3, historyStart: Math.floor(new Date('2026-09-01').getTime() / 1000) });
    eq(M.historyStartDate(), '2026-01-15', 'and a later one is ignored');
  }

  sb2.__quiet = false;
  sb2.__ls = {};
});

// ── a repair must survive a pull from a machine that has not repaired ───────
// Reported: run the data integrity fix, watch it remove 13 bad factors, and see
// the same 13 listed again a couple of days later.
//
// The fixer persists correctly — it writes back to fdbCache and saves. The other
// machine is the problem: it still holds the bad factor, it pushes, and the union
// merge puts the corruption straight back. "A timestamp may never remove a factor"
// is right for DISCOVERY and exactly wrong for CORRECTION, and the union alone
// cannot tell those apart.
//
// The merge now checks arithmetically instead of bookkeeping tombstones, which
// heals whichever side is wrong: the repaired machine cannot be re-infected, and
// the machine that never ran the fixer gets repaired by pulling.
group('repairs-survive-a-stale-peer', () => {
  if (!M) return;
  sb2.__quiet = true;
  const p = 156937982257994989n, q = 1626524294689195079n, r = 1000003n;
  const VAL = (p * q * r).toString();
  const reset = () => { sb2.__ls = {}; sb2.fdbCache = {}; sb2.allEntries = []; sb2.eulerValues = {}; };

  // ── "Factor does not divide E(n)" ────────────────────────────────────────
  {
    reset();
    sb2.eulerValues[900] = VAL;
    // Repaired here: the bogus factor is gone.
    M.saveFDBCache({ [VAL]: { n: 900, status: 'CF', timestamp: 5000,
                              factors: [String(p), String(r)], source: 'import' } });
    // The peer still has it, and pushes.
    M.mergeSyncPayload({ version: 3, fdbCache: { '900': {
      n: 900, status: 'CF', timestamp: 9000,
      factors: [String(p), String(r), '7'], source: 'import' } } });
    const after = M.loadFDBCache()[VAL];
    ok(!(after.factors || []).includes('7'),
       'a factor that does not divide is refused by the merge, however new the peer says it is');
    eq((after.factors || []).slice().sort(), [String(p), String(r)].sort(),
       'and the real factors are untouched');
  }

  // ── "Stored factor is composite" ─────────────────────────────────────────
  // The fixer splits C = p*q into p and q and drops C. A stale peer still holding
  // C would make the list claim p^2*q^2 again — the E(634) shape.
  {
    reset();
    sb2.eulerValues[634] = VAL;
    M.saveFDBCache({ [VAL]: { n: 634, status: 'CF', timestamp: 5000,
                              factors: [String(p), String(q)], source: 'import' } });
    M.mergeSyncPayload({ version: 3, fdbCache: { '634': {
      n: 634, status: 'CF', timestamp: 9000,
      factors: [String(p), String(q), (p * q).toString()], source: 'import' } } });
    const after = M.loadFDBCache()[VAL];
    ok(!(after.factors || []).includes((p * q).toString()),
       'a composite equal to the product of its neighbours is refused too');
    eq((after.factors || []).slice().sort(), [String(p), String(q)].sort(),
       'leaving exactly the primes the fixer left');
  }

  // ── the heal works in the other direction as well ────────────────────────
  // A machine that never ran the fixer should be repaired BY pulling, not just
  // protected from a peer.
  {
    reset();
    sb2.eulerValues[902] = VAL;
    M.saveFDBCache({ [VAL]: { n: 902, status: 'CF', timestamp: 9000,
                              factors: [String(p), '7'], source: 'import' } });   // ours is wrong
    M.mergeSyncPayload({ version: 3, fdbCache: { '902': {
      n: 902, status: 'CF', timestamp: 1000, factors: [String(q)], source: 'import' } } });
    const after = M.loadFDBCache()[VAL];
    ok(!(after.factors || []).includes('7'),
       'our own bad factor is dropped when a merge gives us reason to re-check');
    ok((after.factors || []).includes(String(q)), "and the peer's real factor is taken");
  }

  // ── genuine discovery is not affected ────────────────────────────────────
  // The union still has to work. This is the case it was written for, and the
  // arithmetic must not get in its way.
  {
    reset();
    sb2.eulerValues[904] = VAL;
    M.saveFDBCache({ [VAL]: { n: 904, status: 'CF', timestamp: 9000,
                              factors: [String(p)], source: 'import' } });
    M.mergeSyncPayload({ version: 3, fdbCache: { '904': {
      n: 904, status: 'CF', timestamp: 1000, factors: [String(r)], source: 'import' } } });
    eq((M.loadFDBCache()[VAL].factors || []).slice().sort(), [String(p), String(r)].sort(),
       'two machines that each found a different real factor still end up with both');
  }

  // ── a genuine prime power is not mistaken for corruption ─────────────────
  {
    reset();
    const sq = (p * p * r).toString();
    sb2.eulerValues[906] = sq;
    M.saveFDBCache({ [sq]: { n: 906, status: 'CF', timestamp: 9000,
                             factors: [String(r)], source: 'import' } });
    M.mergeSyncPayload({ version: 3, fdbCache: { '906': {
      n: 906, status: 'CF', timestamp: 1000, factors: [p + '^2'], source: 'import' } } });
    eq((M.loadFDBCache()[sq].factors || []).slice().sort(), [p + '^2', String(r)].sort(),
       'p^2 really does divide, so it is kept');
  }

  sb2.__quiet = false;
  sb2.__ls = {};
});

// ── each method must net out the OTHER method's prior coverage ───────────────
// Reported instinct: "P-1 feels over-valued next to plain ECM." It was, by ~5x on a
// well-worked number, and the cause was an asymmetry in the gain formula.
//
// ECM's gain used (pAfter - pBefore), which discounts its OWN prior curves. P-1's
// used (pm1After - pm1Before), which discounts its OWN prior bounds. Neither knew
// what the other had done. That matters enormously for P-1, whose value sits almost
// entirely in SMALL factors (15-25 digits) — and a few hundred ECM curves at B1=3M
// already covers 15d at 100% and 20d at 99.4%. P-1 was being paid for finding
// factors ECM had effectively ruled out.
group('cross-method-coverage', () => {
  const { recommendNextRunAll: recommendNextRun } = PURE;   // full list, not just the top three
  // 400 digits, not 610. With the B2 GMP-ECM really chooses at B1 = 8.5G (refitted
  // from the user's logs), that run on a 610-digit number takes ~17 h and is rightly
  // no longer offered under the 12-hour cap; at 400 digits it takes ~7.4 h, well
  // inside it. What this group checks — netting out the other method's coverage —
  // does not depend on the size.
  const D = 400;
  const pm1Prior = { method: 'P-1', b1: '850000000', b2: '15300000000' };
  const ecmPrior = { method: 'ECM', b1: '3000000', curves: '384' };
  const gainOf = (recs, m, b1) => {
    const r = recs.find(x => x.method === m && String(x.b1) === b1);
    return r ? parseFloat(r.gain) : null;
  };

  // With no ECM history there is nothing to net out — P-1 keeps its full value.
  const noEcm = recommendNextRun(D, [pm1Prior]);
  const gNoEcm = gainOf(noEcm, 'P-1', '8.5G');
  ok(gNoEcm !== null && gNoEcm > 1.0,
     'with no ECM history, a P-1 escalation keeps its full value');

  // Same number, same P-1 history, but ECM has now covered the small factors.
  const withEcm = recommendNextRun(D, [pm1Prior, ecmPrior]);
  const gWithEcm = gainOf(withEcm, 'P-1', '8.5G');
  ok(gWithEcm !== null, 'the escalation is still offered');
  ok(gWithEcm < gNoEcm / 3,
     'prior ECM coverage sharply reduces the P-1 escalation gain (it was ~5x overstated)');

  // And it must not be zeroed out — P-1 can still catch what ECM missed.
  ok(gWithEcm > 0, 'but it is not eliminated: P-1 can still find what ECM did not');

  // The fix must not over-correct into never valuing P-1. Asserted on the GAIN of
  // the no-ECM case rather than on P-1 appearing in the top three: the top three is
  // ranked by gain-per-hour, and on a fresh number several very cheap ECM levels
  // legitimately outrank it there. Presence in that list is not the property under
  // test; the value assigned to P-1 is.
  ok(gNoEcm > 1.0,
     'P-1 keeps substantial value where ECM has not searched — the correction only bites where it has');

  // The correction is symmetric: ECM should likewise not be paid for factors a
  // prior P-1 would already have caught.
  const ecmFresh = recommendNextRun(D, []).find(r => r.method === 'ECM' && r.targetDigits === 20);
  const ecmAfterPm1 = recommendNextRun(D, [pm1Prior]).find(r => r.method === 'ECM' && r.targetDigits === 20);
  if (ecmFresh && ecmAfterPm1) {
    ok(parseFloat(ecmAfterPm1.gain) < parseFloat(ecmFresh.gain),
       'ECM gain is likewise reduced by prior P-1 coverage — the fix is symmetric');
  } else { passed++; }
});


// ── P-1/P+1 digit-level equivalent ───────────────────────────────────────────
// ECM quotes a t-level; P±1 had no comparable number, so a bare B1 gave no sense of
// what size factor a run could actually reach. pm1ToDigits answers the same question
// ECM's t-level does — at what factor size does this run attain 63% of what the
// method can achieve — so the two labels mean the same thing side by side.
group('pm1-digit-level', () => {
  const { pm1ToDigits, pm1DefaultB2, pm1Probability, ecmOptimalCurves, ecmProbability, ecmTableB1 } = PURE;

  // Monotonic: a bigger bound must reach further.
  const levels = [1e6, 1e7, 1e8, 8.5e8, 8.5e9].map(b => pm1ToDigits(b, pm1DefaultB2(b), 'P-1'));
  ok(levels.every(l => l !== null), 'every realistic P-1 bound gets a level');
  for (let i = 1; i < levels.length; i++) {
    ok(levels[i] > levels[i - 1], 'a larger B1 reaches a larger digit level');
  }

  // The level means what it claims: ~63% at that size for P-1.
  for (const b1 of [1e7, 8.5e8]) {
    const l = pm1ToDigits(b1, pm1DefaultB2(b1), 'P-1');
    const p = pm1Probability(l, b1, pm1DefaultB2(b1), 'P-1');
    ok(Math.abs(p - 0.63) < 0.05, 'P-1 probability at its own level is close to 63%');
  }

  // And that matches what a completed ECM t-level means, so the labels are comparable.
  for (const d of [15, 20, 25]) {
    const p = ecmProbability(d, Math.round(ecmOptimalCurves(d)), ecmTableB1(d));
    ok(Math.abs(p - 0.63) < 0.05, 'a completed ECM t-level is also ~63% — same convention');
  }

  // THE ONE THAT CAUGHT A BUG: P+1 is capped near 50% because it only works on the
  // ~half of primes with p+1 smooth. A flat 63% threshold could never be met, so
  // every P+1 run reported "no level" at all. The threshold scales with each
  // method's achievable ceiling instead.
  for (const b1 of [1e7, 8.5e8]) {
    const l = pm1ToDigits(b1, pm1DefaultB2(b1), 'P+1');
    ok(l !== null, 'P+1 gets a level too — a flat 63% threshold would return none');
    eq(l, pm1ToDigits(b1, pm1DefaultB2(b1), 'P-1'),
       'P+1 reaches the same size as P-1 at the same bounds (the x0.5 cancels)');
  }

  // Bounds too small to reach even 10 digits report nothing rather than a fake level.
  eq(pm1ToDigits(1000, pm1DefaultB2(1000), 'P-1'), null, 'tiny bounds report no level');
  eq(pm1ToDigits(0, null, 'P-1'), null, 'an invalid bound reports no level');
});


// ── P±1 reason text must say where the value actually is ─────────────────────
// Reported confusion: a P-1 escalation was described as "reaching ~22 digits" while
// the coverage table showed everything to 25 digits already at >99.99%. Both were
// true and the recommendation was correctly ranked last — but the text answered
// "where is this run strongest?" when the useful question is "where does its
// strength meet unsearched ground?". P-1's odds decay gradually rather than
// stopping at its 63% point, so on a well-worked number the value sits in the tail:
// a 2.4% chance at 40 digits matters when ECM has covered only 18% there.
// ── a recommended P±1 run must fit in a working night ───────────────────────
// The x5 B1 step was chosen against a 1,062-digit entry, where it costs 0.3
// minutes. The numbers actually being worked run to 80,000 digits, where the same
// step is 16.8 hours, a first run at the old flat B1=1e7 default is 38 hours, and
// escalating an entry already at B1=43M proposes SEVENTY-SIX DAYS.
//
// Nothing in the ranking noticed, because value-per-hour is a RATE: a 17-hour run
// and a 17-minute run at the same rate rank identically. They are not the same
// proposition — the long one cannot be checkpointed, cannot be split, loses
// everything to a reboot, and fits inside no budget anyone would set.
// ── fmtB1 and parseB1 must agree ────────────────────────────────────────────
// They are siblings and they did not: fmtB1(11000000) gives "11.0M" and
// parseB1("11.0M") returned 11, because parseFloat stops at the letter. Anything
// round-tripping a displayed bound through the parser lost a factor of a million,
// silently. No stored data was affected — 0 of 27,345 attempts carry a suffix —
// but a formatter and a parser that disagree is a trap left armed, and a test
// fixture walked straight into it.
group('b1-format-parse-round-trip', () => {
  const { parseB1, fmtB1 } = PURE;
  for (const v of [11000, 50000, 250000, 1e6, 3e6, 11e6, 43e6, 110e6, 260e6, 850e6, 8.5e9]) {
    const back = parseB1(fmtB1(v));
    ok(Math.abs(back - v) / v < 0.05,
       'B1=' + v.toExponential(1) + ' survives fmtB1 -> parseB1 (got ' + back + ')');
  }
  // The suffixes, explicitly — these are what the formatter emits.
  eq(parseB1('11.0M'), 11e6, 'M means millions');
  eq(parseB1('250k'), 250000, 'k means thousands');
  eq(parseB1('8.5G'), 8.5e9, 'G means billions');
  eq(parseB1('11m'), 11e6, 'and case does not matter');

  // Plain forms must keep working — this is an addition, not a replacement.
  eq(parseB1('250000'), 250000, 'a plain number is unchanged');
  eq(parseB1('1.0e+7'), 1e7, 'exponent notation still parses');
  eq(parseB1('1,000,000'), 1e6, 'and so does a thousands separator');
  eq(parseB1(''), 0, 'empty is zero');
  eq(parseB1('abc'), 0, 'and so is nonsense');
  eq(parseB1(null), 0, 'and null');
});

// A FIRST P±1 run on a large number steps DOWN to the largest standard B1 that fits
// in one run, instead of being dropped. Dropped, it was never offered at all: about
// half the unfinished entries — every one above ~32,000 digits at a measured 4.4x
// machine speed — got no P±1 suggestion, though the recommender's own model ranks a
// smaller first P-1 as the best-value run there. (A LATER run that does not fit is
// still dropped, not squeezed — see pm1-over-long-runs-are-dropped.)
group('pm1-first-run-steps-down', () => {
  if (!needs(PURE, 'recommendNextRunAll', 'estimateCpuSeconds')) return;
  const { recommendNextRunAll: rec, estimateCpuSeconds: cost } = PURE;
  const CAP = 12 * 3600;
  const tbl = (src.match(/const ECM_TABLE = (\[[\s\S]*?\]);/) || [])[1];
  const table = tbl ? Function('return ' + tbl)() : null;
  ok(Array.isArray(table) && table.length > 5, 'the standard B1 ladder can be read from the ECM table');
  if (!table) return;
  const ladder = table.map(r => r.B1).concat([table[table.length - 1].B1 * 10]);
  // E(12054)'s actual runs, at the measured machine's calibration (2.574). With the
  // P±1 stage-2 model corrected to measured runs (it had been 4.5-6x too long), a
  // usual 11M first P-1 fits in 12 hours at every size the recommender accepts on
  // the model's reference speed — so the step-down is tested at this machine's speed,
  // on real sizes (the largest cofactors are ~73,000 digits).
  PURE.setCalibForTest(2.574);
  const ecmRuns = [{ method: 'ECM', b1: '532', curves: '9' }, { method: 'ECM', b1: '2420', curves: '26' },
                   { method: 'ECM', b1: '11000', curves: '72' }];
  for (const digits of [65000, 80000]) {
    ok(cost('P-1', 11e6, null, 1, digits) > CAP, digits + 'd: the usual first P-1 (B1=11M) is too long for one run');
    const all = rec(digits, ecmRuns, 0);
    for (const method of ['P-1', 'P+1']) {
      const r = all.find(x => x.method === method);
      ok(!!r, digits + 'd: a first ' + method + ' is still offered — at a B1 that fits, not dropped');
      if (!r) continue;
      ok(cost(method, r.rawB1, null, 1, digits) <= CAP, digits + 'd: ' + method + ' at B1=' + r.b1 + ' fits in one run, at its own price');
      const up = ladder.find(b => b > r.rawB1);
      ok(up != null && cost(method, up, null, 1, digits) > CAP,
         digits + 'd: ' + method + ' gets the LARGEST standard B1 that fits — the next rung up does not');
      ok(/B1 is held at .+ would take over 12 hours in one run/.test(r.reason), digits + 'd: and its plan says why the B1 is held down');
    }
  }
  PURE.setCalibForTest(1);
  // Where the usual first B1 fits, nothing changes.
  const small = rec(5000, ecmRuns, 0).find(x => x.method === 'P-1');
  ok(small && small.rawB1 === ladder.find(b => b >= 1e7) && !/held at/.test(small.reason),
     'a smaller entry still gets the usual first P-1, with no note');
});

group('pm1-over-long-runs-are-dropped', () => {
  const { recommendNextRunAll: rec, parseB1: parseB1PURE } = PURE;
  const CAP = 12 * 3600;
  const pm1Of = (digits, hist) => rec(digits, hist || []).filter(r => /^P[-+]1$/.test(r.method));

  // ── nothing over the ceiling is ever proposed ────────────────────────────
  for (const digits of [1062, 20000, 40000, 60000, 80000]) {
    for (const hist of [[], [{ method: 'P-1', b1: '1000000' }],
                        [{ method: 'P-1', b1: '43000000' }, { method: 'P+1', b1: '43000000' }]]) {
      for (const r of pm1Of(digits, hist)) {
        ok(r.cpuTime <= CAP,
           digits + 'd: proposed ' + r.method + ' at B1=' + r.b1 + ' is within the ceiling');
      }
    }
  }

  // ── dropped, NOT substituted with a smaller bound ────────────────────────
  // These are two different rules that look alike. Substituting answers "what can
  // I afford" when the question was "what is the next step", and hands back a
  // different, weaker run: at 11 hours already spent, a bound squeezed under the
  // ceiling costs nearly as much again for a sliver of extra probability.
  // Dropping says there is no P±1 run here worth proposing, which is the truth.
  {
    const b1At = (digits) => {
      const r = pm1Of(digits, [{ method: 'P-1', b1: '1000000' }]).find(x => x.method === 'P-1');
      return r ? parseB1PURE(r.b1) : null;
    };
    const small = b1At(1062);
    ok(small, 'a small entry is offered its escalation');
    for (const digits of [40000, 60000, 80000]) {
      const b = b1At(digits);
      // Either the SAME bound the small entry gets, or nothing at all — never a
      // third, smaller bound invented to fit.
      ok(b === null || b === small,
         digits + 'd gets the same next bound or no run — never a substituted one');
    }
  }

  // ── the biggest entries lose P±1 entirely, and that is the point ─────────
  {
    const huge = pm1Of(80000, [{ method: 'P-1', b1: '43000000' },
                               { method: 'P+1', b1: '43000000' }]);
    eq(huge.length, 0,
       'an entry whose next step is 76 days is offered no P±1 run at all');
    // ECM is unaffected — its recommendation is a curve COUNT, which is adjustable,
    // so the argument for dropping does not apply to it.
    const all = rec(80000, [{ method: 'P-1', b1: '43000000' }]);
    ok(all.some(r => r.method === 'ECM'), 'while ECM is still recommended for it');
  }

  // ── P+1 is held to the ceiling at its OWN price ──────────────────────────
  // It costs exactly twice P-1 at the same bound. A ceiling checked against P-1
  // would pass an 18-hour P+1 as if it were 9.
  {
    for (const digits of [40000, 60000, 80000]) {
      for (const r of pm1Of(digits, [])) {
        ok(r.cpuTime <= CAP, digits + 'd fresh ' + r.method + ' fits at its own price');
      }
      const both = pm1Of(digits, []);
      const p1 = both.find(r => r.method === 'P-1');
      const pp1 = both.find(r => r.method === 'P+1');
      // Each method now steps down to its OWN largest fitting B1, so the two can sit at
      // different bounds and their times no longer compare. Check the pricing itself:
      // P+1's time is P+1's cost at its bound — well above what P-1 would cost there.
      if (pp1) {
        const b = pp1.rawB1;
        ok(pp1.cpuTime === PURE.estimateCpuSeconds('P+1', b, null, 1, digits)
           && pp1.cpuTime > PURE.estimateCpuSeconds('P-1', b, null, 1, digits) * 1.5,
           digits + 'd: P+1 is priced as the more expensive method');
      }
    }
  }
});

// ── the P±1 default B2, refitted to GMP-ECM's own choices ─────────────────────
// The old formula, 24.8·B1^1.4, rested on one data point and missed GMP-ECM's real B2
// by up to 5.2x — understating it at high bounds, so a P-1 run looked cheaper than it
// is. Refitted to the B2 GMP-ECM chose in 4,395 logged runs (hand-picked values out).
group('pm1-default-b2', () => {
  if (!needs(PURE, 'pm1DefaultB2')) return;
  // GMP-ECM's own choices from the log; the fit must stay within 1.4x of each.
  const chosen = [[250000, 170973772], [3000000, 11184906436], [10000000, 93541776130],
                  [11000000, 93543157510], [43000000, 1512539543092], [110000000, 4537600561228],
                  [260000000, 25441962678786], [850000000, 205702226027130]];
  for (const [b1, b2] of chosen) {
    const r = PURE.pm1DefaultB2(b1) / b2;
    ok(r > 1 / 1.4 && r < 1.4, 'B1=' + b1.toLocaleString() + ': within 1.4x of the B2 GMP-ECM chose (' + r.toFixed(2) + 'x)');
  }
  // What it changes. With the real B2, P-1 to 8.5G on a 610-digit number takes ~17 h —
  // past the 12-hour "done by morning" cap — so it is not offered as an overnight run.
  // The old formula made it look like 8.3 h.
  const pm1Prior = { method: 'P-1', b1: '850000000', b2: '15300000000' };
  const at610 = (PURE.recommendNextRunAll(610, [pm1Prior]) || []).find(r => r.method === 'P-1');
  ok(!at610, 'a P-1 run GMP-ECM would take ~17 h on is not offered under the 12-hour cap');
  const at400 = (PURE.recommendNextRunAll(400, [pm1Prior]) || []).find(r => r.method === 'P-1');
  ok(at400 && at400.cpuTime < 12 * 3600, 'while the same run on a 400-digit number, inside the cap, still is');
});

group('pm1-reason-text', () => {
  const { recommendNextRunAll: rec } = PURE;
  const D = 400;   // inside the 12-hour cap for a B1 = 8.5G P-1 run — see cross-method-coverage
  const ecmHist = [
    { method:'ECM', b1:'50000',     curves:'214'  },
    { method:'ECM', b1:'250000',    curves:'410'  },
    { method:'ECM', b1:'1000000',   curves:'2000' },
    { method:'ECM', b1:'11000000',  curves:'2'    },
  ];
  const worked = rec(D, [...ecmHist, { method:'P-1', b1:'850000000', b2:'15300000000' }])
                   .find(r => r.method === 'P-1');
  ok(worked, 'a P-1 escalation is still offered');
  ok(/Most of its value here is around \d+ digits/.test(worked.reason),
     'the text names the level actually contributing most, not just the reach');
  // Assert the VALUE, not just the format: a regex alone passed even when the
  // coverage was silently left at zero, which would have read "ECM has searched
  // only 0%" on a number with thousands of curves behind it.
  const covPct = parseInt((worked.reason.match(/ECM has searched only (\d+)%/) || [])[1]);
  ok(!isNaN(covPct), 'the text quantifies how little ECM has covered there');
  ok(covPct > 0, 'and that figure reflects the real prior ECM coverage, not a default zero');
  ok(/already exhausted/.test(worked.reason),
     'and says plainly that the range it is strongest at is already done');
  // The named level must be the tail, not the reach.
  const named = parseInt((worked.reason.match(/value here is around (\d+) digits/) || [])[1]);
  const reach = parseInt((worked.reason.match(/strongest at ~(\d+) digits/) || [])[1]);
  ok(named > reach, 'the value level is beyond the reach level on a well-worked number');

  // THE FALSE CLAIM THIS CAUGHT: gating "already exhausted" on distance alone told a
  // FRESH number that its best range was covered, which is the opposite of the truth.
  const fresh = rec(D, []).find(r => r.method === 'P-1');
  ok(fresh, 'a first P-1 run is offered on a fresh number');
  ok(!/already exhausted/.test(fresh.reason),
     'a fresh number is NOT told its range is already exhausted');
  ok(/Reaches ~\d+ digits/.test(fresh.reason), 'it just states the reach instead');
  ok(/searched only 0%/.test(fresh.reason), 'and reports zero prior ECM coverage');
});


// ── batch small-prime sieve ──────────────────────────────────────────────────
// A remainder tree: build one product tree over all the primes, then reduce a
// number through it, halving the modulus at each level. Measured 43x faster than
// trial division on a 50,000-digit number (6s -> 0.13s), which is what makes
// sieving the whole database practical at all.
//
// It writes to the factor list, so correctness matters more than speed here: the
// assertions below check it finds exactly the right factors with the right
// multiplicities, and nothing else.
group('small-prime-sieve', () => {
  const forest = ensurePrimeTree();
  const primes = sandbox.__sievePrimes();
  ok(primes.length > 9000, 'the prime table is built');
  eq(primes[0], 2, 'starting at 2');

  // THE BUG THAT SHIPPED: the first version built ONE tree over every prime, whose
  // root is the full primorial — 433,637 digits at a 10^6 bound. Node allocates that
  // fine; Firefox threw "BigInt is too large to allocate" and the sieve was unusable
  // there. A forest of size-capped trees is equivalent and barely slower, but only
  // if the cap is a real bound.
  ok(Array.isArray(forest) && forest.length > 1, 'the primes are split across a forest, not one giant tree');
  const maxDigits = Math.max(...forest.map(t => t.M.toString().length));
  ok(maxDigits <= sandbox.SIEVE_MAX_BIGINT_DIGITS,
     'no single BigInt exceeds the cap (an off-by-one here made the cap advisory rather than binding)');

  // Splitting must not lose or duplicate primes.
  eq(forest.reduce((s, t) => s + (t.hi - t.lo), 0), primes.length,
     'every prime is covered exactly once across the forest');

  // CHANGING THE BOUND must rebuild the table. Caching it without keying on the
  // bound would silently reuse the table built for the previous one and sieve to the
  // wrong depth — the kind of bug that produces quietly incomplete results rather
  // than an error.
  {
    eq(sandbox.getForestLimit(), 100000, 'the cached table records the bound it was built for');
    sandbox.setSieveLimit(10000);
    const smaller = ensurePrimeTree();
    eq(sandbox.getForestLimit(), 10000, 'changing the bound rebuilds the table');
    const maxPrime = sandbox.__sievePrimes()[sandbox.__sievePrimes().length - 1];
    ok(maxPrime < 10000, 'and the new table really only covers the smaller bound');
    // A factor between the two bounds must now be missed — proving the rebuild took.
    ok(!sieveSmallFactors(99991n * 7n).some(x => x.p === '99991'),
       'a prime above the new bound is correctly no longer found');
    sandbox.setSieveLimit(100000);
    ensurePrimeTree();
    ok(sieveSmallFactors(99991n * 7n).some(x => x.p === '99991'),
       'and is found again once the bound is raised back');
  }

  // RANGE filtering must actually restrict which entries are scanned.
  {
    sandbox.allEntries.length = 0;
    for (const n of [100, 500, 1000, 5000, 9000]) {
      sandbox.allEntries.push({ n, val: String(n) + '0'.repeat(40), status: 'partial', factors: [] });
    }
    eq(sandbox.sieveCandidates(false, null, null).length, 5, 'no range means every entry');
    eq(sandbox.sieveCandidates(false, 500, 5000).map(e => e.n), [500, 1000, 5000], 'a from-to range filters correctly');
    eq(sandbox.sieveCandidates(false, 1000, null).map(e => e.n), [1000, 5000, 9000], 'an open-ended "from" works');
    eq(sandbox.sieveCandidates(false, null, 500).map(e => e.n), [100, 500], 'an open-ended "to" works');
    eq(sandbox.sieveCandidates(false, 6000, 8000).length, 0, 'an empty range yields nothing');
    // Fully factored entries are never candidates, whatever the range.
    sandbox.allEntries.push({ n: 2000, val: '1'.repeat(40), status: 'full', factors: ['3'] });
    ok(!sandbox.sieveCandidates(false, null, null).some(e => e.n === 2000),
       'a fully factored entry is excluded — there is nothing left to find');
  }

  // STATUS filtering — sieve only the categories worth sieving.
  //
  // A full run is hours, and most of it goes on entries that already have factors:
  // the sieve tests the COFACTOR, so those have usually had their easy primes taken
  // already. The entries where a first small factor is both most likely and worth
  // most are the ones nothing has touched — UNKNOWN and FDB UNKNOWN.
  {
    sandbox.allEntries.length = 0;
    const add = (n, status) =>
      sandbox.allEntries.push({ n, val: String(n) + '0'.repeat(40), status, factors: [] });
    add(100, 'unknown');
    add(200, 'fdb-unknown');
    add(300, 'partial');
    add(400, 'composite');
    add(500, 'attempted');
    add(600, 'full');

    // Omitting the argument must behave exactly as before — this parameter was
    // added to an existing function with three call sites and a default of "no
    // restriction" is what keeps every one of them unchanged.
    eq(sandbox.sieveCandidates(false, null, null).map(e => e.n), [100, 200, 300, 400, 500],
       'with no status restriction every unfinished entry is a candidate, as before');
    eq(sandbox.sieveCandidates(false, null, null, null).map(e => e.n), [100, 200, 300, 400, 500],
       'and an explicit null means the same thing');

    // The option the button offers.
    eq(sandbox.sieveCandidates(false, null, null, ['unknown', 'fdb-unknown']).map(e => e.n), [100, 200],
       'restricting to UNKNOWN + FDB UNKNOWN selects exactly those two categories');
    eq(sandbox.sieveCandidates(false, null, null, ['unknown']).map(e => e.n), [100],
       'UNKNOWN alone excludes FDB UNKNOWN');
    eq(sandbox.sieveCandidates(false, null, null, ['fdb-unknown']).map(e => e.n), [200],
       'and FDB UNKNOWN alone excludes UNKNOWN — they are separate categories in the UI too');

    // 'full' is skipped before the status test is even reached, and must stay that
    // way: asking for it explicitly still yields nothing, because "nothing left to
    // find" is a fact about the entry rather than a preference.
    eq(sandbox.sieveCandidates(false, null, null, ['full']).length, 0,
       'a status restriction cannot re-admit fully factored entries');

    // An empty list is not the same as no list. Only null/omitted means "no
    // restriction"; an empty set of statuses matches nothing, which is what any
    // caller passing one would mean.
    eq(sandbox.sieveCandidates(false, null, null, []).length, 0,
       'an empty status list selects nothing rather than everything');

    // Composes with the range rather than replacing it.
    eq(sandbox.sieveCandidates(false, 150, null, ['unknown', 'fdb-unknown']).map(e => e.n), [200],
       'the status restriction narrows the range, it does not override it');

    // And with onlyUnsearched. E(100) has been processed by FactorDB, E(200) has not.
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    const e100 = sandbox.allEntries.find(e => e.n === 100);
    sandbox.fdbCache[e100.val] = { n: 100, status: 'CF', factors: ['3'], timestamp: 1 };
    eq(sandbox.sieveCandidates(true, null, null, ['unknown', 'fdb-unknown']).map(e => e.n), [200],
       'and stacks with "never processed by FactorDB" rather than fighting it');

    // The other half of "unsearched": an entry with ECM logs has been worked on
    // even if FactorDB has never seen it. Asserted here because this branch was
    // unreachable in the harness until now — loadECM was missing, so any test
    // passing onlyUnsearched=true would have thrown rather than quietly passed.
    sandbox.__ecm = { '200': [{ method: 'ECM', b1: '250000', curves: '100' }] };
    eq(sandbox.sieveCandidates(true, null, null, ['unknown', 'fdb-unknown']).length, 0,
       'an entry with ECM logs is not "unsearched" either');
    sandbox.__ecm = {};
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  }

  // The retry path halves the cap on allocation failure, so it can end up smaller
  // than a single prime. Without a guard the chunker makes no progress and hangs.
  // Tested at a deliberately absurd cap, since at the normal 4,000 digits no prime
  // is anywhere near large enough for this to fire.
  {
    const chunks = sandbox._chunkPrimes(primes, 1);   // cap smaller than any prime
    eq(chunks.reduce((s, [a, b]) => s + (b - a), 0), primes.length,
       'an absurdly small cap still covers every prime exactly once');
    ok(chunks.every(([a, b]) => b > a), 'and never produces an empty chunk (which would loop forever)');
  }

  // Exact factorisations, including multiplicity.
  {
    const f = sieveSmallFactors(2n * 3n * 5n * 7n);
    eq(f.map(x => x.p), ['2','3','5','7'], 'finds every small prime factor');
    ok(f.every(x => x.exp === 1), 'with the right multiplicity');
  }
  {
    const f = sieveSmallFactors(7n ** 5n * 13n);
    const seven = f.find(x => x.p === '7');
    eq(seven.exp, 5, 'reports a prime power exactly, not just the base');
  }
  {
    // A large number whose only small factor is one specific prime. Uses 99991 so
    // it stays inside the reduced 10^5 bound this harness builds for speed; the
    // algorithm is bound-independent.
    const f = sieveSmallFactors((10n ** 200n + 7n) * 99991n);
    ok(f.some(x => x.p === '99991'), 'finds a 5-digit factor inside a 200-digit number');
  }
  {
    // Must not invent factors.
    const f = sieveSmallFactors(10n ** 300n + 7n);
    ok(f.every(x => (10n ** 300n + 7n) % BigInt(x.p) === 0n),
       'every reported factor genuinely divides');
  }

  // COMPLETENESS: cross-check against brute force. A sieve that silently misses
  // factors is worse than none, because it would be trusted.
  {
    let seed = 4242;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    let mismatches = 0;
    for (let t = 0; t < 12; t++) {
      let n = 10n ** 60n + BigInt(Math.floor(rnd() * 100000));
      for (let k = 0; k < 3; k++) n *= BigInt(2 + Math.floor(rnd() * 9973));
      const got = sieveSmallFactors(n).map(x => x.p).filter(p => +p < 10000).sort();
      const brute = [];
      for (const p of primes) { if (p >= 10000) break; if (n % BigInt(p) === 0n) brute.push(String(p)); }
      if (JSON.stringify(got) !== JSON.stringify(brute.sort())) mismatches++;
    }
    eq(mismatches, 0, 'matches brute-force trial division on random numbers');
  }
});

// ── cost to finish ───────────────────────────────────────────────────────────
// Answers "where does this end?" rather than "what is the next step?" — it shows
// both the level sitting minutes from complete and the one that would take years,
// so the stopping point is visible instead of being backed into.
group('cost-to-finish', () => {
  const { computeCostToFinish } = PURE;
  const att = [
    { method:'ECM', b1:'50000',    curves:'214'  },
    { method:'ECM', b1:'250000',   curves:'410'  },
    { method:'ECM', b1:'1000000',  curves:'2000' },
  ];
  const rows = computeCostToFinish({}, 610, att);
  ok(rows.length > 0, 'produces rows');

  // Cost must rise with level, and coverage must fall.
  const priced = rows.filter(r => r.cLo > 0);
  for (let i = 1; i < priced.length; i++) {
    ok(priced[i].cLo > priced[i - 1].cLo, 'finishing a higher level costs more');
  }
  // A level already covered costs nothing more.
  const done = rows.find(r => r.have > 0.9);
  if (done) ok(done.cLo === 0 || done.cLo < priced[0].cLo * 2, 'an already-covered level is cheap or free');
  else passed++;

  // 99% must cost more than 90%.
  for (const r of priced) ok(r.cHi > r.cLo, 'reaching 95% costs more than 63%');

  // Value per hour must collapse as levels rise — that collapse is the whole point.
  const withVal = rows.filter(r => r.perHr !== null && r.perHr > 0);
  ok(withVal.length > 1 && withVal[0].perHr > withVal[withVal.length - 1].perHr * 10,
     'value per hour falls sharply across levels, making the stopping point visible');

  // A factor bigger than half the digits cannot be the SMALLEST remaining one,
  // so those levels are pointless and must not be listed.
  ok(rows.every(r => r.d <= 610 / 2), 'levels above half the digit count are excluded');
  eq(computeCostToFinish({}, 60, att).map(r => r.d), [10, 15, 20, 25, 30],
     'a small cofactor caps the levels correctly');

  // ── the table starts at t10, not at the fitted table's floor ─────────────
  // This assertion used to expect [20,25,30] and so PINNED the bug: the loop
  // iterated ECM_TABLE, whose first entry is 20d, while the app's ladder starts at
  // ECM_MIN_LEVEL. So "cost to finish" never showed the two cheapest levels — on a
  // number nothing has touched, the part most worth seeing.
  //
  // The engine offers t10 as the opening move, so a cost table that begins at t20
  // cannot be reconciled with the recommendation sitting above it.
  {
    const ds = computeCostToFinish({}, 610, att).map(r => r.d);
    eq(ds.slice(0, 3), [10, 15, 20], 'the ladder starts at t10');

    // Priced on a number with NO prior work. With the fixture above, 2,000 curves
    // at t35 already cover 10-digit factors far past 90%, so t10 costs nothing —
    // correct, and the reason this needs its own untouched fixture to mean
    // anything.
    const fresh = computeCostToFinish({}, 610, []);
    eq(fresh[0].d, 10, 'an untouched number starts at t10');
    ok(fresh[0].b1 > 0, 'with a real B1 from the extrapolated table');
    ok(fresh[0].nLo > 0, 'and curves actually needed to reach 63%');
    ok(fresh[0].cLo > 0, 'and a real cost for them');
    ok(fresh[0].perHr > 0, 'and a value-per-hour, so the cheapest level can be compared');
    ok(fresh[0].perHr > fresh[2].perHr,
       't10 is better value per hour than t20 — which is why hiding it mattered');
  }

  // ── P-1 and P+1 coverage counts towards the level ────────────────────────
  // They were filtered out entirely — only `method === 'ECM'` reached the
  // coverage calculation — so a level already part-covered by a big P-1 run was
  // priced as though nothing had touched it. That overstates the curves still
  // needed AND the value of doing them, in the same direction, on exactly the
  // entries where P±1 has already done the cheap work.
  {
    const ecmOnly = [{ method: 'ECM', b1: '250000', curves: '19' }];
    const withPm1 = ecmOnly.concat([
      { method: 'P-1', b1: '3000000',  b2: '', curves: '' },
      { method: 'P+1', b1: '10000000', b2: '', curves: '' },
    ]);
    const a = computeCostToFinish({}, 1062, ecmOnly);
    const b = computeCostToFinish({}, 1062, withPm1);
    const at = (rows, d) => rows.find(r => r.d === d);

    ok(at(b, 15).have > at(a, 15).have,
       'a P-1 run raises the coverage already held at a level');
    ok(at(b, 15).nLo < at(a, 15).nLo,
       'so fewer ECM curves are needed to finish it');
    ok(at(b, 15).cLo <= at(a, 15).cLo, 'and it costs no more than before');
    ok(at(b, 30).have >= at(a, 30).have,
       'the effect is monotone — extra evidence never lowers coverage');

    // P-1 is DETERMINISTIC: running it twice finds the same factors, so two
    // attempts must not compound like independent ECM curves.
    const twice = ecmOnly.concat([
      { method: 'P-1', b1: '3000000', b2: '', curves: '' },
      { method: 'P-1', b1: '3000000', b2: '', curves: '' },
    ]);
    const once = ecmOnly.concat([{ method: 'P-1', b1: '3000000', b2: '', curves: '' }]);
    eq(at(computeCostToFinish({}, 1062, twice), 20).have,
       at(computeCostToFinish({}, 1062, once), 20).have,
       'the same P-1 run recorded twice adds nothing — it is not a second trial');

    // ── independence, not addition ─────────────────────────────────────────
    // Two sources each covering a lot must combine to less than their sum: they
    // overlap. Adding them overstates coverage and can exceed 1, which then makes
    // the curves-still-needed calculation meaningless rather than merely wrong.
    // Checked at a level where both parts are MODERATE, so the two formulas give
    // visibly different answers. With a saturating fixture they both clamp to the
    // certainty cap and become indistinguishable — which is how a first version of
    // this assertion passed against the wrong arithmetic.
    {
      const d = 20;
      const ecmPart = PURE.ecmProbForDigit(d, withPm1.filter(a => a.method === 'ECM'));
      const pmPart  = PURE.bestPm1Prob(d, withPm1.filter(a => a.method !== 'ECM'));
      ok(ecmPart > 0.05 && pmPart > 0.02 && ecmPart + pmPart < 0.9,
         'the fixture leaves both parts moderate, so the two rules differ visibly');
      const independent = 1 - (1 - ecmPart) * (1 - pmPart);
      ok(independent < ecmPart + pmPart - 1e-6,
         'independence really is lower than the sum here');
      ok(Math.abs(at(b, d).have - independent) < 1e-9,
         'and the coverage used is 1 − (1−a)(1−b), not a + b');
    }

    // Saturating evidence must still stay inside [0, 1].
    {
      const heavy = [{ method: 'ECM', b1: '1000000', curves: '3000' },
                     { method: 'P-1', b1: '500000000', b2: '', curves: '' },
                     { method: 'P+1', b1: '500000000', b2: '', curves: '' }];
      for (const r of computeCostToFinish({}, 1062, heavy)) {
        ok(r.have >= 0 && r.have <= 1, 't' + r.d + ' coverage stays a probability');
      }
    }

    // ── a level at certainty reports nothing to do, not NaN ────────────────
    // curvesForProb(d, 1) is -Copt*ln(0) = Infinity. `need` subtracts it and
    // clamps at zero, so full coverage comes out as 0 curves and 0 cost rather
    // than poisoning the row. This is why no cap on `have` is needed — the real
    // guarantee is that the combination rule cannot exceed 1.
    {
      const overwhelming = [{ method: 'ECM', b1: '11000000', curves: '500000' }];
      for (const r of computeCostToFinish({}, 1062, overwhelming)) {
        ok(isFinite(r.nLo) && r.nLo >= 0, 't' + r.d + ' curve count stays finite');
        ok(isFinite(r.cLo) && r.cLo >= 0, 't' + r.d + ' cost stays finite');
        ok(r.perHr === null || isFinite(r.perHr), 't' + r.d + ' value per hour stays finite');
      }
    }

    // And a single enormous P-1 run cannot break it either.
    const huge = [{ method: 'P-1', b1: '900000000', b2: '', curves: '' }];
    for (const r of computeCostToFinish({}, 1062, huge)) {
      ok(isFinite(r.nLo) && r.nLo >= 0, 't' + r.d + ' curve count stays finite (P-1)');
      ok(isFinite(r.cLo) && r.cLo >= 0, 't' + r.d + ' cost stays finite (P-1)');
    }
  }

  // Every site that walks ECM levels must walk the SAME ladder — it existed three
  // times in three forms, which is how one of them silently began at 20.
  {
    const ladder = PURE.ecmLevels();
    eq(ladder.slice(0, 3), [10, 15, 20], 'the shared ladder starts at t10');
    ok(ladder.every((d, i) => i === 0 || d > ladder[i - 1]), 'and ascends');
  }

  // ── and NOBODY may spell it out themselves ───────────────────────────────
  // The check above verifies ecmLevels() is CORRECT. It says nothing about
  // whether anything uses it, which is how a FOURTH hardcoded ladder survived
  // §Fix 1 unifying three: the difficulty score (since removed) carried [20,25,...,65] and credited
  // exactly zero coverage for t10 and t15 work — on 4,574 entries whose work is
  // entirely at those levels.
  //
  // A guard on the shared thing being right is not a guard on it being used.
  {
    const src = fs.readFileSync('index.html', 'utf8');
    const js = src.slice(src.indexOf('<script>'), src.lastIndexOf('</script>'));
    // Array literals of ascending multiples of 5 in the ECM range, three or more
    // long — the shape of a level ladder written by hand.
    const suspects = [];
    for (const m of js.matchAll(/\[\s*(\d{2}(?:\s*,\s*\d{2}){2,})\s*\]/g)) {
      const nums = m[1].split(',').map(x => parseInt(x.trim()));
      const ascending = nums.every((v, i) => i === 0 || v > nums[i - 1]);
      const allLevels = nums.every(v => v >= 10 && v <= 70 && v % 5 === 0);
      if (ascending && allLevels) {
        // The ladder's own definition is allowed; nothing else is.
        const around = js.slice(Math.max(0, m.index - 260), m.index);
        if (!/ECM_TABLE|_STANDARD_B1S|_COFDIG_BOUNDARIES|function ecmLevels/.test(around)) {
          suspects.push(m[0].slice(0, 40));
        }
      }
    }
    eq(suspects, [], 'no hardcoded ECM level ladder — everything calls ecmLevels()');
  }
});


// ── sieve run-time estimate ──────────────────────────────────────────────────
// A flat seconds-per-number is wrong by a wide margin, because cost depends on the
// cofactor's SIZE: a 300-digit cofactor takes ~28ms and an 80,000-digit one ~270ms
// at the same bound. Measured against a real run of mixed sizes, a flat estimate was
// 46% out while fitting A + B x digits from timed samples came within 11%.
//
// It also has to reflect the user's machine, not the one the constants were measured
// on — so it times real entries rather than applying a stored coefficient.
groupAsync('sieve-estimate', async () => {
  const mkBig = (d) => { let s = '1'; for (let i = 1; i < d; i++) s += String((i * 7) % 10); return BigInt(s); };
  const mk = (sizes, count) => {
    const out = [];
    for (let i = 0; i < count; i++) { const d = sizes[i % sizes.length]; out.push({ n: i * 2, _d: d, _big: mkBig(d) }); }
    return out;
  };
  const realCof = sandbox.getCofactor;
  sandbox.getCofactor = (e) => ({ big: e._big, digits: e._d, str: '' });
  // CPU TIME, not wall time — the estimator's sampling clock for this whole group.
  // Wall time counts every moment the process sits waiting while something else has
  // the core; this machine has one core, and that waiting was the source of the
  // suite's intermittent failure (see the accuracy check below). The process's own
  // CPU clock counts only time it is actually running, at microsecond resolution.
  const cpuMs = () => { const u = process.cpuUsage(); return (u.user + u.system) / 1000; };
  sandbox.performance = { now: cpuMs };

  const mixed = mk([300, 2000, 15000, 50000], 40);
  const est = await sandbox.estimateSieveCost(mixed);
  ok(est.samples >= 2, 'it times several real entries rather than assuming a rate');
  ok(est.total > 0, 'and produces a positive prediction');
  ok(est.A > 0, 'the fitted fixed cost is positive');
  ok(est.B >= 0, 'and the per-digit slope is never negative (a negative fit is noise)');
  // THE ASSERTION THAT CATCHES BIASED SAMPLING. The samples must span the size
  // range, not be taken from one end: with a mixed-size set the fit must actually
  // capture the size dependence, i.e. a non-zero slope. Sampling the first N sorted
  // entries yields five identical sizes, a slope of exactly zero, and a prediction
  // built entirely from the smallest cofactors — measured at the real bound that is
  // 72% error against 11%. (The accuracy check below runs at the harness's reduced
  // bound, where the difference compresses enough to slip under any sane threshold,
  // so this structural check is what actually guards it.)
  ok(est.B > 0, 'the fit spans the size range, producing a real per-digit slope');
  eq(est.minD, 300, 'it reports the smallest cofactor in the set');
  eq(est.maxD, 50000, 'and the largest — the range the fit had to span');

  // ── the prediction scales with the work ──────────────────────────────────
  // "Twice the entries predicts 1.5x the time" compared TWO independently timed
  // estimates, and each one re-measures the per-digit rate from live samples. An
  // unlucky pair — the first sampling during a slow moment, the second during a
  // fast one — sank the ratio below the threshold. Measured at 1 failure in 35
  // full runs, which is enough to erode trust in the whole suite.
  //
  // The property is really "total is built from the fit and the actual entry
  // sizes". That is checkable against the numbers the call ITSELF returns, with no
  // second timing involved: total is sum(max(1, A + B*d)) / 1000 by construction.
  {
    const set = mk([300, 2000, 15000, 50000], 80);
    const r = await sandbox.estimateSieveCost(set);
    let expect = 0;
    for (const e of set) expect += Math.max(1, r.A + r.B * e._d);
    const rel = Math.abs(r.total - expect / 1000) / Math.max(r.total, 1e-9);
    ok(rel < 1e-9,
       'the total is exactly the fit applied to every entry — not a sample scaled up, '
       + 'and not the count alone');
    // Direction still holds, and comparing totals only for ORDER is robust to the
    // timing noise that comparing them for RATIO was not.
    ok(r.total > est.total, 'twice the entries predicts more time');

    // NOTE for anyone mutation-testing this: replacing each entry's size with the
    // MEAN size is an equivalent mutation, not a coverage gap. The model is linear
    // and count x mean = sum by definition, so the total is identical. It stops
    // being equivalent only if the max(1, ...) clamp binds, which needs a fitted
    // A + B*d below 1ms — far below anything real.
  }

  // The negative-slope guard cannot be reached deterministically: it fires only
  // when timing noise fits a downward slope, which is the very thing this group was
  // made flaky by. Asserted structurally instead, since its absence would let a
  // noisy sample predict that bigger cofactors are cheaper.
  {
    const src2 = fs.readFileSync('index.html', 'utf8');
    ok(/if \(B < 0\) \{ B = 0; A = sy \/ n; \}/.test(src2),
       'a negative fitted slope is flattened rather than used');
  }

  // Bigger cofactors must predict more time than small ones at the same count.
  const small = await sandbox.estimateSieveCost(mk([300], 40));
  const big   = await sandbox.estimateSieveCost(mk([50000], 40));
  ok(big.total > small.total, 'larger cofactors predict a longer run than small ones');

  // All-same-size samples make the slope undefined; it must fall back to a flat mean
  // rather than dividing by zero or fitting nonsense.
  ok(isFinite(small.total) && small.total > 0, 'a uniform size set still yields a sane estimate');

  // ACCURACY against a real run. This is the assertion that matters: the earlier
  // checks confirm the shape of the answer, not whether it is right. It is also what
  // catches biased sampling — taking the first few entries instead of spreading
  // across the size range fits a slope from a narrow window and extrapolates badly,
  // which the structural checks above cannot see.
  //
  // This was the suite's INTERMITTENT FAILURE. Not because the estimate is marginal —
  // it normally lands within ~0-12% of the real run, against a 60% limit — but
  // because of what was being timed. The real run takes ~0.15 s, and the prediction
  // comes from five sample runs shorter still, EXTRAPOLATED to all 24 numbers. On
  // WALL-CLOCK time, one ~20 ms pause while another process had the core, landing
  // during a sample, was multiplied into a prediction far outside the limit. It struck
  // now and then, mostly just after the mutation runs.
  //
  // Both sides are now timed on the process's own CPU clock, which does not count time
  // spent waiting: measured here, a competing process doubles wall time and leaves CPU
  // time where it was. The median of three attempts then absorbs what noise is left
  // inside the process itself (a garbage collection mid-sample). An estimator that is
  // genuinely wrong is wrong every time, so the median still catches it: sampling only
  // the smallest numbers fails this check on its own. (A fit that ignores size stays
  // inside 60% here — the structural check above, which demands a real per-digit
  // slope, is what catches that one.)
  {
    const set = mk([300, 2000, 15000, 50000], 24);
    // Every attempt is STALLED ON PURPOSE for 50 ms during its largest sample, the
    // thread parked without using the CPU — exactly what being descheduled looks like.
    // On the CPU clock that does not register. Switch this test back to wall time and
    // every attempt's prediction balloons, so it fails every time, on any machine,
    // under any load: the guard that keeps the fix in place.
    const real = sandbox.sieveSmallFactors;
    const biggest = set.reduce((m, e) => (e._d > m._d ? e : m))._big;
    const parked = new Int32Array(new SharedArrayBuffer(4));
    const attempt = async () => {
      let armed = true;
      sandbox.sieveSmallFactors = (x) => {
        if (armed && x === biggest) { armed = false; Atomics.wait(parked, 0, 0, 50); }
        return real(x);
      };
      let predicted;
      try { predicted = (await sandbox.estimateSieveCost(set)).total; }
      finally { sandbox.sieveSmallFactors = real; }
      const c0 = cpuMs();
      for (const e of set) sandbox.sieveSmallFactors(e._big);
      const actual = (cpuMs() - c0) / 1000;
      return { err:     Math.abs(predicted - actual) / Math.max(actual, 0.001),
               // the naive alternative it replaced: a flat seconds-per-number figure
               flatErr: Math.abs(0.14 * set.length - actual) / Math.max(actual, 0.001) };
    };
    const runs = [];
    for (let k = 0; k < 3; k++) runs.push(await attempt());
    const med = (xs) => xs.slice().sort((a, b) => a - b)[1];
    const err = med(runs.map(r => r.err));
    ok(err < 0.6, 'the estimate lands within 60% of an actual run over mixed sizes — even stalled mid-sample');
    ok(err < med(runs.map(r => r.flatErr)), 'and is closer than a flat seconds-per-number assumption');
  }
  // The fix, checked directly and independent of any load: the timing clock must not
  // count time the process is not running. Atomics.wait parks the thread for 50 ms
  // without using the CPU — exactly what being descheduled looks like.
  {
    const parked = new Int32Array(new SharedArrayBuffer(4));
    const c0 = cpuMs(), w0 = Date.now();
    Atomics.wait(parked, 0, 0, 50);
    const wall = Date.now() - w0, cpu = cpuMs() - c0;
    ok(wall >= 45 && cpu < 10, 'the timing clock ignores a 50 ms stall that wall time counts in full');
  }

  // Nothing to scan must not throw. (Two guards cover this — the empty-sizes check
  // and the empty-measurements check — so removing either alone is not observable.)
  const none = await sandbox.estimateSieveCost([]);
  eq(none.total, 0, 'an empty candidate set estimates zero');

  sandbox.getCofactor = realCof;
});


// ── FactorDB-unknown weighting in the run export ─────────────────────────────
// A factor found on a number FactorDB has never seen is worth more than the raw
// odds suggest — nobody else is working on it, and your own ECM is the only thing
// that will move it. That is a judgement about what the work is FOR, which the
// probability model cannot express, so it is a user choice rather than a constant.
//
// The rule is replicated here rather than extracted, because it sits inline in an
// export function that downloads files. What matters is that the ORDERING behaves,
// and these pin the properties that could silently go wrong.
group('fdb-unknown-weighting', () => {
  const runs = [
    { n:100, gain:2.00, cpuTime:3600, fdbUnknown:false },
    { n:102, gain:1.00, cpuTime:3600, fdbUnknown:true  },
    { n:104, gain:0.50, cpuTime:3600, fdbUnknown:true  },
    { n:106, gain:1.50, cpuTime:3600, fdbUnknown:false },
    { n:108, gain:0.20, cpuTime:1800, fdbUnknown:true  },
  ];
  const rank = (W) => {
    const eff = r => (r.gain / Math.max(r.cpuTime, 1)) * (r.fdbUnknown ? W : 1);
    let list = runs;
    if (W === 0) list = runs.filter(r => !r.fdbUnknown);
    return [...list].sort((a, b) => (eff(b) - eff(a)) || (a.cpuTime - b.cpuTime)).map(r => r.n);
  };

  // Weight 1 must leave the previous behaviour exactly intact — the feature has to
  // be opt-in, not a silent change to how everyone's exports are ordered.
  const plain = [...runs].sort((a, b) =>
    ((b.gain / b.cpuTime) - (a.gain / a.cpuTime)) || (a.cpuTime - b.cpuTime)).map(r => r.n);
  eq(rank(1), plain, 'weight 1 reproduces the unweighted ranking exactly');

  // A moderate weight promotes unknowns without overriding a clearly better run.
  const w2 = rank(2);
  ok(w2.indexOf(102) < w2.indexOf(106), 'weight 2 lifts an unknown above a slightly better known run');
  eq(w2[0], 100, 'but the strongest known run still leads at a moderate weight');

  // A large weight puts them first.
  const w5 = rank(5);
  ok(w5.slice(0, 3).every(n => [102, 104, 108].includes(n)), 'weight 5 puts unknowns first');

  // Zero must EXCLUDE, not merely demote — "do not work on these" is not honoured
  // by burying them at the bottom of a thousand-run export.
  const w0 = rank(0);
  eq(w0, [100, 106], 'weight 0 removes FactorDB-unknown runs entirely');
  ok(!w0.some(n => [102, 104, 108].includes(n)), 'none of them survive at weight 0');

  // Monotonic: raising the weight can only help an unknown's position.
  for (const n of [102, 104, 108]) {
    const p1 = rank(1).indexOf(n), p5 = rank(5).indexOf(n);
    ok(p5 <= p1, 'raising the weight never pushes an unknown entry further down');
  }
});


// ── a size rejection does not always arrive as a 414 ─────────────────────────
// Observed in the wild at ~65,500 digits: "NetworkError when attempting to fetch
// resource" on every route. A proxy refusing an over-long request line closes the
// connection rather than returning 414, and the browser surfaces that as a bare
// network error — identical, on its own, to being offline. Requiring a 414 meant
// these were classed as transient and retried forever, so the limit could never be
// learned no matter how many times it was hit.
//
// The corroboration is what makes it safe: a smaller number succeeding earlier in
// the SAME session proves the connection works, so a larger one failing everywhere
// is about size. Session-scoped deliberately — a stored success from last week says
// nothing about whether the network is up now.
groupAsync('network-error-as-size-limit', async () => {
  const { queryFactorDB, loadQueryLimits, currentQueryCap } = sb2;
  const netFail = () => { throw new TypeError('NetworkError when attempting to fetch resource.'); };
  const okResp  = { ok: true, status: 200, text: async () => JSON.stringify({ id:'1', status:'CF', factors:[['5',1]] }) };

  // _sessionMaxOkDigits shipped used-but-never-declared, surfacing only as a live
  // ReferenceError mid-poll. It is assigned on the SUCCESS path here, so simply
  // running one successful query exercises it.
  {
    sb2.__ls = {}; sb2.setSessionMaxOk(0);
    sb2.fetchWithTimeout = async () => okResp;
    let refErr = null;
    try { await queryFactorDB('7'.repeat(500)); } catch(e) { refErr = e.message; }
    eq(refErr, null, 'a successful query does not hit an undeclared variable');
  }

  // A smaller number succeeds, then a larger one fails everywhere -> size limit.
  sb2.__ls = {}; sb2.setSessionMaxOk(0);
  // The stub must fail POST too, or the size-limit path is never reached: the POST
  // URL carries no digits, so a stub keyed only on URL length would wave it through
  // and no limit would ever be recorded.
  sb2.fetchWithTimeout = async (url, ms, opts) => {
    if (opts && opts.method === 'POST') {
      const bd = (String(opts.body).match(/7{100,}/) || [''])[0].length;
      if (bd > 60000) netFail();
      return okResp;
    }
    const d = (url.match(/7{100,}/) || [''])[0].length;
    if (d > 60000) netFail();
    return okResp;
  };
  await queryFactorDB('7'.repeat(40000));
  let threw = false;
  try { await queryFactorDB('7'.repeat(65486)); } catch(e) { threw = true; }
  ok(threw, 'the oversized query still fails');
  eq(loadQueryLimits().minFail, 65486, 'and the size is recorded as the measured limit');
  ok(currentQueryCap() < 65486, 'so the cap drops below it');

  // THE CASE THAT MUST NOT MISFIRE: offline. Nothing succeeds at any size, so there
  // is no proof the network works and no limit may be inferred.
  sb2.__ls = {}; sb2.setSessionMaxOk(0);
  sb2.fetchWithTimeout = async () => netFail();   // every route, POST included
  try { await queryFactorDB('7'.repeat(65486)); } catch(e) {}
  eq(loadQueryLimits().minFail, 0, 'an outage records NO size limit');
  eq(currentQueryCap(), 500000, 'and leaves the cap untouched');

  // A failure SMALLER than a known-good size is also not evidence of a size limit —
  // that is a transient error, and capping on it would be badly wrong.
  sb2.__ls = {}; sb2.setSessionMaxOk(0);
  let calls = 0;
  sb2.fetchWithTimeout = async (url, ms, opts) => {
    const src = opts && opts.method === 'POST' ? String(opts.body) : url;
    const d = (src.match(/7{100,}/) || [''])[0].length;
    if (d === 30000) { calls++; netFail(); }
    return okResp;
  };
  await queryFactorDB('7'.repeat(50000));            // proves 50,000d works
  try { await queryFactorDB('7'.repeat(30000)); } catch(e) {}
  eq(loadQueryLimits().minFail, 0,
     'a failure at a size SMALLER than a proven-good one is treated as transient');
});


// ── export threshold vs attempt cap ──────────────────────────────────────────
// These are two different questions and conflating them produced a real failure:
// someone whose queries had just failed at 65,486 digits was told "nothing to
// export — every entry is within the current 500,000-digit limit".
//
//   currentQueryCap()  = the largest size still worth ATTEMPTING. Sits at the sanity
//                        ceiling until a rejection has actually been recorded.
//   export threshold   = the largest size CONFIRMED to work. Everything above it is
//                        unproven, which is precisely what the offline script is for.
//
// An entry can be unreachable long before any failure has been logged against it —
// especially since the failures that revealed this arrived as bare network errors
// that earlier versions never recorded at all.
group('export-threshold', () => {
  // Calls the real confirmedQueryDigits() now. This group used to define its own
  // `pick` mirroring the expression that sat inline in exportFDBCheckList, so the
  // rule existed in three places and the test would have stayed green through any
  // change to the actual one.
  const pick = (lim, cap) => {
    sandbox.saveQueryLimits({ maxOk: lim.maxOk || 0, minFail: lim.minFail || 0 });
    const got = sandbox.confirmedQueryDigits();
    return got;
  };
  const CEIL = 500000;

  // The reported state: a success logged, no rejection recorded.
  eq(pick({ maxOk: 65478, minFail: 0 }, CEIL), 65478,
     'with a confirmed success but no recorded rejection, the threshold is the confirmed size');
  ok(pick({ maxOk: 65478, minFail: 0 }, CEIL) < CEIL,
     'and NOT the attempt cap — using the cap exported nothing while entries were failing');

  // Once a rejection is recorded it is the better bound, being tighter and directly
  // measured rather than inferred from the last success.
  eq(pick({ maxOk: 65478, minFail: 65486 }, CEIL), 65485,
     'a recorded rejection takes precedence and sits just below it');

  // Nothing measured at all: fall back to the cap, since there is no evidence to
  // suggest anything is out of reach.
  eq(pick({ maxOk: 0, minFail: 0 }, CEIL), CEIL,
     'with nothing measured, the threshold falls back to the attempt cap');

  // The entries from the reported log must now qualify.
  const th = pick({ maxOk: 65478, minFail: 0 }, CEIL);
  for (const d of [65486, 65494, 65502]) ok(d > th, d + 'd is exported (it demonstrably failed)');
  for (const d of [65478, 60000])        ok(!(d > th), d + 'd is not exported (it demonstrably worked)');

  // pick() writes real query limits now, and sandbox storage is shared — leaving
  // a 65,478-digit limit installed would silently gate every later group that
  // touches confirmedQueryDigits. (See no-stub-leaks.)
  sandbox.saveQueryLimits({ maxOk: 0, minFail: 0 });
});


// ── POST as the route past the URL-length limit ──────────────────────────────
// The number goes in the BODY, so the 64 KiB request-line cap does not apply. Why
// this belongs in the browser rather than an offline script: the direct GET to
// factordb.com already works from here (a 65,478-digit query succeeded that way,
// too large for the proxy but fine direct), so CORS plainly permits this origin —
// and a POST with Content-Type application/x-www-form-urlencoded is a CORS SIMPLE
// request, skipping preflight and getting the same treatment as that working GET.
//
// A local Python script cannot substitute: it gets 503 from bot protection that
// fingerprints the TLS handshake, which no amount of header-faking addresses.
groupAsync('post-past-url-limit', async () => {
  const { queryFactorDB, loadQueryLimits } = sb2;
  const OK = { ok: true, status: 200,
               text: async () => JSON.stringify({ id: '9912', status: 'CF', factors: [['5', 1]] }) };
  const netFail = () => { throw new TypeError('NetworkError when attempting to fetch resource.'); };

  // Above a measured cap, POST is tried instead of refusing outright.
  sb2.__ls = {}; sb2.setSessionMaxOk(0);
  sb2.noteQuerySizeFailure(60000);
  let body = null, ctype = null, method = null;
  sb2.fetchWithTimeout = async (url, ms, opts) => {
    if (opts && opts.method === 'POST') { method = 'POST'; body = opts.body; ctype = opts.headers['Content-Type']; return OK; }
    netFail();
  };
  const r = await queryFactorDB('7'.repeat(70000));
  eq(method, 'POST', 'a number above the URL cap is attempted by POST rather than refused');
  eq(r.status, 'CF', 'and the response is returned normally');
  ok(/^query=/.test(body), 'the number is sent in the request body');
  eq(ctype, 'application/x-www-form-urlencoded',
     'with the form content type — one of the three that keep it a CORS simple request');
  eq(loadQueryLimits().maxOk, 70000, 'and the size is recorded as working');

  // If POST is refused too, say so plainly — without claiming anything false.
  sb2.__ls = {}; sb2.setSessionMaxOk(0);
  sb2.noteQuerySizeFailure(60000);
  sb2.fetchWithTimeout = async (url, ms, opts) => {
    if (opts && opts.method === 'POST') throw new Error('HTTP 405');
    netFail();
  };
  let msg = '';
  try { await queryFactorDB('7'.repeat(70000)); } catch(e) { msg = e.message; }
  ok(/POST also failed/.test(msg), 'a refused POST is reported honestly');
  ok(/may not accept POST/.test(msg), 'and names the likely reason without overstating it');

  // THE ONE THAT MATTERS MOST: when the URL routes fail but POST works, no size
  // limit may be recorded. Recording one would rule out numbers that ARE reachable.
  sb2.__ls = {}; sb2.setSessionMaxOk(40000);
  let posted = false;
  sb2.fetchWithTimeout = async (url, ms, opts) => {
    if (opts && opts.method === 'POST') { posted = true; return OK; }
    netFail();
  };
  const r3 = await queryFactorDB('7'.repeat(65486));
  ok(posted, 'POST is tried before a size limit is concluded');
  eq(r3.status, 'CF', 'and rescues the query');
  eq(loadQueryLimits().minFail, 0, 'so NO size limit is recorded — the number was reachable after all');
});


// ── FactorDB circuit breaker ─────────────────────────────────────────────────
// The per-number rate limit was the only throttle, and it hid a bad failure mode.
// One number can try up to seven routes (three id lookups, three queries, one POST)
// fired back-to-back with no pause between them. On success the first returns and it
// costs one request — but on FAILURE all seven go out, so a failing streak ran at
// ~28 requests/second against the 4/second the delay implies.
//
// The worst time for that is exactly when FactorDB is unwell: every request fails,
// so every number costs the full seven, and the client hammers hardest precisely
// when the server can least take it.
// ── measured request rate against FactorDB ───────────────────────────────────
// Asserting "the breaker trips" is not enough. What matters to a shared, free
// service is the RATE, and the rate was the thing I got wrong: I claimed 4 req/s
// when the real figure during a failing streak was ~28, because the delay sits
// between numbers while one number can fire up to seven requests back-to-back.
//
// These use a virtual clock — sleeps advance simulated time rather than waiting —
// so a long run can be measured in milliseconds and the peak rate over any window
// computed exactly. Bounds are asserted, not printed.
// ── an aborted run must not report as success ────────────────────────────────
// The completion path overwrote the breaker's stop message with a bland
// "Done — 8 checked", so a run that aborted after 8 of 5,000 numbers looked
// identical to one that finished. That is the exact situation where the user most
// needs to be told something is wrong, and it was the one place saying nothing.
// ── the poll loop must actually RUN ──────────────────────────────────────────
// Two variables (_sessionMaxOkDigits, breakerStopped) shipped used-but-never-
// declared. Both survived every check in this suite:
//   * `node --check` only parses — an undeclared name is valid syntax
//   * the page-load test executes top level, but the poll loop never runs
//   * a strict-mode compile does not help either: an undeclared reference is a
//     RUNTIME error, so the line has to be reached before anything notices
// The first sign was a live ReferenceError mid-poll, after a cancelled run.
//
// The only check that finds this is executing the loop. This drives runPollQueue
// end to end against stubs, through the paths that matter: a normal completion, a
// cancellation, and a breaker abort — the three exits where those variables live.
// ── never send a request that cannot possibly succeed ────────────────────────
// The URL budget is ~65,536 bytes and each route spends a different amount on its
// prefix: corsproxy 69, allorigins 78, direct 31. So the usable ceiling differs per
// route — 65,467 / 65,458 / 65,505 digits.
//
// Trying them in a fixed order meant a 65,486-digit number sent TWO doomed proxy
// requests before reaching the direct one that could work. Pure waste aimed at a
// free service — and it also made the result look like a size limit when the direct
// route was still viable. A local run settled it: plain GET succeeds at 65,486 and
// 65,494 digits, so the wall was the proxy wrapper, not FactorDB.
// ── the import loop must lose nothing, and factor labels must be honest ──────
// Two separate things, raised together:
//   1. Does export -> local script -> import save the same information a live
//      in-browser check would? It must, or the loop is a lesser path and there is
//      no point having it.
//   2. Why do factors show PRIME rather than PRIME · FDB? That turned out to be a
//      display limitation affecting BOTH paths equally, not a shortcoming of the
//      import — plus a stale threshold that skipped testing entirely.
group('import-parity-and-labels', () => {
  const P = 1000000000000000003n;
  const val = (5n * 25541n * P).toString();
  const response = { status: 'CF', factors: [['5', 1], ['25541', 1]], id: '9912' };

  // PARITY. Both paths call applyFdbResult with the same arguments, so the stored
  // state must be identical — asserted rather than assumed, because "the import is
  // just as good" is exactly the kind of claim that quietly stops being true.
  const runOnce = () => {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    for (const k of Object.keys(sandbox.fdbFactors)) delete sandbox.fdbFactors[k];
    sandbox.allEntries.push({ n: 18058, val, status: 'fdb-unknown', factors: [] });
    applyFdbResult(response, 18058, val);
    const e = sandbox.allEntries[0];
    const rec = sandbox.fdbCache[val] || {};
    return JSON.stringify({ status: e.status, factors: e.factors, cofactor: e.cofactor,
                            cacheStatus: rec.status, source: rec.source, fdbIdExact: rec.fdbIdExact });
  };
  eq(runOnce(), runOnce(), 'the import path stores exactly what a live query stores');
  const state = JSON.parse(runOnce());
  eq(state.factors, ['5', '25541'], 'factors are recorded');
  eq(state.fdbIdExact, '9912', 'the FactorDB id is kept, so later re-checks are cheap');
  eq(state.source, 'fdb', 'and the result is attributed to FactorDB');

  // LABELS. The old ceiling was 15 digits — a leftover from when this used trial
  // division, where an unlucky semiprime could freeze the modal. Miller-Rabin
  // settles a 200-digit number in ~50ms, so the cutoff was refusing to test factors
  // it could have decided instantly: a 19-digit prime showed as LARGE after 5ms.
  eq(labelFactor('1000000000000000003'), 'prime',
     'a 19-digit prime is now labelled, not dismissed as LARGE');
  eq(labelFactor('170141183460469231731687303715884105727'), 'prime',
     'and so is a 39-digit prime');
  eq(labelFactor('4294967297'), 'composite', 'composites are still identified correctly');
  eq(labelFactor('7^5'), 'prime', 'a prime power is judged on its base');

  // The ceiling still exists — an unbounded test would stall the modal on a huge
  // cofactor, which is what the original 15-digit limit was guarding against.
  eq(labelFactor('9'.repeat(400)), 'large', 'above the ceiling it declines to test');
  ok(sandbox.LABEL_PRIMALITY_MAX_DIGITS >= 100 && sandbox.LABEL_PRIMALITY_MAX_DIGITS <= 1000,
     'the ceiling is high enough to be useful and low enough not to stall');
});


// ── factor tags: same rule whichever route the result took ───────────────────
// Requirement: a factor FactorDB has confirmed prime gets the same tag whether the
// number was small enough for "Check all" or had to go out through the export →
// local script → import loop. Anything unconfirmed gets a plain PRIME — and those
// are exactly the factors an FDB submission export contains.
//
// Two bugs this pinned down:
//   * the primality tag and the provenance tag BOTH said FDB, rendering
//     "PRIME · FDB  FDB" on every FactorDB-supplied factor;
//   * a CF result set _fdbVerified = true. That flag is read as "every factor here
//     is confirmed prime", but CF means partially factored — FactorDB has looked
//     and specifically has NOT said that, and may even be listing an unfactored
//     cofactor. Partial results were claiming a confirmation never given.
group('factor-tag-parity', () => {
  const P = 1000000000000000003n;
  const val = (5n * 25541n * P).toString();

  // Calls the REAL rule now. This used to carry its own copy of it, so the modal's
  // version could change freely — including into the state that displayed
  // "61 COMPOSITE?" — without failing anything here.
  const tagFor = (f, allVerifiedPrime, cache, prov) => {
    const lbl = sandbox.factorPrimalityLabel(f, allVerifiedPrime, cache);
    const fdbConfirmed = allVerifiedPrime || !!(cache[f] && ['P','PRP'].includes(cache[f].status));
    const primary = lbl === 'prime' ? (fdbConfirmed ? 'PRIME · FDB' : 'PRIME') : lbl.toUpperCase();
    const provTag = prov === 'e' ? 'YOURS'
                  : (prov === 'f' && !fdbConfirmed) ? 'FDB'
                  : prov === 'm' ? 'MANUAL' : '';
    return (primary + ' ' + provTag).trim();
  };

  const apply = (response, prov) => {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    for (const k of Object.keys(sandbox.fdbFactors)) delete sandbox.fdbFactors[k];
    sandbox.allEntries.push({ n: 100, val, status: 'unknown', factors: [] });
    applyFdbResult(response, 100, val);
    const e = sandbox.allEntries[0];
    const rec = sandbox.fdbCache[val] || {};
    const allVP = ['FF','P','PRP'].includes(rec.status) || e._fdbVerified === true;
    return e.factors.map(f => tagFor(f, allVP, sandbox.fdbCache, prov));
  };

  const FF = { status:'FF', factors:[['5',1],['25541',1],['1000000000000000003',1]], id:'1' };
  const CF = { status:'CF', factors:[['5',1],['25541',1]], id:'1' };

  // PARITY: identical input via either route gives identical tags. Both call
  // applyFdbResult the same way, so this is really asserting that nothing in the
  // display secretly depends on how the result arrived.
  const viaCheckAll = apply(FF, 'f');
  const viaImport   = apply(FF, 'f');
  eq(viaCheckAll, viaImport, 'the same result gives the same tags whichever route delivered it');
  ok(viaCheckAll.every(x => x === 'PRIME · FDB'),
     'an FF verdict marks every factor as FactorDB-confirmed');

  // NO DUPLICATION: the provenance tag must not repeat what the primality tag says.
  ok(!viaCheckAll.some(x => /FDB.*FDB/.test(x)),
     'FDB is never shown twice on one factor');

  // UNCONFIRMED: a CF verdict confirms nothing, so a plain PRIME.
  const partial = apply(CF, 'e');
  ok(partial.every(x => x.startsWith('PRIME') && !x.includes('FDB')),
     'a CF result gives plain PRIME — FactorDB confirmed no primality');
  ok(partial.every(x => x.includes('YOURS')),
     'while still crediting who found the factor');

  // And the flag that caused it must no longer be set on a partial result.
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.allEntries.push({ n: 101, val, status: 'unknown', factors: [] });
  applyFdbResult(CF, 101, val);
  ok(sandbox.allEntries[0]._fdbVerified !== true,
     'a CF result does not mark the entry as FactorDB-verified prime');
});

// ── no group may leave a stub installed on the shared sandbox ────────────────
// The sandboxes are shared across every group, and overriding an extracted
// function by assigning to the sandbox is a normal, necessary technique here. But
// an override that is never undone does not end with the group that set it: it
// becomes the definition every later group sees, and nothing complains.
//
// This is not hypothetical. Two computeYieldByLevel groups stubbed loadECM and
// left it stubbed, so the ECM merge tests added later merged against THEIR
// fixture rather than the data they had themselves just saved — producing three
// failures that looked like bugs in mergeEcmData and were not.
//
// M holds the references captured when the harness was built, so anything on the
// sandbox that no longer matches is a leak. Runs last, via the async chain, so it
// sees the state every group left behind.
// ── the record merge must CONVERGE ──────────────────────────────────────────
// mergeFactorRecords used `rTs > lTs`, so a TIE fell to LOCAL — and local is a
// different record on each machine. A kept A's `source`, B kept B's, every merge
// preserved the choice, and they disagreed permanently.
//
// `source` is not cosmetic: 'fdb' means FactorDB already holds everything we do,
// and it is what makes the submission export SKIP an entry. Two machines
// disagreeing about it means one withholds submissions the other sends.
//
// Exhaustive rather than sampled: every combination of the fields that can differ,
// both directions, compared with keys sorted — because comparing JSON.stringify of
// an object compares insertion ORDER too, which is how a first version of this
// reported 161 of 250 pairs divergent when every value was identical.
// ── pulling identical ECM data must not report a change ─────────────────────
// pullECMFile decides whether to save by comparing JSON.stringify of the merged
// store against the previous one. That comparison is sensitive to ORDER, so if the
// merge reordered attempts, a pull of semantically identical data would mark the
// store dirty, save it, and schedule a push — and two machines could then push to
// each other indefinitely without either learning anything.
//
// It does not today. This pins that, because the failure would look like the sync
// being busy rather than broken.
// ── the factor encoding must round-trip, sentinel included ──────────────────
// '~' marks "base36 follows". A value that already starts with '~' was passed
// through unencoded and then DECODED as base36, so "~abc" came back as 13368 and
// "~" as 0 — a factor silently becoming a different factor.
//
// Not reachable from good data: every path that produces a factor produces
// decimal. It becomes reachable the moment a decode fails upstream and leaves an
// encoded value sitting in a factor list, which is exactly the kind of thing that
// has happened here before. An unescaped sentinel is the classic form of this bug.
// ── no status value may collide with a status CODE ──────────────────────────
// _encodeStatus maps a known status to a short code and passes anything else
// through; _decodeStatus does the reverse. So a status whose VALUE happens to equal
// a code round-trips into something else: a record with status "u" would come back
// as "unknown", "fl" as "full".
//
// Nothing collides today — FactorDB's statuses are uppercase (C, U, FF, CF, P, PRP)
// and the entry statuses are full words — so this is latent, not live. It becomes
// live the moment someone adds a status, and the format cannot be changed cheaply
// because 10,000 records are already stored in it. A guard costs nothing.
//
// The status list is SCRAPED from the source rather than written out here, so a new
// one is covered the day it is added rather than the day someone remembers this
// test.
group('status-codes-cannot-collide', () => {
  if (!needs(sandbox, '_encodeStatus', '_decodeStatus')) return;
  const code = fs.readFileSync('index.html', 'utf8');
  const codes = Object.values(sandbox._STATUS_CODE || {});
  ok(codes.length >= 5, 'the code table was found (' + codes.length + ' codes)');

  // Every string literal the source assigns to or compares against a status.
  const found = new Set();
  for (const m of code.matchAll(/status\s*(?:===|!==|:)\s*'([^']{1,20})'/g)) found.add(m[1]);
  for (const m of code.matchAll(/\.status\s*=\s*'([^']{1,20})'/g)) found.add(m[1]);
  ok(found.size >= 8, 'status values were scraped from the source (' + found.size + ' found)');

  const collisions = [...found].filter(v => codes.includes(v));
  eq(collisions, [],
     'no status value equals a storage code — one that did would round-trip into a '
     + 'different status entirely');

  // And the round trip holds for every one of them.
  const lossy = [...found].filter(v => sandbox._decodeStatus(sandbox._encodeStatus(v)) !== v);
  eq(lossy, [], 'every status the source can produce survives encode then decode');

  // The codes themselves must stay distinct, or two statuses share one slot.
  eq(codes.length, new Set(codes).size, 'the codes are unique');
});

// ── a bad exponent is clamped on the way IN ─────────────────────────────────
// The value is available at import, so "does p^k actually divide it" is answerable
// then. Without clamping, a source reporting 839^2 when only one 839 divides has
// that stored verbatim — mergeFactorRecords clamps on sync and the integrity FIX
// clamps on demand, but nothing clamped on the way in. The bad exponent sits in the
// store until somebody runs a repair, and meanwhile the submission export expands
// it to 839*839 and offers FactorDB a factorisation we can already prove wrong.
//
// Found by round-tripping a file written by `euler.py check` back through
// applyFdbResult: the two programs agree on the format, and this is what the app
// did with a bad exponent inside it.
// ── GMP-ECM prints the digit count with %2u ─────────────────────────────────
// A count below 10 is right-aligned into two characters, so the line reads
// "of  3 digits" with TWO spaces. The pattern required exactly one and missed every
// factor of fewer than ten digits.
//
// The factor itself survived — the "Factor found in step N" line above it still
// matched — but THIS is the line carrying the prime/composite classification, and
// the fallback records composite:false. A composite factor under ten digits was
// therefore imported as a PRIME.
//
// Found by testing the parser against real GMP-ECM output forms rather than the
// ones the app happened to be written against.
// ── the export explains how to run it elsewhere ─────────────────────────────
// The scripts land in a Downloads folder and the machine that runs them is usually
// headless and reached over SSH. Which files to copy, that a minimal Debian has no
// gmp-ecm, that `setsid … </dev/null &` is what survives logout, that N concurrent
// stage-2 runs can outgrow a small box — none of it is discoverable from the
// scripts themselves, and all of it was worked out the hard way once.
//
// Generated from the SAME values the scripts are, so it can be pasted rather than
// adapted. A generic note has to be translated every time, which is where the
// mistakes come from.
// ── GitHub status has to reach the user somehow ─────────────────────────────
// setGHStatus used to write into a status element in the toolbar. That element went
// with the in-app check, so the log line and the toast are now the ONLY ways a
// GitHub failure is reported — a push that 403s, a token that expired, a SHA
// conflict. Losing either would make sync failures silent, which is the worst shape
// for a bug in a thing whose whole job is not losing work.
//
// Found by mutation: removing the lookup left nothing testing that the function
// still reports, so deleting the log line and the toast both passed.
group('github-status-is-reported', () => {
  const src2 = fs.readFileSync('index.html', 'utf8');
  const i = src2.indexOf('function setGHStatus');
  ok(i > 0, 'setGHStatus exists');
  const body = src2.slice(i, src2.indexOf('\n}', i));

  ok(/addLog\('GitHub: ' \+ msg,/.test(body),
     'every status goes to the activity log');
  ok(/showToast\(msg, cls\)/.test(body),
     'and to a toast, so a failure is visible without opening the log');
  ok(/cls === 'err'/.test(body),
     'errors are distinguished, not reported as ordinary progress');
  ok(!/getElementById/.test(body),
     'and it no longer hunts for the status element that was removed');

  // The callers that matter: a silent push failure is the case this protects.
  const code2 = src2;
  ok(/setGHStatus\([^)]*'err'\)/.test(code2),
     'at least one caller reports an error through it');
  ok((code2.match(/setGHStatus\(/g) || []).length > 5,
     'and it is the shared reporting path, not a one-off');
});

group('server-notes-match-the-export', () => {
