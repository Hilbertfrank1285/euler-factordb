// ── contributions: other people's ECM results, reviewed by the owner ───────────
// Nothing a contributor sends touches the data until the owner accepts it. The
// review checks each run's input number against E(n) itself (the log's comment line
// is the sender's and is not trusted), each factor, duplicates by sigma, and timings;
// accepting imports exactly the chosen parts as a contribution — counted for planning,
// kept out of the owner's time model — and the ledger records what it really added.
groupAsync('contributions-review-and-accept', async () => {
  if (!sandbox.reviewSubmission || !sandbox.acceptSubmission || !sandbox.buildSubmission) return;
  const S = sandbox;
  const P = 100000000000000000039n;
  const V402 = String(71n * 1000003n * 1000000007n * P), C402 = String(1000003n * 1000000007n * P);
  const V404 = String(5n * 1000081n * 1000099n), V406 = String(3n * 1000037n * 1000039n), C406 = String(1000037n * 1000039n);
  const run = (sig, t1, t2) => ['Using B1=3000, B2=224406, polynomial x^1, sigma=1:' + sig, 'Step 1 took ' + t1 + 'ms', 'Step 2 took ' + t2 + 'ms'];
  const file1 = [
    '# run ECM B1=3000 E(404) 36d - ECM target 10d - ~1 s - +50.00%',      // the comment lies: the number is E(402)'s
    'Input number is ' + C402 + ' (' + C402.length + ' digits)', ...run(111, 100, 50), ...run(222, 100, 50),
    '********** Factor found in step 2: 1000003', 'Found prime factor of 7 digits: 1000003',
    '# run ECM B1=3000 E(406) 13d - ECM target 10d - ~1 s - +50.00%',
    'Input number is ' + C406 + ' (13 digits)', ...run(333, 1, 0), ...run(444, 1, 0),
  ].join('\n');
  const file2 = [
    'Input number is 5000405 (7 digits)', ...run(555, 10, 10), 'Found prime factor of 6 digits: 999983',
    'Input number is 12345678901 (11 digits)', ...run(666, 10, 10),
  ].join('\n');
  const reset = () => {
    S.allEntries.length = 0; for (const k of Object.keys(S.fdbCache)) delete S.fdbCache[k];
    for (const [n, v, f] of [[402, V402, '71'], [404, V404, '5'], [406, V406, '3']]) { S.allEntries.push({ n, val: v, status: 'partial', factors: [f] }); S.eulerValues[n] = v; }
    S.__ecm = { '402': [{ method: 'ECM', b1: '3000', curves: '1', sigmas: [S._hashStr('111')], ms: 500 }] };
    S.__ls[S.CONTRIB_KEY] = '[]';
    S._newSince = {};
  };
  const total = (att) => (att || []).reduce((t, a) => t + (parseInt(a.curves) || 0), 0);
  const hooks = { estimate: (m, b1, b2, c) => 0.1 * c, covered: (e, d, att) => total(att),
                  recommend: (d, att) => [{ method: 'ECM', b1: total(att) >= 2 ? '11000' : '3000', curves: '10' }] };
  // the submission file
  let threw = 0; try { S.buildSubmission([{ name: 'a.txt', text: 'x' }], { name: ' ' }, 'note', 't'); } catch (e) { threw++; }
  try { S.buildSubmission([{ name: 'a.txt', text: 'x' }], { name: 'Alice' }, '  ', 't'); } catch (e) { threw++; }
  eq(threw, 2, 'a submission needs a name and a note to the owner');
  const files = [{ name: 'ecm_import_m1_c1.txt', text: file1 }, { name: 'ecm_import_m1_c2.txt', text: file2 }];
  const sub = S.buildSubmission(files, { name: 'Alice', contact: '@alice' }, 'Ran these on my Ryzen over the weekend.', '2026-10-21T09:00:00Z');
  eq(sub.id, S.buildSubmission(files, { name: 'Alice', contact: '@alice' }, 'Ran these on my Ryzen over the weekend.', '2026-10-21T09:00:00Z').id, 'the same submission has the same id');
  eq(S.readSubmission(JSON.stringify(sub)).sub.id, sub.id, 'and reads back from its file');
  ok(S.readSubmission('{nope').error && S.readSubmission('{"kind":"other"}').error
     && /newer version/.test(S.readSubmission(JSON.stringify(Object.assign({}, sub, { v: 2 }))).error)
     && S.readSubmission(JSON.stringify(Object.assign({}, sub, { by: { name: '' } }))).error, 'anything else is refused, saying why');
  // the review: computed, never applied
  reset();
  const before = JSON.stringify(S.__ecm);
  const rv = S.reviewSubmission(sub, hooks);
  eq(JSON.stringify(S.__ecm), before, 'reviewing changes nothing');
  eq(rv.entries.map(x => x.n + ':' + x.verdict).join(' '), '402:ok 404:bad 406:warn', 'E(402) clean, E(404) bad, E(406) flagged');
  const e402 = rv.entries[0], e404 = rv.entries[1], e406 = rv.entries[2];
  eq([e402.runs.length, e402.runs[0].curves, e402.runs[0].fresh], [1, 2, 1],
     'the run claiming E(404) is E(402)\'s by its number — and of its 2 curves, 1 is already in the data (same sigma)');
  ok(e402.factors.length === 1 && e402.factors[0].divides && e402.factors[0].prime && !e402.factors[0].known, 'its factor divides E(402), is prime, and is new');
  eq([e402.impact.coveredBefore, e402.impact.coveredAfter, e402.impact.nextBefore, e402.impact.nextAfter],
     [1, 2, 'ECM B1=3000, 10 curves', 'ECM B1=11000, 10 curves'], 'its impact: coverage and the next run, before and after');
  eq(e406.runs[0].timing, 'fast', 'two curves in 2 ms where the model expects 0.2 s: implausibly fast');
  ok(e404.runs[0].check === 'wrong' && /lacks part of the unfactored cofactor/.test(e404.runs[0].why), 'a run on a divisor missing part of the cofactor searched the wrong number');
  ok(e404.factors[0] && !e404.factors[0].divides, 'a "factor" that does not divide E(404) is caught');
  eq(rv.unmatched.length, 1, 'a run on a number that is no E(n) here is listed, and ignored');
  eq(S.submissionSummaryText(rv), '3 entries · 3 new curves · 1 new factor', 'the summary counts only what is new');
  // accept E(402) and E(406): the clean one and the flagged one, by choice
  let calib = 0; const keepCalib = S.recordCalibSample; S.recordCalibSample = () => { calib++; return true; };
  let rec;
  try { rec = await S.acceptSubmission(sub, rv, [402, 406], false, 'https://github.com/x/y/issues/1'); }
  finally { S.recordCalibSample = keepCalib; }
  const a402 = S.__ecm['402'][0], a406 = (S.__ecm['406'] || [])[0];
  eq([a402.curves, a402.xs && a402.xs.length, a402.ms], ['2', 1, 500], 'E(402): 1 new curve, listed as contributed — and your measured time untouched');
  ok(a406 && a406.curves === '2' && a406.xs.length === 2 && !(a406.ms > 0) && /contributed by Alice/.test(a406.note), 'E(406): 2 contributed curves, with no time in your model');
  eq(calib, 0, 'a contribution never feeds your calibration');
  ok(S.allEntries.find(x => x.n === 402).factors.includes('1000003'), 'the factor is recorded');
  ok(!S.__ecm['404'], 'E(404) — not accepted — is untouched');
  const led = S.loadContributions();
  eq(led.length, 1, 'one decision in the ledger');
  eq([rec.decision, rec.by.name, rec.note, rec.issue, rec.cpuMs], ['accepted', 'Alice', 'Ran these on my Ryzen over the weekend.', 'https://github.com/x/y/issues/1', 302],
     'accepted, with her name, her note and the issue — and her CPU time credited to her');
  eq(JSON.stringify(rec.added.runs.map(r => r.n + ':' + r.curves).sort()) + JSON.stringify(rec.added.factors), '["402:1","406:2"][{"n":402,"f":"1000003"}]',
     'the ledger records what was actually added');
  await S.acceptSubmission(sub, rv, [402, 406], false, '');
  eq([S.loadContributions().length, S.__ecm['402'][0].curves], [1, '2'], 'accepting the same submission again adds nothing and keeps one record');
  // factors only
  reset();
  const rec2 = await S.acceptSubmission(sub, S.reviewSubmission(sub, hooks), [402], true, '');
  ok(S.__ecm['402'][0].curves === '1' && !S.__ecm['402'][0].xs && S.allEntries.find(x => x.n === 402).factors.includes('1000003') && rec2.decision === 'partial',
     'factors only: the factor is recorded, no curves — a partial acceptance');
  // reject
  reset();
  const rec3 = S.rejectSubmission(sub, 'the timings look made up', 'javascript:alert(1)');
  ok(rec3.decision === 'rejected' && rec3.reason === 'the timings look made up' && !rec3.issue && !S.__ecm['406'], 'rejected: the reason kept, a non-https "link" dropped, nothing added');
  // the ledger across machines
  const m = S.mergeContributionLists([{ id: 'A', decided: '2026-10-01', decision: 'accepted' }],
    [{ id: 'A', decided: '2026-10-05', decision: 'rejected' }, { id: 'B', decided: '2026-10-02', decision: 'accepted' }]);
  eq(m.map(r => r.id + ':' + r.decision).join(' '), 'B:accepted A:rejected', 'ledgers merge by id, the later decision standing');
  // the issue link and escaping
  const url = S.submissionIssueUrl(sub, '3 entries', 'owner/repo');
  ok(url.startsWith('https://github.com/owner/repo/issues/new?') && /template=ecm-submission\.yml/.test(url) && /title=%5BECM\+submission%5D\+Alice/.test(url),
     'the issue form opens filled in from the submission');
  eq([S.cleanIssueUrl('https://github.com/a/b/issues/3'), S.cleanIssueUrl('javascript:x'), S.cleanIssueUrl('https://x/"onmouseover=1')], ['https://github.com/a/b/issues/3', '', ''],
     'only a plain https link is kept');
  const evil = S.buildSubmission([{ name: '<img src=x onerror=alert(1)>.txt', text: 'Input number is 12345678901 (11 digits)\n' + run(1, 1, 1).join('\n') }], { name: 'Mallory' }, 'hi', 't');
  const html = S.reviewHtml(S.reviewSubmission(evil, hooks), true, false);
  ok(/&lt;img src=x/.test(html) && !/<img src=x/.test(html), "the sender's file names are escaped in the review");
  // wiring
  const src = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  ok(/escHtml\(sub\.by\.name\)/.test(src) && /escHtml\(sub\.note\)/.test(src), "the sender's name and note are escaped");
  ok(/curves = pm1 \? 1 : \(parseInt\(a\.curves\) \|\| 0\) - \(\(a\.xs \|\| \[\]\)\.length\);/.test(src), 'the time model counts only your own curves');
  ok(/if \(Array\.isArray\(a\.xs\) && a\.xs\.length\) out\.xs = a\.xs;/.test(src), 'saving keeps the contributed list');
  ok(/contributions: loadContributions\(\),/.test(src) && /mergeContributions\(remote\.contributions\)/.test(src), 'the ledger travels with the data, both ways');
  const norm = S.normalizeEcmAttempts([{ method: 'ECM', b1: '3000', curves: '2', sigmas: ['a', 'b'], xs: ['b'] }, { method: 'ECM', b1: '3000', curves: '2', sigmas: ['b', 'c'], xs: ['c'] }]);
  eq([norm.length, norm[0].curves, JSON.stringify(norm[0].xs.sort())], [1, '3', '["b","c"]'], 'merging duplicate runs unites the contributed lists too');
});

// ── NEW means: gained a factor since you last opened it ───────────────────────
// It used to react only to pulls from GitHub — and to curves — so for one browser
// doing all the imports it showed nothing. Now every route that adds a factor the
// entry did not hold marks it, judged against the entry's own factors.
groupAsync('new-means-a-new-factor', async () => {
  if (!sandbox.markNewFactor || !sandbox.applyFdbResult || !sandbox.processEcmLogText) return;
  const marks = () => sandbox.loadNewSince();
  const reset = () => { sandbox._newSince = {}; };
  const only = (n, list) => { sandbox.allEntries.length = 0; for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.__ecm = {}; sandbox.allEntries.push(list); sandbox.eulerValues[n] = list.val; };
  // an ECM import: a factor marks its entry; curves alone do not
  const V = '71000213497001491';                    // 71 x 1000003 x 1000000007
  const log = (sigma, find) => [
    '# run ECM B1=3000 E(402) 17d - ECM target 10d - ~1 s - +50.00%',
    'Input number is ' + V + ' (17 digits)',
    'Using B1=3000, B2=224406, polynomial x^1, sigma=1:' + sigma,
    'Step 1 took 1ms', 'Step 2 took 1ms',
  ].concat(find ? ['********** Factor found in step 1: 1000000007', 'Found prime factor of 10 digits: 1000000007'] : []).join('\n');
  reset(); only(402, { n: 402, val: V, status: 'partial', factors: ['71'] });
  await sandbox.processEcmLogText(log(1174973967, false), 'curves.log');
  eq(Object.keys(marks()).length, 0, 'an ECM import that only adds curves marks nothing');
  await sandbox.processEcmLogText(log(1174973966, true), 'find.log');
  eq(JSON.stringify((marks()['402'] || {}).factors), '["1000000007"]', 'an ECM import that finds a factor marks its entry NEW, with that factor');
  // FactorDB results: only what the entry did not hold
  const VAL = '600851475143';                       // 71 x 839 x 1471 x 6857
  reset(); only(5004, { n: 5004, val: VAL, status: 'partial', factors: ['71'] });
  sandbox.applyFdbResult({ status: 'CF', factors: ['71', '839'] }, 5004, VAL);
  eq(JSON.stringify((marks()['5004'] || {}).factors), '["839"]', 'FactorDB results mark only the factor the entry did not hold');
  reset(); only(5006, { n: 5006, val: VAL, status: 'partial', factors: ['71', '839'] });
  sandbox.applyFdbResult({ status: 'CF', factors: ['71', '839'] }, 5006, VAL);
  eq(Object.keys(marks()).length, 0, 'a factor the entry already held is not news — even though the discovery history never saw it');
  // the other routes, and what no longer marks
  const src = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  ok(/recordDiscovery\(n, factorStr, prov\);[^\n]*\n  try \{ markNewFactor\(n, factorStr\); \}/.test(src), 'a factor added by hand marks its entry');
  ok(/if \(!hadBases\.has\(String\(h\.p\)\)\) \{ try \{ markNewFactor\(f\.n, h\.p\); \}/.test(src), 'the sieve marks only hits the entry did not hold');
  const rd = src.slice(src.indexOf('function recordDiscovery('), src.indexOf('\n}\n', src.indexOf('function recordDiscovery(')));
  ok(rd.length > 50 && !/markNewFactor/.test(rd), 'never from the discovery history, which lacks factors recorded before it existed');
  ok(!/recordNews\(pullNews\(null, null/.test(src) && !/function curvesByEntry\(/.test(src), 'runs pulled from GitHub are no longer marked');
});

// ── one commit per push ────────────────────────────────────────────────────────
// Every changed file goes into ONE commit through GitHub's git API. The tree is built ON
// TOP of the current one — without that, the commit would hold only the data files and
// the site itself would vanish from the repository.
groupAsync('push-one-commit', () => {
  const srcO = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const grabO = (name) => { const at = srcO.indexOf('function ' + name + '(');
    if (at < 0) return '';
    for (let j = srcO.indexOf('{', at), d = 0; j < srcO.length; j++) {
      if (srcO[j] === '{') d++; else if (srcO[j] === '}' && --d === 0) return (srcO.slice(at - 6, at) === 'async ' ? 'async ' : '') + srcO.slice(at, j + 1); }
    return ''; };
  const code = ['ghApi', 'branchHead', 'commitFiles'].map(grabO);
  ok(code.every(Boolean), 'the one-commit push can be located');
  if (!code.every(Boolean)) return;
  // A fake GitHub: records every call, answers each step; `fail` makes one step fail.
  const world = (fail) => {
    const calls = [];
    const fakeFetch = async (url, opts) => {
      const path = url.split('/repos/u/r/')[1], method = opts.method, body = opts.body ? JSON.parse(opts.body) : null;
      calls.push({ method, path, body });
      const f = (fail || {})[method + ' ' + path.replace(/\/[0-9a-f]{6,}$/, '/*')];
      if (f) return { ok: false, status: f.status, json: async () => (f.html ? Promise.reject(new Error('<html>')) : { message: f.message }) };
      const answer = {
        'GET git/ref/heads/main': { object: { sha: 'C0' } }, 'GET git/commits/C0': { tree: { sha: 'T0' } },
        'POST git/trees': { sha: 'T1' }, 'POST git/commits': { sha: 'C1' }, 'PATCH git/refs/heads/main': { object: { sha: 'C1' } },
        'POST git/refs': { ref: 'refs/heads/main' },
      }[method + ' ' + path] || (path === 'git/blobs' ? { sha: 'blob-' + body.content.length } : {});
      return { ok: true, status: 200, json: async () => answer };
    };
    const api = new Function('fetch', 'ghHeaders', code.join('\n') + '\nreturn { branchHead, commitFiles };')(fakeFetch, () => ({}));
    return { api, calls };
  };
  const ctx = { user: 'u', repo: 'r', branch: 'main', token: 't' };
  const plan = () => [{ path: 'data/ecm-01000.json', text: '{"ecm":{"1002":[]}}', sha: 'x1' },
                      { path: 'data/meta.json', text: '{"version":3}', sha: 'x2' }];
  return (async () => {
    let w = world();
    const head = await w.api.branchHead(ctx);
    eq(JSON.stringify(head), '{"commit":"C0","tree":"T0"}', 'the push builds on the branch\'s latest commit and its tree');
    const res = await w.api.commitFiles(ctx, head, plan(), 'msg');
    ok(res.ok && res.commit === 'C1', 'two changed files, one commit');
    const n = (m, p) => w.calls.filter(c => c.method === m && c.path === p).length;
    eq([n('POST', 'git/blobs'), n('POST', 'git/trees'), n('POST', 'git/commits'), n('PATCH', 'git/refs/heads/main')], [2, 1, 1, 1],
       'the pieces are uploaded, then exactly one tree, one commit and one branch move');
    const tree = w.calls.find(c => c.path === 'git/trees').body;
    eq(tree.base_tree, 'T0', 'the tree is built ON TOP of the current one — so the site itself stays in the repository');
    eq(JSON.stringify(tree.tree.map(e => [e.path, e.mode, e.type])), JSON.stringify([['data/ecm-01000.json', '100644', 'blob'], ['data/meta.json', '100644', 'blob']]),
       'and holds just the changed files');
    eq(JSON.stringify(w.calls.find(c => c.path === 'git/commits').body.parents), '["C0"]', 'the commit follows the latest one — history is kept');
    eq(w.calls.find(c => c.method === 'PATCH').body.force, false, 'and the branch is moved, never forced');
    const blob = w.calls.find(c => c.path === 'git/blobs').body;
    ok(blob.encoding === 'utf-8' && blob.content === '{"ecm":{"1002":[]}}', 'the text goes as it is — no base64, a third smaller');

    w = world({ 'PATCH git/refs/heads/main': { status: 422, message: 'Update is not a fast forward' } });
    let r = await w.api.commitFiles(ctx, { commit: 'C0', tree: 'T0' }, plan(), 'msg');
    ok(!r.ok && r.conflict, 'a branch that moved meanwhile is a conflict — merged and retried, never overwritten');

    w = world({ 'POST git/blobs': { status: 500, html: true } });
    r = await w.api.commitFiles(ctx, { commit: 'C0', tree: 'T0' }, plan(), 'msg');
    ok(!r.ok && !r.conflict && /HTTP 500/.test(r.message), 'a failed upload, even with an HTML error page, is reported by its status');
    eq(w.calls.filter(c => c.method === 'PATCH').length, 0, 'and the branch is never moved: nothing changes on GitHub');

    w = world({ 'GET git/ref/heads/main': { status: 409, message: 'Git Repository is empty.' } });
    eq(await w.api.branchHead(ctx), null, 'an empty repository has no commit to build on');
    r = await w.api.commitFiles(ctx, null, plan(), 'msg');
    ok(r.ok && w.calls.some(c => c.method === 'POST' && c.path === 'git/refs')
       && !('base_tree' in w.calls.find(c => c.path === 'git/trees').body)
       && JSON.stringify(w.calls.find(c => c.path === 'git/commits').body.parents) === '[]',
       'so the first push creates its first commit and the branch');
    w = world({ 'GET git/ref/heads/main': { status: 500, message: 'Server error' } });
    let threw = false;
    try { await w.api.branchHead(ctx); } catch (e) { threw = true; }
    ok(threw, 'any other failure reading the branch stops the push — it is never taken for an empty repository');
  })();
});

groupAsync('push-guard-decisions', () => {
  if (!needs(PURE, 'pushLosses', 'factorsFromPayload')) return;
  const src9 = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const m = src9.match(/async function pushGuard\(\) \{[\s\S]*?\n\}/);
  ok(!!m, 'pushGuard can be located');
  if (!m) return;
  // The REAL pushGuard; only its network calls and dialogs are faked.
  const world = (o) => {
    const w = { pulls: 0, asked: [], status: [], answer: o.answer !== false, pullOk: o.pullOk !== false,
                gh: o.gh || { main: 'A', ecm: 'B' }, local: o.local || {}, afterPull: o.afterPull };
    const api = new Function('ghShaAt', 'ghApiBase', 'ghEcmApiBase', 'pullBothFromGitHub', 'pushLosses', 'loadECM',
      'factorsFromPayload', 'buildSyncPayload', 'deletedHere', 'confirm', 'setGHStatus', 'addLog', 'W', 'lossMessage', 'loadSyncBase',
      'dataListing', 'syncCtx', 'eulerValues', 'pageTag', 'pageVersionChanged', '_loadedPageTag', 'showStaleTabBanner',
      'let _syncBase = W.initialBase;\n' + m[0] + '\nreturn { pushGuard, setBase: (b) => { _syncBase = b; } };')(
      async (u) => (u === 'MAIN' ? w.gh.main : w.gh.ecm), () => 'MAIN', () => 'ECM',
      async () => { w.pulls++; if (!w.pullOk) return false;
        w.api.setBase({ mainSha: w.gh.main, ecmSha: w.gh.ecm, ecm: o.githubEcm || {}, factors: {} });
        if (w.afterPull) w.local = w.afterPull; return true; },
      PURE.pushLosses, () => w.local, PURE.factorsFromPayload, () => ({ fdbCache: {} }),
      () => o.deleted || { runs: new Set(), entries: new Set() },
      (msg) => { w.asked.push(msg); return w.answer; }, (t) => w.status.push(t), () => {},
      { initialBase: o.base === undefined ? null : o.base }, PURE.lossMessage, () => null, async () => { w.listings = (w.listings || 0) + 1; return o.listing || null; }, () => ({}),
      o.values || {}, async () => (o.pageNow === undefined ? null : o.pageNow), PURE.pageVersionChanged,
      o.pageLoaded === undefined ? null : o.pageLoaded, () => { w.banner = true; });
    w.api = api;
    return w;
  };
  const run = (b1, c) => ({ method: 'ECM', b1, curves: c });
  const ghEcm = { '10': [run('250000', '100')], '12': [run('1000000', '50')] };
  const synced = { mainSha: 'A', ecmSha: 'B', ecm: ghEcm, factors: {} };
  return (async () => {
    let w = world({ base: synced, local: JSON.parse(JSON.stringify(ghEcm)) });
    let g = await w.api.pushGuard();
    ok(g.ok && w.pulls === 0 && w.asked.length === 0, 'GitHub unchanged and nothing missing: push straight away, no questions');

    // an old tab must not push: many sync bugs came from tabs still running old code
    w = world({ base: synced, local: JSON.parse(JSON.stringify(ghEcm)), pageLoaded: '"v1"', pageNow: '"v2"' });
    g = await w.api.pushGuard();
    ok(!g.ok && w.banner === true && w.pulls === 0 && !w.listings && w.status.some(s => /newer version of the app is deployed/.test(s)),
       'a newer version deployed since this tab loaded: no push, nothing fetched, and a banner asking for a reload');
    w = world({ base: synced, local: JSON.parse(JSON.stringify(ghEcm)), pageLoaded: '"v1"', pageNow: '"v1"' });
    g = await w.api.pushGuard();
    ok(g.ok && !w.banner, 'the same version: the push goes ahead');
    w = world({ base: synced, local: JSON.parse(JSON.stringify(ghEcm)), pageLoaded: '"v1"', pageNow: null });
    g = await w.api.pushGuard();
    ok(g.ok && !w.banner, 'when the version cannot be checked (offline, a local file), it does not block');

    w = world({ base: synced, gh: { main: 'A2', ecm: 'B' }, local: { '10': [run('250000', '100')] }, githubEcm: ghEcm,
                afterPull: JSON.parse(JSON.stringify(ghEcm)) });
    g = await w.api.pushGuard();
    ok(g.ok && w.pulls === 1 && w.asked.length === 0, 'GitHub changed since the last sync: merge first, silently — merging loses nothing');

    w = world({ base: null, githubEcm: {}, local: {} });
    g = await w.api.pushGuard();
    ok(g.ok && w.pulls === 1, 'never synced in this browser: pull and merge before the first push');

    w = world({ base: synced, gh: { main: 'A2', ecm: 'B' }, pullOk: false });
    g = await w.api.pushGuard();
    ok(!g.ok && w.pulls === 1, 'if GitHub\'s new version cannot be fetched to merge, nothing is pushed');

    w = world({ base: synced, local: { '10': [run('250000', '100')] }, answer: false });
    g = await w.api.pushGuard();
    ok(!g.ok && w.asked.length === 1 && w.pulls === 0, 'missing data it did not delete: it stops and asks — Cancel pushes nothing');
    ok(/E\(12\)/.test(w.asked[0]), 'and the question names the entry');

    w = world({ base: synced, local: { '10': [run('250000', '100')] }, githubEcm: ghEcm, afterPull: JSON.parse(JSON.stringify(ghEcm)) });
    g = await w.api.pushGuard();
    ok(g.ok && w.asked.length === 1 && w.pulls === 1, 'OK restores from GitHub first, then pushes');

    w = world({ base: synced, local: { '10': [run('250000', '100')] },
                deleted: { runs: new Set(['12|ECM|1000000']), entries: new Set() } });
    g = await w.api.pushGuard();
    ok(g.ok && w.asked.length === 0 && w.pulls === 0, 'a run you deleted here is not questioned');

    // In the chunked layout the guard compares every file's ID.
    const files = { 'data/meta.json': 'm1', 'data/ecm-00000.json': 'e1' };
    w = world({ base: Object.assign({}, synced, { files }), listing: files, local: JSON.parse(JSON.stringify(ghEcm)) });
    g = await w.api.pushGuard();
    ok(g.ok && w.pulls === 0, 'chunks: every file as last synced — push straight away');
    w = world({ base: Object.assign({}, synced, { files }), listing: Object.assign({}, files, { 'data/ecm-00000.json': 'e2' }),
                local: JSON.parse(JSON.stringify(ghEcm)), githubEcm: ghEcm });
    g = await w.api.pushGuard();
    ok(g.ok && w.pulls === 1, 'chunks: one file changed on GitHub — merge first');
    w = world({ base: Object.assign({}, synced, { files }), listing: Object.assign({}, files, { 'data/main-01000.json': 'n1' }),
                local: JSON.parse(JSON.stringify(ghEcm)), githubEcm: ghEcm });
    g = await w.api.pushGuard();
    ok(g.ok && w.pulls === 1, 'chunks: a file this browser has never seen — merge first too');

    // pullBothFromGitHub — the real one: true only if BOTH pulls worked, or the guard
    // would push over a GitHub it never managed to read.
    const mp = src9.match(/async function pullBothFromGitHub\(\) \{[\s\S]*?\n\}/);
    ok(!!mp, 'pullBothFromGitHub can be located');
    if (mp) {
      const pb = (mainOk, ecmVal) => new Function('githubPull', 'logSwallowed', 'setGHBtns', 'W',
        'let _ecmPullPromise = W.p;\n' + mp[0] + '\nreturn pullBothFromGitHub;')(
        async () => mainOk, () => {}, () => {}, { p: ecmVal instanceof Error ? Promise.reject(ecmVal) : Promise.resolve(ecmVal) });
      ok(await pb(true, true)(), 'both pulls worked: true');
      ok(!(await pb(false, true)()), 'the main pull failed: false');
      ok(!(await pb(true, false)()), 'the ECM pull failed: false');
      ok(!(await pb(true, new Error('network'))()), 'the ECM pull threw: false');
    }
  })();
});

// ── visitor mode ──────────────────────────────────────────────────────────────
// No token in this browser means it cannot push. The data on GitHub is protected by
// GitHub either way; visitor mode makes that visible.
group('visitor-mode', () => {
  const srcV = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const grabS = (name) => { const at = srcV.indexOf('function ' + name + '(');
    if (at < 0) return '';
    for (let j = srcV.indexOf('{', at), d = 0; j < srcV.length; j++) {
      if (srcV[j] === '{') d++; else if (srcV[j] === '}' && --d === 0) return srcV.slice(at, j + 1); }
    return ''; };
  const body = grabS('isVisitor') + '\n' + grabS('updateVisitorMode');
  ok(/function isVisitor/.test(body) && /function updateVisitorMode/.test(body), 'visitor mode can be located');
  const run = (settings) => {
    const els = { visitorBanner: { style: {} }, visitorOwner: { textContent: '' }, ghPushBtn: { style: {} }, ghLocalLabel: { style: {} } };
    let dotUpdates = 0;
    new Function('document', 'loadGHSettings', 'updateDirtyIndicator', body + '\nupdateVisitorMode();')(
      { getElementById: (id) => els[id] || null }, () => settings, () => { dotUpdates++; });
    return { els, dotUpdates };
  };
  const v = run({});
  eq(v.els.visitorBanner.style.display, 'flex', 'with no token, the visitor banner shows');
  eq(v.els.ghPushBtn.style.display, 'none', 'Push is hidden — nothing here can push');
  eq(v.els.ghLocalLabel.style.display, '', 'and "Local copy" says so instead');
  eq(v.els.visitorOwner.textContent, 'hilbertfrank1285', 'the banner names whose data this is');
  eq(v.dotUpdates, 1, 'and the dot is refreshed, so none shows for a push that cannot happen');
  const o = run({ user: 'Hilbertfrank1285', token: 't' });
  eq([o.els.visitorBanner.style.display, o.els.ghPushBtn.style.display, o.els.ghLocalLabel.style.display], ['none', '', 'none'],
     'with a token: no banner, Push is back, no label');
  eq(o.els.visitorOwner.textContent, 'Hilbertfrank1285', 'the owner named is the configured one');
  // Exactly what saveGHSettings stores when the token field is left blank — someone
  // opened the settings and typed nothing. That browser still cannot push.
  const blank = run({ user: '', repo: '', branch: 'main', token: '' });
  eq(blank.els.ghPushBtn.style.display, 'none', 'an EMPTY stored token is no token: still visitor mode');
  ok(/try \{ updateVisitorMode\(\); \}/.test(srcV) && /_lastPushedSha = null;\s*\n\s*updateVisitorMode\(\);/.test(srcV),
     'applied at startup, and the moment a token is typed or removed');
  ok(/if \(el\) el\.style\.display = \(_dirty && !isVisitor\(\)\)/.test(srcV), 'no pending-push dot in visitor mode');
  ok(/if \(_dirty && !isVisitor\(\)\) \{ e\.preventDefault\(\);/.test(srcV), 'and no leave-page warning for changes that stay here anyway');
  ok(/id="visitorBanner"[\s\S]{0,400}stays in this browser — the data on GitHub is not affected/.test(srcV),
     'the banner says plainly that changes stay here and GitHub is untouched');
});

// ── the first modal after a reload no longer waits ~2 seconds ───────────────────
// It waited for the yield calibration: a scan of every logged run, built on demand.
// Measured on real data (31,348 runs, 45,259 discoveries) that scan took 1.9 s, 1.3 s of
// it in b1ToDigits — called once per run for 31 distinct B1s. Now each answer is kept,
// and the calibration is built in the background when the page is idle.
// ── real timings, a NEW filter, a 20-second auto-push ─────────────────────────────
group('sync-timings-and-new-filter', () => {
  if (!needs(PURE, 'fmtTransfer', 'fmtSecs')) return;
  eq(PURE.fmtTransfer(13, 3.7e6, 6800), '13 files, 3.7 MB, in 6.8 s', 'a push reads "13 files, 3.7 MB, in 6.8 s"');
  eq(PURE.fmtTransfer(1, 420, 380), '1 file, 1 KB, in 0.4 s', 'small ones say KB, and one file is "1 file"');
  eq(PURE.fmtSecs(64000), '64 s', 'long waits in whole seconds');
  const srcT = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  ok(/const tPush = Date\.now\(\);\s*\/\/ the whole push, guard included\s*\n\s*const guard = await pushGuard\(\);/.test(srcT),
     'the push is timed from its very start, guard included');
  ok(/addLog\(uploaded\.length \? 'Pushed to GitHub in one commit: ' \+ moved/.test(srcT) && /' — ' \+ \(uploaded\.length \? moved : 'nothing needed sending'\)/.test(srcT),
     'and logs what it sent and how long it took — in the status line too');
  ok(/const AUTO_PUSH_DELAY_MS = 20000;/.test(srcT), 'the automatic push waits 20 s after the last change, not 45');
  // The NEW filter: a button, a case in the filter, and a count kept current.
  ok(/data-filter="new"[\s\S]{0,200}NEW<span class="filter-count" id="newCount"><\/span><\/button>/.test(srcT), 'there is a NEW filter button, with a count');
  ok(/\} else if \(activeFilter === 'new'\) \{\s*\n\s*matchFilter = !!newMarks\[String\(e\.n\)\];/.test(srcT), 'which shows exactly the entries marked new');
  const at = srcT.indexOf('function updateNewCount('); let fn = '';
  if (at >= 0) for (let j = srcT.indexOf('{', at), d = 0; j < srcT.length; j++) {
    if (srcT[j] === '{') d++; else if (srcT[j] === '}' && --d === 0) { fn = srcT.slice(at, j + 1); break; } }
  ok(!!fn, 'the count can be located');
  if (!fn) return;
  const run = (marks) => {
    const cls = new Set(), el = { textContent: 'x', parentElement: { classList: { toggle: (c, on) => (on ? cls.add(c) : cls.delete(c)) } } };
    new Function('document', 'loadNewSince', fn + '\nupdateNewCount();')({ getElementById: () => el }, () => marks);
    return { text: el.textContent, lit: cls.has('has-new') };
  };
  eq(JSON.stringify(run({ '10': {}, '12': {} })), JSON.stringify({ text: ' 2', lit: true }), 'two new entries: the button says 2 and lights up');
  eq(JSON.stringify(run({})), JSON.stringify({ text: '', lit: false }), 'none: no number, no highlight');
  ok(/function saveNewSince\(m\) \{[\s\S]{0,200}updateNewCount\(\);/.test(srcT), 'and it updates whenever marks are added or seen');
  // No filter button may share a class with a standalone style rule: ".new-since" was
  // also the modal's line style, and gave the NEW button that line's font, colour and
  // bottom margin — shorter than its neighbours and out of line with them.
  const css = (srcT.match(/<style>([\s\S]*?)<\/style>/) || ['', ''])[1];
  const btnClasses = [...srcT.matchAll(/<button class="filter-btn ([\w-]+)[^"]*" data-filter=/g)].map(m => m[1]);
  ok(btnClasses.length >= 8 && btnClasses.includes('new-since'), 'the filter buttons can be read (' + btnClasses.join(', ') + ')');
  const clash = btnClasses.filter(c => new RegExp('(^|[\\s,}])\\.' + c + '\\s*[{,]').test(css));
  eq(clash, [], 'no filter button picks up a style meant for something else');
});

