#!/usr/bin/env node
/*
 * Test suite for index.html's core logic.
 *
 * Run from the same folder as index.html:
 *     node tests.js
 *
 * It extracts the pure functions straight out of index.html (so the tests can
 * never drift from the deployed code), wires up minimal fakes for the browser
 * globals that applyFdbResult touches, and asserts behaviour.
 *
 * Exit code is non-zero if any test fails — handy for CI / pre-push hooks.
 */

const fs = require('fs');
const path = require('path');

// ── tiny test harness ────────────────────────────────────────────────────────
let passed = 0, failed = 0;
const failures = [];
function eq(actual, expected, msg) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a === e) { passed++; }
  else { failed++; failures.push(`${msg}\n    expected ${e}\n    got      ${a}`); }
}
function ok(cond, msg) {
  if (cond) { passed++; } else { failed++; failures.push(msg); }
}
function throws(fn, msg) {
  try { fn(); failed++; failures.push(msg + ' (expected throw, none thrown)'); }
  catch { passed++; }
}

// ── pull the source out of index.html ────────────────────────────────────────
const html = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
const scriptMatch = html.match(/<script>([\s\S]*)<\/script>/);
if (!scriptMatch) { console.error('Could not find <script> block in index.html'); process.exit(2); }
const src = scriptMatch[1];

// Grab a single top-level function definition by name (brace-matched).
function extractFn(name) {
  for (const prefix of [`function ${name}(`, `async function ${name}(`]) {
    const idx = src.indexOf(prefix);
    if (idx === -1) continue;
    const brace = src.indexOf('{', idx);
    let depth = 0;
    for (let i = brace; i < src.length; i++) {
      if (src[i] === '{') depth++;
      else if (src[i] === '}') { depth--; if (depth === 0) return src.slice(idx, i + 1); }
    }
  }
  throw new Error(`Function ${name} not found in index.html`);
}

// ── build a sandbox with the functions + fake globals ────────────────────────
// Fakes for everything applyFdbResult references, so we can test it in isolation.
const sandbox = {
  // data stores
  allEntries: [],
  fdbCache: {},
  fdbFactors: {},
  // no-op persistence / UI
  saveFDBCache(){},
  addFdbUnknown(){},
  loadSeedNewSet(){ return new Set(); },
  saveSeedNewSet(){},
  Date, Math, BigInt, String, Set, JSON, Array, Object,
};

const harnessSrc = [
  extractFn('parseFactorExpr'),
  extractFn('isProbablePrime'),
  extractFn('isPrime'),
  extractFn('applyFdbResult'),
  // expose them on the sandbox
  'this.parseFactorExpr = parseFactorExpr;',
  'this.isProbablePrime = isProbablePrime;',
  'this.isPrime = isPrime;',
  'this.applyFdbResult = applyFdbResult;',
].join('\n\n');

const vm = require('vm');
vm.createContext(sandbox);
vm.runInContext(harnessSrc, sandbox);

const { parseFactorExpr, isProbablePrime, isPrime, applyFdbResult } = sandbox;

// ═════════════════════════════════════════════════════════════════════════════
// parseFactorExpr
// ═════════════════════════════════════════════════════════════════════════════
console.log('\n# parseFactorExpr');
eq(parseFactorExpr('7').value.toString(), '7', 'plain digits → value');
eq(parseFactorExpr('7').display, '7', 'plain digits → display');
eq(parseFactorExpr('5^3').value.toString(), '125', '5^3 → 125');
eq(parseFactorExpr('5^3').display, '5^3', '5^3 keeps display form');
eq(parseFactorExpr('7*13').value.toString(), '91', '7*13 → 91');
eq(parseFactorExpr(' 5 ^ 2 ').value.toString(), '25', 'whitespace tolerated'); // strips spaces
throws(() => parseFactorExpr('abc'), 'rejects non-numeric');
throws(() => parseFactorExpr('2+3'), 'rejects unsupported operator');

// ═════════════════════════════════════════════════════════════════════════════
// isProbablePrime  (and the slow trial-division isPrime as a cross-check)
// ═════════════════════════════════════════════════════════════════════════════
console.log('# isProbablePrime');
ok(isProbablePrime(2n),  '2 is prime');
ok(isProbablePrime(7n),  '7 is prime');
ok(!isProbablePrime(1n), '1 is not prime');
ok(!isProbablePrime(0n), '0 is not prime');
ok(!isProbablePrime(100n), '100 is composite');
ok(!isProbablePrime(561n), '561 (Carmichael) is composite');   // classic pseudoprime trap
ok(isProbablePrime(2305843009213693951n), '2^61-1 (Mersenne prime)');
ok(!isProbablePrime(2305843009213693950n), '2^61-2 composite');
ok(isProbablePrime(67280421310721n), '14-digit prime');
ok(isProbablePrime(BigInt('100000000000000000039')), '21-digit prime 1e20+39');
ok(!isProbablePrime(BigInt('100000000000000000041')), '21-digit composite');
// cross-check small numbers against trial division
let mismatches = 0;
for (let i = 2n; i < 2000n; i++) if (isProbablePrime(i) !== isPrime(i)) mismatches++;
eq(mismatches, 0, 'isProbablePrime matches trial division for 2..1999');

// ═════════════════════════════════════════════════════════════════════════════
// applyFdbResult — the consolidated FDB handler
// ═════════════════════════════════════════════════════════════════════════════
console.log('# applyFdbResult');

function resetState(entry) {
  sandbox.allEntries.length = 0;
  if (entry) sandbox.allEntries.push(entry);
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  for (const k of Object.keys(sandbox.fdbFactors)) delete sandbox.fdbFactors[k];
}

// helper: FDB response shape
const resp = (status, factors=[]) => ({ status, factors });

// 1. FF on an unknown entry → full, source fdb
{
  const e = { n: 10, val: '12345', status: 'unknown', factors: [] };
  resetState(e);
  const r = applyFdbResult(resp('FF', [['3',1],['5',1],['823',1]]), 10, '12345');
  eq(e.status, 'full', 'FF → entry full');
  eq(r.source, 'fdb', 'FF all-from-fdb → source fdb');
  eq(e.factors, ['3','5','823'], 'FF factors set');
}

// 2. CF strips the last (cofactor) factor
{
  const e = { n: 12, val: '999', status: 'unknown', factors: [] };
  resetState(e);
  const r = applyFdbResult(resp('CF', [['3',1],['7',1],['BIGCOMPOSITE',1]]), 12, '999');
  eq(e.status, 'partial', 'CF → partial');
  eq(e.factors, ['3','7'], 'CF drops last factor (cofactor)');
  eq(r.source, 'fdb', 'CF fully covered → fdb');
}

// 3. Our seed factor NOT returned by FDB → source stays import
{
  const e = { n: 14, val: '555', status: 'partial', factors: ['1199714371'] };
  resetState(e);
  // FDB returns only 3 (and a cofactor); it does NOT know about 1199714371
  const r = applyFdbResult(resp('CF', [['3',1],['COFACTOR',1]]), 14, '555');
  ok(e.factors.includes('1199714371'), 'our factor preserved through merge');
  ok(e.factors.includes('3'), 'fdb factor merged in');
  eq(r.source, 'import', 'we hold a factor FDB lacks → source import');
}

// 4. FDB later returns our factor too → flips to fdb
{
  const e = { n: 14, val: '555', status: 'partial', factors: ['1199714371'] };
  resetState(e);
  const r = applyFdbResult(resp('CF', [['3',1],['1199714371',1],['COFACTOR',1]]), 14, '555');
  eq(r.source, 'fdb', 'FDB now has everything → source flips to fdb');
}

// 5. C (composite, no factors) does NOT wipe an entry that has our factors
{
  const e = { n: 16, val: '777', status: 'partial', factors: ['41'] };
  resetState(e);
  applyFdbResult(resp('C', []), 16, '777');
  eq(e.status, 'partial', 'C must not downgrade an entry with known factors');
  ok(e.factors.includes('41'), 'C must not drop our factors');
}

// 6. C on a truly-empty unknown entry → composite
{
  const e = { n: 18, val: '888', status: 'unknown', factors: [] };
  resetState(e);
  applyFdbResult(resp('C', []), 18, '888');
  eq(e.status, 'composite', 'C on empty unknown → composite');
}

// 7. U → fdb-unknown (only from unknown)
{
  const e = { n: 20, val: '111', status: 'unknown', factors: [] };
  resetState(e);
  applyFdbResult(resp('U', []), 20, '111');
  eq(e.status, 'fdb-unknown', 'U → fdb-unknown');
}

// 8. U must NOT downgrade an entry that already has factors
{
  const e = { n: 22, val: '222', status: 'partial', factors: ['7'] };
  resetState(e);
  applyFdbResult(resp('U', []), 22, '222');
  eq(e.status, 'partial', 'U must not downgrade a partial entry');
}

// 9. FF must NOT be downgraded by a later CF
{
  const e = { n: 24, val: '333', status: 'full', factors: ['3','11'] };
  resetState(e);
  applyFdbResult(resp('CF', [['3',1],['COF',1]]), 24, '333');
  eq(e.status, 'full', 'a full entry stays full even if FDB returns CF');
}

// 10. factors deduped (no double-listing on repeat)
{
  const e = { n: 26, val: '444', status: 'partial', factors: ['5'] };
  resetState(e);
  applyFdbResult(resp('CF', [['5',1],['COF',1]]), 26, '444');
  eq(e.factors.filter(f => f === '5').length, 1, 'no duplicate factor after merge');
}

// 11. source compares by VALUE not string — "5^2" (ours) vs 25 (fdb) must match → fdb
{
  const e = { n: 28, val: '555', status: 'partial', factors: ['5^2', '7'] };
  resetState(e);
  // FDB returns 25 and 7 as plain primes + a cofactor
  const r = applyFdbResult(resp('CF', [['25',1],['7',1],['COF',1]]), 28, '555');
  eq(r.source, 'fdb', 'value-equal factors (5^2 vs 25) count as covered → fdb');
}

// 12. genuinely-missing factor keeps import even with matching values elsewhere
{
  const e = { n: 30, val: '666', status: 'partial', factors: ['3', '999999937'] };
  resetState(e);
  const r = applyFdbResult(resp('CF', [['3',1],['COF',1]]), 30, '666');
  eq(r.source, 'import', 'FDB missing our 999999937 → stays import');
}

// ── report ───────────────────────────────────────────────────────────────────
console.log(`\n${'─'.repeat(50)}`);

// Write a machine-readable summary that gets committed alongside the code.
const results = {
  timestamp: new Date().toISOString(),
  passed,
  failed,
  total: passed + failed,
  status: failed === 0 ? 'PASS' : 'FAIL',
  failures, // array of failure descriptions (empty when all green)
};
try {
  fs.writeFileSync(
    path.join(__dirname, 'test-results.json'),
    JSON.stringify(results, null, 2) + '\n'
  );
  console.log('Wrote test-results.json');
} catch (e) {
  console.error('Could not write test-results.json:', e.message);
}

if (failed === 0) {
  console.log(`✓ All ${passed} assertions passed.`);
  process.exit(0);
} else {
  console.log(`✗ ${failed} failed, ${passed} passed.\n`);
  failures.forEach((f, i) => console.log(`  ${i + 1}. ${f}\n`));
  process.exit(1);
}
