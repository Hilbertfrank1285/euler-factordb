group('ecm-log-digit-count-spacing', () => {
  const src = fs.readFileSync('index.html', 'utf8');
  const m = /const reFacA\s*=\s*(\/.*?\/);/.exec(src);
  ok(m, 'the factor-classification pattern was found');
  const re = new RegExp(m[1].slice(1, -1));

  // Both spacings, both classifications.
  for (const [line, kind, factor] of [
    ['Found probable prime factor of  3 digits: 839', 'probable prime', '839'],
    ['Found prime factor of  3 digits: 839', 'prime', '839'],
    ['Found composite factor of  9 digits: 123456789', 'composite', '123456789'],
    ['Found composite factor of 12 digits: 600851475143', 'composite', '600851475143'],
    ['Found probable prime factor of 15 digits: 156937982257', 'probable prime', '156937982257'],
  ]) {
    const r = re.exec(line);
    ok(r, 'matches: ' + line.slice(0, 46));
    if (r) {
      eq(r[1], kind, 'and reads the classification from it');
      eq(r[2], factor, 'and the factor');
    }
  }

  // The single-digit case is the one that regressed, so state it separately: a
  // COMPOSITE under ten digits must not be silently classified as prime.
  const nine = re.exec('Found composite factor of  9 digits: 123456789');
  ok(nine && nine[1] === 'composite',
     'a composite factor of fewer than ten digits is recognised as composite, not '
     + 'left to the fallback that records everything as prime');

  // ── the rest of the log patterns, against real output forms ──────────────
  // GMP-ECM is an EXTERNAL producer, so there is no round trip to lean on: the
  // only check is knowing its format. These are the forms it actually emits,
  // across versions and methods.
  const pat = (name) => {
    const mm = new RegExp('const ' + name + '\\s*=\\s*(/.*?/);').exec(src);
    ok(mm, name + ' was found');
    return mm ? new RegExp(mm[1].slice(1, -1)) : /$^/;
  };
  const reInput = pat('reInput'), reUsing = pat('reUsing'), reRun = pat('reRun'),
        reSigma = pat('reSigma'), reStepTime = pat('reStepTime');

  ok(reInput.test('Input number is 600851475143 (12 digits)'), 'a plain input line');
  ok(reInput.test('Input number is N=600851475143 (12 digits)'), 'the N= form');
  ok(reInput.test('Input number is 7 (1 digit)'), 'and the singular "digit"');

  ok(reUsing.test('Using B1=1000000, polynomial x^1, sigma=1:1234'), 'B1 alone');
  ok(reUsing.test('Using B1=11e6, B2=3.5e10, polynomial x^1, sigma=1:5'),
     'scientific notation in both bounds');
  ok(reUsing.exec('Using B1=250000, B2=-1, polynomial x^1, sigma=1:5')[2] === '-1',
     'and B2=-1, which is what GMP-ECM prints when it picks B2 itself');

  ok(reRun.test('Run 3 out of 430:'), 'the run counter');
  ok(reStepTime.test('Step 1 took 2360ms'), 'step timings');
  ok(reStepTime.test('Step 2 took 1180ms'), 'from either stage');

  // sigma is the ECM curve seed. P-1 and P+1 print x0= instead, and the parser
  // treats the PRESENCE of a sigma as proof the block is ECM whatever the header
  // said — so a pattern that matched x0= would silently relabel P±1 runs as ECM.
  ok(reSigma.test('Using B1=250000, polynomial x^1, sigma=1:1001'), 'a sigma is recognised');
  ok(!reSigma.test('Using B1=1000000, B2=1e9, polynomial x^1, x0=7001'),
     'and P-1/P+1 seeds are NOT — sigma is what identifies a block as ECM');
});

group('import-clamps-bad-exponents', () => {
  if (!needs(sandbox, 'applyFdbResult')) return;
  const V = (71n * 839n * 1471n).toString();     // 839^2 does NOT divide this
  const W = '600851475143';                      // 71 * 839 * 1471 * 6857
  const find = (n) => sandbox.allEntries.find(e => e.n === n);
  const saved = sandbox.allEntries.slice();
  try {
    sandbox.allEntries.length = 0;
    sandbox.allEntries.push({ n: 510, val: V, status: 'unknown', factors: [] });
    sandbox.allEntries.push({ n: 454, val: W, status: 'unknown', factors: [] });

    // Exactly the shape euler.py check writes: [base, exponent] pairs.
    sandbox.applyFdbResult({ status: 'CF', factors: [['71', 1], ['839', 2]], id: null }, 510, V);
    eq(find(510).factors, ['71', '839'],
       'an exponent that does not divide is reduced at import, not stored and repaired later');

    // A correct list is untouched, so the clamp is not just discarding exponents.
    sandbox.applyFdbResult({ status: 'FF',
      factors: [['71', 1], ['839', 1], ['1471', 1], ['6857', 1]], id: null }, 454, W);
    eq(find(454).factors, ['71', '839', '1471', '6857'], 'a correct list survives intact');
    eq(find(454).status, 'full', 'and still resolves the entry');

    // A genuine power is kept as a power — and the case has to be one where the
    // clamp actually FIRES, or the mutation that flattens every exponent never
    // runs and the assertion proves nothing.
    const P = (71n * 71n * 839n).toString();
    sandbox.allEntries.push({ n: 456, val: P, status: 'unknown', factors: [] });
    sandbox.applyFdbResult({ status: 'CF',
      factors: [['71', 2], ['839', 3]], id: null }, 456, P);   // 839^3 must clamp
    ok(find(456).factors.includes('71^2'),
       'a power that DOES divide is kept while another in the same list is reduced — '
       + 'the clamp reduces per factor, it does not flatten the list');
    ok(!find(456).factors.some(f => String(f).startsWith('839^')),
       'and the one that does not divide loses its exponent');
  } finally {
    sandbox.allEntries.length = 0;
    for (const e of saved) sandbox.allEntries.push(e);
  }
});

group('factor-encoding-round-trip', () => {
  if (!needs(sandbox, '_encodeFactor', '_decodeFactor')) return;
  const rt = (f) => sandbox._decodeFactor(sandbox._encodeFactor(f));

  // Ordinary factors, including the forms the app actually stores.
  for (const f of ['2', '71', '5^2', '5^12', '2^1000', '1', '0',
                   '340282366920938463463374607431768211457', '9'.repeat(50)]) {
    eq(rt(f), f, JSON.stringify(f.length > 24 ? f.slice(0, 12) + '…' : f) + ' survives');
  }

  // Past the conversion ceiling it is stored verbatim — still a round trip.
  eq(rt('9'.repeat(2001)), '9'.repeat(2001), 'a value too large to convert is stored as-is');

  // The sentinel itself.
  for (const f of ['~', '~abc', '~zz', '~~x', '~7']) {
    eq(rt(f), f, JSON.stringify(f) + ' is escaped, not decoded as base36');
  }

  // Non-numeric input is untouched.
  for (const f of ['abc', '']) eq(rt(f), f, JSON.stringify(f) + ' passes through');

  // And the compression still happens — an escape that disabled encoding would
  // pass these tests while doubling the size of the store.
  const big = '340282366920938463463374607431768211457';
  ok(sandbox._encodeFactor(big).length < big.length,
     'a long decimal factor is still compressed, not merely round-tripped');
  ok(sandbox._encodeFactor(big)[0] === '~', 'with the base36 marker');
});

group('ecm-pull-is-idempotent', () => {
  if (!needs(M, 'mergeEcmData', 'loadECM', 'saveECM')) return;
  const A = [{ method: 'ECM', b1: '1000000', curves: '50' },
             { method: 'ECM', b1: '11000',   curves: '200' },
             { method: 'P-1', b1: '250000',  curves: '' }];
  const clone = (x) => JSON.parse(JSON.stringify(x));

  // A byte-identical remote.
  {
    sb2.__ls = {};
    M.saveECM({ '500': clone(A) });
    const before = JSON.stringify(M.loadECM());
    const merged = M.mergeEcmData({ '500': clone(A) });
    eq(JSON.stringify(merged), before,
       'pulling an identical remote produces an identical store — no dirty flag, no push');
  }

  // The realistic cross-machine case: the same attempts, different order.
  {
    sb2.__ls = {};
    M.saveECM({ '500': clone(A) });
    const before = JSON.stringify(M.loadECM());
    const shuffled = [A[2], A[0], A[1]].map(clone);
    const merged = M.mergeEcmData({ '500': shuffled });
    eq(JSON.stringify(merged), before,
       'and so does a remote holding the same attempts in a different order');
  }

  // A genuinely new attempt DOES register — the check above must not be satisfied
  // by a merge that ignores the remote entirely.
  {
    sb2.__ls = {};
    M.saveECM({ '500': clone(A) });
    const before = JSON.stringify(M.loadECM());
    const merged = M.mergeEcmData({ '500': clone(A).concat([{ method: 'ECM', b1: '43000000', curves: '10' }]) });
    ok(JSON.stringify(merged) !== before, 'while a new attempt does change the store');
    eq(merged['500'].length, 4, 'and is added');
  }
  sb2.__ls = {};
});

// ── marking a number unknown must not discard what we know ──────────────────
// Five sites wrote `{ status: 'U', timestamp, n }` as a WHOLE record. The factors
// survived — saveFDBCache recovers those from the in-memory index — but `fdbHas`,
// `fdbId` and `source` did not.
//
// `fdbHas` is the expensive one: it is what FactorDB itself reported holding, and
// it is what makes the submission export WITHHOLD those factors. Dropping it means
// the next export offers FactorDB its own factors back, which is the bug §14 exists
// to prevent — re-armed by a mere status update, on entries the app had just
// finished talking to FactorDB about.
// ── the export must not offer FactorDB its own factors ──────────────────────
// Three independent ways to know FactorDB already holds a factor, because the
// first two are absent from most of the live data:
//   1. fdbHas on the cache record — MISSING from all 9,397 records holding factors
//   2. an 'f' provenance entry     — absent for 4,094 of them
//   3. the record's source being 'fdb' — the fallback for records populated wholly
//      from a FactorDB response before either of the above existed
//
// Without the third, the next export offers FactorDB its own factors back on those
// 4,094 entries, which is precisely the §14 bug.
group('export-withholds-factordbs-own', () => {
  if (!needs(M, 'factorsFdbLacks', 'recordDiscovery', 'saveHistory')) return;
  const V = '600851475143';
  const saved = sb2.allEntries.slice();
  try {
    sb2.__ls = {};
    for (const k of Object.keys(sb2.fdbCache)) delete sb2.fdbCache[k];
    M.saveHistory([]);
    const e = { n: 700, val: V, status: 'partial', factors: ['71', '839'] };
    sb2.allEntries.length = 0; sb2.allEntries.push(e);

    // 1. fdbHas present: withheld by the strongest signal.
    sb2.fdbCache[V] = { n: 700, status: 'CF', source: 'fdb', fdbHas: ['71'] };
    eq(M.factorsFdbLacks(e), ['839'], 'a factor named in fdbHas is withheld');

    // 2. fdbHas absent, provenance says FactorDB.
    sb2.fdbCache[V] = { n: 700, status: 'CF', source: 'import' };
    M.saveHistory([]);
    M.recordDiscovery(700, '71', 'f');
    eq(M.factorsFdbLacks(e), ['839'], 'an f-provenance factor is withheld too');

    // 3. Neither: the record came from FactorDB, so its factors did.
    M.saveHistory([]);
    sb2.fdbCache[V] = { n: 700, status: 'CF', source: 'fdb' };
    eq(M.factorsFdbLacks(e), [],
       'with no fdbHas and no provenance, a FactorDB-sourced record withholds '
       + 'everything — it all came from there');

    // …and that fallback must NOT swallow our own discoveries.
    M.saveHistory([]);
    M.recordDiscovery(700, '839', 'e');
    eq(M.factorsFdbLacks(e), ['839'],
       'an ECM find on a FactorDB-sourced record is still submitted — it has its '
       + 'own provenance, so it never reaches the fallback');

    // A record we populated ourselves submits everything with no provenance.
    M.saveHistory([]);
    sb2.fdbCache[V] = { n: 700, status: 'CF', source: 'import' };
    eq(M.factorsFdbLacks(e), ['71', '839'],
       'while a non-FactorDB record offers all of it');
  } finally {
    sb2.allEntries.length = 0;
    for (const x of saved) sb2.allEntries.push(x);
    sb2.__ls = {};
  }
});

// ── and the marks can be cleared ────────────────────────────────────────────
// Without this the 2,650 already written are permanent: the mark excludes an entry
// from checking, so nothing can ever overwrite it.
// ── the false marks clear themselves, once ──────────────────────────────────
// Telling someone to open a console and call a function is not a fix. This runs on
// load beside the other one-time migrations, and is TARGETED: only entries small
// enough that FactorDB should have answered, so a legitimate "too large" refusal is
// left alone.
group('false-fdb-unknown-migration', () => {
  if (!needs(sandbox, 'migrateFalseFdbUnknown', 'loadFdbUnknownSet')) return;
  const saved = sandbox.allEntries.slice();
  try {
    sandbox.__ls = {};
    sandbox.allEntries.length = 0;
    // Small enough to be answerable — the mark cannot have been a refusal.
    sandbox.allEntries.push({ n: 600, val: '9'.repeat(300), status: 'fdb-unknown', factors: [] });
    // Far too large — a refusal here is plausible, so it must survive.
    sandbox.allEntries.push({ n: 602, val: '9'.repeat(90000), status: 'fdb-unknown', factors: [] });
    sandbox.saveFdbUnknownSet(new Set([600, 602]));
    // A MEASURED limit. Without one confirmedQueryDigits falls back to "nothing is
    // known to be out of reach", every entry counts as answerable, and the size
    // filter cannot bite — so the fixture would prove nothing about targeting.
    sandbox.saveQueryLimits({ maxOk: 52000, minFail: 60000 });

    sandbox.migrateFalseFdbUnknown();

    const left = [...sandbox.loadFdbUnknownSet()];
    eq(left, [602], 'the small entry is cleared and the oversized one is left alone');
    eq(sandbox.allEntries[0].status, 'unknown', 'and its status goes back to unknown');
    eq(sandbox.allEntries[1].status, 'fdb-unknown', 'while the oversized one keeps its mark');

    // Once. Re-running must not undo a mark the user has since made deliberately.
    sandbox.saveFdbUnknownSet(new Set([600, 602]));
    sandbox.saveQueryLimits({ maxOk: 52000, minFail: 60000 });
    sandbox.allEntries[0].status = 'fdb-unknown';
    sandbox.migrateFalseFdbUnknown();
    eq([...sandbox.loadFdbUnknownSet()].sort(), [600, 602],
       'a second run does nothing — the flag makes it one-time, so a mark set by '
       + 'hand afterwards is not silently undone');
  } finally {
    sandbox.allEntries.length = 0;
    for (const e of saved) sandbox.allEntries.push(e);
    sandbox.__ls = {};
  }
});

group('merge-converges', () => {
  if (!needs(M, 'mergeFactorRecords')) return;
  const V = '600851475143';
  const stable = (x) => Array.isArray(x) ? x.map(stable)
    : (x && typeof x === 'object'
        ? Object.keys(x).sort().reduce((o, k) => { o[k] = stable(x[k]); return o; }, {}) : x);

  let pairs = 0, divergent = 0, example = null;
  for (const s1 of ['fdb', 'import', 'manual']) for (const s2 of ['fdb', 'import', 'manual'])
  for (const id1 of ['A', 'B']) for (const id2 of ['A', 'B'])
  for (const h1 of [['71'], []]) for (const h2 of [['71'], []])
  for (const t1 of [100, 200]) for (const t2 of [100, 200])
  for (const f1 of [['71'], ['839']]) for (const f2 of [['71'], ['839']]) {
    const A = { n: 500, timestamp: t1, source: s1, status: 'CF', factors: f1, fdbHas: h1, fdbIdExact: id1 };
    const B = { n: 500, timestamp: t2, source: s2, status: 'CF', factors: f2, fdbHas: h2, fdbIdExact: id2 };
    pairs++;
    const ab = JSON.stringify(stable(M.mergeFactorRecords(A, B, V)));
    const ba = JSON.stringify(stable(M.mergeFactorRecords(B, A, V)));
    if (ab !== ba && !example) example = JSON.stringify({ A, B, ab, ba });
    if (ab !== ba) divergent++;
  }
  ok(pairs > 2000, 'the sweep covers every combination (' + pairs + ' pairs)');

  // ── and through the SYNC PAYLOAD, not just the record merge ──────────────
  // The record merge converging is not enough. A record that has been through the
  // slim encode/decode round trip has its keys in a different ORDER from one built
  // in memory, and a tie-break that compared plain JSON.stringify therefore
  // compared different strings on the two machines and picked different winners.
  // It converged when called directly and diverged through the payload — which is
  // the path that actually runs.
  {
    const stableJSON = (x) => JSON.stringify(stable(x));
    const RA = { n: 500, status: 'CF', timestamp: 100, source: 'fdb',    factors: ['71'],  fdbHas: ['71'], fdbIdExact: 'A' };
    const RB = { n: 500, status: 'CF', timestamp: 100, source: 'manual', factors: ['839'], fdbHas: [],     fdbIdExact: 'B' };
    const load = (rec) => {
      sb2.__ls = {};
      for (const k of Object.keys(sb2.fdbCache)) delete sb2.fdbCache[k];
      sb2.eulerValues[500] = V;
      M.saveFDBCache({ [V]: rec }); M.flushFDBCache();
      for (const [k, v] of Object.entries(M.loadFDBCache())) sb2.fdbCache[k] = v;
    };
    load(RA); const pA = JSON.parse(JSON.stringify(M.buildSyncPayload()));
    load(RB); const pB = JSON.parse(JSON.stringify(M.buildSyncPayload()));
    load(RA); M.mergeSyncPayload(pB); const ab = stableJSON(M.loadFDBCache()[V]);
    load(RB); M.mergeSyncPayload(pA); const ba = stableJSON(M.loadFDBCache()[V]);
    eq(ab, ba, 'a full push/pull in either direction reaches the same record');
    // …and matches what the record merge alone produces, so the two paths agree.
    eq(ab, stableJSON(M.mergeFactorRecords(RA, RB, V)),
       'and it agrees with merging the records directly');
    sb2.__ls = {};
  }
  eq(divergent, 0, 'A<-B and B<-A reach the same record, ties included' +
     (example ? ' — first divergence: ' + example.slice(0, 220) : ''));

  // And idempotence: re-merging the same remote changes nothing.
  {
    const A = { n: 500, timestamp: 100, source: 'fdb', status: 'CF', factors: ['71'], fdbIdExact: 'A' };
    const B = { n: 500, timestamp: 100, source: 'manual', status: 'CF', factors: ['839'], fdbIdExact: 'B' };
    const once = M.mergeFactorRecords(A, B, V);
    const twice = M.mergeFactorRecords(once, B, V);
    eq(JSON.stringify(stable(twice)), JSON.stringify(stable(once)),
       'merging the same remote twice is a no-op');

    // The timestamp must be the MAX of the two, not the winner's. Taking the
    // winner's means a re-pull of an older remote can lower it, which flips the
    // next merge's winner and starts the two machines oscillating.
    const older = { n: 500, timestamp: 50, source: 'manual', status: 'CF', factors: ['839'] };
    const newer = { n: 500, timestamp: 900, source: 'fdb', status: 'CF', factors: ['71'] };
    eq(M.mergeFactorRecords(newer, older, V).timestamp, 900,
       'merging an OLDER remote keeps the later timestamp');
    eq(M.mergeFactorRecords(older, newer, V).timestamp, 900, 'from either side');
    // …and re-merging the old one does not walk it back.
    const step1 = M.mergeFactorRecords(newer, older, V);
    eq(M.mergeFactorRecords(step1, older, V).timestamp, 900,
       'and a repeat pull of the old remote cannot lower it');
  }
});

groupAsync('no-stub-leaks', async () => {
  // SANDBOX 2, against the exported reference.
  if (M) {
    const leaked = [];
    for (const [name, real] of Object.entries(M)) {
      if (typeof real !== 'function') continue;
      if (sb2[name] && sb2[name] !== real) leaked.push(name);
    }
    eq(leaked, [], 'every group restored the sandbox-2 functions it stubbed');
  } else { passed++; }

  // SANDBOX 1, against the snapshot taken at build time.
  //
  // This half was missing, and sandbox 1 is where the stubs that matter live. A
  // leak here does not fail where it happened — it fails in whatever group runs
  // next and depends on the real function, which is a long walk back to the cause.
  {
    const leaked = [];
    for (const [name, real] of SANDBOX1_SNAPSHOT) {
      if (sandbox[name] !== real) leaked.push(name);
    }
    eq(leaked, [], 'every group restored the sandbox-1 functions it stubbed');
  }
});

// ── report ───────────────────────────────────────────────────────────────────
// Async groups must settle before anything is counted, or their failures would be
// reported after the summary had already been printed (or missed entirely).
await Promise.all(asyncGroups);
console.log(`\n${'─'.repeat(50)}`);

// ── the suite must not quietly get smaller ──────────────────────────────────
// A green run says nothing about how much ran. Dropping one function from the
// sandbox export list removed ten assertions and still reported "All passed",
// because the only evidence was a number nobody was watching.
//
// A FLOOR, not an exact count: adding tests should never require editing this, and
// it only needs raising when the slack has been used up. It catches the case that
// matters — a chunk of the suite silently ceasing to exist.
const ASSERTION_FLOOR = 1090;
if (passed + failed < ASSERTION_FLOOR) {
  failed++;
  failures.push('SUITE SHRANK: ' + (passed + failed) + ' assertions ran, floor is '
    + ASSERTION_FLOOR + '. Something stopped being tested — most likely a function '
    + 'missing from a sandbox export list, which makes its group skip silently.');
}

// Write a machine-readable summary that gets committed alongside the code.
const results = {
  timestamp: new Date().toISOString(),
  passed,
  failed,
  total: passed + failed,
  status: failed === 0 ? 'PASS' : 'FAIL',
  failures, // array of failure descriptions (empty when all green)
};
try {
  fs.writeFileSync(
    path.join(__dirname, 'test-results.json'),
    JSON.stringify(results, null, 2) + '\n'
  );
  console.log('Wrote test-results.json');
} catch (e) {
  console.error('Could not write test-results.json:', e.message);
}

if (failed === 0) {
  console.log(`✓ All ${passed} assertions passed.`);
  process.exit(0);
} else {
  console.log(`✗ ${failed} failed, ${passed} passed.\n`);
  failures.forEach((f, i) => console.log(`  ${i + 1}. ${f}\n`));
  process.exit(1);
}
})();
