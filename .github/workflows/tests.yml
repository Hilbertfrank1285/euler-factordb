  const app = new Function('localStorage', 'document', 'logSwallowed',
    "const FF_SEEN_KEY = 'ff'; let _appReady = false; let _ffPending = null; let allEntries = [];"
    + ['newlyFullyFactored', 'loadFfSeen', 'saveFfSeen', 'announceNewlyFullyFactored', 'showFullyFactoredBanner', 'dismissFullyFactored'].map(grab).join('\n')
    + 'return { set(e) { allEntries = e; }, ready() { _appReady = true; }, check: announceNewlyFullyFactored, ok: dismissFullyFactored };')(
