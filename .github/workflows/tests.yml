// ═════════════════════════════════════════════════════════════════════════════
// applyFdbResult — the consolidated FDB handler
// ═════════════════════════════════════════════════════════════════════════════
console.log('# applyFdbResult');

function resetState(entry) {
  sandbox.allEntries.length = 0;
  if (entry) sandbox.allEntries.push(entry);
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  for (const k of Object.keys(sandbox.fdbFactors)) delete sandbox.fdbFactors[k];
}

// helper: FDB response shape
const resp = (status, factors=[]) => ({ status, factors });

// helper mirroring the in-app prime-power parser, for assertions
function parsePowTest(f) {
  const s = String(f);
  const m = /^(\d+)\^(\d+)$/.exec(s);
  return m ? { base: m[1], exp: parseInt(m[2]) } : { base: s, exp: 1 };
}

// 1. FF on an unknown entry → full, source fdb
{
  const e = { n: 10, val: '12345', status: 'unknown', factors: [] };
  resetState(e);
  const r = applyFdbResult(resp('FF', [['3',1],['5',1],['823',1]]), 10, '12345');
  eq(e.status, 'full', 'FF → entry full');
  eq(r.source, 'fdb', 'FF all-from-fdb → source fdb');
  eq(e.factors, ['3','5','823'], 'FF factors set');
}

// ── FactorDB ids must be EXACT ─────────────────────────────────────────────────
// A FactorDB id is ~19 digits, past the ~16 a JavaScript number holds exactly. Read
// from JSON as a number it was silently ROUNDED to a different id, and the value
// box's "open on FactorDB" link opened some other number. Ids are now accepted only
// as text or as numbers small enough to be exact, under a new field name.
{
  const ID = '1100000008856768812';
  // exactly the line euler.py now writes, parsed exactly as the app parses it
  const fromFile = JSON.parse('{"status":"CF","factors":[["3",1],["5",1]],"id":"' + ID + '"}');
  const e = { n: 16, val: '1234567', status: 'unknown', factors: [] };
  resetState(e);
  applyFdbResult(fromFile, 16, '1234567');
  eq(sandbox.fdbCache['1234567'].fdbIdExact, ID, 'a 19-digit id written as text arrives with every digit intact');

  // The same id as a bare JSON NUMBER — what the old euler.py wrote — must not be
  // stored at all: by the time it is a number, it is already the wrong id.
  const asNumber = JSON.parse('{"status":"CF","factors":[["3",1],["5",1]],"id":' + ID + '}');
  ok(String(asNumber.id) !== ID, '(the rounding is real: read as a number, it is a different id)');
  const e2 = { n: 18, val: '7654321', status: 'unknown', factors: [] };
  resetState(e2);
  applyFdbResult(asNumber, 18, '7654321');
  ok(!('fdbIdExact' in sandbox.fdbCache['7654321']), 'an id that arrived as an unsafe number is refused, not stored rounded');

  // A small id is exact as a number, and is kept.
  const e3 = { n: 20, val: '1111111', status: 'unknown', factors: [] };
  resetState(e3);
  applyFdbResult({ status: 'CF', factors: [['3', 1]], id: 9912 }, 20, '1111111');
  eq(sandbox.fdbCache['1111111'].fdbIdExact, '9912', 'a small id, exact even as a number, is kept (as text)');
}

// 2. CF strips the last (cofactor) factor
{
  // 3 * 7 * <25-digit composite>. Over 19 digits, so it is treated as the
  // unfactored cofactor — exactly how a real one behaves.
  const CF_COF = '1000000000000000000000009';
  const e = { n: 12, val: String(3n * 7n * BigInt(CF_COF)), status: 'unknown', factors: [] };
  resetState(e);
  const r = applyFdbResult(resp('CF', [['3',1],['7',1],[CF_COF,1]]), 12, e.val);
  eq(e.status, 'partial', 'CF → partial');
  eq(e.factors, ['3','7'], 'CF drops last factor (cofactor)');
  eq(r.source, 'fdb', 'CF fully covered → fdb');
}

// 3. Our seed factor NOT returned by FDB → source stays import
{
  // 3 * 1199714371 * 1000003 — every listed factor genuinely divides it
  const V14 = String(3n * 1199714371n * 1000000000000000000000009n);
  const e = { n: 14, val: V14, status: 'partial', factors: ['1199714371'] };
  resetState(e);
  // FDB returns only 3 (and a cofactor); it does NOT know about 1199714371
  const r = applyFdbResult(resp('CF', [['3',1],['1000000000000000000000009',1]]), 14, V14);
  ok(e.factors.includes('1199714371'), 'our factor preserved through merge');
  ok(e.factors.includes('3'), 'fdb factor merged in');
  eq(r.source, 'import', 'we hold a factor FDB lacks → source import');
}

// 4. FDB later returns our factor too → flips to fdb
{
  const V14b = String(3n * 1199714371n * 1000000000000000000000009n);
  const e = { n: 14, val: V14b, status: 'partial', factors: ['1199714371'] };
  resetState(e);
  const r = applyFdbResult(resp('CF', [['3',1],['1199714371',1],['1000000000000000000000009',1]]), 14, V14b);
  eq(r.source, 'fdb', 'FDB now has everything → source flips to fdb');
}

// 5. C (composite, no factors) does NOT wipe an entry that has our factors
{
  const e = { n: 16, val: String(41 * 19), status: 'partial', factors: ['41'] };
  resetState(e);
  applyFdbResult(resp('C', []), 16, '777');
  eq(e.status, 'partial', 'C must not downgrade an entry with known factors');
  ok(e.factors.includes('41'), 'C must not drop our factors');
}

// 6. C on a truly-empty unknown entry → composite
{
  const e = { n: 18, val: '888', status: 'unknown', factors: [] };
  resetState(e);
  applyFdbResult(resp('C', []), 18, '888');
  eq(e.status, 'composite', 'C on empty unknown → composite');
}

// 7. U → fdb-unknown (only from unknown)
{
  const e = { n: 20, val: '111', status: 'unknown', factors: [] };
  resetState(e);
  applyFdbResult(resp('U', []), 20, '111');
  eq(e.status, 'fdb-unknown', 'U → fdb-unknown');
}

// 8. U must NOT downgrade an entry that already has factors
{
  const V22 = String(7n * 1000000000000000000000009n);
  const e = { n: 22, val: V22, status: 'partial', factors: ['7'] };
  resetState(e);
  applyFdbResult(resp('U', []), 22, V22);
  eq(e.status, 'partial', 'U must not downgrade a partial entry');
}

// 9. FF must NOT be downgraded by a later CF
{
  const V24 = String(3n * 11n);
  const e = { n: 24, val: V24, status: 'full', factors: ['3','11'] };
  resetState(e);
  applyFdbResult(resp('CF', [['3',1],['1000000000000000000000009',1]]), 24, V24);
  eq(e.status, 'full', 'a full entry stays full even if FDB returns CF');
}

// 10. factors deduped (no double-listing on repeat)
{
  const V26 = String(5n * 1000000000000000000000009n);
  const e = { n: 26, val: V26, status: 'partial', factors: ['5'] };
  resetState(e);
  applyFdbResult(resp('CF', [['5',1],['1000000000000000000000009',1]]), 26, V26);
  eq(e.factors.filter(f => f === '5').length, 1, 'no duplicate factor after merge');
}

// 11. source compares by base+exponent — our "5^2" vs FDB ["5",2] must match → fdb
{
  // 5^2 * 7 * <25-digit composite cofactor> — every factor genuinely divides it
  const V28 = String(25n * 7n * 1000000000000000000000009n);
  const e = { n: 28, val: V28, status: 'partial', factors: ['5^2', '7'] };
  resetState(e);
  // FDB returns 5^2 (as [base,exp]) and 7 + a cofactor
  const r = applyFdbResult(resp('CF', [['5',2],['7',1],['1000000000000000000000009',1]]), 28, V28);
  eq(r.source, 'fdb', 'matching prime powers (5^2) count as covered → fdb');
}

// 12. genuinely-missing factor keeps import even with matching values elsewhere
{
  const V30 = String(3n * 999999937n * 1000000000000000000000009n);
  const e = { n: 30, val: V30, status: 'partial', factors: ['3', '999999937'] };
  resetState(e);
  const r = applyFdbResult(resp('CF', [['3',1],['1000000000000000000000009',1]]), 30, V30);
  eq(r.source, 'import', 'FDB missing our 999999937 → stays import');
}

// 13. prime-power collapse: our "5" + FDB "5^2" → keep 5^2, source fdb
{
  // 5^2 * 53 * 1000003 — so both 5^2 and 53 genuinely divide the value
  const V32 = String(25n * 53n * 1000000000000000000000009n);
  const e = { n: 32, val: V32, status: 'partial', factors: ['5', '53'] };
  resetState(e);
  // FDB returns 5^2 and 53 (+ cofactor). Our "5" is the same prime at lower power.
  const r = applyFdbResult(resp('CF', [['5',2],['53',1],['1000000000000000000000009',1]]), 32, V32);
  ok(e.factors.includes('5^2'), 'collapsed to 5^2');
  ok(!e.factors.includes('5'),  'plain 5 dropped in favour of 5^2');
  eq(e.factors.filter(f => parsePowTest(f).base === '5').length, 1, 'only one power of 5');
  eq(r.source, 'fdb', 'our 5 is covered by FDB 5^2 → source fdb');
}

// 14. our higher power than FDB → stays import (we know more)
{
  // 7^3 * <25-digit composite cofactor> — so our 7^3 genuinely divides the value
  const V34 = String(343n * 1000000000000000000000009n);
  const e = { n: 34, val: V34, status: 'partial', factors: ['7^3'] };
  resetState(e);
  const r = applyFdbResult(resp('CF', [['7',1],['1000000000000000000000009',1]]), 34, V34);
  ok(e.factors.includes('7^3'), 'keep our higher power 7^3');
  eq(r.source, 'import', 'FDB only has 7^1 < our 7^3 → import');
}

// 15. CF where the LAST factor is PRIME (not a cofactor) must NOT be stripped
{
  const e = { n: 36, val: '600x', status: 'partial', factors: ['5','3085637175635107'] };
  resetState(e);
  // FDB returns 5 and the 16-digit PRIME as the last element — no separate cofactor
  const r = applyFdbResult(resp('CF', [['5',1],['3085637175635107',1]]), 36, '600x');
  ok(e.factors.includes('3085637175635107'), 'prime last factor kept, not stripped');
  eq(r.source, 'fdb', 'FDB covers everything (last factor was prime) → fdb');
}

// 16. CF where the last factor is a genuine large composite cofactor → stripped
{
  const e = { n: 38, val: '999x', status: 'unknown', factors: [] };
  resetState(e);
  // last element is 30-digit composite (even → obviously composite)
  const r = applyFdbResult(resp('CF', [['7',1],['100000000000000000000000000000',1]]), 38, '999x');
  ok(!e.factors.includes('100000000000000000000000000000'), 'large composite cofactor stripped');
  eq(e.factors, ['7'], 'only the prime kept');
}

// ═════════════════════════════════════════════════════════════════════════════
// ECM expected-curve model — must match GMP-ECM's published reference table
// ═════════════════════════════════════════════════════════════════════════════
console.log('# ECM model (GMP-ECM table)');
// Reference: github.com/sethtroisi/gmp-ecm README, expected curves (default poly)
const ECM_REF = { 20:74, 25:214, 30:430, 35:904, 40:2350, 45:4480, 50:7553, 55:17769, 60:42017, 65:69408 };
for (const [d, expected] of Object.entries(ECM_REF)) {
  const got = ecmOptimalCurves(Number(d));
  ok(Math.abs(got - expected) <= 1, `ecmOptimalCurves(${d}) ≈ ${expected} (got ${Math.round(got)})`);
}
// curvesForProb at 63.2% (=1-1/e) should reproduce the expected-curves table
eq(curvesForProb(50, 1 - 1/Math.E), ECM_REF[50], 'curvesForProb(50, 63%) = table value 7553');
eq(curvesForProb(30, 1 - 1/Math.E), ECM_REF[30], 'curvesForProb(30, 63%) = table value 430');
// probability semantics: at expected curves → ~63%, at 2.3x → ~90%
{
  const p63 = ecmProbability(40, ECM_REF[40]);
  ok(Math.abs(p63 - 0.632) < 0.01, '40d at expected curves → ~63%');
  const p90 = ecmProbability(40, Math.round(ECM_REF[40] * 2.302585));
  ok(Math.abs(p90 - 0.90) < 0.01, '40d at 2.3x expected curves → ~90%');
}
// more curves → higher probability (monotonic)
ok(ecmProbability(45, 1000) < ecmProbability(45, 5000), 'probability increases with curves');
// optimal B1 matches table within 1%
ok(Math.abs(optimalB1(40) - 3e6) / 3e6 < 0.01, 'optimalB1(40) ≈ 3e6');
ok(Math.abs(optimalB1(50) - 43e6) / 43e6 < 0.01, 'optimalB1(50) ≈ 43e6');

// ═════════════════════════════════════════════════════════════════════════════
// Dickman rho + P-1/P+1 smoothness probability
// ═════════════════════════════════════════════════════════════════════════════
console.log('# Dickman rho + P-1/P+1');
// Reference Dickman values from the literature
const RHO_REF = { 1:1.0, 2:0.3069, 3:0.04861, 4:0.004911, 5:0.0003545, 6:0.0000196 };
for (const [u, expected] of Object.entries(RHO_REF)) {
  const got = dickmanRho(Number(u));
  const ratio = got / expected;
  ok(ratio > 0.95 && ratio < 1.05, `dickmanRho(${u}) ≈ ${expected} (got ${got.toExponential(2)}, ${ratio.toFixed(2)}x)`);
}
// rho is monotonically decreasing
ok(dickmanRho(2) > dickmanRho(3), 'rho decreasing: rho(2) > rho(3)');
ok(dickmanRho(4) > dickmanRho(6), 'rho decreasing: rho(4) > rho(6)');
// rho(u)=1 for u<=1
eq(dickmanRho(0.5), 1, 'rho(0.5) = 1');

// P-1: stage 2 increases probability over stage 1 alone
ok(pm1Probability(25, 1e6, 1e8) > pm1Probability(25, 1e6, 0), 'P-1 stage 2 helps');
// P-1: monotonic in B1
ok(pm1Probability(30, 1e7, 0) > pm1Probability(30, 1e5, 0), 'P-1 increases with B1');
// P+1 is exactly half of P-1 (same B1/B2)
{
  const pm = pm1Probability(25, 1e6, 1e8, 'P-1');
  const pp = pm1Probability(25, 1e6, 1e8, 'P+1');
  ok(Math.abs(pp / pm - 0.5) < 1e-9, 'P+1 = 0.5 × P-1');
}
// probability never exceeds 1
ok(pm1Probability(10, 1e12, 1e15) <= 1, 'P-1 probability capped at 1');
// Wikipedia anchor: B1=2^32 finds ~1/4 of 64-bit factors (stage 1)
{
  const p = pm1Probability(19.3, 4.29e9, 0);
  ok(p > 0.18 && p < 0.40, '64-bit factor at B1=2^32 ≈ 25% (got ' + (p*100).toFixed(0) + '%)');
}

// bestPm1Prob: duplicate P-1 runs must NOT compound (deterministic method)
{
  const one  = bestPm1Prob(30, [{method:'P-1', b1:'1e7', b2:'1e10'}]);
  const three = bestPm1Prob(30, [
    {method:'P-1', b1:'1e7', b2:'1e10'},
    {method:'P-1', b1:'1e7', b2:'1e10'},
    {method:'P-1', b1:'1e7', b2:'1e10'},
  ]);
  ok(Math.abs(one - three) < 1e-9, 'duplicate P-1 runs do not compound (best, not product)');
}
// bestPm1Prob: larger B1 run subsumes smaller (takes the max)
{
  const mixed = bestPm1Prob(30, [{method:'P-1', b1:'1e6', b2:0}, {method:'P-1', b1:'1e8', b2:0}]);
  const big   = bestPm1Prob(30, [{method:'P-1', b1:'1e8', b2:0}]);
  ok(Math.abs(mixed - big) < 1e-9, 'best P-1 attempt wins (1e8 subsumes 1e6)');
}
// bestPm1Prob: P-1 and P+1 ARE combined (different events)
{
  const m = bestPm1Prob(25, [{method:'P-1', b1:'1e7', b2:'1e10'}]);
  const p = bestPm1Prob(25, [{method:'P+1', b1:'1e7', b2:'1e10'}]);
  const both = bestPm1Prob(25, [
    {method:'P-1', b1:'1e7', b2:'1e10'},
    {method:'P+1', b1:'1e7', b2:'1e10'},
  ]);
  const expected = 1 - (1 - m) * (1 - p);
  ok(Math.abs(both - expected) < 1e-9, 'P-1 and P+1 combine independently');
  ok(both > m && both > p, 'combining P-1+P+1 beats either alone');
}

// ecmProbForDigit: a low-B1 run cannot find a large factor (B1 efficiency)
{
  // 214 curves at B1=50000 (optimal for 25d) — should be ~63% at 25d, ~0 at 65d
  const at25 = ecmProbForDigit(25, [{method:'ECM', b1:'50000', curves:'214'}]);
  const at65 = ecmProbForDigit(65, [{method:'ECM', b1:'50000', curves:'214'}]);
  ok(at25 > 0.55 && at25 < 0.70, 'low-B1 run ~63% at its target digit (got ' + (at25*100).toFixed(0) + '%)');
  ok(at65 < 0.001, 'low-B1 run ~0% at 65d (B1 too small) — got ' + (at65*100).toFixed(3) + '%');
}
// ecmProbForDigit: combines multiple ECM attempts as 1−∏(1−p) (independent trials)
{
  const attempts = [{method:'ECM', b1:'50000', curves:'214'}, {method:'ECM', b1:'1e6', curves:'500'}];
  const combined = ecmProbForDigit(30, attempts);
  const a1 = ecmProbForDigit(30, [attempts[0]]);
  const a2 = ecmProbForDigit(30, [attempts[1]]);
  const expected = 1 - (1 - a1) * (1 - a2);
  ok(Math.abs(combined - expected) < 1e-9, 'ECM attempts combine as 1−∏(1−p)');
  ok(combined >= a1 && combined >= a2, 'combining ECM runs never decreases probability');
}


