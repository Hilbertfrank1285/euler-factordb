#!/usr/bin/env node
/*
 * Test suite for index.html's core logic.
 *
 * Run from the same folder as index.html:
 *     node tests.js
 *
 * It extracts the pure functions straight out of index.html (so the tests can
 * never drift from the deployed code), wires up minimal fakes for the browser
 * globals that applyFdbResult touches, and asserts behaviour.
 *
 * Exit code is non-zero if any test fails — handy for CI / pre-push hooks.
 */

const fs = require('fs');
const path = require('path');

// ── tiny test harness ────────────────────────────────────────────────────────
let passed = 0, failed = 0;
const failures = [];
function eq(actual, expected, msg) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a === e) { passed++; }
  else { failed++; failures.push(`${msg}\n    expected ${e}\n    got      ${a}`); }
}
function ok(cond, msg) {
  if (cond) { passed++; } else { failed++; failures.push(msg); }
}
function throws(fn, msg) {
  try { fn(); failed++; failures.push(msg + ' (expected throw, none thrown)'); }
  catch { passed++; }
}

// ── pull the source out of index.html ────────────────────────────────────────
const html = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
const scriptMatch = html.match(/<script>([\s\S]*)<\/script>/);
if (!scriptMatch) { console.error('Could not find <script> block in index.html'); process.exit(2); }
const src = scriptMatch[1];

// Pull a top-level `const NAME = <literal>;` straight out of index.html.
// Hardcoding these in the harness meant the tests could silently disagree with the
// source: a mutation that changed a threshold in index.html left the sandbox on the
// old value, so assertions about it passed no matter what the app actually did.
function extractConst(name) {
  const m = new RegExp('^const\\s+' + name + '\\s*=\\s*([^;]+);', 'm').exec(src);
  if (!m) throw new Error('Constant ' + name + ' not found in index.html');
  return 'const ' + name + ' = ' + m[1].trim() + ';';
}

// Same idea for module-scope `let`. Declaring these in the harness instead meant a
// variable could be DELETED from index.html and every test still passed, because the
// sandbox supplied its own — which is exactly how an undeclared _sessionMaxOkDigits
// shipped and only showed up as a live ReferenceError.
function extractLet(name) {
  const m = new RegExp('^let\\s+' + name + '\\s*=\\s*([^;]+);', 'm').exec(src);
  if (!m) throw new Error('Variable ' + name + ' not found in index.html (is it declared?)');
  return 'let ' + name + ' = ' + m[1].trim() + ';';
}

// Grab a single top-level function definition by name (brace-matched).
// NOTE: the async form is checked FIRST and deliberately. `function foo(` is a
// substring of `async function foo(`, so checking the plain form first would
// match at the inner offset and silently drop the `async` keyword — producing a
// function whose `await`s are syntax errors. That failure mode cost real time
// while building ad-hoc harnesses, so the ordering here matters.
function extractFn(name) {
  for (const prefix of [`async function ${name}(`, `function ${name}(`]) {
    const idx = src.indexOf(prefix);
    if (idx === -1) continue;
    const brace = src.indexOf('{', idx);
    let depth = 0;
    for (let i = brace; i < src.length; i++) {
      if (src[i] === '{') depth++;
      else if (src[i] === '}') { depth--; if (depth === 0) return src.slice(idx, i + 1); }
    }
  }
  throw new Error(`Function ${name} not found in index.html`);
}

// ═════════════════════════════════════════════════════════════════════════════
// SOURCE GUARDS — catch "changed the logic, missed a caller"
// ═════════════════════════════════════════════════════════════════════════════
// A shipped bug that these would have caught: the query size cap was made
// dynamic (currentQueryCap()), but the entry modal kept testing against the old
// fixed QUERY_MAX_DIGITS. The engine would happily query a 73,415-digit number
// while the UI still refused to offer the button — invisible to every existing
// test, because they all test data-layer functions and none read the rendered UI.
//
// These checks are cheap, need no sandbox, and fail loudly the moment a stale
// reference reappears anywhere in the file.
{
  // Strip comments so prose mentioning a name doesn't count as a use.
  const code = src
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .replace(/^[ \t]*\/\/.*$/gm, '');

  const usesOf = (name) => {
    const re = new RegExp('\\b' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g');
    return (code.match(re) || []).length;
  };

  // QUERY_MAX_DIGITS is a legacy alias. Exactly one occurrence — its own
  // definition — is correct; anything more means a caller is using the fixed
  // value where it should be asking currentQueryCap().
  eq(usesOf('QUERY_MAX_DIGITS'), 1,
     'QUERY_MAX_DIGITS appears only in its own definition (all live checks use currentQueryCap)');

  // The modal's FactorDB section is the SAME for every size now. It used to switch
  // on the cap and tell large entries they were "too long for the browser to ask
  // about" — which, once the browser check was removed, implied a smaller number
  // could still be checked here. None can.
  ok(!/too long for the browser to ask/.test(src),
     'the modal no longer says the browser can ask about smaller numbers');
  ok(!/e\.val\.length > currentQueryCap\(\) \? `/.test(code),
     'and the FactorDB section no longer branches on number size');

  // The modal's error fallback went with modalCheckFull — there is no in-app query
  // left to fail. The section gate above remains, since the modal still decides
  // whether to SHOW the FactorDB section at all.

  // Cost of an ALREADY-RUN attempt must go through attemptCpuSeconds (which
  // prefers the real measured ms); only future/hypothetical runs may call the
  // model directly. A call passing `a.method` is by definition a recorded
  // attempt — and exactly ONE such call is correct: the fallback inside
  // attemptCpuSeconds itself, for runs with no measured time. More than one
  // means a caller is bypassing the measured value.
  eq((code.match(/estimateCpuSeconds\(a\.method/g) || []).length, 1,
     'only attemptCpuSeconds prices a recorded attempt from the model (its own fallback)');
  ok(/function attemptCpuSeconds[\s\S]{0,400}estimateCpuSeconds\(a\.method/.test(code),
     'that single model call is the fallback inside attemptCpuSeconds');

  // The big stores must not be read straight out of localStorage — they live in
  // IndexedDB now and kvGet is the only correct accessor.
  for (const k of ['STORAGE_KEY', 'ECM_KEY', 'COFDIG_KEY', 'CHANGELOG_KEY', 'CALIB_KEY', 'HISTORY_KEY']) {
    ok(!new RegExp('localStorage\\.(get|set)Item\\(' + k).test(code),
       k + ' is accessed through the kv layer, not localStorage directly');
  }

  // Extending an existing ECM attempt must stamp lastRun. This lives inside the
  // import merge branch, which is impractical to exercise directly without stubbing
  // most of the parser — but the assignment either exists or it does not, and its
  // absence is exactly the bug that made the yield table's "since tracking began"
  // effort columns sit empty while finds populated normally.
  ok(/existing\.lastRun\s*=/.test(code),
     'the import merge branch stamps lastRun when an attempt gains new work');
  ok(/if \(a\.lastRun\) out\.lastRun = a\.lastRun;/.test(code),
     'saveECM persists lastRun (a whitelist, so new fields must be added explicitly)');

  // The submission export must record what it sent, or the "check submitted"
  // button has nothing to work with. Exercising exportFDBSubmission directly would
  // mean stubbing the whole download path, and the assignment either exists or does
  // not — its absence silently breaks the entire verify loop.
  ok(/exportedNs\.push\(e\.n\)/.test(code),
     'the submission export records which entries went out');
  ok(/markSubmitted\(exportedNs\)/.test(code),
     'and hands them to the pending-submission list');

  // The submission export must verify factors against E(n) before writing a line.
  // These go to a public database, so a wrong line is worse than a missing one.
  ok(/valBig % pw !== 0n/.test(code),
     'the submission export verifies each factor power divides E(n) before writing it');
  ok(/skippedBadFactors\+\+/.test(code),
     'and skips (rather than emits) any entry that fails that check');

  // The weighting rule sits inline in exportNextRuns (which downloads files), so
  // these guard the parts a behavioural test cannot reach.
  ok(/\(r\.fdbUnknown \? FDB_WEIGHT : 1\)/.test(code),
     'the export ranking applies the FactorDB-unknown weight');
  ok(/if \(FDB_WEIGHT === 0\) ranked = runs\.filter\(r => !r\.fdbUnknown\)/.test(code),
     'and a weight of 0 excludes those runs rather than ranking them last');
  // The weight must never be written INTO the reported gain — inflating the stored
  // odds would corrupt the CPU-per-find statistics, the summary totals and the
  // timing calibration, all to express a preference that belongs only in the
  // ordering. Checks for ASSIGNMENT specifically: the ranking function legitimately
  // combines gain and weight in one expression, and an earlier version of this guard
  // flagged that as a violation.
  ok(!/\.gain\s*=[^=]/.test(code),
     'the reported gain is never reassigned (the weight affects ranking only)');
  ok(!/gain:\s*[^,\n]*FDB_WEIGHT/.test(code),
     'and the weight is never baked into a stored gain value');

  // The rule that decides what the browser can reach used to sit inline in
  // exportFDBCheckList, with a second copy in the export-threshold group below —
  // so it existed three times and no test executed the real one. It is now
  // confirmedQueryDigits(), which the group DOES execute. What is left to guard
  // statically is that its callers still call it rather than reverting to the
  // attempt cap, which is the mistake that reported "nothing to export" to
  // someone holding numbers that had just failed.
  ok(/function confirmedQueryDigits\(\)/.test(code),
     'the confirmed-working threshold is one shared function, not an inline expression');
  // …but the check list NO LONGER gates on it. It did, from when the browser checked
  // every number up to its URL limit itself; once the browser check went, the gate
  // made "submitted" skip every smaller entry, so their submissions were never
  // confirmed. euler.py has no size limit.
  {
    const fc = code.slice(code.indexOf('function fdbCheckSets'));
    ok(!/confirmedQueryDigits|currentQueryCap|threshold/.test(fc.slice(0, fc.indexOf('\n}\n'))),
       'the check list no longer gates on the browser\'s size limit');
  }

  // The sieve's status choice is collected by showSievePrompt, which is a chain of
  // prompt()/confirm() calls a test cannot drive. sieveCandidates' filtering IS
  // tested directly; what is left is the wiring — that the choice the prompt
  // collected actually reaches the run. Dropping the argument left every
  // behavioural assertion green while the sieve silently scanned everything.
  ok(/async function runSmallPrimeSieve\(onlyUnsearched, onProgress, nFrom, nTo, statuses\)/.test(code),
     'the sieve run accepts a status restriction');
  ok(/\}, nFrom, nTo, statuses\);/.test(code),
     'and the button passes the one the prompt collected, rather than dropping it');

  // The check-list export's three sets are tested directly against
  // fdbCheckListSets(). What no test can reach is the prompt built on top of them,
  // since it is a prompt() call — so the wiring gets a static guard, the same way
  // the sieve's status choice does. Pointing the third option at an empty list
  // left every behavioural assertion green while the option silently vanished from
  // the dialog.
  ok(/list: sets\[o\.key\], bytes: bytesOf\(sets\[o\.key\]\), match: FDB_CHECK_SET_MATCH\[o\.key\]/.test(code),
     'every option is wired to its OWN set — none can silently point at an empty list');
  // Every set is offered even when empty, and an empty choice is refused with a
  // reason. This replaced a `.filter(o => o.list.length)` that dropped empty sets
  // before the prompt was built — which meant that with only one set populated the
  // question was never asked at all, and the export silently ran 'all'. From the
  // outside that is indistinguishable from the other options not existing, which
  // is exactly how it was reported.
  ok(!/\]\.filter\(o => o\.list\.length\);/.test(code),
     'empty sets are not dropped before the prompt is built');
  ok(/if \(!chosen\.list\.length\) \{ alert\('Nothing to export under/.test(code),
     'and choosing an empty set explains why it is empty instead of exporting something else');

  // ── the two "nothing known" categories describe themselves consistently ───
  // These are different things: 'unknown' is an absence of data on our side,
  // 'fdb-unknown' is a positive answer from FactorDB (status 'U' — no
  // factorisation, not even a composite verdict). The app used to say both, in
  // different places: the legend said FactorDB HAD seen the number, while the tile
  // badge and the U-branch comment said it had no record. Opposite claims about
  // the same category, which is what made the split read as arbitrary.
  ok(!/has no record of this number/.test(code),
     'nothing claims FactorDB has no record — it has no FACTORISATION, which is different');
  ok(/FactorDB has never seen/.test(code) === false,
     'and the ECM weighting prompt no longer calls them "never seen", which describes the other category');

  // The Check prompt and the sieve prompt both ask which of these to work on. They
  // used to use "unknown" for different sets — both categories in one dialog, only
  // the never-checked one in the other. Same word, two meanings, two dialogs apart.
  // The Check prompt went with the in-app check, so only the SIEVE prompt asks
  // which of these to work on — there is no second dialog left to disagree with.
  // The surviving half of the rule is that it uses the merged word for the merged
  // set.
  ok(/\/\^\(nothing\|nothingknown\|both\|none\|n\)\$\/\.test\(a\)/.test(code),
     'and the sieve prompt answers to the same word for the same set');


  // A results_ecm.json is an ECM store, not GMP-ECM console output, and the two
  // arrive through the same file picker. The routing sits inside a FileReader
  // callback so no test can reach it — and getting it wrong is silent: the log
  // parser finds no "Input number is" lines, matches no run blocks, and reports
  // that nothing was imported, which reads exactly like an empty file. That is the
  // state this import was added to end, so the wiring is pinned statically.
  ok(/const jsonFiles = nonEmpty\.filter\(r => looksJson\(r\.text\)\);/.test(code),
     'files that look like JSON are separated from console logs');
  ok(/for \(const r of jsonFiles\) importEcmJson\(r\.text, r\.name\);/.test(code),
     'and routed to the store importer rather than the log parser');
  ok(/await processEcmLogText\(combined, logFiles\.length > 1/.test(code),
     'while the log parser only ever sees the files that are actually logs');

  // The factor tag rule lives in factorPrimalityLabel and is tested directly. The
  // modal's use of it is inside a template string in a render function, which no
  // test reaches — and reverting that one line is exactly how the rule and the
  // display drifted apart before, producing "61 COMPOSITE?" on a prime.
  ok(/const lbl = factorPrimalityLabel\(f, allVerifiedPrime, fdbCache\);/.test(code),
     'the modal labels factors with the shared rule rather than its own copy');
  ok(!/factorFDB\.status === 'FF'\) \{\s*\n\s*lbl = 'composite'/.test(code),
     'and the raw FF-means-composite inference is not back in the render path');

  // unpushedWork() is tested directly; that clearAllLocalData actually CONSULTS it
  // before deleting is not reachable from a test, and it is the half that matters.
  // Without it the button keeps its promise — "pull from GitHub afterwards to
  // restore your data" — only by luck.
  ok(/const risk = unpushedWork\(\);\s*\n\s*if \(risk\.length\) \{/.test(code),
     'clearing checks for unpushed work before deleting anything');
  ok(/return;\s*\n\s*\}\s*\n/.test(code.slice(code.indexOf('const risk = unpushedWork'))),
     'and returns rather than continuing when there is any');

  // The factor chips' FDB/YOURS tag answers "is FactorDB holding this one?", not
  // "who found it first". Those diverge permanently for anything the sieve found
  // and FactorDB later confirmed, because recordDiscovery keeps the original
  // attribution — so keying the tag on provenance made the list useless for the
  // thing it is wanted for, scanning for what still needs posting. Render-path, so
  // no test reaches it.
  ok(/const onFdb = !fdbLacks\.includes\(f\);/.test(code),
     'the factor tag is driven by whether FactorDB has the factor');
  ok(/const fdbLacks = factorsFdbLacks\(e\);/.test(code),
     'using the same rule as the submission export, so the chips preview it exactly');

  // The modal carries TWO marks and they answer different questions:
  //   PRIME · FDB  FactorDB has declared this factor prime   (primality)
  //   FDB / YOURS  FactorDB is holding this factor           (possession)
  // Merging them is tempting and wrong: on a CF result FactorDB has the factor and
  // has said nothing about its primality, so the primality tooltip would be a lie.
  // Only the possession mark may consult factorsFdbLacks.
  ok(/const fdbConfirmed = allVerifiedPrime \|\| !!\(fdbCache\[f\] && \['P','PRP'\]\.includes\(fdbCache\[f\]\.status\)\);/.test(code),
     'the primality mark asks about primality, not possession');
  ok(/const onFdb = !fdbLacks\.includes\(f\);/.test(code),
     'and the possession mark asks factorsFdbLacks, so it tracks what the export would send');

  // isFdbUndetermined is tested directly; that exportNextRuns USES it is not
  // reachable — the call sits inside an async chunked loop over every candidate.
  // Reverting that one line restores the whole bug: the priority weight goes back
  // to rewarding numbers for having no record, which for anything past the query
  // limit means rewarding them for being unaskable.
  ok(/const fdbUnknown = qualifiesForEcmPriority\(e, _rec\);/.test(code),
     'the ECM export decides the priority weight with the shared two-part rule');
  ok(!/const fdbUnknown = !_rec \|\|/.test(code),
     'and not by whether a cache record happens to exist');

  // ── the summary's RANKED column must be the sort key itself ──────────────
  // The export ranks by value x weight but printed only raw value, so with a
  // weight in play the rows were not in the order the "value" column implied and
  // the file gave no way to see why. The column is written from the same
  // expression the sort uses; if those two ever diverge the file becomes
  // actively misleading rather than merely incomplete, so both are pinned here —
  // the whole thing lives inside an async export that no test can drive.
  ok(/const eff = r => \(r\.gain \/ Math\.max\(r\.cpuTime, 1\)\)\s*\n\s*\* \(r\.fdbUnknown \? FDB_WEIGHT : 1\)/.test(code),
     'the ranking multiplies value by the weight for qualifying runs');
  // …and, when the objective is completion rather than factors found, by the odds
  // that the find would actually finish the number. A separate multiplier, so the
  // reported GAIN stays honest — this expresses which runs to prefer, never a claim
  // about how likely a find is.
  ok(/completionOdds\(r\.digits \|\| 0, r\.targetDigits \|\| 0,/.test(code),
     'and by the completion odds when that objective is chosen');
  // The CONFIDENTLY cleared depth, not the level the run aimed at. "t25" is a curve
  // count giving ~63% odds on a 25-digit factor, so reasoning from 25 claims far
  // more than the run established — it clears t19 at 95%.
  ok(/confidentlyCleared\(parseInt\(r\.rawCurves \|\| r\.curves\) \|\| 0,\s*\n?\s*r\.rawB1 \|\| 0\)/.test(code),
     'derived from the curve count actually run, not from the nominal level');
  // …and the SIEVE counts too. Its exclusion is PROVEN where ECM's is 95%, so for
  // the low end it is the better evidence: a sieve to 10^9 establishes t9 outright,
  // a t15 ECM job establishes t9 at 95%. Whichever is deeper wins.
  ok(/Math\.max\(confidentlyCleared\([\s\S]{0,200}?sieveDepthDigits\(r\.n\)\)/.test(code),
     'the deeper of the sieve and ECM evidence is used, not just the curves');

  // The summary must SAY which objective ranked it. Both produced an identical
  // header, so the first real completion-ranked export was indistinguishable from a
  // default one — there was no way to tell, from the file, whether the option had
  // taken effect at all.
  ok(/ranked by '\s*\n?\s*\+ \(GOAL_COMPLETE/.test(code),
     'the summary header names the objective it was ranked by');
  ok(/CHANCE OF COMPLETING the number/.test(code),
     'in words that cannot be mistaken for the default ranking');

  // …and the sieve must RECORD what it covered, or there is no evidence to use.
  // Correct bookkeeping nobody calls is the same as none — the mutation removing
  // the call passed every unit test of the recorder itself.
  ok(/try \{ recordSieveDepth\(covered, SIEVE_LIMIT\); \}/.test(code),
     'the sieve records the depth it reached');
  ok(/covered\.push\(e\.n\);/.test(code),
     'building that list as it goes, entry by entry');
  {
    // Only entries it actually REACHED. A cancelled scan crediting the whole
    // candidate list would write a proof it never earned, and everything
    // downstream treats this number as proven.
    const i = code.indexOf('async function runSmallPrimeSieve');
    const body = code.slice(i, code.indexOf('\n}', i));
    ok(/covered\.push/.test(body) && !/recordSieveDepth\(cands/.test(body),
       'crediting what it reached, not the list it set out to scan');
    const push = body.indexOf('covered.push');
    const cancel = body.indexOf('if (cancelRequested) break;');
    ok(cancel > 0 && push > cancel,
       'and the push sits after the cancellation check, inside the loop');
  }
  ok(/GOAL_COMPLETE\s*\n?\s*\?/.test(code), 'only when that objective is chosen');
  // RANKED must be EVERY factor the sort used. It carried only the weight while the
  // sort also multiplied by the completion odds, so the first completion-ranked
  // export showed rows in an order its own columns did not explain.
  // Two columns, because they are different KINDS of number: `rate` is a genuine
  // expected-completions-per-hour, `ranked` is that times a preference weight and
  // is not a probability at all. One column labelled %/hr carrying both turns a
  // measurable quantity into an opinion wearing the same units.
  // Score once, sort on the stored value. The comparator used to call eff() on
  // both sides of every comparison — n·log n times — and in completion mode eff()
  // does a sieve-depth lookup and confidentlyCleared each time.
  ok(/for \(const r of ranked\) r\._score = eff\(r\);/.test(code),
     'the export scores each run once before sorting');
  ok(/ranked\.sort\(\(a, b\) => \(b\._score - a\._score\)/.test(code),
     'and the comparator reads the stored score instead of recomputing it');
  ok(!/ranked\.sort\(\(a, b\) => \(eff\(b\) - eff\(a\)\)/.test(code),
     'the recompute-in-the-comparator form is gone');
  ok(/const rateHr = effHr \* finishOdds;/.test(code),
     'rate = value × finish, an honest rate');
  ok(/const adj = r\.fdbUnknown \? rateHr \* FDB_WEIGHT : rateHr;/.test(code),
     'and ranked = rate × weight, the score the sort used');
  ok(/const finishOdds = GOAL_COMPLETE/.test(code) && /completionOdds\(r\.digits/.test(code),
     'and the finish odds shown are the ones the ranking used, recomputed the same way');
  ok(/rate = value × finish — expected completions per hour, a real rate/.test(code),
     'the legend explains the honest rate');
  ok(/× weight — a preference score, not a probability/.test(code),
     'and says plainly that the ranked column is not one');
  // The size column is the COFACTOR — what ECM actually works on. On a partially
  // factored entry that is nowhere near E(n)'s size, and a bare "digits" heading
  // invites reading it as the latter.
  ok(/#   E\(n\)     cofdig  method/.test(code),
     'the size column says it is the cofactor, not E(n)');
  // And the finish column is plain decimals: exponential notation in a percent
  // column reads as noise, and this column exists to be read at a glance.
  ok(/return v > 0 \? '<0\.01%' : '0%';/.test(code),
     'tiny finish odds read as <0.01%, not as an exponent');
  ok(!/finishOdds \* 100\)\.toExponential/.test(code),
     'nothing in the finish column is formatted exponentially');
  // These two check the ROW BUILDER, not just that the strings exist somewhere:
  // a marker that never varies, or a column that is always emitted, both leave the
  // file looking right while telling you nothing.
  ok(/const star = FDB_WEIGHT !== 1\s*\n/.test(code),
     'the column is emitted only when a weight is actually in play');
  ok(/\(r\.fdbUnknown \? '★' : ' '\)/.test(code),
     'and the marker is driven by whether the row earned the boost');

  // ── t/curve ──────────────────────────────────────────────────────────────
  // The per-curve cost is the size-independent part of the estimate: it says
  // whether a run is expensive because the number is big or because there is a lot
  // of it. Only ECM has curves — P-1 and P+1 are a single pass, so dividing by a
  // curve count there would invent a figure.
  ok(/const perCurve = \(r\.method === 'ECM' && nCurves > 0 && r\.cpuTime\)\s*\n\s*\? fmtCpuTime\(r\.cpuTime \/ nCurves\) : '—';/.test(code),
     'time per curve is the run time divided by its own curve count, ECM only');
  ok(/const nCurves = r\.rawCurves \|\| parseInt\(String\(r\.curves\)\.replace\(\/\[\^0-9\]\/g, ''\)\) \|\| 0;/.test(code),
     'and falls back to the displayed count the same way the command builder does');
  // Computing a column and printing it are two different things, and a guard on
  // the first says nothing about the second — the row template has to be checked
  // too, or the field can be computed and silently dropped.
  ok(/\$\{tm\}  \$\{pc\}  \$\{gn\}  \$\{val\}\$\{extra\}/.test(code),
     'and the row actually prints it, between the run time and the odds');

  // ── the over-limit panel points at the tool that can actually do it ──────
  // A number past the browser's URL limit used to offer "Mark factors as
  // FDB-confirmed": the user looks at factordb.com and asserts, by hand, that it
  // holds these factors. That writes source:'fdb' and _fdbVerified on no evidence
  // the app can check — the same unbacked claim that once printed "all prime,
  // verified by FactorDB" over factors FactorDB had never seen.
  //
  // fdb_check.py has no size limit (it posts the number in the body rather than
  // the URL), so the honest answer is to route these through it and get a real
  // recorded result.
  ok(!/markFactorsFdbConfirmed/.test(code),
     'the manual "mark as FDB-confirmed" claim is gone, handler and all');
  // The modal's FactorDB section is gone entirely — the user asked for it removed.
  // FactorDB checking lives in euler.py check, reached from the toolbar's export.
  ok(!/FactorDB is checked with/.test(src) && !/Open\s+on FactorDB/.test(src),
     'the entry modal carries no FactorDB section');
  ok(!/href="https:\/\/factordb\.com\/index\.php\?query=\$\{e\.val\}"/.test(src),
     'and nothing builds a query URL out of an arbitrarily large number');

  // ── the modal's ECM panels, trimmed to what the user reads ───────────────
  // The recommendations carried a paragraph restating its own heading; the cost
  // table carried one summarising what the table already shows. Both asked for
  // shorter. And NOW reads 98.09%, not 98%: at the top of a level the difference
  // between 98% and 99.9% is exactly what decides whether to top it up.
  ok(!/Two numbers per run, don/.test(src), 'the long recommendations paragraph is gone');
  // The recommendations are a table now, and its legend names the table's columns.
  ok(/\+Odds<\/span> = how much the run raises your overall odds of a new factor/.test(src)
     && /Finish<\/span> = if it finds one, the chance that completes E\(/.test(src),
     'the legend explains +Odds and Finish, the two figures easiest to confuse');
  ok(!/rather than just take the next step/.test(src) && !/it would need NFS/.test(src),
     'the cost table\'s summary paragraph is gone');
  // NOW became the grid's Total row; fmtPct gives the two decimals asked for.
  ok(/perLevel\(r => `<td style="font-size:10px;font-weight:600;color:\$\{ink\(r\.have\)\};\$\{shade\(r\.have\)\}">\$\{fmtPct\(r\.have\)\}<\/td>`\)/.test(src),
     'the Total row shows each level\'s coverage to two decimals, shaded like the runs above it');
  // The probability grid keeps its heading and its column legend, and loses the two
  // sentences restating them.
  ok(!/Each cell answers:/.test(src) && !/This is progress, not completion/.test(src),
     'the probability panel\'s two explanatory sentences are gone');
  // The probability grid and the cost table were indexed by the same levels and
  // showed the same numbers — the grid's find|exists IS the table's NOW, computed
  // by the identical formula. Merged: the grid is gone, and its figures are columns.
  ok(!/★ Chance of finding a factor of this size/.test(src),
     'the separate probability grid is gone');
  ok(!/const resolveDigits = ecmLevels\(\)/.test(src),
     'along with the block that built it, rather than left computing values nothing reads');
  // The coverage table itself is gone: its rows are the summary rows under the grid.
  // (Its old title survives only in a comment, so absence is tested on the code.)
  ok(!/function costToFinishHtml/.test(src), 'the separate coverage table is gone');
  // …and not re-added inline either. Tested on `code`, which has comments stripped:
  // the old title survives only in explanatory comments, and those must not count.
  ok(!/Coverage and cost by level/.test(code),
     'nothing renders the old "Coverage and cost by level" table any more');
  ok(/sumRow\('Total',/.test(src), 'and the grid ends with a Total row across all runs');
  ok(/sumRow\('Exists',/.test(src) && /sumRow\('Found',/.test(src),
     'with Exists and Found beneath it, so nothing the coverage table showed is lost');
  ok(/\$\{fmtPct\(r\.pe \* r\.have\)\}/.test(src),
     'FOUND is exists x now, exactly the grid\'s headline figure');

  // ── finish odds in the modal's recommendations ────────────────────────────
  // The completion ranking's key figure lived only in the export. Each recommended
  // run now says, if it finds a factor, the chance that completes the number —
  // computed exactly as the export's completion score is.
  ok(/const fin = completionOdds\(digits, rec\.targetDigits \|\| 0, cleared\);/.test(src),
     'each recommendation computes its finish odds with completionOdds');
  ok(/confidentlyCleared\(parseInt\(rec\.rawCurves \|\| rec\.curves\) \|\| 0, rec\.rawB1 \|\| 0\),\s*\n?\s*sieveDepthDigits\(n\)\)/.test(src),
     'from the deeper of the run\'s ECM evidence and the proven sieve depth');
  ok(/chance that completes E\(' \+ n \+ '\)/.test(src), 'and shows it under the run');
  // The modal asked the recommender WITHOUT the sieve depth while the export
  // passed it, so the two could disagree about which levels were still open.
  ok(/const recs = recommendNextRun\(digits, attempts, sieveDepthDigits\(n\)\);/.test(src),
     'the modal passes the sieve depth to the recommender, as the export does');

  // ── curve counts in full ──────────────────────────────────────────────────
  // "~2k" hid the figure that decides whether to run it, the callers added their own
  // "~" to print "~~2k", and the export's fallback turned "~2k" into 2 curves.
  ok(!/level: ~' \+ fmtCurves/.test(src) && !/ of ~' \+ fmtCurves/.test(src),
     'the sentences no longer prefix a "~" onto an exact count');

  // ── the method note ───────────────────────────────────────────────────────
  // Its explanation is a collapsed footnote rather than a standing block…
  ok(/<summary[^>]*>How these are computed<\/summary>/.test(src),
     'the explanation of the method is a collapsed footnote');
  // …and each cell lost "B1≈11k · done: 0 · 90%→171", which counted only curves at
  // the level's ideal B1 — so a level >99.99% covered by higher-B1 runs showed
  // "done: 0" right under the figure contradicting it.
  ok(!/done: \$\{fmtCurves\(curves\)\}/.test(src) && !/curvesPerDigit/.test(src),
     'the misleading "done: N · 90%→M" line is gone, with the tally that fed it');

  // ── the tile badge asks the same question as everything else ─────────────
  // It keyed on the raw _fdbUnknown flag, which applyFdbUnknownSet sets for every
  // member of a set nothing ever removed from. So a tile claimed "FDB has nothing
  // on this — our factors are new" while the entry's own modal said "FactorDB has
  // every factor we hold". Two readings of one entry, from two different tests.
  ok(/if \(isFdbUndetermined\(e, fdbCache\[e\.val\]\) && \(e\.factors \|\| \[\]\)/.test(code),
     'the tile badge uses the shared test, not the raw marker');
  ok(!/if \(e\._fdbUnknown && \(e\.factors/.test(code),
     'so it cannot contradict the modal or the export weight');

  // The check list's "submitted" set and the submission export choose entries by the
  // SAME rule, factorsFdbLacks: what submit would send is exactly what the post-submit
  // check confirms. (This used to assert that aheadOfFdbTargets existed, on the claim
  // that the submission export depended on it. Nothing called it — it was dead code
  // from the in-browser check, kept looking alive by a comment and by this guard.)
  ok(/submitted:\s*base\.filter\(e => factorsFdbLacks\(e\)\.length > 0\)/.test(code)
     && /if \(!factorsFdbLacks\(e\)\.length\) \{ skippedFdb\+\+; continue; \}/.test(code),
     'the check list and the submission export select entries by the same rule');

  // ── the push must not ship a stale payload ───────────────────────────────
  // buildSyncPayload reads the PERSISTED store, so a debounced save still in
  // flight would be pushed as its previous version — silently sending the other
  // machines data one save behind, with nothing to indicate it.
  ok(/async function githubPush\(\) \{\s*\n(\s*\/\/[^\n]*\n)*\s*try \{ flushFDBCache\(\); \}/.test(code),
     'a push writes any pending cache out before building the payload');

  // ── the offline tool is named correctly everywhere ───────────────────────
  // Merging the three scripts into euler.py left eighteen references telling the
  // user to run files that no longer exist — in button tooltips, export file
  // headers and modal panels. A rename is only finished when the things that TELL
  // people how to run it have been renamed too.
  ok(!/fdb_check\.py|fdb_submit\.py|check_data\.py|tests_py\.py/.test(html),
     'no user-facing text names a script that was merged away');
  ok(/euler\.py check/.test(html) && /euler\.py submit/.test(html),
     'and the surviving commands are named as they are actually invoked');

  // The in-app check is GONE, and with it the route diagnostic that existed to
  // explain why it kept failing. This used to assert the diagnostic's POSITION
  // between the Check buttons and the export group; it now asserts their absence,
  // which is the property that has to hold.
  ok(!/id="testRoutesBtn"/.test(html), 'the route diagnostic button is gone');
  ok(!/id="pollBtn"/.test(html), 'and the Check button');
  ok(!/id="pollSubmittedBtn"/.test(html), 'and Check submitted');
  ok(/Export FDB check list/.test(html),
     'while the offline export that feeds euler.py check remains');

  // ── and it cannot creep back ─────────────────────────────────────────────
  // The whole feature was dead UI: a browser cannot call FactorDB (no CORS), every
  // query went through public proxies, and those stopped answering. Worse, each
  // failed attempt wrote "FactorDB has no factorisation for this" onto the entry —
  // 2,650 of them. Re-adding a button would resurrect both the dead control and the
  // false verdicts.
  //
  // Pinned as an ABSENCE, because that is the shape a return would take. The
  // remaining FactorDB code is deliberate: queryFactorDB and fdbRoutes survive for
  // tryResolveCompositeViaFDB, which the ECM import and the integrity fix use.
  for (const gone of ['startCheck', 'diagnoseRoutes', 'quickCheckFDB', 'modalCheckFull',
                      'runPollQueue', 'startManualPoll', 'allTargets', 'requestCap']) {
    ok(!new RegExp('function ' + gone + '\\b').test(code),
       gone + ' stays removed — the in-app check does not come back');
  }
  // Quote-agnostic: a re-added button might use either kind, and a guard that only
  // knows double quotes waves the other one straight through. A mutation adding
  // id='pollBtn' survived the first version of this check.
  ok(!/id=['"](pollBtn|pollSubmittedBtn|testRoutesBtn)['"]/.test(html),
     'and no button reappears in the markup');
  ok(!/onclick=['"](startCheck|diagnoseRoutes|quickCheckFDB|modalCheckFull)\(/.test(html),
     'nor a handler wired to one of the removed entry points');
  ok(/function tryResolveCompositeViaFDB/.test(code) && /function queryFactorDB/.test(code),
     'while the composite lookup the ECM import depends on is untouched');

  // ── no code may hunt for an element that does not exist ──────────────────
  // A reference count cannot see this: the function is CALLED, so it looks alive,
  // but every element it touches has gone and it returns at its first line.
  // updateSubmittedBtn, showFdbButtons, renderChangelog and updateGHStatus were all
  // in that state — renderChangelog's own comment said "there's nothing to render"
  // and it was still being called three times, and updateGHStatus did a
  // loadGHSettings() storage read before discovering it had nothing to update.
  //
  // Ids created at runtime (`el.id = 'x'`) are legitimate, so they count as defined.
  {
    const wholeSrc = fs.readFileSync('index.html', 'utf8');
    const used = new Set([...wholeSrc.matchAll(/getElementById\(['"]([\w-]+)['"]\)/g)].map(m => m[1]));
    const defined = new Set([
      ...[...wholeSrc.matchAll(/id=['"]([\w-]+)['"]/g)].map(m => m[1]),
      ...[...wholeSrc.matchAll(/\.id = ['"]([\w-]+)['"]/g)].map(m => m[1]),
    ]);
    const missing = [...used].filter(i => !defined.has(i)).sort();

    // ZERO missing, not "none of the dead shape". There used to be one exception —
    // setGHStatus looked up a removed element, guarded with `if (el)`, and did its
    // real work regardless — so this only flagged the narrower pattern of looking
    // up and then returning. That lookup is gone: the function reports through the
    // activity log and a toast, which is all that was ever left of it.
    //
    // With no exception to carve out, the stricter rule is the right one. A lookup
    // that can never succeed is dead code whether or not the function around it
    // still does something, and the narrow version would have missed it.
    eq(missing, [],
       'every getElementById target exists, statically or created at runtime');
  }

  // ── the hybrid is wired into the numbers it is meant to correct ──────────
  // Without the accumulator every level has expected 0, every verdict becomes "no
  // runs at this level", and the hybrid silently degrades to the theory it exists
  // to correct — with nothing on screen to say so. And the cost table has to ask
  // the CALIBRATED estimator, or the correction is computed and never used.
  ok(/stats\[bucket\]\.expFinds \+= pe \* pf;/.test(code),
     'the yield walk accumulates what the model predicted for those same runs');
  ok(/pe = pFactorExistsCalibrated\(d, digits, provenDigits\);/.test(code),
     'and cost-to-finish asks the calibrated estimator, not the raw one');
  ok(/calibrated: !!\(calib && calib\.usable\)/.test(code),
     'carrying whether the row is measured or modelled');
  // The Basis row was removed at the user's request, so Found sits directly under
  // Exists. The ratio moved into the Exists tooltip rather than being lost: a figure
  // pinned by real finds still reads differently from an unchecked model on hover.
  ok(!/sumRow\('Basis',/.test(code), 'there is no separate Basis row');
  ok(/The model was multiplied by \$\{r\.calibRatio\.toFixed\(2\)\}/.test(code),
     'the calibration ratio lives in the Exists tooltip instead');
  // The "P(at least one method finds an N-digit factor)" grid showed
  // 1 − (1 − p_ECM)(1 − p_PM1) per level — the Total row's figure, same formula.
  // It went; the collapsible note that sat under its heading stayed, and now
  // explains the Total row instead of a grid that is gone.
  ok(!/P\(at least one method finds/.test(code), 'the duplicate per-level grid is gone');
  // ONE methodology note: there were two, above and below the grid, repeating the
  // ECM formula, the rho description and "P+1 x 0.5" — and both still quoting rho as
  // "~1-3%", the figure for the per-u recompute the precomputed table replaced.
  ok((code.match(/<summary[^>]*>How these are computed<\/summary>/g) || []).length === 1,
     'there is exactly one "How these are computed" note');
  ok(!/How these probabilities are computed/.test(code), 'the second, overlapping note is gone');
  ok(/<span style="color:var\(--text\)">Total<\/span> — assuming a factor/.test(code),
     'the merged note explains the Total row');
  ok(/within 0\.2–0\.9% of published values/.test(code) && !/accurate to ~1–3%/.test(code),
     'and states rho\'s CURRENT accuracy, not the old recompute\'s');

  // ── the modal, tightened ──────────────────────────────────────────────────
  // #1 The value opens FactorDB by ID. It put the whole number in the URL — 73 KB for
  // a 72,613-digit E(n) — which FactorDB refuses, so the click failed on exactly the
  // entries you most want to look at.
  ok(/'https:\/\/factordb\.com\/index\.php\?id=' \+ encodeURIComponent\(rec\.fdbIdExact\)/.test(code),
     'the value box links by FactorDB ID when it is known');
  ok(!/href="https:\/\/factordb\.com\/index\.php\?query=' \+ encodeURIComponent\(e\.val\)/.test(code),
     'and never builds a query URL from the whole number unconditionally');
  // Without a stored id the value links by NAME: FactorDB evaluates E(n) itself (OEIS
  // A000111 — for even n exactly this E(n)), so the link works at any size. By value it
  // stopped at FactorDB's URL limit, and the biggest entries had no link at all.
  ok(/: 'https:\/\/factordb\.com\/\?query=' \+ encodeURIComponent\('E\(' \+ n \+ '\)'\);/.test(code),
     'without a stored id, the value links to FactorDB by name — E(n) — which works at any size');
  const linkCode = (code.match(/const fdbLink = \(rec && rec\.fdbIdExact\)[\s\S]*?;\n/) || [''])[0];
  ok(linkCode && !/encodeURIComponent\(e\.val\)/.test(linkCode) && !/currentQueryCap/.test(linkCode),
     'never by the whole number, which stops at the URL limit');
  ok(/'<a class="value-box cofactor-link" href="' \+ fdbLink/.test(code) && !/too long to look up by value/.test(code),
     'so every entry has a link — there is no unlinked case to explain any more');
  // Nothing reads, saves or syncs the old, rounded field any more.
  ok(!/\.fdbId\b|\{ fdbId\b|fdbId \?/.test(code), 'the old rounded fdbId is no longer read anywhere');
  // #2 The Total row carries the CPU total; the badge above the grid repeated it.
  ok(!/Total CPU:/.test(code), 'no separate Total CPU badge');
  // #3 The sign is one line, so it sits in the header, not a section of its own.
  ok(!/modal-section-label">Sign</.test(code), 'no Sign section');
  ok(/getElementById\('modalTitle'\)\.innerHTML = `E\(\$\{n\}\)`[\s\S]{0,200}\$\{signWord\} · PARI: eulerfrac/.test(code),
     'the sign and the PARI name ride in the header instead');
  // #4 First column pinned while the levels scroll. Every row's first cell must be one
  // column wide for this to work — a six-column summary label would stay pinned at that
  // width and slide over the level columns.
  ok(/\.ecm-table th:first-child, \.ecm-table td:first-child \{\s*position: sticky; left: 0;/.test(html),
     'the attempts grid pins its first column');
  ok(!/<td colspan="\$\{labelSpan\}"/.test(code) && /'<td><\/td>'\.repeat\(labelSpan - 1\)/.test(code),
     'and summary labels occupy that one column, not a span that would slide over the rest');
  // #5 One line at the top, from the same inputs the ECM section uses.
  ok(/innerHTML = `\s*\n\s*\$\{summaryHtml\}\s*\n\s*(\$\{newHtml\})?\$\{noteHtml\}/.test(code),
     'a summary line opens the modal body');
  // It leads with the status, which used to be a section of its own; the generic
  // sentence became the tooltip. It must be built AFTER statusInfo — built earlier,
  // the status is not defined yet.
  ok(!/modal-section-label">Factorization Status</.test(code), 'no separate Factorization Status section');
  ok(/title="\$\{escHtml\(statusInfo\.desc\)\}">`\s*\n?\s*\+ `\$\{statusInfo\.icon\} \$\{statusInfo\.label\}/.test(code),
     'the summary leads with the status icon and label, its description on hover');
  {
    const om = code.slice(code.indexOf('function openModal'));
    ok(om.indexOf('const statusInfo') < om.indexOf('const summaryHtml'),
       'and is built after statusInfo, which it needs');
    // RENDERED, not grepped: a guard on the markup's text passes even when the code
    // that emits it can never run. And with the Status section gone, a fully factored
    // entry that lost its status here would show no status anywhere.
    const m = om.match(/const summaryHtml = \(\(\) => \{([\s\S]*?)\n  \}\)\(\);/);
    ok(!!m, 'the summary builder can be located for rendering');
    if (m) {
      // coverage comes from the real coveredTo, built on the same stand-ins
      const cov = src.slice(src.indexOf('function coveredTo('), src.indexOf('\n}\n', src.indexOf('function coveredTo(')) + 2);
      const ccf = () => [{ d: 30, have: 0.9 }, { d: 35, have: 0.7 }, { d: 40, have: 0.1 }];
      const coveredTo = new Function('computeCostToFinish', 'COST_TARGET_LO', cov + '\nreturn coveredTo;')(ccf, 0.63);
      const render = (status, stInfo, cache) => new Function('statusInfo', 'e', 'n', 'getCofactorDigits', 'loadECM',
        'sieveDepthDigits', 'computeCostToFinish', 'COST_TARGET_LO', 'recommendNextRun', 'logSwallowed', 'escHtml', 'fdbCache', 'coveredTo', m[1])(
        stInfo, { val: '9'.repeat(400), status }, 206, () => 323, () => ({ '206': [] }), () => 0,
        ccf, 0.63,
        () => [{ method: 'ECM', b1: '3.0M', curves: '2,350' }], () => {}, (x) => String(x), cache, coveredTo);
      const partial = render('partial', { icon: '◐', label: 'Partially Factored', desc: 'Some known.', color: 'var(--yellow)' });
      ok(/◐ Partially Factored/.test(partial), 'the rendered summary leads with the status');
      ok(/323-digit cofactor/.test(partial) && /covered to t35/.test(partial)
         && /next: ECM B1=3\.0M, 2,350 curves/.test(partial), 'then the cofactor, its coverage and the next run');
      // When FactorDB was last checked — the old FactorDB section's one unique fact.
      const cache = { ['9'.repeat(400)]: { status: 'CF', timestamp: Date.UTC(2026, 8, 20, 12) } };
      const checked = render('partial', { icon: '◐', label: 'Partially Factored', desc: 'x', color: 'var(--yellow)' }, cache);
      ok(/FactorDB checked 2026-09-20/.test(checked), 'the summary says when FactorDB was last checked');
      ok(!/FactorDB checked/.test(partial), 'and says nothing when it never was');
      const full = render('full', { icon: '●', label: 'Fully Factored', desc: 'All known.', color: 'var(--green)' });
      ok(/● Fully Factored/.test(full) && !/cofactor/.test(full),
         'a fully factored entry still shows its status — and nothing that no longer applies');
    }
  }
  // #1 FactorDB's record shows for any entry that has one. It only appeared for
  // "unknown" entries — so for partially factored ones, most of them, the results
  // imported from euler.py check were recorded and never displayed.
  ok(!/FactorDB Lookup/.test(code) && !/unknownFdbHtml/.test(code), 'the old "FactorDB Lookup" section is gone');
  // …and then the FactorDB section went altogether: its factor list duplicated the
  // Known Factors chips (each marked FDB or YOURS) and its status the summary line's.
  // Its one unique fact, when FactorDB was last checked, moved into the summary line.
  ok(!/fdbRecordHtml/.test(code) && !/modal-section-label">FactorDB</.test(code),
     'there is no separate FactorDB section');
  ok(!/class="fdb-block"/.test(html) && !/\.fdb-block\b/.test(html), 'nor any markup or styling left for it');
  // #3 Adding a factor is a rare action: a quiet collapsible panel below the attempts.
  ok(/<summary[^>]*>\+ Add a factor you know<\/summary>/.test(code), 'adding a factor is a collapsible panel');
  ok(!/>Add Known Factor</.test(code), 'not the accent-bordered box it was');
  {
    const bodyAt = code.indexOf("getElementById('modalBody').innerHTML = `");
    const b = code.slice(bodyAt, code.indexOf('`;', bodyAt));
    ok(b.indexOf('Factoring Attempts') > 0 && b.indexOf('Factoring Attempts') < b.indexOf('+ Add a factor you know'),
       'and it sits below the attempts, not above them');
    // #5 Download and Clear share one footer row instead of two headed sections.
    ok(!/modal-section-label">Download</.test(b) && !/modal-section-label">Cache</.test(b),
       'no separate Download and Cache sections');
    ok(/downloadEntry\(\$\{n\}\)[\s\S]{0,400}resetEntry\(\$\{n\}\)/.test(b),
       'both buttons share one footer row');
    // Named for what it does. "Clear cached data" undersold a full reset of the entry.
    ok(/⊗ Reset E\(\$\{n\}\)…<\/button>/.test(b), 'the button says Reset E(n)');
    ok(!/Clear cached data/.test(code), 'and nothing still calls it "Clear cached data"');
  // Clearing local data must forget what GitHub held too — or the next pull would see
  // "unchanged", skip the download, and restore nothing.
  { const i = code.indexOf('function doClearAllLocalData'); const b = code.slice(i, code.indexOf('\n}\n', i));
    ok(/_syncBase = null;/.test(b), 'clearing local data forgets the remembered GitHub version too'); }
  // The labels say what really happened, and P±1 finds still count as your own work.
  ok(/prov === 'p' \? 'your P±1' : prov === 'm' \? 'you \(added by hand\)'/.test(code), 'P±1 finds and hand-added factors are labelled for what they are');
  ok(/if \(r\[3\] !== 'e' && r\[3\] !== 'p' && r\[3\] !== 'm'\) continue;/.test(code), 'and the run statistics still count P±1 finds as your own');
  // ── the push guard's wiring ────────────────────────────────────────────────
  // The decisions are tested by running pushGuard; these pin how it is wired in.
  {
    const fnBody = (name) => { const i = code.indexOf('function ' + name + '('); return i < 0 ? '' : code.slice(i, code.indexOf('\n}\n', i)); };
    const push = fnBody('githubPush'), pushEcm = fnBody('pushECMFile'), pull = fnBody('githubPull'), pullEcm = fnBody('pullECMFile');
    ok(/const guard = await pushGuard\(\);\s*\n\s*if \(!guard\.ok\) return;/.test(push) && push.indexOf('pushGuard()') < push.indexOf('buildSyncPayload()'),
       'every push runs the guard before building what it sends');
    // A conflict must MERGE before retrying: re-sending with the new version's ID is
    // what overwrote other machines' work.
    // The push plans, uploads what differs, and on a conflict merges GitHub's version and
    // plans again before retrying: re-sending with a newer ID would overwrite that change.
    // One commit per push. The plan is made against the listing AT the commit the push
    // builds on; a refused branch move is a conflict: merge GitHub's version, plan again.
    const loop = push.slice(push.indexOf('for (let attempt = 0; ; attempt++) {'), push.indexOf('setSyncBase({ files: lastShas'));
    ok(loop.length > 100 && /const head = await branchHead\(ctx\);/.test(loop)
       && /dataListing\(ctx, head \? head\.commit : null\)/.test(loop)
       && loop.indexOf('planChunkedPush(') < loop.indexOf('commitFiles(')
       && loop.indexOf('if (!res.conflict) throw') < loop.indexOf('await pullBothFromGitHub()'),
       "a conflict merges GitHub's version and plans again before retrying");
    ok(/if \(attempt >= 1\) throw new Error/.test(loop), 'and it retries once, not forever');
    ok(/setSyncBase\(\{ files: lastShas, ecm: loadECM\(\), factors: factorsFromPayload\(payload\) \}\);\s*\n\s*clearDeletedHere\(\);\s*\n\s*markClean\(\);/.test(push),
       'the dot clears only once every differing file has landed');
    ok(/if \(part && 'ecm' in part\) next\.ecm = compactEcm\(part\.ecm\);/.test(code)
       && /\.map\(a => \(\{ method: a\.method, b1: a\.b1, curves: a\.curves \}\)\)/.test(code),
       'what GitHub holds is recorded as a compact COPY — a live reference would check the store against itself');
    ok(/mainSha: pulledSha, factors: factorsFromPayload\(payload\)/.test(pull) && /ecmSha: await gitBlobSha\(bytes\)/.test(pullEcm),
       'each pull records the exact version it merged');
    const mergeMain = fnBody('mergePulledMain'), mergeEcm = fnBody('mergePulledEcm');
    ok(/for \(const n of deletedHere\(\)\.entries\) resetEntryData\(Number\(n\)\);/.test(mergeMain)
       && /applyDeletionsToEcm\(mergeEcmData\(remoteEcm\), deletedHere\(\)\)/.test(mergeEcm),
       'pulls re-apply deletions made here, so a merge cannot bring them back');
    ok(/recordDeletion\(\{ runs: \[ecmRunId\(n, attempts\[idx\]\)\] \}\)/.test(fnBody('confirmDeleteECM')), 'deleting a run records it');
    ok(/recordDeletion\(\{ runs: attempts\.filter/.test(fnBody('executeBulkDelete')), 'so does bulk delete');
    ok(fnBody('clearAllLocalData') && !/recordDeletion/.test(fnBody('clearAllLocalData')),
       'clearing local data is NOT recorded as a deletion, so it can never wipe GitHub');
  }
  // Factors and entry notes are data too, and reach the modal as HTML: escaped.
  ok(/title="Open \$\{escHtml\(f\)\} on FactorDB">\$\{escHtml\(f\)\}/.test(code), 'a factor chip escapes its factor');
  ok(/border-left:2px solid var\(--border2\)">\$\{escHtml\(e\.note\)\}<\/div>/.test(code), 'and the entry note is escaped');
  // Every save that lights the Push dot says WHAT it changed — the tooltip lists it.
  // A bare markDirty() would fall back to a vague "local changes".
  ok(!/markDirty\(\)/.test(code.replace(/function markDirty\(what\)/, '')),
     'every markDirty call names what it changed');
    // ── the grid tile ─────────────────────────────────────────────────────
    // One title line. The sign used to be its own line above the title — "E(1062) −"
    // over "E(1062)" — so the name showed twice and the lone minus read as a dash.
    {
      const rg = code.slice(code.indexOf('function renderGrid'));
      const tile = rg.slice(0, rg.indexOf('\n}\n'));
      ok(!/card-index/.test(tile) && (tile.match(/E\(\$\{e\.n\}\)/g) || []).length <= 2,
         'the tile names its entry once, not on two lines');
      ok(/<div class="card-label">E\(\$\{e\.n\}\)<span class="card-sign"[^>]*>\$\{signWord\}<\/span><\/div>/.test(tile),
         'with the sign as a word on the title line');
      // No "⟳" beside the status badge: it only meant "ECM runs logged", looked like a
      // refresh button that did nothing, and the tile's ECM line says the same.
      ok(!/badge-attempted" style="opacity:0\.6">⟳/.test(tile) && !/\$\{attemptBadge\}/.test(tile),
         'and no refresh-looking marker beside the status badge');
    }
    // Factor chips carry the date each factor was first recorded, from ONE pass over the
    // discovery history per modal, earliest row winning — the history's own merge rule.
    ok(/for \(const row of loadHistory\(\)\) \{\s*\n\s*if \(row && row\[0\] === n && \(foundAt\.get\(row\[4\]\) == null \|\| row\[1\] < foundAt\.get\(row\[4\]\)\)\)/.test(code),
       'chip dates come from the discovery history, earliest record winning');
    // A factor that came FROM FactorDB is dated by your check, not by FactorDB — the app
    // cannot know when FactorDB got it, and the wording must not pretend it does.
    ok(/prov === 'f' \? `FactorDB — first seen in your check on \$\{foundWhen\}`/.test(code),
       'a FactorDB-supplied factor says when your check first saw it, not "found on"');
    ok(/\$\{escHtml\(f\)\} \$\{tag\}\$\{provTag\}\$\{dateTag\}/.test(code), 'and the date shows on the chip itself');
  }
  ok(/'-digit cofactor'/.test(code) && /'covered to t' \+ covered/.test(code) && /'next: ' \+ next/.test(code),
     'giving the cofactor size, how far it is covered, and the next run');
  ok(/r\.have >= COST_TARGET_LO/.test(code),
     '"covered to" means the 63% target — the same line the grid\'s To 63% row uses');
  // `html`, not `src`: src is the script alone, and CSS lives in the <style> block.
  ok(!/\.prob-(grid|cell|d|b1|high|mid|low)\b/.test(html) && /color-mix\(in srgb, var\(--green\)/.test(html),
     'no CSS is left for the removed grids or the three colour bands, which shading replaced');
  ok(/95% interval \$\{r\.calibLo\.toFixed\(2\)\}–\$\{r\.calibHi\.toFixed\(2\)\}/.test(code),
     'with the interval in the tooltip, so the confidence is stated not implied');

  // ── the frontier band is actually applied ────────────────────────────────
  // ecmFrontier and belowFrontier are tested directly; that the export USES them
  // is not reachable. Without the filter the prompt would accept "<t20" and export
  // the whole ranked list — the worst outcome, because it looks like it worked.
  ok(/const frontierSet = frontierBelow\s*\n\s*\? new Set\(belowFrontier\(frontierBelow\)\.map\(e => e\.n\)\)/.test(code),
     'the export builds the frontier band when one was asked for');
  ok(/&& \(!frontierSet \|\| frontierSet\.has\(e\.n\)\)\);/.test(code),
     'and filters candidates through it');
  ok(/\[below t' \+ frontierBelow \+ ' only\]/.test(code),
     'and the export header says the run was restricted, so a short list is not a mystery');

  // ── the Euler value chunks must TILE the range ───────────────────────────
  // 45 filenames, written by hand. A missing one is invisible: the entries in that
  // range just read as "value not loaded" forever, the factor cache load skips
  // their records, and nothing says why.
  {
    const names = [...code.matchAll(/'(euler_values_(\d+)_(\d+)\.json)'/g)]
      .map(m => ({ file: m[1], a: parseInt(m[2]), b: parseInt(m[3]) }));
    ok(names.length > 40, 'the chunk list was found (' + names.length + ' files)');
    eq(names[0].a, 0, 'and starts at E(0)');

    const gaps = [];
    for (let i = 1; i < names.length; i++) {
      // Only even n exist, so the next chunk should start at prev_end + 2 — or at
      // prev_end itself, which is a harmless one-value overlap.
      if (names[i].a > names[i - 1].b + 2) {
        gaps.push('E(' + names[i - 1].b + ')..E(' + names[i].a + ')');
      }
    }
    eq(gaps, [], 'the chunks tile the range with no gap');

    const ascending = names.every((c, i) => i === 0 || c.a >= names[i - 1].a);
    ok(ascending, 'and are listed in order, so a misplaced entry is visible');
    ok(names.every(c => c.b > c.a), 'every chunk covers a real span');
  }

  // ── a partial load must be reported ──────────────────────────────────────
  // Only `loaded === 0` used to warn. One chunk failing out of forty-five was
  // silent, and everything downstream then treats those entries as uninteresting
  // rather than unavailable.
  ok(/const failed = chunks\.filter\(\(f, i\) => !results\[i\]\);/.test(code),
     'the failed chunks are identified, not just counted');
  ok(/\} else if \(failed\.length\) \{/.test(code),
     'and a partial failure is reported, not only a total one');
  ok(/'E\(' \+ m\[1\] \+ '\)–E\(' \+ m\[2\] \+ '\)'/.test(code),
     'naming the E(n) range rather than a chunk index, which is checkable');

  // ── bulk ECM uses the shared normaliser, not its own dedup ───────────────
  ok(/ecmData\[key\] = normalizeEcmAttempts\(\[\.\.\.ecmData\[key\], \{ \.\.\.attempt \}\]\);/.test(code),
     'bulk-logged attempts go through normalizeEcmAttempts');
  ok(!/function normNum\(s\)/.test(code),
     'and its own parseFloat-based key is gone — "250k" parsed as 250 there');

  // ── adding a factor by hand ──────────────────────────────────────────────
  // 87 lines that write to the factor store, with no test coverage at all until
  // this audit. Three faults, all invisible from the outside:
  //
  // 1. It divided by every stored factor UNCONDITIONALLY. BigInt division
  //    truncates, so one factor that does not divide made the cofactor unrelated
  //    to the entry — and a genuinely good new factor was rejected against it. On
  //    the 90 live entries holding E(n) as one of their own factors the remainder
  //    is exactly 1, so nothing could be added to them at all.
  // 2. It REPLACED the cache record, dropping fdbHas and fdbId. fdbHas is what
  //    stops the submission export sending FactorDB its own factors back, so
  //    adding one factor by hand re-armed the bug §14 exists to prevent.
  // 3. It recorded no provenance. 'm' is the manual source code — defined,
  //    documented, and written by nothing, so a hand-added factor belonged to
  //    nobody in the yield report and the finds column.
  ok(/const remaining = divideOutFactors\(eulerBig, \(e\.factors \|\| \[\]\)/.test(code),
     'the manual add uses the shared divide rule, not its own unchecked loop');
  ok(!/remaining = remaining \/ parseFactorExpr\(f\)\.value/.test(code),
     'the unconditional division is gone');
  ok(/const prev = fdbCache\[e\.val\] \|\| \{\};/.test(code)
     && /fdbCache\[e\.val\] = \{ \.\.\.prev,/.test(code),
     'and it merges into the cache record rather than replacing it');
  // The bookkeeping lives in commitKnownFactor, one function for every verified factor;
  // the manual path passes its own source code into it.
  ok(/commitKnownFactor\(n, e, factorStr, remaining, factorBig, 'm', 'manual', 'Manual factor'\)/.test(code)
     && /recordDiscovery\(n, factorStr, prov\)/.test(code),
     'a hand-added factor is attributed to the manual source');
  {
    // Scoped to the function BODY, so the guard cannot be satisfied by a
    // removeFdbUnknown call somewhere else in the file.
    const vi = code.indexOf('function commitKnownFactor');
    const body = code.slice(vi, code.indexOf('\n}\n', vi));
    ok(/removeFdbUnknown\(n\);/.test(body),
       'the fdb-unknown marker is retired through the shared function');
    ok(!/loadFdbUnknownSet\(\)[^;]*delete/.test(body),
       'and not by a hand-rolled set edit — a third place to keep in step');
  }

  // ── every write to a MEMOISED store must refresh its memo ────────────────
  // loadECM, loadHistory, loadCofDigitsCache and loadCalib each return a
  // module-level memo when one is set, so a write that reaches storage without
  // refreshing the memo leaves every reader in the session looking at the old data
  // — and it looks like the write silently did nothing.
  //
  // All five write paths are correct today. This is the generalisation of the
  // debounce bugs: there, readers bypassed the accessor; here, writers would.
  //
  // Scoped to the enclosing FUNCTION, not a line window. A first version used ±14
  // lines and reported saveECM as broken, because it refreshes the memo 38 lines
  // before it writes.
  {
    const memos = { COFDIG_KEY: '_cofDigCache', ECM_KEY: '_ecmCache',
                    HISTORY_KEY: '_historyCache', CALIB_KEY: '_calibCache' };
    const lines = code.split('\n');
    // Function spans, by brace depth from each declaration.
    const spanOf = (i) => {
      let start = i;
      for (let j = i; j >= 0; j--) {
        if (/^(?:async )?function \w+/.test(lines[j])) { start = j; break; }
      }
      let end = lines.length;
      for (let j = start + 1; j < lines.length; j++) {
        if (/^\}/.test(lines[j])) { end = j; break; }
      }
      return lines.slice(start, end + 1).join('\n');
    };
    const stale = [];
    for (const [key, memo] of Object.entries(memos)) {
      for (let i = 0; i < lines.length; i++) {
        if (!lines[i].includes('kvSet(' + key)) continue;
        const body = spanOf(i);
        // Safe if the function ASSIGNS the memo, or if the write SERIALISES it —
        // saveCofDigitsCacheQuiet does the latter, its whole job being to persist
        // the memo, and a rule demanding an assignment called that a bug.
        const assigns = new RegExp('\\b' + memo + '\\s*=').test(body);
        const writesFromMemo = lines[i].includes(memo);
        if (!assigns && !writesFromMemo) {
          stale.push(key + ' written at line ' + (i + 1) + ' without refreshing ' + memo);
        }
      }
    }
    eq(stale, [], 'every write to a memoised store refreshes its memo');
  }

  // ── and must not claim more copies of a prime than the number has ────────
  // Expansion turns 5^3 into 5*5*5, so a stored exponent that does not divide
  // becomes "E(n)=71*71*839" when only one 71 divides — a false statement to a
  // public database. euler.py submit's check refuses the surplus now, but it is the
  // LAST gate, not the first: a file full of claims that get refused wastes the run
  // and reads like a fault in the submitter.
  //
  // Imports are clamped at the door, so new bad exponents cannot arrive. Anything
  // stored before that still sits in the file and reaches the export.
  ok(/const cl = clampExponentsToValue\(ours, e\.val\);/.test(code),
     'the export clamps the stored exponents against the value');
  {
    const ci = code.indexOf('clampExponentsToValue(ours, e.val)');
    // NOT a comment as the anchor: `code` has comments stripped, so an indexOf on
    // one returns -1 and the ordering check passes or fails by accident. Third time
    // this has bitten in this file.
    const xi = code.indexOf('const expanded = [];');
    ok(ci > 0 && xi > ci, 'and does it BEFORE expanding — after would be too late');
  }
  ok(/for \(const f of submitFactors\) \{/.test(code),
     'the expansion reads the clamped list, not the raw one');

  // ── one rule for "FactorDB does not have this" ───────────────────────────
  // fdbCheckListSets carried its own, cruder copy: "we have something FactorDB
  // lacks IFF the record did not come from FactorDB", ignoring both fdbHas and
  // provenance. It disagreed with the shared rule on exactly the interesting
  // entries — one FactorDB sourced, fdbHas naming what it holds, our own ECM having
  // found more — and left them out of the check list. aheadOfFdbTargets, a dozen
  // lines above it, already used the shared rule.
  ok(/submitted:\s*base\.filter\(e => factorsFdbLacks\(e\)\.length > 0\)/.test(code),
     'the check list uses factorsFdbLacks rather than its own version');
  ok(!/return !\(cached && cached\.source === 'fdb'\);/.test(code),
     'and the cruder copy is gone');

  // ── the cheap integrity pass must run BEFORE the budgeted loop ───────────
  // The scan walks allEntries in order and stops at a deadline. Entries are ordered
  // by n, so the largest are last AND the most expensive to reach — and that is
  // exactly where "E(n) among its own factors" lives: 90 live entries, every one a
  // 57,000-digit monster at the tail. The check for them was always correct; the
  // scan reported "no inconsistencies found" having never looked.
  //
  // Asserted as ORDER, not behaviour: INTEGRITY_BUDGET_MS is a const in the
  // harness, so a test cannot starve the budget to reproduce it — an earlier
  // attempt assigned to it and passed without testing anything at all.
  {
    const scan = code.indexOf('async function runDataIntegrityCheck');
    const pass = code.indexOf('wholeValueSeen.add(e.n)', scan);
    const loop = code.indexOf('for (let i = 0; i < allEntries.length; i++)', scan);
    ok(pass > scan && loop > pass,
       'the complete cheap pass runs before the loop that can time out');
    ok(/wholeValueSeen\.has\(e\.n\)/.test(code),
       'and the budgeted check defers to it so nothing is reported twice');
  }

  // The export must SKIP an entry that leaves nothing to send, and must decide that
  // per factor. Skipping by the entry's source tag made 1,909 entries holding our
  // own discoveries unexportable, because `source` records only the most recent
  // writer and any FactorDB re-check overwrites it.
  ok(/if \(!factorsFdbLacks\(e\)\.length\) \{ skippedFdb\+\+; continue; \}/.test(code),
     'the export skips an entry only when factorsFdbLacks leaves nothing');
  {
    // No OTHER site may decide WHAT TO SEND from the source field alone.
    //
    // Name-aware, not a global count: reconcileSubmitted reads the same field to
    // answer a different question — "has FactorDB since confirmed this entry?" —
    // and a blanket count flagged it. The rule is about the withholding decision,
    // not about touching `source`.
    const lines = code.split('\n');
    const offenders = [];
    for (let i = 0; i < lines.length; i++) {
      if (!/\.source === 'fdb'/.test(lines[i])) continue;
      let fn = '(top)';
      for (let j = i; j >= 0; j--) {
        const m = /^(?:async )?function (\w+)/.exec(lines[j]);
        if (m) { fn = m[1]; break; }
      }
      // factorsFdbLacks   — the withholding decision itself.
      // reconcileSubmitted — a different question: has FactorDB since confirmed it?
      // mergeFactorRecords — SETS the field (downgrading 'fdb' to 'import' when the
      //                      union grew), rather than reading it to withhold.
      const allowed = ['factorsFdbLacks', 'reconcileSubmitted', 'mergeFactorRecords'];
      if (!allowed.includes(fn)) offenders.push(fn);
    }
    eq(offenders, [],
       'only factorsFdbLacks decides what to withhold, and only reconcileSubmitted '
       + 'reads the source for its own separate question');
  }

  // ── the migration must actually RUN ──────────────────────────────────────
  // A correct migration nobody calls is a console command with extra steps, which
  // is what this replaced. It belongs beside the other one-time migrations on load.
  ok(/try \{ migrateFalseFdbUnknown\(\); \} catch/.test(code),
     'the false-unknown migration runs on load');
  {
    // …in the same block as the others, so it cannot drift out of the sequence.
    const i = code.indexOf('migrateSigmaHashes();');
    const j = code.indexOf('migrateFalseFdbUnknown();');
    ok(i > 0 && j > i && (j - i) < 400,
       'and sits with the other migrations rather than somewhere of its own');
  }

  // ── a failed check must consult the distinction before marking ───────────
  // Only a real verdict may mark an entry fdb-unknown — never a transport failure.
  // That is what wrote 2,650 false marks. The classifier that told the two apart
  // (fdbDeclinedToAnswer) went with the in-browser check, so now only the two sites
  // below may mark at all; a new one must be justified here, not waved through.
  // The site this named (quickCheckFDB) went with the in-app check. The enumeration
  // below is the stronger guard anyway: it requires EVERY surviving site to ask,
  // rather than naming one and trusting the rest.
  {
    // And no OTHER catch may set the status without asking.
    const bad = [];
    const lines = code.split('\n');
    for (let i = 0; i < lines.length; i++) {
      if (!/status = 'fdb-unknown'/.test(lines[i])) continue;
      const ctx = lines.slice(Math.max(0, i - 6), i + 1).join('\n');
      // Two sites legitimately mark without asking:
      //   applyFdbResult   — FactorDB ANSWERED with status 'U'. That is a verdict,
      //                      not a failure, so there is no error to classify.
      //   markAsFdbUnknown — the user pressed the button. Their call, not ours.
      // Report the FUNCTION, not a line number. `code` has comments stripped, so its
      // line numbers do not match index.html and chasing one lands in an unrelated
      // function — which has happened repeatedly while writing these guards.
      let fn = '(top)';
      for (let j = i; j >= 0; j--) {
        const m = /^(?:async )?function (\w+)/.exec(lines[j]);
        if (m) { fn = m[1]; break; }
      }
      // Two sites legitimately mark without asking:
      //   applyFdbResult   — FactorDB ANSWERED with status 'U'. That is a verdict,
      //                      not a failure, so there is no error to classify.
      //   markAsFdbUnknown — the user pressed the button. Their call, not ours.
      const legit = fn === 'applyFdbResult' || fn === 'markAsFdbUnknown';
      if (!legit) bad.push(fn);
    }
    eq(bad, [], 'every site that marks fdb-unknown checks it was a refusal first');
  }

  // ── nothing may write an "unknown" record inline ─────────────────────────
  // Five sites did, and each one silently dropped fdbHas, fdbId and source. They
  // now go through which merges. A sixth appearing is the real
  // regression risk — the helper is easy to bypass by writing the obvious literal —
  // so this pins the ABSENCE of the pattern rather than the presence of the helper.
  {
    const inline = [];
    const lines = code.split('\n');
    for (let i = 0; i < lines.length; i++) {
      if (!/fdbCache\[[^\]]+\]\s*=\s*\{/.test(lines[i])) continue;
      const ctx = lines.slice(i, i + 3).join('\n');
      if (ctx.includes('...')) continue;          // merges: fine
      let fn = '(top)';
      for (let j = i; j >= 0; j--) {
        const m = /^(?:async )?function (\w+)/.exec(lines[j]);
        if (m) { fn = m[1]; break; }
      }
      inline.push(fn + ' at line ' + (i + 1));
    }
    eq(inline, [],
       'every whole-record write to fdbCache merges with what is already there — '
       + 'a replacing write loses fdbHas, which is what stops the export offering '
       + 'FactorDB its own factors back');
  }

  // ── the submission export must not emit a line with no factors ───────────
  // The app WRITES this file and euler.py submit READS it, so a format mismatch
  // loses work silently. Round-tripped across the two programs: the basic format
  // survives, but expansion can empty a non-empty list ("5^0" expands to nothing),
  // producing "<value>=" — which the parser skips as unparseable, so the entry is
  // never submitted, while the export's summary counted it as ONE factor because
  // ''.split('*') is [''].
  //
  // The parser and verify() were checked directly rather than assumed: malformed
  // factors like "5 ^ 2" are refused as "not a decimal number", so nothing bad
  // reaches FactorDB. What was wrong was the app reporting work it had not done.
  ok(/if \(!expanded\.length\) \{ skippedAllFdb\+\+; continue; \}/.test(code),
     'an entry whose factors all expand away is skipped, not written as an empty line');
  {
    const gi = code.indexOf('if (!expanded.length)');
    const gj = code.indexOf("lines.push(e.val + '=' + expanded.join");
    ok(gi > 0 && gj > gi, 'and the check comes BEFORE the line is written');
  }
  ok(/\.split\('\*'\)\.filter\(Boolean\)\.length/.test(code),
     'the factor total filters empties, so it cannot overstate by construction');

  // ── EVERY raw reader of the cache store must flush first ─────────────────
  // saveFDBCache is debounced. loadFDBCache owns its own flush, so callers that go
  // through it are safe — but anything reading kvGet(STORAGE_KEY) DIRECTLY bypasses
  // that and can see the previous version of the store.
  //
  // Two regressions came from exactly this, both from the same change: the pull's
  // change-detection snapshots, and buildSyncPayload — which is what gets pushed to
  // GitHub, so a stale read there ships the wrong data to every other machine.
  //
  // Enumerated rather than remembered: this finds the raw readers and requires a
  // flush within the preceding lines of each, so the next one cannot be added
  // quietly.
  {
    const lines = code.split('\n');
    const unflushed = [];
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].includes('kvGet(STORAGE_KEY)')) continue;
      const ctx = lines.slice(Math.max(0, i - 14), i).join('\n');
      if (!ctx.includes('flushFDBCache')) {
        let fn = '(top level)';
        for (let j = i; j >= 0; j--) {
          const m = /^(?:async )?function (\w+)/.exec(lines[j]);
          if (m) { fn = m[1]; break; }
        }
        unflushed.push(fn + ' at line ' + (i + 1));
      }
    }
    eq(unflushed, [],
       'every direct read of the cache store flushes the debounced save first');
  }

  // ── the pull's change-detection must not be fooled by a pending write ────
  // githubPull decides whether a pull ADDED anything by snapshotting storage
  // before and after the merge, so it can restore the dirty flag when nothing
  // changed rather than manufacturing a spurious auto-push on every load.
  //
  // saveFDBCache is debounced, so a save from work that just finished may not be
  // on disk when the first snapshot is taken. mergeSyncPayload then flushes it
  // while loading the local cache, the second snapshot sees it land, and the pull
  // reports a change the remote had nothing to do with. A regression introduced by
  // the debounce itself, defeating the exact thing this code exists for.
  //
  // Both snapshots are taken with the store flushed, so they measure the same
  // thing. kvSet's own debounce is not affected: kvGet reads the pending map first.
  {
    const i = code.indexOf('function mergePulledMain');
    const body = code.slice(i, code.indexOf('\n}\n', i));
    const flushPos = body.indexOf('flushFDBCache');
    const beforePos = body.indexOf('const snapBefore');
    const afterPos = body.indexOf('const snapAfter');
    ok(flushPos > 0 && flushPos < beforePos,
       'the store is flushed BEFORE the first snapshot');
    ok(body.slice(beforePos, afterPos).includes('flushFDBCache'),
       'and again before the second, so a write from the merge is counted');
    ok(/if \(snapAfter === snapBefore\) restoreDirty\(dirtyBefore\);/.test(body),
       'and an unchanged pull restores the dirty flag rather than inventing one');
    // The pull ENDS by restoring what was pending before it, not by marking clean:
    // what it brought came from GitHub, but anything already waiting still is. An
    // unconditional markClean() here turned the dot off with changes still unpushed.
    ok(/\n  restoreDirty\(dirtyBefore\);\n/.test(body + '\n') && !/markClean\(\); \/\/ just synced with remote/.test(body),
       'a pull ends by restoring what was pending, not by marking everything clean');
  }

  // ── an identical file is never re-sent ────────────────────────────────────
  // The ECM push used to skip an unchanged upload with a content signature that had to
  // be cleared on every path, and dropping one clear meant data silently never reached
  // GitHub. The chunked push needs no such state: each file's git blob ID is computed
  // from what would be sent and compared with GitHub's own.
  ok(/if \(listing && listing\[path\] === sha\) continue;/.test(code), 'a file GitHub already holds exactly is not sent again');
  ok(!/_lastPushedEcmSig/.test(code), 'and the old signature, with its many ways to go stale, is gone');

  // ── caches derived from storage are dropped when storage changes ─────────
  // invalidateProbeFree was defined and never called — the same shape as
  // invalidateYieldCalib, which turned out to be a real bug. After clearing
  // everything, a cached "headroom low" reading survives for up to 60 seconds and
  // describes a store that no longer exists.
  ok(/function clearAllLocalData\(\)[\s\S]{0,4000}?invalidateProbeFree\(\);/.test(code),
     'clearing all local data drops the cached free-space probe');

  // ── one implementation of divide-by-factors ──────────────────────────────
  // getCofactor and getCofactorDigits each carried their own copy, already drifted
  // in structure. Their CONTRACTS differ on purpose — one exact, one a bounded
  // bit-length estimate — but the division is the same rule, and a fix to the
  // fallback in one would have left the other wrong.
  ok(/function divideOutFactors\(vBig, factors\)/.test(code),
     'the divide-by-factors rule has a single implementation');
  ok(/vBig = divideOutFactors\(vBig, factors\);/.test(code),
     'and getCofactor uses it rather than repeating it');
  // The product loop was the LAST copy. The fallback was already shared —
  // getCofactorDigits delegates to getCofactor for it, deliberately, because the
  // bad-data path wants the exact count and is rare enough to afford one.
  ok(/function factorProduct\(factors\)/.test(code),
     'the product of a factor list is built in one place');
  ok((code.match(/factorProduct\(factors\)/g) || []).length >= 3,
     'and both callers use it, rather than one keeping a copy');
  ok(/const gc = getCofactor\(e\);/.test(code),
     'getCofactorDigits delegates its bad-data path to the exact function');
  // Two contracts, on purpose: exact vs a bounded bit-length estimate. Merging
  // them would make the fast path pay for a decimal conversion on every entry.
  ok(/_nearCofDigBoundary\(est\) \? cof\.toString\(\)\.length : est/.test(code),
     'while keeping its own fast estimate, refined only near a decision boundary');

  // ── "most CPU on one E(n)" is the view you land on ───────────────────────
  // It is the one that answers "where is my time going", which is the question the
  // section exists for; the others are follow-ups.
  ok(/let _runStatsMode = 'entry-cpu';/.test(code),
     'the run statistics open on most-CPU-per-entry');
  ok(/RUN_STATS_MODES = \[\s*\n\s*\{ key: 'entry-cpu'/.test(code),
     'and it is first in the selector, so the list order matches the default');

  // ── the run tables render P±1 in its own units ───────────────────────────
  // ecmRunStats returns null curves for a P±1 row; the table has to show that as a
  // dash rather than filling in a 1, which is what the yield table already does and
  // what the units actually are.
  ok(/r\.curves == null \? '—' : r\.curves\.toLocaleString\(\)/.test(code),
     'a P±1 row shows a dash for curves, not an invented 1');
  ok(/'E\(n\)', 'digits', 'curves', 'P±1', 'CPU', 'ECM finds'/.test(code),
     'and the per-entry view has a column for P±1 passes beside the curve count');

  // ── a long run is called out, not hidden and not substituted ─────────────
  // The recommender proposes the natural next bound whatever it costs, so the
  // length has to be visible somewhere. This is that somewhere.
  // The LOGIC, not the prose. A guard on the message passes with the whole block
  // behind `if (false)` — the strings are still in the source, sitting in a dead
  // branch. Two mutations walked through exactly that hole before this was fixed.
  ok(/const LONG = 12 \* 3600;/.test(code),
     'the long-run threshold is 12 hours');
  ok(/const longRuns = top\.filter\(r => \(r\.cpuTime \|\| 0\) > LONG\);/.test(code),
     'and selects only runs actually over it — a filter that matches everything says nothing');
  ok(/if \(longRuns\.length\) \{/.test(code),
     'the note is emitted when there are long runs, and not otherwise');
  ok(/run\(s\) exceed 12 hours on one core/.test(code),
     'saying how many');
  ok(/cannot be checkpointed/.test(code) && /a time budget excludes them if that matters/.test(code),
     'why it matters, and that the budget is what excludes them');

  // ── the export actually applies the budget ───────────────────────────────
  // parseRunBudget and fillRunBudget are tested directly; that exportNextRuns USES
  // them is not reachable. Reverting that one line restores the old behaviour with
  // the new prompt still on screen — the worst outcome, because "8h" would be
  // accepted and quietly ignored.
  ok(/const filled = fillRunBudget\(ranked, budget\);/.test(code),
     'the export fills against the budget rather than slicing by count');
  ok(/const budget = parseRunBudget\(capInput, /.test(code),
     'and parses what was typed rather than stripping it to digits');
  ok(!/parseInt\(capInput\.replace\(\/\[\^0-9\]\/g, ''\)\)/.test(code),
     'the old digits-only reading is gone — it would turn "8h" into 8 runs');
  ok(/budget\.kind === 'time'/.test(code),
     'and the summary reports what a time budget bought');

  // ── the check-list export: five sets, one keyword table, an honest message ──
  // Every option takes its keyword from the ONE table and its count and size from
  // its own list — no separately kept totals to report against the wrong set.
  ok(/match: FDB_CHECK_SET_MATCH\[o\.key\]/.test(code) && /bytes: bytesOf\(sets\[o\.key\]\)/.test(code),
     'every check-list option takes its keyword from the one table, and its size from its own list');
  for (const k of ['submitted', 'never', 'old', 'fdb', 'everything'])
    ok(new RegExp("\\{ key: '" + k + "',").test(code), 'the export prompt offers "' + k + '"');
  // The old message told EVERY export it was "above 19,441 digits" and "just under
  // the 19,442-digit size FactorDB rejected" — including "everything", which had no
  // size limit at all, and euler.py has none.
  {
    const ex = code.slice(code.indexOf('function exportFDBCheckList'));
    const body = ex.slice(0, ex.indexOf('\n}\n'));
    ok(!/threshold/.test(body) && !/FactorDB rejected/.test(body) && !/above ' \+/.test(body),
       'the export no longer talks about size limits it does not have');
    ok(/no size limit/.test(body), 'and says plainly that euler.py has none');
  }

  // ── no harness may extract the same thing twice ──────────────────────────
  // Three duplicates had accumulated in sandbox 1 without breaking anything, which
  // is exactly why they accumulated. They only turn fatal when the repeated name is
  // a const — a second `const X = …` in one script is a SyntaxError, and the whole
  // suite stops with a message about a redeclaration rather than about the edit
  // that caused it.
  //
  // Checked per array, not across the file: three harnesses legitimately extract
  // the same helper, because each builds a separate script. A first version of
  // this scan compared them all together, reported five duplicates that were not
  // duplicates, and "fixing" them broke the build.
  {
    const lines = fs.readFileSync(__filename, 'utf8').split('\n');
    const dupes = [];
    for (let i = 0; i < lines.length; i++) {
      if (!/const (?:body|harnessSrc|harness2)\s*=\s*\[/.test(lines[i])) continue;
      let end = i + 1;
      while (end < lines.length && !/^\s*\]\.join/.test(lines[end])) end++;
      const seen = new Set();
      for (let j = i; j < end; j++) {
        const m = /extract(?:Fn|Const|Let)\('([A-Za-z_0-9]+)'\)/.exec(lines[j]);
        if (!m) continue;
        if (seen.has(m[1])) dupes.push(m[1] + ' (line ' + (j + 1) + ')');
        seen.add(m[1]);
      }
    }
    eq(dupes, [], 'no harness extracts the same name twice');
  }

  // Every onclick handler in the HTML must resolve to a real function.
  const handlers = [...new Set([...html.matchAll(/onclick="(\w+)\(/g)].map(m => m[1]))];
  const dangling = handlers.filter(h =>
    !new RegExp('(async\\s+)?function\\s+' + h + '\\s*\\(').test(src));
  eq(dangling, [], 'every onclick handler resolves to a defined function');

  // Element ids referenced from JS via getElementById should exist in the HTML,
  // for the ids this app creates statically (dynamic ones are skipped).
  const staticIds = [...new Set([...html.matchAll(/id="([a-zA-Z][\w-]*)"/g)].map(m => m[1]))];
  const referenced = [...new Set([...src.matchAll(/getElementById\('([a-zA-Z][\w-]*)'\)/g)].map(m => m[1]))];
  const missingIds = referenced.filter(id => !staticIds.includes(id));
  // Some ids are created at runtime; assert only that the well-known static ones exist.
  const mustExist = ['statsBar', 'modalBody', 'modalTitle', 'modalBackdrop', 'fdbStatusText'];
  const reallyMissing = mustExist.filter(id => !staticIds.includes(id));
  eq(reallyMissing, [], 'core UI element ids exist in the HTML');
}


// ── fast host-realm harness for the pure numeric functions ───────────────────
// Code compiled into a vm context runs far slower than code compiled in the host
// realm — measured at 38x on dickmanRho, which dominates the recommendation tests
// and made them ~28s of a ~31s suite. (Letting the vm use its own built-ins was
// slower still, so it is the vm compilation itself, not cross-realm access.)
//
// The whole suite cannot simply move off vm: several tests override extracted
// functions (loadECM, factorizeSmall) by assigning to the sandbox, and under
// `new Function` a function DECLARATION shadows the sandbox property, so those
// overrides would silently stop working. That is a correctness trap, so the vm
// sandboxes stay as they are.
