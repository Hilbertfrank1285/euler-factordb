// ── shared test fixtures ─────────────────────────────────────────────────────
// These were being recomputed in group after group: nine prime searches for five
// distinct values, and eleven copies of the same two composites. Derived once,
// lazily, so a group that never needs a 299-digit prime does not pay for one.
const FIX = (() => {
  const cache = {};
  return {
    // Lazily derived so a group that never needs a 299-digit prime does not pay for one.
    prime(d) {
      const k = 'p' + d;
      if (!cache[k]) { let p = 10n ** BigInt(d); while (!sandbox.isProbablePrime(p)) p++; cache[k] = p; }
      return cache[k];
    },
    // Composites used as stand-ins for unfactored cofactors.
    comp200:  10n ** 200n  + 4747n,
    comp300:  10n ** 300n  + 4747n,
    comp2000: 10n ** 2000n + 4747n,
  };
})();

