// ── a composite factor is split — or kept, never lost ──────────────────────────
// A real import: GMP-ECM found 5497940873535604155393005611 (28d) on E(5710) — two
// primes, 15059306829971 x 365085919000841, found by one curve. The splitter (Floyd,
// a gcd every step, 800 ms) could not split it, and the import then DROPPED it: the
// summary said "run logged", and the find was gone.
groupAsync('composite-factors-split-or-kept', async () => {
  if (!sandbox.processEcmLogText || !sandbox.factorizeSmall || !sandbox.recordEcmFactor) return;
  const fs1 = sandbox.factorizeSmall;
  eq(fs1(1000003n * 1000033n).map(String), ['1000003', '1000033'], "Brent's rho splits a small composite within the old 800 ms");
  const P = 1000000000000000000012369n, Q = 3000000000000000000000703n;   // two 25-digit primes
  const t0 = Date.now(), none = fs1(P * Q, 300);
  ok(none === null && Date.now() - t0 < 1500, 'a composite beyond rho gives up when its time is up, rather than hanging the import');
  const log = (n, V, comp) => [
    '# run ECM B1=3000 E(' + n + ') ' + V.length + 'd - ECM target 10d - ~1 s - +50.00%',
    'Input number is ' + V + ' (' + V.length + ' digits)',
    'Using B1=3000, B2=224406, polynomial x^1, sigma=1:1174973966',
    'Step 1 took 1ms', 'Step 2 took 1ms',
    '********** Factor found in step 2: ' + comp,
    'Found composite factor of ' + comp.length + ' digits: ' + comp,
  ].join('\n');
  const fresh = (n, V) => {
    sandbox.allEntries.length = 0; for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.__ecm = {};
    sandbox.allEntries.push({ n, val: V, status: 'partial', factors: ['71'] }); sandbox.eulerValues[n] = V;
  };
  const bases = (n) => (sandbox.allEntries.find(x => x.n === n).factors || []).map(f => String(f).split('^')[0]);
  // the real one: split, through the real import
  const comp = '5497940873535604155393005611';
  const V1 = String(71n * BigInt(comp) * 1000000007n);
  fresh(5710, V1);
  await sandbox.processEcmLogText(log(5710, V1, comp), 'e5710.log');
  ok(bases(5710).includes('15059306829971') && bases(5710).includes('365085919000841'),
     'the 28-digit composite from E(5710) is split into its two primes, and both are recorded');
  // one that cannot be split in time: KEPT as one factor, not dropped
  const V2 = String(71n * P * Q * 1000000007n);
  fresh(5712, V2);
  const keepMs = sandbox.COMPOSITE_SPLIT_MS;
  sandbox.COMPOSITE_SPLIT_MS = 300;
  try { await sandbox.processEcmLogText(log(5712, V2, String(P * Q)), 'e5712.log'); }
  finally { sandbox.COMPOSITE_SPLIT_MS = keepMs; }
  const e2 = sandbox.allEntries.find(x => x.n === 5712);
  ok(bases(5712).includes(String(P * Q)), 'a composite that cannot be split yet is KEPT as one factor — never lost');
  eq(e2.status, 'partial', 'and the entry stays partially factored');
  // a known composite never makes an entry fully factored
  const e3 = { n: 9, val: String(71n * P * Q), status: 'partial', factors: ['71'] };
  sandbox.allEntries.length = 0; sandbox.allEntries.push(e3);
  sandbox.recordEcmFactor(e3, String(P * Q), 'ECM', { composite: true });
  eq(e3.status, 'partial', 'even when the factors multiply to E(n), an unsplit composite among them means not fully factored');
  const e4 = { n: 11, val: String(71n * 1000003n), status: 'partial', factors: ['71'] };
  sandbox.allEntries.length = 0; sandbox.allEntries.push(e4);
  sandbox.recordEcmFactor(e4, '1000003', 'ECM');
  eq(e4.status, 'full', 'while a prime completing the factorization still does');
});

group('b1-to-digits-remembers', () => {
  if (!needs(PURE, 'b1ToDigits')) return;
  const f = PURE.b1ToDigits;
  const inputs = ['11000', '50000', '250000', '1e6', '3e6', '11e6', '4.3e7', '1.1e8', '0', '', '1', 'abc', 11000];
  f._memo = new Map();
  const first = inputs.map(x => f(x));
  eq(JSON.stringify(inputs.map(x => f(x))), JSON.stringify(first), 'asked again, it gives the same answers');
  f._memo = new Map();
