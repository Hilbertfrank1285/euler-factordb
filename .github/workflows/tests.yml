// Run a group of assertions, converting an unexpected throw into a reported
// failure rather than letting it abort the whole suite. Before this, one crash
// meant every subsequent test silently never executed.
// Async groups run SEQUENTIALLY, not concurrently. They share sandbox state
// (allEntries, fdbCache), so overlapping them lets one group's fixtures clobber
// another's mid-await — which produced failures that looked like real bugs but
// were pure test interference.
let asyncChain = Promise.resolve();
const asyncGroups = [];
function groupAsync(name, fn) {
  asyncChain = asyncChain
    .then(fn)
    .catch(e => { failed++; failures.push('[' + name + '] threw before finishing: ' + (e && e.message ? e.message : e)); });
  asyncGroups.push(asyncChain);
}
// A group whose dependency is missing is a group that ISN'T RUNNING, and saying
// so is the whole point. These guards used to read `{ passed++; return; }` — a
// fake pass — so dropping one function from the M export list silently removed ten
// assertions and left the suite reporting green. Nobody watches the count, so the
// only signal was a number quietly getting smaller.
//
// `!M` alone stays quiet: the harness catch already reports that once, and
// repeating it per group would bury the real error under seventeen copies.
// Read from index.html rather than restated, so a change there cannot leave the
// budget assertions describing a limit that no longer exists.
const BREAKER_LIMIT_N = parseInt((/const FDB_BREAKER_LIMIT\s*=\s*(\d+)/.exec(src) || [0, '8'])[1], 10);

function needs(obj, ...names) {
  if (!obj) return false;                     // already reported by the harness
  const missing = names.filter(n => typeof obj[n] !== 'function');
  if (!missing.length) return true;
  failed++;
  failures.push('group skipped — not exported from the sandbox: ' + missing.join(', '));
  return false;
}

function group(name, fn) {
  try { fn(); }
  catch (e) {
    failed++;
    failures.push('[' + name + '] threw before finishing: ' + (e && e.message ? e.message : e));
  }
}

if (M) group('sandbox2', () => {
  // ── Regression: default B2 must come from the verified table, not a flat multiple
  // The shipped bug: B2 was assumed to be 18*B1. A real run at B1=110,000,000 had
  // B2 = 4,537,600,561,228 — a ratio of ~41,000x, so the model was wrong by >2000x.
  {
    const rows = [[11e3,1.9e6],[5e4,1.3e7],[25e4,1.3e8],[1e6,1.0e9],[11e7,7.8e11],[85e7,1.6e13]];
    let allClose = true;
    for (const [b1, want] of rows) {
      const got = M.ecmDefaultB2(b1);
      if (Math.abs(got - want) / want > 0.01) allClose = false;
    }
    ok(allClose, 'ecmDefaultB2 reproduces the verified ECM_TABLE B2 column');
    const r = M.pm1DefaultB2(110000000) / 110000000;
    ok(r > 1000, 'pm1DefaultB2 ratio is in the thousands, not ~18 (the shipped bug)');
    ok(M.pm1DefaultB2(1e6) < M.pm1DefaultB2(1e7), 'pm1DefaultB2 increases with B1');
  }

  // ── Invariant: B1 must be monotonic in target digits
  // The shipped bug: a 15-digit entry spliced in from a different dataset gave
  // B1=12,322 at t15 vs 11,000 at t20 — a larger target needing a SMALLER bound.
  {
    let mono = true;
    for (let d = 10; d < 65; d++) if (M.ecmTableB1(d) > M.ecmTableB1(d + 1) + 1e-9) mono = false;
    ok(mono, 'ecmTableB1 is monotonically non-decreasing in target digits');
  }

  // ── Invariant: cost rises with work
  {
    const a = M.estimateCpuSecondsRaw('ECM', 250000, null, 100, 300);
    const b = M.estimateCpuSecondsRaw('ECM', 250000, null, 200, 300);
    ok(b > a, 'estimated cost increases with curve count');
    const c = M.estimateCpuSecondsRaw('ECM', 1e6, null, 100, 300);
    ok(c > a, 'estimated cost increases with B1');
    const d = M.estimateCpuSecondsRaw('ECM', 250000, null, 100, 600);
    ok(d > a, 'estimated cost increases with cofactor size');
  }

  // ── Regression: measured time must win over the model
  {
    const withMs = M.attemptCpuSeconds({ method:'ECM', b1:'250000', curves:'100', ms: 42000 }, 300);
    eq(withMs, 42, 'attemptCpuSeconds uses the measured ms when present');
    const noMs = M.attemptCpuSeconds({ method:'ECM', b1:'250000', curves:'100' }, 300);
    ok(noMs > 0 && noMs !== 42, 'attemptCpuSeconds falls back to the model without ms');
    ok(M.allMeasured([{ms:1},{ms:2}]) === true, 'allMeasured true when every attempt is measured');
    ok(M.allMeasured([{ms:1},{}]) === false, 'allMeasured false when any attempt lacks ms');
  }

  // ── Regression: partial progress must reduce what's recommended
  // The shipped bug: a "batch to at least 50 curves" floor collapsed to the full
  // level target whenever that target was <= 50, so 7-of-26 curves done still
  // recommended 26 more instead of 19.
  {
    const attempts = [{ method:'ECM', b1:'2420', curves:'7' }];
    const recs = PURE.recommendNextRun(1000, attempts);
    const t15 = recs.find(r => r.targetDigits === 15 && r.method === 'ECM');
    if (t15) {
      const fresh = PURE.recommendNextRun(1000, []).find(r => r.targetDigits === 15 && r.method === 'ECM');
      ok(fresh ? t15.rawCurves < fresh.rawCurves : true,
         'partial progress at a level recommends FEWER curves than starting fresh');
    } else { passed++; }
    ok(recs.every(r => r.rawCurves >= 0), 'recommended curve counts are never negative');
  }

  // ── Regression: P-1/P+1 escalation nets out prior coverage
  {
    const fresh = PURE.recommendNextRun(300, []).concat();
    const after = PURE.recommendNextRun(300, [{ method:'P-1', b1:'1000000', b2:'18000000' }]);
    const fp = fresh.find(r => r.method === 'P-1');
    const ap = after.find(r => r.method === 'P-1');
    if (fp && ap) ok(parseFloat(ap.gain) < parseFloat(fp.gain),
      'escalated P-1 shows a smaller gain than a first P-1 (prior coverage netted out)');
    else passed++;
  }

  // ── Regression: sigmas must be compacted, and ms/date preserved, on normalize
  {
    const raw = '14754818392207826063';
    const out = M.normalizeEcmAttempts([{ method:'ECM', b1:'11000', curves:'1', sigmas:[raw], ms: 5000, date:'2026-01-01' }]);
    ok(out[0].sigmas[0] !== raw, 'normalizeEcmAttempts hashes a raw decimal sigma');
    ok(out[0].sigmas[0].length <= 7, 'hashed sigma is compact');
    eq(out[0].ms, 5000, 'normalizeEcmAttempts preserves measured ms');
    eq(out[0].date, '2026-01-01', 'normalizeEcmAttempts preserves date');
  }
  {
    // merging duplicate reports of the same work must not double-count time
    const a = { method:'ECM', b1:'11000', curves:'5', sigmas:['a','b'], ms: 1000 };
    const b = { method:'ECM', b1:'11000', curves:'5', sigmas:['a','b'], ms: 1000 };
    const out = M.normalizeEcmAttempts([a, b]);
    eq(out.length, 1, 'same method+B1 attempts collapse to one');
    eq(out[0].ms, 1000, 'overlapping reports take max ms, not the sum');
  }

  // ── Regression: factor/status encoding must round-trip exactly
  {
    const before = M._encodeFactor('12345678901234567890123456789');
    eq(M._decodeFactor(before), '12345678901234567890123456789', 'factor base36 encoding round-trips');
    ok(before.length < 29, 'base36 encoding is shorter than decimal');
    eq(M._decodeFactor('999'), '999', 'un-prefixed (legacy) factor passes through unchanged');
  }

  // ── Regression: saveECM must not drop fields on write
  // The shipped bug: the slimming whitelist omitted `date`, silently blanking the
  // DATE column, and would have dropped `ms` the same way.
  {
    sb2.__ls = {}; sb2.M.loadECM && (sb2.M.saveECM({}));
    M.saveECM({ '100': [{ method:'ECM', b1:'11000', curves:'3', sigmas:['x'], ms: 7000, date:'2026-02-03', source:'log' }] });
    const round = JSON.parse(M.kvGet('eulerFDB_ecm_v1'));
    eq(round['100'][0].ms, 7000, 'saveECM preserves measured ms');
    eq(round['100'][0].date, '2026-02-03', 'saveECM preserves date');
    eq(round['100'][0].curves, '3', 'saveECM preserves curve count');
  }

  // ── Regression: fdbCache save/load round-trip
  {
    const val = '7'.repeat(60);
    sb2.eulerValues[42] = val;
    sb2.fdbFactors = {};
    M.saveFDBCache({ [val]: { n:42, status:'partial', timestamp: 1234, source:'gmp-ecm', factors:['79','563'] } });
    const loaded = M.loadFDBCache();
    eq(loaded[val].status, 'partial', 'fdbCache round-trip restores the full status string');
    eq(loaded[val].factors, ['79','563'], 'fdbCache round-trip restores factors exactly');
  }

  // ── Regression: internal encodings must NOT leak into the shared sync format
  // The shipped bug: buildSyncPayload read raw storage, so short status codes and
  // base36 factors would have been pushed into results.json, which every device
  // parses expecting the full representation.
  {
    const payload = M.buildSyncPayload();
    const str = JSON.stringify(payload.fdbCache || {});
    ok(!/"status":"pt"/.test(str) && !/"status":"fl"/.test(str),
       'sync payload contains full status strings, not internal short codes');
    ok(!/"~[0-9a-z]+"/.test(str), 'sync payload contains decimal factors, not base36');
  }

  // ── Regression: serialized payload must be valid, identical JSON
  {
    const big = {}; for (let i = 0; i < 40; i++) big[i] = { status:'partial', n:i, factors:['7'] };
    const p = { version:3, fdbCache: big, changelog: [], odd: 'quote " and \\ backslash' };
    let same = false;
    try { same = JSON.stringify(JSON.parse(M.serializeSyncPayload(p))) === JSON.stringify(p); } catch(_) {}
    ok(same, 'serializeSyncPayload output parses back to an identical object');
  }

  // ── Regression: calibration merge must be idempotent
  // The shipped risk: without per-sample identity, each pull/push cycle unioned
  // local+remote and the list grew without bound.
  {
    sb2.__ls = {}; sb2.M && (M.loadCalib().s.length = 0);
    M.recordCalibSample(1.5, 'm1');
    const remote = [[1.5,'m1', Math.floor(Date.now()/1000)], [2.0,'m2', 999]];
    const n1 = M.mergeCalibSamples(remote);
    const n2 = M.mergeCalibSamples(remote);
    const n3 = M.mergeCalibSamples(remote);
    eq(n2, n1, 'mergeCalibSamples is idempotent (2nd merge adds nothing)');
    eq(n3, n1, 'mergeCalibSamples stays stable across repeated merges');
  }
  {
    // median must resist outliers, since samples come from a mix of machines
    sb2.__ls = {}; const c = M.loadCalib(); c.s.length = 0;
    [1.0,1.1,0.9,1.05,0.95,9.0,0.06].forEach(r => M.recordCalibSample(r, 'mix'));
    const f = M.calibFactor();
    ok(f > 0.9 && f < 1.2, 'calibration median is not dragged by extreme outliers');
    ok(M.recordCalibSample(500, 'x') === false, 'absurd ratios are rejected outright');
  }

  // ── The kv layer: synchronous read-after-write, and only big keys are routed
  {
    sb2.__ls = {};
    M.kvSet('eulerFDB_ecm_v1', '{"a":1}');
    eq(M.kvGet('eulerFDB_ecm_v1'), '{"a":1}', 'kv read-after-write is synchronous');
    M.kvSet('eulerFDB_theme', 'dark');
    eq(sb2.__ls['eulerFDB_theme'], 'dark', 'small keys still go straight to localStorage');
  }

  // ── logSwallowed must record without throwing
  {
    const before = sb2.__swallowedCount();
    M.logSwallowed('test/site', new Error('boom'));
    ok(sb2.__swallowedCount() === before + 1, 'logSwallowed records a non-fatal failure');
  }
});


  // ── Per-factor provenance ─────────────────────────────────────────────────
  // The problem this replaces: `source` lived on the ENTRY, so an entry touched
  // by both your ECM and FactorDB only remembered whichever wrote last, and the
  // yield report could only ever be "indicative".
  {
    sb2.__ls = {}; sb2.M && (M.saveHistory([]));
    ok(M.recordDiscovery(100, '1234567891', 'e') === true, 'recordDiscovery records a new find');
    eq(M.factorProvenance(100, '1234567891'), 'e', 'provenance is recoverable per factor');
    eq(M.factorProvenance(100, '9999999999'), null, 'unknown factor has no provenance (not a guess)');
    eq(M.factorProvenance(999, '1234567891'), null, 'provenance is scoped to the right n');
  }
  {
    // THE key property: FactorDB reporting a factor we already found must NOT
    // steal attribution. This is precisely the over/under-count the entry-level
    // source flag suffered from.
    sb2.__ls = {}; M.saveHistory([]);
    M.recordDiscovery(200, '55555555567', 'e');       // we found it
    const foundTs = M.loadHistory()[0][1];
    const again = M.recordDiscovery(200, '55555555567', 'f'); // FDB reports it later
    ok(again === false, 'a second report of the same factor is not appended again');
    eq(M.factorProvenance(200, '55555555567'), 'e', 'original finder keeps attribution when FDB re-reports');
    eq(M.loadHistory().length, 1, 'no duplicate history record created');
    // …and the DATE is untouched, which the factor chips now display: a factor your
    // ECM found keeps showing when you found it after euler.py check imports it too.
    eq(M.loadHistory()[0][1], foundTs, 'the date it was found is unchanged by the later FactorDB report');
    eq(M.loadHistory()[0][3], 'e', 'as is who found it');
  }
  {
    // prime powers: provenance is about the prime, not the exponent
    sb2.__ls = {}; M.saveHistory([]);
    M.recordDiscovery(300, '79', 'e');
    eq(M.factorProvenance(300, '79^2'), 'e', 'prime-power form resolves to the same provenance');
  }
  {
    // history must be uncapped — capping it is what caused the original problem
    sb2.__ls = {}; M.saveHistory([]);
    for (let i = 0; i < 500; i++) M.recordDiscovery(i, String(1000000007 + i * 7), 'e');
    ok(M.loadHistory().length === 500, 'history is uncapped (500 records retained, no 100-entry ceiling)');
  }
  {
    // merge must be idempotent AND keep the earliest timestamp per factor
    sb2.__ls = {}; M.saveHistory([]);
    const h = _hash => _hash;
    M.saveHistory([[10, 5000, 11, 'e', 'aaa']]);
    const remote = [[10, 3000, 11, 'e', 'aaa'], [11, 4000, 12, 'f', 'bbb']];
    const n1 = M.mergeHistory(remote);
    const n2 = M.mergeHistory(remote);
    const n3 = M.mergeHistory(remote);
    eq(n1, 2, 'mergeHistory unions local and remote');
    eq(n2, n1, 'mergeHistory is idempotent');
    eq(n3, n1, 'mergeHistory stays stable across repeated merges');
    const rec = M.loadHistory().find(r => r[4] === 'aaa');
    eq(rec[1], 3000, 'merge keeps the EARLIEST timestamp (true discovery time)');
  }
  {
    // the sync payload must carry history, or provenance can't propagate
    sb2.__ls = {}; M.saveHistory([[1, 100, 10, 'e', 'zzz']]);
    const p = M.buildSyncPayload();
    ok(Array.isArray(p.history) && p.history.length === 1, 'sync payload includes the discovery history');
  }
  {
    // malformed records must not crash the index build
    sb2.__ls = {}; M.saveHistory([[1,2,3], null, 'garbage', [5, 100, 10, 'e', 'ok1']]);
    let built = true;
    try { M.getProvIndex(); } catch(_) { built = false; }
    ok(built, 'provenance index tolerates malformed history records');
    eq(M.factorProvenance(5, 'x'), null, 'non-numeric factor query returns null safely');
  }


  // ── Yield: all-time effort vs. the attributable window ────────────────────
  // Finds can only be attributed since provenance tracking began, but effort is
  // known for all time. Dividing all-time CPU by attributable-only finds would
  // understate every level's yield — potentially by years of work — so the report
  // reports both and computes cost-per-find from the tracked window only.
  {
    sb2.__ls = {}; M.saveHistory([]);
    sb2.__ls['eulerFDB_histStart_v1'] = String(Math.floor(new Date('2026-07-01').getTime() / 1000));
    eq(M.historyStartDate(), '2026-07-01', 'tracking start date is read back correctly');

    const val = '2'.repeat(300);
    sb2.allEntries = [{ n: 2, val, factors: ['12345678901234567890123456789'] }];
    sb2.fdbCache = {};
    sb2.loadECM = () => ({ '2': [
      { method:'ECM', b1:'250000', curves:'100', date:'2025-03-01' }, // before tracking
      { method:'ECM', b1:'250000', curves:'100', date:'2025-06-01' }, // before tracking
      { method:'ECM', b1:'250000', curves:'100' },                     // undated
      { method:'ECM', b1:'250000', curves:'50',  date:'2026-07-15' }, // tracked
      { method:'ECM', b1:'250000', curves:'50',  date:'2026-08-01' }, // tracked
    ]});
    M.recordDiscovery(2, '12345678901234567890123456789', 'e');

    const y = M.computeYieldByLevel();
    const L = y.levels.find(x => x.d === 30);
    eq(L.runs, 5, 'all-time run count includes work from before tracking');
    eq(L.tRuns, 2, 'tracked run count covers only the attributable window');
    eq(L.curves, 400, 'all-time curve count is the full history');
    eq(L.tCurves, 100, 'tracked curve count excludes pre-tracking work');
    // Put the real loadECM back. An override left installed does not end with the
    // group that set it — the sandbox is shared, so it silently becomes the
    // definition every LATER group sees. This one leaked into the ECM merge tests
    // hundreds of lines below, which then merged against this fixture instead of
    // the data they had just saved. See the no-stub-leaks group at the end.
    sb2.loadECM = M.loadECM;
    eq(L.finds, 1, 'the attributable find is counted at its level');
    ok(L.tCpuSec > 0 && L.tCpuSec < L.cpuSec, 'tracked CPU is a strict subset of all-time CPU');
    ok(L.runs - L.tRuns === 3, 'an undated run is treated as UNtracked (conservative)');
    eq(y.undatedRuns, 1, 'runs with no date are counted and reported, not silently dropped');
    eq(y.startDate, '2026-07-01', 'yield report exposes the tracking start date');
    // The headline metric: must divide TRACKED effort by finds, never all-time.
    ok(Math.abs(L.cpuPerFind - L.tCpuSec / L.finds) < 1e-9,
       'cpuPerFind uses tracked CPU, not all-time');
    ok(L.cpuPerFind < L.cpuSec / L.finds,
       'cpuPerFind is lower than the all-time figure would be (does not overstate cost)');
    const noFinds = y.levels.find(x => x.runs > 0 && x.finds === 0);
    if (noFinds) ok(noFinds.cpuPerFind === null, 'a level with no finds reports null, not Infinity');
    else passed++;
  }
  {
    // With no start recorded and no history, tracking begins now — so nothing
    // historical is wrongly claimed as attributable.
    sb2.__ls = {}; M.saveHistory([]);
    const d = M.historyStartDate();
    eq(d, new Date().toISOString().slice(0,10), 'fresh install starts tracking today');
  }
  {
    // If history arrives from another device that started earlier, adopt ITS
    // start rather than stamping "now" and wrongly excluding attributable work.
    sb2.__ls = {}; M.saveHistory([[1, Math.floor(new Date('2026-05-01').getTime()/1000), 10, 'e', 'aaa']]);
    eq(M.historyStartDate(), '2026-05-01', 'adopts the earliest synced history timestamp as the start');
  }



// ── CF cofactor must never be stored as a prime factor ───────────────────────
// Shipped bug (found on E(14710)): FactorDB returns CF listing ONLY the unfactored
// composite for numbers it knows nothing about. The strip guard required more than
// one factor, so nothing was stripped, the composite was recorded as a prime, the
// product of "factors" equalled the value, and the entry displayed as FULLY
// FACTORED while not a single factor was actually known.
group('cf-cofactor', () => {
  const mk = () => {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    for (const k of Object.keys(sandbox.fdbFactors)) delete sandbox.fdbFactors[k];
  };
  const BIG = (FIX.comp200).toString();   // unfactored composite

  // 1) CF with ONLY the composite — the exact failing case
  {
    mk();
    sandbox.allEntries.push({ n: 14710, val: BIG, status: 'composite', factors: [], cofactor: null });
    applyFdbResult({ status: 'CF', factors: [[BIG, 1]] }, 14710, BIG);
    const e = sandbox.allEntries[0];
    ok(!e.factors.includes(BIG), 'CF: the unfactored composite is not stored as a prime factor');
    eq(e.factors.length, 0, 'CF with only the cofactor yields no known factors');
    ok(e.status !== 'full', 'entry with no real factors is not marked fully factored');
  }

  // 2) CF with real primes + trailing composite — primes kept, composite dropped
  {
    mk();
    const p1 = 56941n, p2 = 69557n;
    const val = (p1 * p2 * BigInt(BIG)).toString();
    sandbox.allEntries.push({ n: 14711, val, status: 'composite', factors: [], cofactor: null });
    applyFdbResult({ status: 'CF', factors: [['56941', 1], ['69557', 1], [BIG, 1]] }, 14711, val);
    const e = sandbox.allEntries[0];
    ok(e.factors.includes('56941') && e.factors.includes('69557'), 'CF keeps the genuine prime factors');
    ok(!e.factors.includes(BIG), 'CF drops the trailing composite cofactor');
    ok(e.status !== 'full', 'still partial — the cofactor remains unfactored');
  }

  // 3) A genuinely PRIME last factor must be kept, not mistaken for a cofactor
  {
    mk();
    const val = (3n * 7n * 11n).toString();
    sandbox.allEntries.push({ n: 14712, val, status: 'composite', factors: [], cofactor: null });
    applyFdbResult({ status: 'CF', factors: [['3', 1], ['7', 1], ['11', 1]] }, 14712, val);
    const e = sandbox.allEntries[0];
    ok(e.factors.includes('11'), 'a small PRIME last factor is kept, not stripped as a cofactor');
  }

  // 4) The invariant that would have caught this at any layer: a factor equal to
  //    the whole value is never legitimate under CF.
  {
    mk();
    sandbox.allEntries.push({ n: 14713, val: BIG, status: 'composite', factors: [], cofactor: null });
    applyFdbResult({ status: 'CF', factors: [[BIG, 1]] }, 14713, BIG);
    const e = sandbox.allEntries[0];
    const prod = (e.factors || []).reduce((a, f) => {
      const [b, x] = String(f).split('^'); return a * BigInt(b) ** BigInt(x || 1);
    }, 1n);
    ok(prod !== BigInt(BIG), 'stored factors never multiply to the whole value under CF');
  }
});


// ── replayFDBCache must not promote an entry from a COFACTOR lookup ──────────
// Second bug found while tracing the E(14710) report: the "resolved to full"
// branch never checked that the cached record was for the entry's FULL VALUE. A
// cofactor lookup returning FF therefore also landed there — and because that
// branch REPLACES entry.factors with only the queried number's factors, it wiped
// out every factor found separately for the entry.
group('replay-cofactor', () => {
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  for (const k of Object.keys(sandbox.fdbFactors)) delete sandbox.fdbFactors[k];

  const p = 7n, q = 11n, r = 13n;
  const cofactor = (q * r).toString();
  const val = (p * q * r).toString();

  sandbox.allEntries.push({ n: 900, val, status: 'partial', factors: ['7'], cofactor });
  // A cached FF result for the COFACTOR, not for the entry's value.
  sandbox.fdbCache[cofactor] = { status: 'FF', factors: ['11', '13'], n: 900 };

  replayFDBCache();
  const e = sandbox.allEntries[0];
  ok(e.factors.includes('7'), 'a cofactor lookup does not discard the entry\u2019s own known factors');
  ok(e.factors.includes('11') && e.factors.includes('13'), 'cofactor factors are merged in');
  const prod = e.factors.reduce((a, f) => a * BigInt(String(f).split('^')[0]), 1n);
  ok(prod === BigInt(val), 'merged factors multiply back to the entry value');
});


// ── the repair migration must not destroy legitimate factorisations ──────────
// An earlier version of this migration used the rule "a big factor accounting for
// the whole value is the cofactor bug". That rule ALSO describes a perfectly normal
// fully-factored entry whose largest factor is a genuine large prime — the end
// state of every successful factorisation — and it stripped those, demoting correct
// results to partial. These assertions pin both directions.
group('repair-migration', () => {
  const P = FIX.prime(199);   // a real 200-digit prime
  const BIGC = FIX.comp200;                        // a composite

  const run = (entry, cache) => {
    sandbox.__ls = {};
    sandbox.allEntries.length = 0; sandbox.allEntries.push(entry);
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    for (const k of Object.keys(sandbox.fdbFactors)) delete sandbox.fdbFactors[k];
    if (cache) sandbox.fdbCache[entry.val] = cache;
    migrateBogusCofactorFactors();
    return entry;
  };

  // MUST NOT TOUCH: real prime, FactorDB confirms fully factored
  {
    const e = run({ n:1, val:(3n*P).toString(), status:'full', factors:['3', P.toString()] },
                  { status:'FF', factors:['3', P.toString()], n:1 });
    eq(e.status, 'full', 'FF entry with a genuine large prime is left fully factored');
    eq(e.factors.length, 2, 'its real prime factor is not stripped');
  }
  // MUST NOT TOUCH: real prime, no FactorDB record at all
  {
    const e = run({ n:2, val:(3n*P).toString(), status:'full', factors:['3', P.toString()] }, null);
    eq(e.status, 'full', 'a genuine large prime is kept even with no FDB record');
  }
  // MUST NOT TOUCH: a factor too large to primality-test, where FactorDB says FF.
  // Above REPAIR_PRIMALITY_MAX_DIGITS the primality check is skipped entirely, so
  // the FF guard is the ONLY thing protecting a genuine large prime here.
  {
    const huge = (10n ** 1200n + 7n).toString();   // >1000d, so primality is not tested
    const e = run({ n:5, val:(3n*BigInt(huge)).toString(), status:'full', factors:['3', huge] },
                  { status:'FF', factors:['3', huge], n:5 });
    eq(e.status, 'full', 'FF guard protects a factor too large to primality-test');
    eq(e.factors.length, 2, 'that untestable factor is not stripped when FDB says FF');
  }
  // MUST NOT TOUCH: a COMPOSITE factor small enough to test, under an FF status.
  // This is the one case where the FF guard is the sole protection: the primality
  // check would flag it as composite and strip it, demoting an entry FactorDB has
  // explicitly resolved. Trusting FDB's verdict is the less destructive choice —
  // contradictory data should not silently delete a completed factorisation.
  {
    const comp = (FIX.comp200).toString();  // composite, testable size
    const e = run({ n:7, val:(3n*BigInt(comp)).toString(), status:'full', factors:['3', comp] },
                  { status:'FF', factors:['3', comp], n:7 });
    eq(e.status, 'full', 'FF guard: an entry FactorDB calls fully factored is not demoted');
    eq(e.factors.length, 2, 'FF guard: its factors are left intact');
  }

  // MUST NOT TOUCH: a large composite that does NOT account for the whole value.
  // Here the product check is the only guard — the factor may be a legitimate
  // large composite that simply hasn't been split yet, with a cofactor remaining.
  {
    const e = run({ n:6, val:(BIGC * 7919n).toString(), status:'partial',
                    factors:[BIGC.toString()] },
                  { status:'CF', factors:[BIGC.toString()], n:6 });
    eq(e.factors.length, 1, 'a large factor is kept when it does not account for the whole value');
  }

  // MUST REPAIR: composite stored as the only "factor"
  {
    const e = run({ n:3, val:BIGC.toString(), status:'partial', factors:[BIGC.toString()] },
                  { status:'CF', factors:[BIGC.toString()], n:3 });
    eq(e.factors.length, 0, 'a composite stored as the sole factor is removed');
    eq(e.status, 'composite', 'and the entry drops back to composite (no factors known)');
  }
  // MUST REPAIR: real primes plus a composite cofactor, wrongly showing as full
  {
    const e = run({ n:4, val:(61n*839551n*BIGC).toString(), status:'full',
                    factors:['61','839551', BIGC.toString()] },
                  { status:'CF', factors:['61','839551', BIGC.toString()], n:4 });
    eq(e.status, 'partial', 'a falsely-full entry is demoted to partial');
    ok(e.factors.includes('61') && e.factors.includes('839551'), 'its real prime factors are preserved');
    ok(!e.factors.includes(BIGC.toString()), 'only the composite cofactor is removed');
  }
});


// ── stored factors must divide their E(n) ────────────────────────────────────
// Nothing verified this, so a run attributed to the wrong number silently wrote
// factors onto an entry they have nothing to do with — observed as E(14704)
// holding a dozen factors when FactorDB knew of two. A factor of E(n) divides
// E(n) exactly, so this is a complete correctness test.
group('factor-verification', () => {
  ok(factorDividesValue('105', '7') === true,  'a genuine factor is accepted');
  ok(factorDividesValue('105', '4') === false, 'a non-dividing factor is rejected');
  ok(factorDividesValue('105', '7^1') === true, 'prime-power form is handled');
  ok(factorDividesValue('105', 'abc') === null, 'unparseable input returns null, not false');
  ok(factorDividesValue('105', '1') === false,  '1 is never a valid factor');

  // applyFdbResult must not write factors that don't divide the entry
  {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    const val = String(3n * 1000000000000000000000009n);
    const e = { n: 40, val, status: 'unknown', factors: [] };
    sandbox.allEntries.push(e);
    // "11" does not divide val — it belongs to some other number
    applyFdbResult({ status: 'CF', factors: [['3',1], ['11',1], ['1000000000000000000000009',1]] }, 40, val);
    ok(e.factors.includes('3'), 'the valid factor is stored');
    ok(!e.factors.includes('11'), 'a factor that does not divide E(n) is rejected');
  }

  // recordEcmFactor must reject a factor that doesn't divide the entry. This is
  // the path a mis-attributed ECM run takes, and it was writing on trust.
  {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    const e = { n: 43, val: '105', status: 'partial', factors: ['3'] };
    sandbox.allEntries.push(e);
    eq(recordEcmFactor(e, '4'), 'invalid', 'recordEcmFactor rejects a factor that does not divide E(n)');
    ok(!e.factors.includes('4'), 'the rejected factor is not stored');
    const r = recordEcmFactor(e, '5');
    ok(r !== 'invalid', 'a genuine factor is still accepted');
    ok(e.factors.includes('5'), 'and is stored');
  }
});


// ── the integrity scan must catch the bugs that were found by eye ────────────
// Both data-correctness bugs so far were spotted manually against FactorDB, not by
// anything automatic. Each produced an entry that contradicted ITSELF, which is
// cheap to detect offline. These assertions pin that the scan catches them — and,
// just as importantly, that it does not flag healthy entries.
// "Audit factors" was folded into "Check data": the integrity scan tests every factor
// of every entry for dividing E(n) — the audit's exact test — and its fix removes the
// ones that don't and downgrades the entry, as the audit did. (The fix does more: it
// then fills in a prime cofactor it can compute.)
groupAsync('check-data-covers-the-audit', async () => {
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.allEntries.push({ n: 41, val: '105', status: 'partial', factors: ['3', '5', '4'] });
  sandbox.allEntries.push({ n: 42, val: '105', status: 'partial', factors: ['3', '7'] });
  const scan = await runDataIntegrityCheck();
  eq(scan.issues.notDividing.map(i => i.n + ':' + i.factor), ['41:4'], 'it finds exactly the one factor that does not divide, on the right entry');
  await fixIntegrityIssues(scan);
  const [e41, e42] = sandbox.allEntries;
  ok(!e41.factors.includes('4') && e41.factors.includes('3') && e41.factors.includes('5'), 'the fix removes it and keeps the good ones');
  ok(e42.factors.includes('3') && e42.factors.includes('7'), 'and a clean entry keeps its factors');
  sandbox.allEntries.length = 0;
});

groupAsync('integrity-scan', async () => {
  const BIGC = FIX.comp200;                          // composite
  const P = FIX.prime(199);      // genuine prime

  sandbox.allEntries.length = 0;
  sandbox.allEntries.push(
    { n: 14710, val: BIGC.toString(), status: 'full', factors: [BIGC.toString()] },   // bug 1 (200d, above the 120d ceiling — must still be caught)
    { n: 900, val: (7n*11n*13n).toString(), status: 'full', factors: ['11','13'] },   // bug 2
    { n: 100, val: (3n*P).toString(), status: 'full', factors: ['3', P.toString()] }, // healthy full
    { n: 200, val: (61n*839551n*BIGC).toString(), status: 'partial', factors: ['61','839551'] }, // healthy partial
    { n: 300, val: (3n*5n).toString(), status: 'partial', factors: ['7'] },           // not a factor
    { n: 400, val: (3n*5n).toString(), status: 'partial', factors: ['3','5'] },       // complete, unmarked
    { n: 500, val: (3n*3n*5n).toString(), status: 'partial', factors: ['3','3','5'] },// duplicate prime
  );
  const { issues, checked } = await runDataIntegrityCheck();
  const has = (k, n) => issues[k].some(i => i.n === n);

  eq(checked, 7, 'scan visits every entry that has factors');
  ok(has('wholeValue', 14710),
     'catches the E(14710) bug WITHOUT primality testing (factor too large to test)');
  // E(900) is val = 7*11*13 holding [11,13]. The shortfall is real, but the missing
  // piece is a PRIME and therefore computable — so it is reported in the
  // locally-fixable category rather than as an unresolvable mismatch.
  ok(has('missingPrime', 900),
     'catches the cofactor-lookup shortfall, classed as a recoverable missing prime');
  ok(has('notDividing', 300),       'catches a stored value that does not divide E(n)');
  ok(has('unmarkedFull', 400),      'catches factors that complete E(n) but are not marked full');
  ok(has('duplicate', 500),         'catches the same prime listed twice instead of as a power');

  // No false positives — this matters more than the catches. A scan that cries
  // wolf on healthy data gets ignored, which is worse than not having one.
  for (const n of [100, 200]) {
    for (const k of Object.keys(issues)) {
      ok(!has(k, n), 'healthy entry E(' + n + ') is not flagged as ' + k);
    }
  }
});

(async () => {

// ── saveFDBCache must not drop large factors ─────────────────────────────────
// Shipped bug, surfaced by the integrity scan on real data (76 entries): factors
// longer than 100 digits were silently discarded to keep localStorage small, while
// the "full" status was still saved. A fully-factored entry whose largest prime
// exceeded 100 digits therefore came back marked complete with a factor list that
// no longer multiplied to E(n) — and buildSyncPayload falls back to this persisted
// set after any reload, so the loss propagated to GitHub and every other device.
groupAsync('no-factor-truncation', async () => {
  sb2.__ls = {}; sb2.fdbCache = {}; sb2.fdbFactors = {};

  const bigPrime = '9'.repeat(140);           // well past the old 100-digit cutoff
  const val = '123456789';
  sb2.eulerValues[7] = val;
  M.saveFDBCache({ [val]: { n: 7, status: 'full', timestamp: 1, factors: ['3', '7', bigPrime] } });

  // Read back exactly what was persisted, with the in-memory copy cleared — this
  // is the post-reload state where the truncation used to bite.
  sb2.fdbFactors = {};
  const reloaded = M.loadFDBCache();
  const stored = (reloaded[val] || {}).factors || [];
  ok(stored.includes(bigPrime), 'a 140-digit prime factor survives save/load');
  eq(stored.length, 3, 'no factors are dropped on persistence');
});


// ── the integrity fixer must repair what it can and touch nothing else ───────
// This edits real factorisation data, so the important assertions are the ones
// about what it does NOT do: healthy entries untouched, and anything requiring
// information the app doesn't have left alone rather than guessed at.
groupAsync('integrity-fix', async () => {
  const P = FIX.prime(99);
  const COMP = 4294967297n;                       // 641 * 6700417
  const HUGE = (FIX.comp300).toString();  // above the primality ceiling

  sandbox.allEntries.length = 0;
  sandbox.allEntries.push(
    { n:1, val:(3n*5n).toString(),      status:'partial', factors:['3','5'] },              // complete, unmarked
    { n:2, val:(3n*3n*5n).toString(),   status:'partial', factors:['3','3','5'] },          // duplicate prime
    { n:3, val:(3n*5n).toString(),      status:'partial', factors:['7'] },                  // not a factor
    { n:4, val:HUGE,                     status:'full',    factors:[HUGE] },                 // cofactor-as-prime
    { n:5, val:(3n*COMP).toString(),    status:'partial', factors:['3', COMP.toString()] }, // composite factor
    { n:6, val:(7n*11n*13n).toString(), status:'full',    factors:['11','13'] },            // full but short
    { n:7, val:(3n*P).toString(),       status:'full',    factors:['3', P.toString()] },    // HEALTHY
  );
  const healthyBefore = JSON.stringify(sandbox.allEntries.find(e => e.n === 7).factors);

  const scan = await runDataIntegrityCheck();
  const res  = await fixIntegrityIssues(scan);
  const get  = n => sandbox.allEntries.find(e => e.n === n);

  eq(get(1).status, 'full',      'an entry whose factors already complete E(n) is promoted');
  ok(get(2).factors.includes('3^2') && get(2).factors.includes('5') && get(2).factors.length === 2,
     'duplicate primes are collapsed to a power');
  eq(get(3).factors, [],         'a value that does not divide E(n) is removed');
  eq(get(4).factors, [],         'a cofactor recorded as its own factor is removed');
  eq(get(4).status, 'composite', 'and that entry drops back to composite');
  ok(get(5).factors.includes('641') && get(5).factors.includes('6700417'),
     'a composite factor is split into its primes');

  // The two that matter most:
  eq(JSON.stringify(get(7).factors), healthyBefore, 'a healthy entry is left completely untouched');
  // E(6) is val = 7*11*13 holding only [11,13]. The missing piece is COMPUTABLE:
  // the remainder is 7, and 7 is prime, so recording it is arithmetic, not a guess.
  // This previously counted as unfixable and was sent for a FactorDB re-check — an
  // unnecessary round trip for something decidable locally.
  eq(get(6).factors, ['7','11','13'], 'a missing prime cofactor is recovered locally');
  eq(get(6).status, 'full', 'and the entry is correctly complete');

  // GENUINELY unfixable: a COMPOSITE remainder cannot be resolved here and must
  // not be invented.
  {
    const COMPOSITE20 = FIX.comp300;   // composite remainder
    sandbox.allEntries.push({ n: 20, val: (11n*13n*COMPOSITE20).toString(), status: 'full', factors: ['11','13'] });
    const s3 = await runDataIntegrityCheck();
    ok(s3.issues.fullMismatch.some(i => i.n === 20),
       'a shortfall with a COMPOSITE remainder is still reported as unfixable');
    const r3 = await fixIntegrityIssues(s3);
    eq(sandbox.allEntries.find(e => e.n === 20).factors, ['11','13'],
       'and its factors are not guessed at');
    ok(r3.needsRecheck.includes(20), 'it is listed for a FactorDB re-check instead');
    sandbox.allEntries = sandbox.allEntries.filter(e => e.n !== 20);
  }

  // GUARD: a STALE scan must not cause a wrong promotion. Data can change between
  // scanning and fixing (a pull, an import), so the fixer re-verifies rather than
  // trusting the scan's list. Here the scan claims E(8) is complete when it isn't.
  {
    sandbox.allEntries.push({ n:8, val:(3n*5n*7n).toString(), status:'partial', factors:['3','5'] });
    const staleScan = { issues: { notDividing:[], wholeValue:[], duplicate:[],
                                  compositeFactor:[], unmarkedFull:[{ n:8, factors:2 }], fullMismatch:[] } };
    await fixIntegrityIssues(staleScan);
    eq(get(8).status, 'partial', 'a stale scan cannot promote an entry whose factors do not actually complete E(n)');
  }

  // GUARD: a bad split must be rejected. factorizeSmall is stubbed to return
  // factors that do NOT multiply back — the product check is the only thing
  // standing between that and corrupted data.
  {
    const realSplit = sandbox.factorizeSmall;
    sandbox.factorizeSmall = () => [3n, 5n];      // wrong on purpose
    sandbox.allEntries.push({ n:9, val:(3n*COMP).toString(), status:'partial',
                              factors:['3', COMP.toString()] });
    const badScan = { issues: { notDividing:[], wholeValue:[], duplicate:[],
                                compositeFactor:[{ n:9, factor: COMP.toString(), digits: 10 }],
                                unmarkedFull:[], fullMismatch:[] } };
    const r2 = await fixIntegrityIssues(badScan);
    sandbox.factorizeSmall = realSplit;
    ok(get(9).factors.includes(COMP.toString()),
       'a split whose parts do not multiply back is rejected, leaving the data untouched');
    ok(r2.needsRecheck.includes(9), 'and that entry is flagged for a re-check instead');
  }

  // And the fixer must not create new problems.
  sandbox.allEntries = sandbox.allEntries.filter(e => e.n <= 7);
  const after = await runDataIntegrityCheck();
  const leftover = Object.entries(after.issues).filter(([, v]) => v.length).map(([k]) => k);
  eq(leftover, [], 'after fixing, nothing locally-fixable remains');
});


// ── "full" must be proved by arithmetic, not taken on FactorDB's word ────────
// Reported symptom: E(176) stayed marked FF no matter how many times it was
// re-checked, while the integrity scan kept flagging its factors as falling short.
// Cause: status came straight from FactorDB's verdict, so each re-check simply
// re-asserted "full" without ever looking at whether the factors multiply back.
// The entry could never self-correct.
group('full-requires-proof', () => {
  const P = 1000000000000000003n;
  const val = (3n * 7n * P).toString();

  // FDB says FF but the returned list is incomplete -> must NOT claim full
  sandbox.allEntries.length = 0;
  sandbox.allEntries.push({ n: 176, val, status: 'full', factors: [] });
  applyFdbResult({ status: 'FF', factors: [['3', 1], ['7', 1]] }, 176, val);
  eq(sandbox.allEntries[0].status, 'partial',
     'an FF verdict with factors that fall short is recorded as partial, not full');

  // FDB says FF and the list is complete -> full, as before
  sandbox.allEntries.length = 0;
  sandbox.allEntries.push({ n: 177, val, status: 'partial', factors: [] });
  applyFdbResult({ status: 'FF', factors: [['3', 1], ['7', 1], [P.toString(), 1]] }, 177, val);
  eq(sandbox.allEntries[0].status, 'full',
     'an FF verdict backed by complete factors is still recorded as full');

  // THE ONE THAT BIT: the corrected status must SURVIVE a replay.
  // Symptom reported: a manual per-tile re-check appeared to fix E(176), but
  // "Check all" changed nothing and pushing put it back to fully factored. Cause:
  // the entry was demoted correctly, but the CACHE still held FactorDB's raw 'FF'.
  // replayFDBCache runs on every re-render — including at the end of a bulk poll
  // and after a push — read that FF back, and promoted the entry again. The manual
  // path only looked right because nothing re-rendered immediately afterwards.
  {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.allEntries.push({ n: 176, val, status: 'full', factors: [] });
    applyFdbResult({ status: 'FF', factors: [['3', 1], ['7', 1]] }, 176, val);
    eq(sandbox.fdbCache[val].status, 'CF',
       'an unproven FF is CACHED as CF, not as FF');
    replayFDBCache();
    eq(sandbox.allEntries[0].status, 'partial',
       'the demotion survives a replay (this is what "Check all" and push both trigger)');
    replayFDBCache(); replayFDBCache();
    eq(sandbox.allEntries[0].status, 'partial', 'and stays stable across repeated replays');
  }

  // A prime number reported P/PRP is complete by definition
  sandbox.allEntries.length = 0;
  sandbox.allEntries.push({ n: 178, val: P.toString(), status: 'unknown', factors: [] });
  applyFdbResult({ status: 'PRP', factors: [[P.toString(), 1]] }, 178, P.toString());
  eq(sandbox.allEntries[0].status, 'full', 'a number FDB reports as prime is full');
});


// ── a FactorDB "unknown" verdict must be recorded, not silently dropped ──────
// Reported on E(14798): FactorDB has no record of the number, yet the entry just
// read "partially factored" with nothing indicating FDB knew nothing — which looks
// as though FDB supplied those factors. It is the reverse: we are ahead of FDB,
// and those factors are worth submitting.
group('fdb-unknown', () => {
  const val = (61n * 839551n * (10n ** 200n + 7n)).toString();

  // We hold factors; FDB knows nothing.
  sandbox.allEntries.length = 0; sandbox.__fdbUnknown.length = 0;
  sandbox.allEntries.push({ n: 14798, val, status: 'partial', factors: ['61', '839551'] });
  applyFdbResult({ status: 'U', factors: [] }, 14798, val);
  let e = sandbox.allEntries[0];
  eq(e.status, 'partial', 'our own factors keep the entry partial — that describes OUR knowledge');
  ok(e._fdbUnknown === true, 'the entry records that FactorDB has no data');
  ok(sandbox.__fdbUnknown.includes(14798), 'and it joins the fdb-unknown set');
  eq(e.factors, ['61', '839551'], 'our factors are not discarded by a U verdict');

  // No factors of our own either.
  sandbox.allEntries.length = 0;
  sandbox.allEntries.push({ n: 14799, val, status: 'unknown', factors: [] });
  applyFdbResult({ status: 'U', factors: [] }, 14799, val);
  eq(sandbox.allEntries[0].status, 'fdb-unknown', 'with nothing of our own, the entry becomes fdb-unknown');

  // An unrecognised status must fail SAFE, never to "fully factored".
  sandbox.allEntries.length = 0;
  sandbox.allEntries.push({ n: 14800, val, status: 'partial', factors: ['61'] });
  applyFdbResult({ status: 'WAT', factors: [] }, 14800, val);
  eq(sandbox.allEntries[0].status, 'partial',
     'an unrecognised FactorDB status never promotes an entry');
  // Where the mapping actually bites: an unknown entry receiving a garbage status
  // should land in fdb-unknown (we learned nothing), not fall through untouched.
  sandbox.allEntries.length = 0; sandbox.__fdbUnknown.length = 0;
  sandbox.allEntries.push({ n: 14802, val, status: 'unknown', factors: [] });
  applyFdbResult({ status: 'WAT', factors: [] }, 14802, val);
  eq(sandbox.allEntries[0].status, 'fdb-unknown',
     'an unrecognised status is mapped to U so the result is still recorded');

  // A "resolved" verdict carrying no factors proves nothing and must not invent a status.
  sandbox.allEntries.length = 0;
  sandbox.allEntries.push({ n: 14801, val, status: 'composite', factors: [] });
  applyFdbResult({ status: 'FF', factors: [] }, 14801, val);
  eq(sandbox.allEntries[0].status, 'composite',
     'an FF verdict with no factors at all leaves the status alone rather than inventing one');
});


// ── a genuinely prime E(n) must not be mistaken for the cofactor bug ─────────
// Reported on E(454) (922 digits, actually prime): the scan flagged "factor equals
// E(n) itself" and the fixer then stripped it, leaving the entry with no factors at
// all. But for a prime, being its own sole factor IS the correct representation —
// it is the same SHAPE as the cofactor-as-prime bug and the opposite MEANING.
// FactorDB's verdict separates them: P/PRP is a positive statement of primality,
// while the bug arrives as CF or with no record.
groupAsync('prime-not-a-bug', async () => {
  const PRIME922  = (10n ** 921n + 1n).toString();
  const COMPOSITE = (FIX.comp300).toString();

  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.allEntries.push(
    { n: 454, val: PRIME922,  status: 'full', factors: [PRIME922] },
    { n: 999, val: COMPOSITE, status: 'full', factors: [COMPOSITE] },
  );
  sandbox.fdbCache[PRIME922]  = { status: 'PRP', factors: [PRIME922],  n: 454 };
  sandbox.fdbCache[COMPOSITE] = { status: 'CF',  factors: [COMPOSITE], n: 999 };

  const { issues } = await runDataIntegrityCheck();
  ok(!issues.wholeValue.some(i => i.n === 454),
     'an E(n) FactorDB confirms prime is NOT flagged for being its own factor');
  ok(issues.wholeValue.some(i => i.n === 999),
     'the genuine cofactor-as-prime case is still flagged');

  // Defence in depth: even if the scan wrongly lists the prime, the fixer refuses.
  const scan = await runDataIntegrityCheck();
  scan.issues.wholeValue.push({ n: 454, digits: 922 });
  await fixIntegrityIssues(scan);
  const p = sandbox.allEntries.find(e => e.n === 454);
  eq(p.factors.length, 1,  'the fixer refuses to strip a confirmed prime even if told to');
  eq(p.status, 'full',     'and the prime entry stays fully factored');
  const b = sandbox.allEntries.find(e => e.n === 999);
  eq(b.factors.length, 0,  'while the real bug is still cleaned up');
});


// ── "we say full, FactorDB says composite" ───────────────────────────────────
// Reported on E(14702) (52,004 digits). This shape defeats every arithmetic check:
// small primes plus a huge composite recorded as a factor. The big factor DOES
// divide E(n), the product DOES equal E(n), it is not a lone factor, and it is far
// too large to primality-test. The arithmetic is self-consistent, so only
// FactorDB's verdict reveals the problem. Especially common just above the old
// query size limit, where numbers were never verified at all.
groupAsync('contradicts-fdb', async () => {
  const HUGE     = FIX.comp300;                        // stands in for the 52,000d cofactor
  const valBug   = (61n * 839551n * HUGE).toString();
  const PRIME922 = (10n ** 921n + 1n).toString();
  const P = FIX.prime(99);
  const valOk = (3n * P).toString();

  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.allEntries.push(
    { n: 14702, val: valBug,   status: 'full', factors: ['61', '839551', HUGE.toString()] },
    { n: 454,   val: PRIME922, status: 'full', factors: [PRIME922] },
    { n: 100,   val: valOk,    status: 'full', factors: ['3', P.toString()] },
  );
  sandbox.fdbCache[valBug]   = { status: 'CF',  n: 14702 };   // FDB: composite
  sandbox.fdbCache[PRIME922] = { status: 'PRP', n: 454 };     // FDB: prime
  sandbox.fdbCache[valOk]    = { status: 'FF',  n: 100 };     // FDB: fully factored

  const scan = await runDataIntegrityCheck();
  ok(scan.issues.contradictsFdb.some(i => i.n === 14702),
     'catches an entry we call full that FactorDB calls composite');
  ok(!scan.issues.contradictsFdb.some(i => i.n === 454),
     'does not flag an entry FactorDB calls prime');
  ok(!scan.issues.contradictsFdb.some(i => i.n === 100),
     'does not flag an entry FactorDB confirms fully factored');

  const res = await fixIntegrityIssues(scan);
  const bug = sandbox.allEntries.find(e => e.n === 14702);
  ok(!bug.factors.includes(HUGE.toString()), 'the unfactored cofactor is removed');
  eq(bug.factors.length, 2, 'the genuine prime factors are kept');
  eq(bug.status, 'partial', 'and the entry is honestly demoted');
  ok(res.needsRecheck.includes(14702), 'it is flagged for a FactorDB re-check');

  // The guard that matters: this repair strips a large unverifiable factor, which
  // would be destructive on an entry FactorDB calls prime. It is safe ONLY because
  // FDB positively said composite.
  eq(sandbox.allEntries.find(e => e.n === 454).factors.length, 1,
     'a FactorDB-confirmed prime is untouched by this repair');
  eq(sandbox.allEntries.find(e => e.n === 100).factors.length, 2,
     'a FactorDB-confirmed full entry is untouched by this repair');

  // STALE SCAN: the fixer re-verifies against the cache rather than trusting the
  // list it was handed. Here the scan wrongly names a FactorDB-confirmed prime —
  // without the re-verify this would strip a 922-digit prime and wipe the entry.
  {
    const staleScan = { issues: { notDividing:[], wholeValue:[], duplicate:[],
                                  compositeFactor:[], unmarkedFull:[], fullMismatch:[],
                                  contradictsFdb:[{ n: 454, fdbStatus: 'CF', digits: 922 }] } };
    await fixIntegrityIssues(staleScan);
    const p = sandbox.allEntries.find(e => e.n === 454);
    eq(p.factors.length, 1, 'a stale scan cannot make the fixer strip a confirmed prime');
    eq(p.status, 'full',    'and that prime entry stays fully factored');
  }
});


// ── "fully factored" while holding no factors at all ─────────────────────────
// Reported on E(14708) (FactorDB HAS factors for it) and E(14774) (FactorDB has no
// record) — both sat at 'full' with an empty factor list. Nothing backs that claim.
//
// The scan could not see them for a structural reason worth remembering: its loop
// SKIPPED any entry without factors before running a single check, so the one state
// that is wrong precisely BECAUSE it has no factors was the one state guaranteed to
// go unexamined. The check now runs before that skip.
groupAsync('full-with-no-factors', async () => {
  const v1 = '1'.repeat(300), v2 = '2'.repeat(300), v3 = '3'.repeat(300);
  const P = FIX.prime(99);
  const vOk = (3n * P).toString();

  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.allEntries.push(
    { n: 14708, val: v1,  status: 'full',      factors: [] },                   // FDB has factors
    { n: 14774, val: v2,  status: 'full',      factors: [] },                   // FDB unknown
    { n: 14775, val: v3,  status: 'full',      factors: [] },                   // no FDB record
    { n: 100,   val: vOk, status: 'full',      factors: ['3', P.toString()] },  // healthy
    { n: 200,   val: v1,  status: 'composite', factors: [] },                   // legitimately factorless
  );
  sandbox.fdbCache[v1]  = { status: 'CF', n: 14708 };
  sandbox.fdbCache[v2]  = { status: 'U',  n: 14774 };
  sandbox.fdbCache[vOk] = { status: 'FF', n: 100 };

  const scan = await runDataIntegrityCheck();
  const flagged = n => scan.issues.fullNoFactors.some(i => i.n === n);
  ok(flagged(14708), 'catches a full entry with no factors (FactorDB has factors)');
  ok(flagged(14774), 'catches a full entry with no factors (FactorDB has no record)');
  ok(flagged(14775), 'catches a full entry with no factors (no FactorDB record at all)');
  ok(!flagged(100),  'a healthy fully-factored entry is not flagged');
  ok(!flagged(200),  'a non-full entry with no factors is not flagged — that is normal');

  const res = await fixIntegrityIssues(scan);
  const get = n => sandbox.allEntries.find(e => e.n === n);
  // Demote to whatever is actually true, using FactorDB's verdict to decide.
  eq(get(14708).status, 'composite',   'FactorDB says composite -> composite');
  eq(get(14774).status, 'fdb-unknown', 'FactorDB says unknown -> fdb-unknown');
  eq(get(14775).status, 'unknown',     'no FactorDB record -> unknown');
  ok(res.needsRecheck.includes(14708) && res.needsRecheck.includes(14774),
     'all of them are flagged for a FactorDB re-check');

  // This repair only ever changes a status; there are no factors to lose.
  eq(get(100).status, 'full',       'a healthy entry is untouched');
  eq(get(100).factors.length, 2,    'and keeps its factors');
  eq(get(200).status, 'composite',  'a legitimately factorless entry is untouched');

  // Re-verify guard: if factors appeared between scanning and fixing, do not demote.
  {
    sandbox.allEntries.push({ n: 300, val: vOk, status: 'full', factors: ['3', P.toString()] });
    const staleScan = { issues: { notDividing:[], wholeValue:[], duplicate:[], compositeFactor:[],
                                  unmarkedFull:[], fullMismatch:[], contradictsFdb:[],
                                  fullNoFactors:[{ n: 300, fdbStatus: null }] } };
    await fixIntegrityIssues(staleScan);
    eq(get(300).status, 'full', 'a stale scan cannot demote an entry that does have factors');
  }

  // And the scan must come back clean afterwards.
  sandbox.allEntries = sandbox.allEntries.filter(e => [14708, 14774, 14775, 100, 200].includes(e.n));
  const after = await runDataIntegrityCheck();
  eq(after.issues.fullNoFactors.length, 0, 'after fixing, no factorless "full" entries remain');
});


// ── "Check all" must check what is actually on screen ────────────────────────
// Reported symptom: with the view filtered to E(14700)-E(14800), "Check all"
// changed nothing, while re-checking a single tile worked. Cause: the target list
// was built from ALL entries and then truncated with .slice(0, cap) — so at the
// default cap of 500 it checked E(0) onwards and never reached the filtered range.
// It was working perfectly; just on entries nobody was looking at.
// ── t10 belongs in the recommendation set ────────────────────────────────────
// It had been excluded on two grounds that do not survive checking for large
// numbers: that extrapolating below the table's 20-65d range is unreliable (the
// values continue the table's own trend monotonically), and that tiny factors are
// better caught by trial division (reaching 10 digits that way means ~10^10
// divisions of a 70,000-digit number). On a fresh number t10 measured ~6.7x the
// gain-per-hour of t15, so omitting it discarded the best available first move.
group('t10-in-recommendations', () => {
  const { recommendNextRun, ecmTableB1, ecmOptimalCurves } = PURE;
  const D = 70000;

  const fresh = recommendNextRun(D, []);
  const freshEcm = fresh.filter(r => r.method === 'ECM');
  ok(freshEcm.some(r => r.targetDigits === 10),
     'a fresh large number is offered a t10 ECM run');
  ok(freshEcm[0].targetDigits === 10,
     'and t10 ranks first — it is the most efficient opening move');

  // Self-limiting: after a t15 run, 10-digit factors are already ~95% covered, so
  // t10's marginal gain collapses and it should drop out on its own. No special
  // case exists for this; it falls out of the efficiency ranking.
  const after = recommendNextRun(D, [{ method: 'ECM', b1: '2420', curves: '26' }]);
  const afterEcm = after.filter(r => r.method === 'ECM');
  ok(!afterEcm.some(r => r.targetDigits === 10),
     'after a t15 run, ECM t10 is no longer suggested');
  ok(afterEcm.length > 0, 'but larger ECM levels still are');

  // The extrapolated parameters must stay monotonic with the rest of the table.
  ok(ecmTableB1(10) < ecmTableB1(15) && ecmTableB1(15) < ecmTableB1(20),
     'extrapolated t10/t15 bounds remain monotonic with the fitted table');
  ok(ecmOptimalCurves(10) < ecmOptimalCurves(15),
     'and so do the curve counts');

  // ── a run must be REPORTED at the level it was run at ────────────────────
  // The engine offers t10 as the opening move above, and ecmTableB1 extrapolates
  // below the fitted table to price it. But b1ToDigits searched only from
  // ECM_TABLE[0].d (20), so it could never return anything lower: a t10 run at
  // B1=532 came back as level 20, and the t10 and t15 rows of the yield report —
  // which that report creates — could not be filled by any run at all. Do t10 work
  // all day and those rows stay at zero, which is how this surfaced.
  //
  // The round trip is the property worth pinning, not the individual numbers:
  // whatever B1 the engine recommends for level d must be recognised as level d.
  {
    const b1ToDigits = PURE.b1ToDigits;
    let roundTrips = true; const offenders = [];
    for (let d = 10; d <= 65; d++) {
      const got = b1ToDigits(String(Math.round(ecmTableB1(d))));
      if (got !== d) { roundTrips = false; offenders.push(`t${d}→${got}`); }
    }
    ok(roundTrips, 'every recommendable level round-trips through b1ToDigits'
       + (offenders.length ? ' (failed: ' + offenders.slice(0, 8).join(', ') + ')' : ''));
    eq(b1ToDigits(String(Math.round(ecmTableB1(10)))), 10,
       't10 specifically — the level the engine recommends first');
    eq(b1ToDigits(String(Math.round(ecmTableB1(15)))), 15, 'and t15');
  }
});


// ── recent work on an OLD attempt must count as recent ───────────────────────
// Reported symptom: the yield table's "since tracking began" columns showed finds
// but no runs, curves or CPU. Cause: `date` is stamped only when an attempt is
// FIRST created, and merging new curves into an existing attempt never refreshed
// it. So an attempt opened months ago and extended every week kept its original
// date forever and was permanently classed as old work — while the finds, which
// come from the timestamped discovery history, appeared normally. The two halves
// of the table were measuring time from different sources.
group('lastRun-tracking', () => {
  const { computeYieldByLevel } = M;
  sb2.__ls = {};
  sb2.__ls['eulerFDB_histStart_v1'] = String(Math.floor(new Date('2026-07-01').getTime() / 1000));
  M.saveHistory([[2, Math.floor(new Date('2026-07-15').getTime() / 1000), 29, 'e', 'aaa']]);

  const val = '2'.repeat(300);
  sb2.allEntries = [{ n: 2, val, factors: ['12345678901234567890123456789'] }];
  sb2.fdbCache = {};
  sb2.loadECM = () => ({ '2': [
    { method:'ECM', b1:'250000', curves:'100' },                                       // undated legacy
    { method:'ECM', b1:'250000', curves:'50',  date:'2025-01-01' },                    // genuinely old
    { method:'ECM', b1:'250000', curves:'80',  date:'2025-01-01', lastRun:'2026-07-20' }, // old start, recent work
  ]});

  const y = computeYieldByLevel();
  const L = y.levels.find(x => x.d === 30);
  eq(L.runs, 3,      'all three runs count toward all-time effort');
  eq(L.tRuns, 1,     'only the recently-extended run counts as tracked');
  eq(L.tCurves, 80,  'and it contributes its curves — previously invisible');
  ok(L.tCpuSec > 0,  'tracked CPU is non-zero, so cost-per-find is meaningful');
  eq(L.finds, 1,     'the find is still attributed');
  eq(y.undatedRuns, 1, 'the undated legacy run is reported so the gap is explained');
  sb2.loadECM = M.loadECM;   // restore — see the note on the other loadECM stub
});

// ── a find belongs to the run that was GOING, not the biggest one ever run ────
// findLevel took the HIGHEST level ever run on the number before the find. Run t45
// in June and t15 in September, and a September find came from t15 — but the max
// credited it to t45. With every t45 run predating the tracked window, the live
// report showed t45 at 0 runs and 8 finds, t40 at 0 and 2, t55 at 0 and 1, and t25
// at 6 finds from 2 runs and 17 minutes: finds on levels where no work was done.
//
// No test distinguished "highest" from "most recent", which is how it survived a
// comment explicitly claiming the problem had been fixed.
group('find-credited-to-most-recent-run', () => {
  const { computeYieldByLevel } = M;
  sb2.__ls = {};
  sb2.__ls['eulerFDB_histStart_v1'] = String(Math.floor(new Date('2026-08-04').getTime() / 1000));
  // The find is in September, after both runs.
  M.saveHistory([[4, Math.floor(new Date('2026-09-15').getTime() / 1000), 22, 'e', 'bbb']]);
  sb2.allEntries = [{ n: 4, val: '7'.repeat(300), factors: ['1234567890123456789012'] }];
  sb2.fdbCache = {};
  sb2.loadECM = () => ({ '4': [
    { method: 'ECM', b1: '11000000', curves: '1',   date: '2026-06-01' },   // t45, OLD
    { method: 'ECM', b1: '11000',    curves: '74',  date: '2026-09-10' },   // t20, RECENT
  ]});
  try {
    const y = computeYieldByLevel();
    const at = d => (y.levels.find(x => x.d === d) || { finds: 0 }).finds;
    eq(at(20), 1, 'the find is credited to t20, the run that was actually going');
    eq(at(45), 0, 'not to t45, merely the biggest level ever run on the number');

    // Same-day runs: the higher of them, since either could have produced it.
    sb2.loadECM = () => ({ '4': [
      { method: 'ECM', b1: '11000',   curves: '74',  date: '2026-09-10' },   // t20
      { method: 'ECM', b1: '50000',   curves: '214', date: '2026-09-10' },   // t25, same day
      { method: 'ECM', b1: '3000000', curves: '1',   date: '2026-05-01' },   // t40, old
    ]});
    const y2 = computeYieldByLevel();
    const at2 = d => (y2.levels.find(x => x.d === d) || { finds: 0 }).finds;
    eq(at2(25), 1, 'a tie on the latest date goes to the higher of those runs');
    eq(at2(40), 0, 'and an older, higher run still does not claim it');
  } finally {
    sb2.loadECM = M.loadECM;
  }
});


// ── submit-then-verify loop ──────────────────────────────────────────────────
// Exporting a submission file is only half the job: until each entry is re-checked
// the app still believes FactorDB doesn't know those factors, and doing that by
// hand across hundreds of numbers is the tedious part. The export now records what
// went out, one button re-checks exactly those, and entries clear themselves.
group('submitted-tracking', () => {
  const v = n => String(n) + '0'.repeat(50);
  sandbox.__ls = {};
  sandbox.allEntries.length = 0;
  for (const n of [100, 102, 104]) sandbox.allEntries.push({ n, val: v(n), factors: ['61'] });
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];

  eq(markSubmitted([100, 102, 104]), 3, 'exporting records which entries were submitted');
  eq(Object.keys(loadSubmitted()).length, 3, 'all of them stay pending until FactorDB confirms them');

  // 'fdb' as the source means FactorDB's own list now covers everything we held —
  // that is the signal the submission landed. It reuses applyFdbResult's existing
  // computation rather than inventing a separate notion of "accepted".
  sandbox.fdbCache[v(100)] = { source: 'fdb' };
  sandbox.fdbCache[v(104)] = { source: 'fdb' };
  sandbox.fdbCache[v(102)] = { source: 'import' };   // still only ours
  let r = reconcileSubmitted();
  eq(r.cleared, 2,   'entries FactorDB has absorbed are cleared');
  eq(r.remaining, 1, 'ones it has not are kept pending');
  eq(Object.keys(loadSubmitted()).map(Number), [102], 'only the outstanding entry stays pending');

  sandbox.fdbCache[v(102)] = { source: 'fdb' };
  r = reconcileSubmitted();
  eq(r.remaining, 0, 'the list empties once everything has landed');

  // Must not get stuck on an entry that no longer exists locally.
  markSubmitted([999]);
  eq(reconcileSubmitted().remaining, 0, 'a submitted entry missing from the database is dropped, not stuck');

  // Re-submitting the same entry should not duplicate it.
  markSubmitted([100]); markSubmitted([100]);
  eq(Object.keys(loadSubmitted()).length, 1, 're-exporting the same entry does not duplicate it');
});


// ── a recorded power must actually divide E(n) ───────────────────────────────
// Found in a submission file: a line reading "N = p*p*q*q" where p and q each
// divide N only ONCE. Nothing caught it because every check only asked whether the
// BASE divides — never the full power. The squares come from a duplicate prime in
// the factor list being folded into an exponent by collapsePowers, which preserves
// the (already wrong) product and so looks internally consistent.
//
// This one matters more than most: the submission export turns it into repeated
// factors and sends it to a public database as a false claim.
groupAsync('exponent-must-divide', async () => {
  const p = 156937982257994989n, q = 1626524294689195079n;
  const N = p * q * 10n ** 200n;        // p, q each divide exactly once
  const M = p * p * q * 10n ** 200n;    // p genuinely squared

  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.allEntries.push(
    { n: 1, val: N.toString(), status: 'partial', factors: [p + '^2', q + '^2'] },
    { n: 2, val: M.toString(), status: 'partial', factors: [p + '^2', q.toString()] },
  );

  const scan = await runDataIntegrityCheck();
  eq(scan.issues.wrongExponent.filter(i => i.n === 1).length, 2,
     'both bogus squares are flagged');
  ok(!scan.issues.wrongExponent.some(i => i.n === 2),
     'a genuine square is NOT flagged');
  const it = scan.issues.wrongExponent.find(i => i.n === 1);
  eq(it.claimed, 2, 'the claimed exponent is reported');
  eq(it.actual, 1,  'along with the multiplicity that actually divides');

  await fixIntegrityIssues(scan);
  const e1 = sandbox.allEntries.find(e => e.n === 1);
  eq(e1.factors.sort(), [p.toString(), q.toString()].sort(),
     'exponents are reduced to the true multiplicity');
  const e2 = sandbox.allEntries.find(e => e.n === 2);
  ok(e2.factors.includes(p + '^2'), 'a legitimate square survives the fix untouched');

  // The corrected factors must genuinely divide.
  for (const f of e1.factors) {
    const [b, x] = String(f).split('^');
    ok(N % (BigInt(b) ** BigInt(x || 1)) === 0n, 'every corrected factor power divides E(n)');
  }

  // HIGHER POWERS: a genuine p^3 (as FactorDB itself reports for many numbers)
  // must pass through untouched. The check must distinguish "the exponent is
  // wrong" from "the exponent is large", and must not quietly flatten real
  // multiplicities — that would lose information rather than correct it.
  {
    const q2 = 1626524294689195079n;
    sandbox.allEntries.length = 0;
    sandbox.allEntries.push(
      { n: 11, val: (5n**3n * q2).toString(), status:'partial', factors:['5^3', q2.toString()] }, // genuine
      { n: 12, val: (5n**2n * q2).toString(), status:'partial', factors:['5^3', q2.toString()] }, // over-claimed
      { n: 13, val: (5n**4n * q2).toString(), status:'partial', factors:['5^3', q2.toString()] }, // under-claimed
    );
    const s2 = await runDataIntegrityCheck();
    ok(!s2.issues.wrongExponent.some(i => i.n === 11), 'a genuine 5^3 is not flagged');
    ok(s2.issues.wrongExponent.some(i => i.n === 12),  'an over-claimed 5^3 IS flagged');
    ok(!s2.issues.wrongExponent.some(i => i.n === 13),
       'an UNDER-claimed exponent is not flagged — incomplete, but not a false claim');

    await fixIntegrityIssues(s2);
    const g = n => sandbox.allEntries.find(e => e.n === n);
    ok(g(11).factors.includes('5^3'), 'the genuine cube survives the fix intact');
    ok(g(12).factors.includes('5^2'), 'the over-claimed cube is reduced to what divides');
    ok(g(13).factors.includes('5^3'), 'the under-claimed one is left alone, not flattened');
  }
});


// ── the submission line FactorDB actually receives ───────────────────────────
// FactorDB's report.php expects repeated factors, so p^3 has to go out as p*p*p.
// This pins both halves: a genuine power expands correctly, and an entry whose
// factors do not divide is skipped rather than emitted as a false claim.
group('submission-line-format', () => {
  if (!needs(M, 'exportFDBSubmission')) return;
  const q = 1626524294689195079n;
  let written = '';
  const realBlob = sb2.Blob, realURL = sb2.URL, realDoc = sb2.document;
  sb2.Blob = function (parts) { written = parts.join(''); };
  sb2.URL = { createObjectURL: () => 'blob:x', revokeObjectURL() {} };
  sb2.document = { createElement: () => ({ set href(v) {}, set download(v) {}, click() {} }) };
  sb2.eulerValues[1] = 'x';
  sb2.allEntries.length = 0;
  sb2.allEntries.push(
    { n: 1, val: (5n**3n * q).toString(), factors: ['5^3', q.toString()] },  // genuine cube
    { n: 2, val: (5n**2n * q).toString(), factors: ['5^3', q.toString()] },  // does not divide
  );
  for (const k of Object.keys(sb2.fdbCache)) delete sb2.fdbCache[k];

  M.exportFDBSubmission();

  const lines = written.split('\n').filter(l => l && !l.startsWith('#'));
  eq(lines.length, 1, 'only the arithmetically valid entry is written');
  const [nStr, facStr] = lines[0].split('=');
  const parts = facStr.split('*').map(BigInt);
  eq(parts.filter(p => p === 5n).length, 3, '5^3 is expanded to three separate 5s');
  ok(parts.every(p => BigInt(nStr) % p === 0n), 'every factor on the line divides the number');
  ok(parts.reduce((a, b) => a * b, 1n) === BigInt(nStr) / (BigInt(nStr) / parts.reduce((a, b) => a * b, 1n)),
     'the listed factors are a genuine divisor product of the number');

  sb2.Blob = realBlob; sb2.URL = realURL; sb2.document = realDoc;
});


// ── units, and an unrecorded final prime ─────────────────────────────────────
// Two false positives reported together:
//   E(0) and E(2) are both 1. A unit has no prime factors, so "fully factored with
//   no factors" describes it correctly — FactorDB has a dedicated "Unit" status.
//   E(5186) and friends were reported as "factors fall short" and sent off for a
//   FactorDB re-check, when the missing piece was a PRIME and therefore computable
//   locally. The entries were already correct in substance; only the final prime
//   had never been written into the factor list.
groupAsync('units-and-missing-prime', async () => {
  const P = FIX.prime(40);
  const COMPOSITE = FIX.comp300;

  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.allEntries.push(
    { n: 0,    val: '1', status: 'full', factors: [] },                                  // unit
    { n: 2,    val: '1', status: 'full', factors: [] },                                  // unit
    { n: 5186, val: (11n*13n*P).toString(),         status: 'full', factors: ['11','13'] }, // prime missing
    { n: 5187, val: (11n*13n*COMPOSITE).toString(), status: 'full', factors: ['11','13'] }, // genuinely short
  );

  const scan = await runDataIntegrityCheck();
  ok(!scan.issues.fullNoFactors.some(i => i.n === 0), 'E(0) = 1 is not flagged — a unit has no factors');
  ok(!scan.issues.fullNoFactors.some(i => i.n === 2), 'E(2) = 1 is not flagged either');
  ok(scan.issues.missingPrime.some(i => i.n === 5186),
     'a shortfall whose remainder is PRIME is classed as locally recoverable');

  // The remainder ceiling must be high enough to cover a realistic final prime.
  // A fully-factored E(n) almost always ends in one LARGE prime; at the 120-digit
  // per-factor ceiling that could never be verified, so entries missing only their
  // last prime were reported as unfixable and sent to FactorDB unnecessarily.
  const { REMAINDER_PRIMALITY_MAX_DIGITS: RMAX, PRIMALITY_SCAN_MAX_DIGITS: PMAX } = sandbox;
  ok(RMAX >= 500,
     'the remainder ceiling covers a realistically-sized final prime');
  ok(RMAX > PMAX,
     'and is higher than the per-factor ceiling — it runs once per entry, not per factor');
  ok(scan.issues.fullMismatch.some(i => i.n === 5187),
     'a shortfall whose remainder is COMPOSITE remains a genuine mismatch');

  await fixIntegrityIssues(scan);
  const e = sandbox.allEntries.find(x => x.n === 5186);
  eq(e.status, 'full', 'the recoverable entry stays full');
  eq(e.factors.length, 3, 'and the missing prime is now recorded');
  const prod = e.factors.reduce((a, f) => a * BigInt(String(f).split('^')[0]), 1n);
  ok(prod === BigInt(e.val), 'its factors now multiply back to E(n)');

  // Must never add a COMPOSITE remainder — that would recreate the cofactor-as-prime
  // bug exactly. The scan already routes those elsewhere, so the guard inside the
  // fixer only bites on a STALE scan: data can change between scanning and fixing,
  // and re-verifying is what stops a composite being written in as a "prime".
  const bad = sandbox.allEntries.find(x => x.n === 5187);
  eq(bad.factors.length, 2, 'a composite remainder is never added as a factor');
  {
    const staleScan = { issues: { notDividing:[], wholeValue:[], duplicate:[], compositeFactor:[],
                                  unmarkedFull:[], fullMismatch:[], contradictsFdb:[],
                                  fullNoFactors:[], wrongExponent:[],
                                  missingPrime:[{ n: 5187, digits: 301 }] } };
    await fixIntegrityIssues(staleScan);
    const still = sandbox.allEntries.find(x => x.n === 5187);
    eq(still.factors.length, 2,
       'a stale scan cannot make the fixer record a composite remainder as a prime');

  // ── and it must re-check DIVISIBILITY too, not just primality ────────────
  // Found by a blind mutation survey: the primality re-check was tested, the
  // divisibility one was not. It is the more dangerous of the pair. A scan entry
  // whose product no longer divides E(n) — because the factors changed in between,
  // which is the whole reason the fixer re-verifies — yields a TRUNCATED quotient,
  // and BigInt division gives no hint that it truncated. If that garbage happens to
  // be prime it gets written as a factor of a number it does not divide.
  {
    sandbox.__ls = {}; sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    // 45 does not divide 600851475143 (remainder 8), and yet the TRUNCATED
    // quotient 600851475143 / 45 = 13352255003 is prime. That combination is what
    // makes the guard load-bearing: without it the fixer computes a quotient that
    // is not a factor, finds it prime, and writes it in. A first version of this
    // test used 101, whose truncated quotient is even — so the primality check
    // rejected it and the missing guard never showed.
    const e = { n: 720, val: '600851475143', status: 'full', factors: ['45'] };
    sandbox.allEntries.push(e);
    return fixIntegrityIssues({ issues: { missingPrime: [{ n: 720, digits: 10 }] } })
      .then(() => {
        eq(e.factors, ['45'],
           'no remainder is written when the recorded factors do not divide E(n)');
        let allDivide = true;
        for (const f of e.factors) {
          if (BigInt('600851475143') % BigInt(String(f).split('^')[0]) !== 0n) allDivide = false;
        }
        ok(!allDivide,
           'the entry is left visibly wrong for the scan to report, not quietly patched');
      });
  }
  }
});


// ── property-based fuzz over the scan + fixer ────────────────────────────────
// Hand-written cases only prove what someone thought to check. This generates
// entries with randomised corruption and asserts INVARIANTS rather than specific
// outcomes — which is how the two bugs below were found after the hand-written
// tests were all green:
//   * an entry whose shortfall could not be repaired was left marked 'full',
//     so the app kept asserting something it had just proved false;
//   * repairs changed the factor list without re-deriving the status, so running
//     the fixer twice produced different results.
groupAsync('fuzz-invariants', async () => {
  let seed = 20260810;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const SMALL = [3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n,41n,43n];
  const P = FIX.prime(40);
  let Q = 10n ** 60n; while (!isProbablePrime(Q)) Q++;
  const COMP = FIX.comp200;
  const productOf = fsx => fsx.reduce((p, f) => { const [b, x] = String(f).split('^'); return p * BigInt(b) ** BigInt(x || 1); }, 1n);

  const make = (n) => {
    const a = pick(SMALL), b = pick(SMALL.filter(x => x !== a));
    switch (pick(['healthy','healthyPow','missingPrime','wrongExp','dup','notDiv','wholeVal','emptyFull','composShort','unit','partial'])) {
      case 'unit':         return { e:{n, val:'1', status:'full', factors:[]} };
      case 'healthy':      return { e:{n, val:(a*b*P).toString(), status:'full', factors:[a,b,P].map(String)}, fdb:{status:'FF'}, healthy:true };
      case 'healthyPow':   return { e:{n, val:(a*a*a*b*P).toString(), status:'full', factors:[a+'^3',String(b),String(P)]}, fdb:{status:'FF'}, healthy:true };
      case 'missingPrime': return { e:{n, val:(a*b*P).toString(), status:'full', factors:[String(a),String(b)]} };
      case 'wrongExp':     return { e:{n, val:(a*b*P).toString(), status:'full', factors:[a+'^2',String(b),String(P)]} };
      case 'dup':          return { e:{n, val:(a*a*b*P).toString(), status:'full', factors:[String(a),String(a),String(b),String(P)]} };
      case 'notDiv':       return { e:{n, val:(a*b*P).toString(), status:'partial', factors:[String(a),String(b),String(Q)]} };
      case 'wholeVal':     return { e:{n, val:COMP.toString(), status:'full', factors:[String(COMP)]}, fdb:{status:'CF'} };
      case 'emptyFull':    return { e:{n, val:(a*b*P).toString(), status:'full', factors:[]}, fdb:{status:'CF'} };
      case 'composShort':  return { e:{n, val:(a*b*COMP).toString(), status:'full', factors:[String(a),String(b)]}, fdb:{status:'CF'} };
      default:             return { e:{n, val:(a*b*COMP).toString(), status:'partial', factors:[String(a),String(b)]} };
    }
  };

  const violations = [];
  for (let round = 0; round < 8; round++) {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    const healthy = [];
    for (let i = 0; i < 20; i++) {
      const s = make(i * 2);
      sandbox.allEntries.push(s.e);
      if (s.fdb) sandbox.fdbCache[s.e.val] = { ...s.fdb, n: s.e.n };
      if (s.healthy) healthy.push({ n: s.e.n, f: JSON.stringify(s.e.factors), st: s.e.status });
    }

    await fixIntegrityIssues(await runDataIntegrityCheck());

    for (const e of sandbox.allEntries) {
      const val = BigInt(e.val);
      if (val === 1n) continue;
      for (const f of (e.factors || [])) {
        const [bs, xs] = String(f).split('^');
        if (val % (BigInt(bs) ** BigInt(xs || 1)) !== 0n) violations.push(`E(${e.n}) factor does not divide`);
        if (bs.length <= 120 && !isProbablePrime(BigInt(bs))) violations.push(`E(${e.n}) composite stored as factor`);
      }
      if (e.status === 'full' && (e.factors || []).length && productOf(e.factors) !== val)
        violations.push(`E(${e.n}) full but factors do not multiply back`);
      if (e.status === 'full' && !(e.factors || []).length) violations.push(`E(${e.n}) full with no factors`);
    }
    for (const h of healthy) {
      const e = sandbox.allEntries.find(x => x.n === h.n);
      if (JSON.stringify(e.factors) !== h.f || e.status !== h.st) violations.push(`E(${h.n}) healthy entry modified`);
    }
    const snap = JSON.stringify(sandbox.allEntries);
    await fixIntegrityIssues(await runDataIntegrityCheck());
    if (JSON.stringify(sandbox.allEntries) !== snap) violations.push(`round ${round}: fix is not idempotent`);
  }
  eq([...new Set(violations)], [], 'fuzz: all invariants hold across randomised corrupted data');
});


// ── a large final prime must be recovered, not sent to FactorDB ──────────────
// Reported: nine entries stuck at "factors fall short" despite being genuinely
// fully factored. Cause: the remainder was a prime LARGER than the 120-digit
// per-factor ceiling, so it could not be verified and fell through to the
// unfixable bucket. The remainder test runs at most once per failing entry, so it
// can afford a far higher ceiling than an individual factor check.
groupAsync('large-final-prime', async () => {
  const P300 = FIX.prime(299);
  const COMP = FIX.comp300;

  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.allEntries.push(
    { n: 5186, val: (11n*13n*P300).toString(), status: 'full', factors: ['11','13'] },
    { n: 7634, val: (11n*13n*COMP).toString(), status: 'full', factors: ['11','13'] },
  );

  const scan = await runDataIntegrityCheck();
  ok(scan.issues.missingPrime.some(i => i.n === 5186),
     'a 300-digit missing prime is recognised as recoverable');
  ok(scan.issues.fullMismatch.some(i => i.n === 7634),
     'a composite remainder is still correctly unfixable');

  await fixIntegrityIssues(scan);
  const good = sandbox.allEntries.find(e => e.n === 5186);
  eq(good.status, 'full', 'the recovered entry is fully factored');
  eq(good.factors.length, 3, 'and the large prime is now recorded');
  const prod = good.factors.reduce((a, f) => a * BigInt(String(f).split('^')[0]), 1n);
  ok(prod === BigInt(good.val), 'its factors multiply back exactly');

  const bad = sandbox.allEntries.find(e => e.n === 7634);
  eq(bad.factors.length, 2, 'the composite remainder is never recorded as a prime');
  eq(bad.status, 'partial', 'and that entry stops claiming to be fully factored');
});


// ── acknowledging an externally-verified entry ───────────────────────────────
// Some entries genuinely ARE fully factored but cannot be proved here: the missing
// prime is too large to primality-test in reasonable time (past ~1000 digits a
// single test takes seconds). Those would be reported forever. An acknowledgement
// suppresses that one finding — and the assertions that matter are the ones proving
// it does NOT become a blanket "stop checking this number".
groupAsync('verified-complete-ack', async () => {
  const COMP = FIX.comp2000;         // remainder too large to verify
  const val = (11n * 13n * COMP).toString();

  sandbox.__ls = {};
  clearVerifiedComplete();
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.allEntries.push({ n: 5186, val, status: 'full', factors: ['11','13'] });

  let s = await runDataIntegrityCheck();
  ok(s.issues.fullMismatch.some(i => i.n === 5186), 'unacknowledged, the shortfall is reported');
  await fixIntegrityIssues(s);
  eq(sandbox.allEntries[0].status, 'partial', 'and the entry is demoted');

  sandbox.allEntries[0].status = 'full';
  markVerifiedComplete([5186]);
  s = await runDataIntegrityCheck();
  ok(!s.issues.fullMismatch.some(i => i.n === 5186), 'acknowledged, the shortfall is suppressed');
  eq(s.acknowledged, 1, 'and counted separately rather than vanishing');
  await fixIntegrityIssues(s);
  eq(sandbox.allEntries[0].status, 'full', 'an acknowledged entry is not demoted');

  // THE ASSERTIONS THAT MATTER: acknowledging must not silence anything else.
  sandbox.allEntries[0].factors = ['11','13','7'];              // 7 does not divide
  s = await runDataIntegrityCheck();
  ok(s.issues.notDividing.some(i => i.n === 5186),
     'a factor that does not divide is STILL reported on an acknowledged entry');

  sandbox.allEntries[0].factors = ['11','13', (10n**50n + 1n).toString()];  // composite
  s = await runDataIntegrityCheck();
  ok(s.issues.compositeFactor.some(i => i.n === 5186),
     'a composite recorded as a prime is STILL reported on an acknowledged entry');

  // And it can be undone.
  sandbox.allEntries[0].factors = ['11','13'];
  clearVerifiedComplete();
  s = await runDataIntegrityCheck();
  ok(s.issues.fullMismatch.some(i => i.n === 5186), 'clearing the acknowledgement restores the finding');
  ok(!isVerifiedComplete(5186), 'and the entry is no longer marked verified');
});


// ── the sync merge must never let a timestamp delete a factor ────────────────
// THE BUG: mergeSyncPayload handled its two conflict branches differently. When
// local won on timestamp it took the UNION of both factor lists; when REMOTE won
// it replaced the record wholesale. So any factor the local machine held and the
// remote did not was destroyed by an ordinary pull — and the next push propagated
// the loss to every other device.
//
// It needs two machines to see it, which is why no single-device test caught it:
//   A finds a factor by ECM at 10:00 and pushes.
//   B, which had not pulled yet, re-checks the same entry on FactorDB at 10:05
//     and pushes its shorter list.
//   A pulls. A's factor is gone. Nothing is logged; the entry just reads as
//     less-factored than it is, and the app re-spends the CPU that found it.
//
// A factor is monotone knowledge — a prime that divides E(n) divides it forever —
// so the merge is only ever allowed to ADD to a factor list. Every assertion here
// is a variation on that one rule.
group('merge-keeps-every-factor', () => {
  if (!M) return;
  const R = (factors, ts, extra) => ({ n: 1234, status: 'CF', timestamp: ts, factors, ...(extra || {}) });
  const factorsOf = (rec) => (rec.factors || []).slice().sort();

  // ── the shipped bug, in the branch that had it ────────────────────────────
  {
    const local  = R(['71', '839', '1471', '6857'], 1000, { status: 'FF' });
    const remote = R(['71', '839'], 2000);            // newer, but knows less
    const out = M.mergeFactorRecords(local, remote);
    eq(factorsOf(out), ['1471', '6857', '71', '839'],
       'a NEWER remote with fewer factors cannot delete local factors');
  }
  // ── the branch that was already correct, so the fix did not break it ──────
  {
    const local  = R(['71', '839', '1471', '6857'], 2000, { status: 'FF' });
    const remote = R(['71', '839'], 1000);
    const out = M.mergeFactorRecords(local, remote);
    eq(factorsOf(out), ['1471', '6857', '71', '839'],
       'an OLDER remote with fewer factors still cannot delete local factors');
  }
  // ── the realistic case: two machines each found something different ───────
  {
    const local  = R(['71', '1471'], 1000);
    const remote = R(['71', '839'],  2000);
    const out = M.mergeFactorRecords(local, remote);
    eq(factorsOf(out), ['1471', '71', '839'], 'disjoint discoveries are unioned, not chosen between');
    // and symmetrically — the result must not depend on which side is called local
    const flipped = M.mergeFactorRecords(remote, local);
    eq(factorsOf(flipped), factorsOf(out), 'the merge is symmetric in its factor set');
  }

  // ── same prime at different precision ─────────────────────────────────────
  // One device holds "5" (ECM found the prime), another holds "5^2" (FactorDB
  // reported the power). A plain Set union keeps BOTH, and then the product of
  // "factors" is 5^3 — larger than E(n). That reads downstream as a corrupt entry,
  // and exportFDBSubmission expands it to N=5*5*5 and sends that claim to a public
  // database. collapseFactorPowers takes the max, which is the informative one.
  {
    const out = M.mergeFactorRecords(R(['5', '53'], 1000), R(['5^2', '53'], 2000));
    // Not sorted here: the merge is expected to hand back canonical ASCENDING order
    // (5^2 = 25, so it precedes 53), same as every other factor-writing path.
    eq(out.factors, ['5^2', '53'], 'the same prime at two precisions collapses to the higher power');
  }

  // ── a completeness claim may not outlive the list that proved it ──────────
  // FF is cached only after applyFdbResult proves the factors multiply back to
  // E(n), and replayFDBCache promotes a cached FF straight to 'full' WITHOUT
  // re-checking that arithmetic. So an FF carried onto a list it does not describe
  // becomes a wrong 'full' on every device that pulls it.
  {
    const proven = M.mergeFactorRecords(
      R(['71', '839', '1471', '6857'], 2000, { status: 'FF' }),
      R(['71', '839'], 1000, { status: 'CF' }));
    eq(proven.status, 'FF', 'FF survives when the union adds nothing to the list that proved it');

    const outgrown = M.mergeFactorRecords(
      R(['71', '839'], 2000, { status: 'FF' }),          // newer, claims complete
      R(['71', '1471'], 1000, { status: 'CF' }));        // older, holds a factor it lacks
    eq(outgrown.status, 'CF',
       'a completeness claim is demoted when the union outgrows the list behind it');
    eq(factorsOf(outgrown), ['1471', '71', '839'], 'and the factors are still all kept');

    const olderProof = M.mergeFactorRecords(
      R(['71', '839'], 1000, { status: 'FF' }),
      R(['71', '839'], 2000, { status: 'CF' }));
    eq(olderProof.status, 'FF', 'arithmetic does not expire — an older proof of the same list stands');
  }

  // ── 'fdb' is what makes the submission export skip an entry ───────────────
  // If the union adds a factor to the side that claimed FactorDB had everything,
  // that claim is now false, and leaving it would silently stop us submitting a
  // factor FactorDB does not have.
  {
    const out = M.mergeFactorRecords(
      R(['71'], 2000, { source: 'fdb' }),
      R(['71', '1471'], 1000, { source: 'import' }));
    eq(out.source, 'import', "source drops to 'import' when the union outgrows an 'fdb' claim");
    const untouched = M.mergeFactorRecords(
      R(['71', '1471'], 2000, { source: 'fdb' }),
      R(['71'], 1000, { source: 'import' }));
    eq(untouched.source, 'fdb', "and stays 'fdb' when FactorDB really does hold everything");
  }

  // ── an fdbId is how a 65,000-digit number is re-checked at all ────────────
  {
    const out = M.mergeFactorRecords(R(['71'], 2000), R(['71'], 1000, { fdbIdExact: '9912' }));
    eq(out.fdbIdExact, '9912', 'the only fdbIdExact available is kept even when the other side is newer');
  }

  // ── n must survive a remote record that lacks it ──────────────────────────
  // saveFDBCache keys everything by v.n and SKIPS any record where it is missing
  // (`if (v.n == null) continue`). So a merge that let an absent remote n blank out
  // a good local one would not corrupt the entry — it would delete it from storage
  // entirely on the next save, silently, with the factors inside it.
  {
    const out = M.mergeFactorRecords(
      { n: 1234, status: 'CF', factors: ['71'], timestamp: 1000 },
      { n: undefined, status: 'CF', factors: ['839'], timestamp: 2000 });
    eq(out.n, 1234, 'a remote record with no n cannot blank out the local one');
  }

  // ── the merged record carries the LATER check time ────────────────────────
  // Not cosmetic. This timestamp is the "last checked" date in the grid, it is how
  // startStalePoll decides what is due for re-checking, and it is what the NEXT
  // pull compares against — so keeping the older one re-queues an entry that was
  // just checked and lets the same stale remote win the metadata again every time.
  // (Added because a mutation that swapped max for min left every other assertion
  // in this group green.)
  {
    const fwd = M.mergeFactorRecords(R(['71'], 1000), R(['71'], 2000));
    eq(fwd.timestamp, 2000, 'the merged record is stamped with the later of the two checks');
    const rev = M.mergeFactorRecords(R(['71'], 2000), R(['71'], 1000));
    eq(rev.timestamp, 2000, 'and that does not depend on which side it arrived from');
  }

  // ── merging twice must change nothing ─────────────────────────────────────
  // Pulls happen on every load and on a timer. A merge that keeps flipping the
  // winner would rewrite storage and re-dirty the file forever. (§7: the fixer
  // shipped non-idempotent once already.)
  {
    const local  = R(['71', '1471'], 1000);
    const remote = R(['71', '839'],  2000);
    const once  = M.mergeFactorRecords(local, remote);
    const twice = M.mergeFactorRecords(once, remote);
    eq(JSON.stringify(twice), JSON.stringify(once), 'merging the same remote again is a no-op');
  }

  // ── the merge may only ever ADD ──────────────────────────────────────────
  // Self-validating catch-all: whatever the status rules do, no output factor may
  // be invented and no input factor may vanish.
  {
    const cases = [
      [R(['3', '5'], 1), R(['7'], 2)],
      [R(['3'], 5), R(['3', '5', '7'], 1, { status: 'FF' })],
      [R([], 9, { status: 'C' }), R(['11'], 1)],
      [R(['13^2'], 1), R(['13'], 7)],
    ];
    let addsOnly = true, keepsAll = true;
    for (const [a, b] of cases) {
      const out = M.mergeFactorRecords(a, b);
      const bases = new Set([...(a.factors || []), ...(b.factors || [])].map(f => String(f).split('^')[0]));
      for (const f of (out.factors || [])) if (!bases.has(String(f).split('^')[0])) addsOnly = false;
      for (const f of bases) if (!(out.factors || []).some(g => String(g).split('^')[0] === f)) keepsAll = false;
    }
    ok(addsOnly, 'the merge never invents a factor neither side held');
    ok(keepsAll, 'the merge never drops a prime base either side held');
  }
});

// ── the same guarantee through the real pull path ────────────────────────────
// The unit tests above call mergeFactorRecords directly. This one goes through
// mergeSyncPayload with a payload shaped exactly like results.json — n-keyed
// remote, number-string-keyed local — because that conversion is where the record
// pairs are formed, and a merge that is correct on records it is never handed is
// no use to anyone.
group('merge-sync-payload-end-to-end', () => {
  if (!M) return;
  sb2.__quiet = true;
  const VAL = '600851475143';                 // = 71 × 839 × 1471 × 6857
  sb2.eulerValues[1234] = VAL;
  for (const k of Object.keys(sb2.fdbFactors)) delete sb2.fdbFactors[k];

  // Local: we found 1471 ourselves and never told anyone.
  M.saveFDBCache({ [VAL]: { n: 1234, status: 'CF', factors: ['71', '1471'], timestamp: 1000, source: 'import' } });

  // Remote: another machine re-checked FactorDB later and pushed what IT knew.
  M.mergeSyncPayload({
    version: 3,
    fdbCache: { '1234': { n: 1234, status: 'CF', factors: ['71', '839'], timestamp: 2000, source: 'fdb' } },
  });

  const after = M.loadFDBCache()[VAL];
  ok(!!after, 'the merged record is stored under the number-string key');
  eq((after.factors || []).slice().sort(), ['1471', '71', '839'],
     'a pull keeps the factors this machine found and adds the ones it did not');
  eq(after.source, 'import', "and stops claiming FactorDB has everything, so the export still offers 1471");

  // Pulling the identical payload again must not churn storage.
  const before = JSON.stringify(M.loadFDBCache()[VAL]);
  M.mergeSyncPayload({
    version: 3,
    fdbCache: { '1234': { n: 1234, status: 'CF', factors: ['71', '839'], timestamp: 2000, source: 'fdb' } },
  });
  eq(JSON.stringify(M.loadFDBCache()[VAL]), before, 'pulling the same payload twice changes nothing');
  sb2.__quiet = false;
});


// ── the ECM log merges by accumulating work, never by picking a winner ───────
// results_ecm.json is the record of every CPU-hour spent. If a merge picked one
// device's curve count over another's, the recommendation engine would think work
// that was actually done had not been — and would re-issue it. Untested until now,
// which matters because the failure is invisible: nothing looks broken, the app
// just quietly recommends runs you already paid for.
group('merge-ecm-runs', () => {
  if (!M) return;
  const run = (o) => Object.assign({ method: 'ECM', b1: '250000', curves: '100' }, o);

  // A number only the remote knows about arrives whole.
  {
    M.saveECM({});
    const out = M.mergeEcmData({ '30': [run({ curves: '77' })] });
    eq((out['30'] || []).length, 1, 'a number only the remote has is added');
    eq(out['30'][0].curves, '77', 'with its curve count intact');
  }

  // Same method and B1 on both sides = overlapping reports of the same work, so
  // curves take the MAX. Summing would claim twice the coverage actually achieved.
  {
    M.saveECM({ '30': [run({ curves: '100' })] });
    const out = M.mergeEcmData({ '30': [run({ curves: '250' })] });
    eq(out['30'].length, 1, 'the same method+B1 stays a single attempt');
    eq(out['30'][0].curves, '250', 'curves take the max, not the sum, of overlapping reports');
  }

  // With sigmas the count is knowable exactly: distinct sigmas are distinct curves,
  // so two devices running DIFFERENT curves at the same bound really do add up.
  {
    M.saveECM({ '30': [run({ curves: '2', sigmas: ['a', 'b'] })] });
    const out = M.mergeEcmData({ '30': [run({ curves: '2', sigmas: ['b', 'c'] })] });
    eq((out['30'][0].sigmas || []).slice().sort(), ['a', 'b', 'c'], 'sigma sets are unioned across devices');
    eq(out['30'][0].curves, '3', 'and the curve count is derived from the union, not either side alone');
  }

  // A different B1 is different work and must not be folded into the first.
  {
    M.saveECM({ '30': [run({ b1: '250000' })] });
    const out = M.mergeEcmData({ '30': [run({ b1: '1000000' })] });
    eq(out['30'].length, 2, 'a different B1 is recorded as a separate attempt');
  }

  // Merging the same remote twice must not keep inflating anything.
  {
    M.saveECM({ '30': [run({ curves: '100', sigmas: ['a'] })] });
    const once = M.mergeEcmData({ '30': [run({ curves: '150', sigmas: ['b'] })] });
    M.saveECM(once);
    const twice = M.mergeEcmData({ '30': [run({ curves: '150', sigmas: ['b'] })] });
    eq(JSON.stringify(twice), JSON.stringify(once), 'merging the same ECM payload again is a no-op');
  }

  // ── dates and measured time ──────────────────────────────────────────────
  // The sigma/curve merge above ignored these, so restoring an old export dropped
  // exactly the fields that mark work as historical. `date` is when an attempt was
  // first made and `lastRun` when it was last extended: the widest true interval
  // is the earliest date with the latest lastRun.
  {
    M.saveECM({ '30': [run({ date: '2026-06-01', lastRun: '2026-06-01' })] });
    const out = M.mergeEcmData({ '30': [run({ date: '2025-01-15', lastRun: '2026-08-09' })] })['30'][0];
    eq(out.date, '2025-01-15', 'the EARLIEST creation date wins — that is when the work started');
    eq(out.lastRun, '2026-08-09', 'and the LATEST lastRun — that is when it was last extended');
  }
  {
    M.saveECM({ '30': [run({})] });                       // no dates at all locally
    const out = M.mergeEcmData({ '30': [run({ date: '2025-01-15' })] })['30'][0];
    eq(out.date, '2025-01-15', 'a date from the file fills in where there was none');
  }
  {
    M.saveECM({ '30': [run({ ms: 5000 })] });
    const out = M.mergeEcmData({ '30': [run({ ms: 9000 })] })['30'][0];
    eq(out.ms, 9000, 'measured time takes the larger of the two');
    M.saveECM({ '30': [run({ ms: 9000 })] });
    const again = M.mergeEcmData({ '30': [run({ ms: 9000 })] })['30'][0];
    eq(again.ms, 9000, 'and never sums, which would inflate on every re-merge');
  }

  // ── any merge repairs the WHOLE store, not just what it touches ──────────
  // mergeEcmData normalises every local key before merging, so duplicate rows left
  // anywhere by an earlier import collapse on the next GitHub pull or JSON import
  // — including for numbers the incoming payload says nothing about. That is what
  // makes "did I double count?" answerable with a yes/no rather than a maybe.
  {
    M.saveECM({
      '30': [run({ curves: '100' }), run({ curves: '40', sigmas: ['x'] })],   // duplicate pair
      '99': [run({ b1: '250000', curves: '7' })],                             // untouched by the merge
    });
    const out = M.mergeEcmData({ '77': [run({ curves: '5' })] });
    eq(out['30'].length, 1, 'a duplicate pair on an unrelated number is collapsed by any merge');
    eq(out['30'][0].curves, '100', 'keeping the larger count rather than summing');
    eq(out['99'].length, 1, 'and numbers with nothing wrong are left alone');
    eq(Object.keys(out).sort(), ['30', '77', '99'], 'while the incoming number is still added');
  }
});

// ── one-time migrations rewrite stored data and get one chance to be right ────
// These run unattended at startup on every device, and each one has already been
// used for real. Two properties matter and neither was covered: they must not
// re-run once done (the flag), and running twice must be indistinguishable from
// running once (§7 shipped a non-idempotent fixer already).
group('startup-migrations', () => {
  if (!M) return;
  const clearFlags = () => {
    for (const k of ['eulerFDB_ecmMethodFix_v2', 'eulerFDB_compositeDedup_v1', 'eulerFDB_sigmaHash_v1'])
      sb2.localStorage.removeItem(k);
  };

  // ── P±1 runs mislabelled as ECM ──────────────────────────────────────────
  // A run with many curves or a sigma list is ECM whatever the label says; P-1
  // and P+1 run a single curve and have no sigma. The relabel drives the whole
  // cross-method coverage calculation, so a wrong method mis-values every
  // recommendation for that number.
  {
    clearFlags();
    M.saveECM({ '40': [{ method: 'P-1', b1: '250000', curves: '400', sigmas: ['x', 'y'] }] });
    M.migrateMislabeledEcm();
    eq(M.loadECM()['40'][0].method, 'ECM', 'a "P-1" run with 400 curves and sigmas is relabelled ECM');

    // Idempotent, and gated: a second call must not touch anything.
    const after = JSON.stringify(M.loadECM());
    M.migrateMislabeledEcm();
    eq(JSON.stringify(M.loadECM()), after, 'running it again changes nothing');

    // And a genuine P-1 run is left alone — one curve, no sigmas.
    clearFlags();
    M.saveECM({ '42': [{ method: 'P-1', b1: '11000000', curves: '1' }] });
    M.migrateMislabeledEcm();
    eq(M.loadECM()['42'][0].method, 'P-1', 'a real single-curve P-1 run keeps its method');
  }

  // ── the flag is what stops it running on every load ──────────────────────
  {
    clearFlags();
    M.saveECM({ '44': [{ method: 'P-1', b1: '250000', curves: '400', sigmas: ['x'] }] });
    M.migrateMislabeledEcm();                       // sets the flag
    M.saveECM({ '44': [{ method: 'P-1', b1: '250000', curves: '400', sigmas: ['x'] }] });
    M.migrateMislabeledEcm();                       // must be a no-op now
    eq(M.loadECM()['44'][0].method, 'P-1',
       'once the flag is set the migration does not run again (it is one-time, not a rule)');
  }

  // ── raw sigmas compacted to hashes ───────────────────────────────────────
  // This one exists because raw sigmas blew the storage quota, and clearing local
  // data did not help — the next pull brought them straight back from GitHub. So
  // it has to be safe to run against data that is already converted.
  {
    clearFlags();
    const raw = '123456789012345';
    M.saveECM({ '50': [{ method: 'ECM', b1: '250000', curves: '2', sigmas: [raw, '987654321098765'] }] });
    M.migrateSigmaHashes();
    const sig = M.loadECM()['50'][0].sigmas;
    ok(sig.every(s => !/^\d{9,}$/.test(String(s))), 'long raw sigmas are replaced by hashes');
    eq(sig.length, 2, 'and distinct sigmas stay distinct');
    eq(sig[0], M._hashStr(raw), 'the stored value is the hash of the original');

    clearFlags();
    const after = JSON.stringify(M.loadECM());
    M.migrateSigmaHashes();
    eq(JSON.stringify(M.loadECM()), after, 'a second pass over already-hashed data is a no-op');
  }

  // ── a composite recorded alongside its own prime factors ─────────────────
  // [79, 563, 1199714371, 53359696078967] where the last is the product of the
  // first three. Keeping both double-counts in the product-based status check and
  // sends the redundant composite to FactorDB as if it were a distinct factor.
  {
    clearFlags();
    const VAL = '600851475143';
    sb2.eulerValues[9002] = VAL;
    for (const k of Object.keys(sb2.fdbCache)) delete sb2.fdbCache[k];
    sb2.fdbCache[VAL] = { n: 9002, status: 'CF', timestamp: 1, factors: ['71', '839', '59569'] }; // 59569 = 71×839
    M.migrateRedundantComposites();
    eq(sb2.fdbCache[VAL].factors, ['71', '839'],
       'a composite equal to the product of its neighbours is dropped');

    clearFlags();
    const after = JSON.stringify(sb2.fdbCache[VAL].factors);
    M.migrateRedundantComposites();
    eq(JSON.stringify(sb2.fdbCache[VAL].factors), after, 'and a second pass leaves the cleaned list alone');
  }
});


// ── the sieve's write path re-verifies before it writes ─────────────────────
// runSmallPrimeSieve finds candidate factors; applySieveFindings is what commits
// them to entries and to fdbCache. The scan and the commit are separated by a
// user prompt, so the data can change in between — and this project's worst bugs
// have all been a factor written that does not divide. The guard exists in the
// source; nothing tested that it fires.
group('apply-sieve-findings', () => {
  const VAL = '600851475143';                     // 71 × 839 × 1471 × 6857
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.__discoveries.length = 0;
  sandbox.allEntries.push({ n: 7000, val: VAL, status: 'unknown', factors: [] });

  // A real hit and a fabricated one in the same finding. 73 does not divide, so it
  // must be dropped while its neighbours are still applied — rejecting the whole
  // finding would throw away good work, keeping the bad one would corrupt an entry.
  sandbox.__setPendingSieve([{ n: 7000, hits: [
    { p: '71',  exp: 1 },
    { p: '73',  exp: 1 },   // does not divide E(n)
    { p: '839', exp: 1 },
  ]}]);
  sandbox.applySieveFindings();

  const e = sandbox.allEntries[0];
  eq(e.factors, ['71', '839'], 'a hit that does not divide is refused, and the valid ones still land');
  eq(e.status, 'partial', 'the entry is partial because the factors do not account for the whole value');
  eq(sandbox.fdbCache[VAL].status, 'CF', 'and the cache record agrees with the entry');
  eq(sandbox.fdbCache[VAL].source, 'sieve', 'a new record is attributed to the sieve');
  eq(sandbox.__discoveries.filter(d => d[1] === '73').length, 0,
     'and the refused factor is not credited in the discovery history');
  eq(sandbox.__discoveries.filter(d => d[2] === 's').length, 2,
     'while the two real finds are recorded as sieve discoveries');

  // A silent rejection would be worse than a loud one: it looks like the sieve
  // simply found less. The count has to reach the user.
  ok(/1 were rejected because they no longer divide/.test(sandbox.__alerts.join(' ')),
     'the refused factor is reported rather than dropped silently');

  // The pending findings are consumed, so a second commit cannot double-apply.
  eq(sandbox.__getPendingSieve(), null, 'the pending findings are cleared once applied');
  sandbox.applySieveFindings();
  eq(sandbox.allEntries[0].factors, ['71', '839'], 'applying again is a no-op rather than a duplicate write');

  // ── the whole power must divide, not just the base ─────────────────────────
  // A hit is (p, exp) and gets written as "p^exp". Verifying only p would let 2^4
  // be recorded against a number divisible by 2^3 — a factor that does not divide,
  // arrived at from one that does.
  {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.allEntries.push({ n: 7002, val: '40', status: 'unknown', factors: [] });
    sandbox.__setPendingSieve([{ n: 7002, hits: [{ p: '2', exp: 4 }] }]);  // 40 % 16 ≠ 0
    sandbox.applySieveFindings();
    eq(sandbox.allEntries[0].factors, [], 'an over-stated exponent is refused even though its base divides');

    sandbox.__setPendingSieve([{ n: 7002, hits: [{ p: '2', exp: 3 }] }]);  // 40 % 8 = 0
    sandbox.applySieveFindings();
    eq(sandbox.allEntries[0].factors, ['2^3'], 'the correct power is written in exponent form');
  }

  // ── a complete factorisation is recognised as complete ────────────────────
  {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.allEntries.push({ n: 7004, val: '59569', status: 'unknown', factors: [] });  // 71 × 839
    sandbox.__setPendingSieve([{ n: 7004, hits: [{ p: '71', exp: 1 }, { p: '839', exp: 1 }] }]);
    sandbox.applySieveFindings();
    eq(sandbox.allEntries[0].status, 'full', 'an entry whose factors multiply back to the value is full');
    eq(sandbox.fdbCache['59569'].status, 'FF', 'and its cache record says so too');
  }
});

// ── the shared n→entry index ────────────────────────────────────────────────
// 22 call sites did `allEntries.find(x => x.n === n)`, five of them inside loops
// over the whole dataset, and four functions had each built their own local map to
// avoid exactly that. This replaces all of it.
//
// The risk being taken on is staleness, and it is a worse failure than the scan it
// replaces: a stale index hands back an entry object that is no longer the one in
// allEntries, so every mutation made to it lands on an orphan and disappears at the
// next render. Silent, and the same shape as several bugs in §7. So the guard gets
// tested harder than the lookup does.
group('entry-index', () => {
  const A = { n: 10, val: '10', factors: [] };
  const B = { n: 20, val: '20', factors: [] };

  sandbox.allEntries.length = 0;
  sandbox.allEntries.push(A, B);
  eq(sandbox.entryByN(10), A, 'finds an entry by n');
  eq(sandbox.entryByN(99), undefined, 'returns undefined for an n with no entry — same as .find');
  ok(sandbox.entryByN(20) === B, 'and returns the identical object, not a copy');

  // ── replacing the array ──────────────────────────────────────────────────
  // Every assignment in the app is `allEntries = buildEntries()`, so this is the
  // path that matters most.
  const C = { n: 10, val: 'different', factors: [] };
  sandbox.allEntries = [C];
  ok(sandbox.entryByN(10) === C, 'a replaced allEntries is picked up, not the old array');
  eq(sandbox.entryByN(20), undefined, 'and entries that no longer exist stop resolving');

  // ── mutating the array in place, same length ─────────────────────────────
  // This is the case an identity check alone would miss, and it is exactly what
  // the test harness does throughout: `allEntries.length = 0` then push one fresh
  // fixture, so the array is the same object at the same length with a completely
  // different entry inside it.
  const D = { n: 10, val: 'third', factors: [] };
  sandbox.allEntries.length = 0;
  sandbox.allEntries.push(D);
  ok(sandbox.entryByN(10) === D, 'an in-place swap at the same length is still picked up');

  // ── appending ────────────────────────────────────────────────────────────
  const E = { n: 30, val: '30', factors: [] };
  sandbox.allEntries.push(E);
  ok(sandbox.entryByN(30) === E, 'an appended entry becomes findable');
  ok(sandbox.entryByN(10) === D, 'without disturbing the entries already indexed');

  // ── removal from the middle ──────────────────────────────────────────────
  // Length changes while the first and last elements stay identical, so this is
  // the one shape only the LENGTH comparison catches. Added after a mutation that
  // deleted that comparison left the suite green — the check was load-bearing and
  // nothing was covering it.
  const M1 = { n: 100 }, M2 = { n: 110 }, M3 = { n: 120 };
  sandbox.allEntries = [M1, M2, M3];
  eq(sandbox.entryByN(110), M2, 'the middle entry resolves while it is present');
  sandbox.allEntries.splice(1, 1);        // [M1, M3] — same first, same last, shorter
  eq(sandbox.entryByN(110), undefined, 'removing it from the middle is detected via the length');
  ok(sandbox.entryByN(120) === M3, 'and the surviving entries still resolve');
  sandbox.allEntries.length = 0;
  sandbox.allEntries.push(D, E);

  // ── the property the whole thing rests on ────────────────────────────────
  // A write through the index must be a write to the live entry. If this ever
  // fails, work is being thrown away rather than merely found slowly.
  sandbox.entryByN(10).factors = ['7'];
  eq(sandbox.allEntries.find(x => x.n === 10).factors, ['7'],
     'a mutation through the index lands on the entry that is actually in allEntries');

  // ── first occurrence wins, exactly like .find ────────────────────────────
  const F1 = { n: 40, val: 'first' }, F2 = { n: 40, val: 'second' };
  sandbox.allEntries = [F1, F2];
  ok(sandbox.entryByN(40) === F1, 'a duplicate n resolves to the first, matching Array.find');

  // ── the limit of the guard, asserted so it is not assumed away ───────────
  // The guard compares identity, length, and the first and last elements. It
  // therefore cannot see a MIDDLE element being swapped inside the same array at
  // the same length. That is deliberate: it is four O(1) comparisons per lookup
  // instead of a scan, and the app never replaces an entry at an index — the only
  // way allEntries changes is `allEntries = buildEntries()`. Anything that does
  // start mutating entries positionally has to call rebuildEntryIndex itself, and
  // this assertion is here so that requirement is discovered by a failing test
  // rather than by wrong data.
  const G1 = { n: 50 }, G2 = { n: 60 }, G3 = { n: 70 };
  sandbox.allEntries = [G1, G2, G3];
  eq(sandbox.entryByN(60), G2, 'indexed before the positional swap');
  sandbox.allEntries[1] = { n: 60, val: 'swapped in' };
  ok(sandbox.entryByN(60) === G2,
     'a middle-element swap is NOT detected — callers doing that must rebuild explicitly');
  sandbox.rebuildEntryIndex(sandbox.allEntries);
  eq(sandbox.entryByN(60).val, 'swapped in', 'and an explicit rebuild resolves it');

  sandbox.allEntries = [];
  eq(sandbox.entryByN(10), undefined, 'an empty allEntries resolves nothing rather than throwing');
});

// ── "Check submitted" only queues what the browser can actually ask about ────
// The number goes in the URL and the request line is capped at 64 KiB, so a
// 75,000-digit entry is not a query that might fail — it is one that cannot be
// made. Queueing it produced a run of errors, moved the poll's failure counters,
// and left the entry pending regardless.
//
// The gate is confirmedQueryDigits(), NOT currentQueryCap(). §8's distinction:
// the cap is optimistic on purpose and sits at the sanity ceiling until something
// has actually been rejected, which is right for deciding to try one query and
// wrong for deciding whether a whole batch belongs in the browser at all.
// ── the offline check list has two questions, not one ───────────────────────
// "Export FDB check list" used to mean one thing: every unfinished entry above the
// browser's reach. That is the right set for "what does FactorDB know that we do
// not", and the wrong one after a fdb_submit.py run, when the question is "did our
// factors land?" — a set that is usually a few dozen entries rather than a few
// thousand, and megabytes rather than hundreds.
//
// The two are NOT nested, which is the whole reason this needs testing. 'all'
// excludes finished entries because there is nothing left to learn about them.
// 'ours' must INCLUDE them: a number factored completely on our own machines is
// `full` locally while FactorDB may know nothing about it, which makes it the
// clearest possible case of "we hold factors FactorDB lacks".
group('fdb-check-list-modes', () => {
  // The "submitted" set: every entry holding a factor FactorDB lacks — sent or not,
  // ANY SIZE. It used to be gated above ~19,000 digits, a leftover from when the
  // browser checked the smaller numbers itself, so a factor submitted for a smaller
  // entry was never confirmed.
  if (!needs(sandbox, 'fdbCheckSets')) return;
  const val = (d, seed) => String(seed) + '9'.repeat(d - String(seed).length);
  sandbox.__ls = {};
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  const add = (n, digits, status, factors) => {
    const e = { n, val: val(digits, n), status, factors: factors || [] };
    sandbox.allEntries.push(e);
    return e;
  };
  const small     = add(300, 1000,  'partial', ['61']);        // SMALL, holds a factor
  const unfinished= add(302, 80000, 'partial', []);            // nothing of ours
  const bothSets  = add(304, 80000, 'partial', ['61']);        // unfinished and ours
  const fullOurs  = add(306, 90000, 'full',    ['61','1471']); // complete here, not on FDB
  const fullOnFdb = add(308, 80000, 'full',    ['61']);        // FDB already has it
  const noFactors = add(310, 80000, 'full',    []);            // done, nothing to offer
  sandbox.fdbCache[fullOnFdb.val] = { n: 308, status: 'FF', source: 'fdb', factors: ['61'], timestamp: 1 };

  const sets = sandbox.fdbCheckSets(31);
  eq(sets.submitted.map(e => e.n), [300, 304, 306],
     'submitted = every entry holding a factor FactorDB lacks');
  ok(sets.submitted.some(e => e.n === small.n),
     'nothing is left out for size: a 1,000-digit entry is confirmed too (the old gate skipped it)');
  ok(sets.submitted.some(e => e.n === fullOurs.n),
     'entries already complete here are included — FactorDB is the most likely to be missing those');
  ok(!sets.submitted.some(e => e.n === fullOnFdb.n), 'an entry FactorDB already covers is not re-checked');
  ok(!sets.submitted.some(e => e.n === noFactors.n || e.n === unfinished.n), 'nor one with no factors of our own');
  ok(!sandbox.fdbCache[fullOurs.val] && sets.submitted.some(e => e.n === 306),
     'no FactorDB record at all means FactorDB does not have it: still selected');

  // Sent or not: the pending list no longer narrows it.
  sandbox.markSubmitted([304]);
  eq(sandbox.fdbCheckSets(31).submitted.map(e => e.n), [300, 304, 306],
     'a factor is in the set until FactorDB has it, whether or not it has been sent');

  // ── ordering ──────────────────────────────────────────────────────────────
  // The numbers and labels files are written from one list in one pass and paired
  // line by line; a mis-sorted set would record every result against the wrong
  // entry. Stored out of order here, so the sets must SORT, not inherit an order.
  // EVERY set must hold at least two entries for this to mean anything — an empty or
  // one-entry list is trivially "in order", which is how a missing sort on "old"
  // first slipped through.
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  const longAgo = Date.now() - 40 * 86400000;
  for (const n of [420, 410, 400]) {                          // stored DESCENDING
    add(n,     1000, 'unknown',     []);                     // never, everything
    add(n + 2, 1000, 'fdb-unknown', []);                     // fdb, everything
    const st = add(n + 4, 1000, 'partial', ['61']);          // submitted, old, everything
    sandbox.fdbCache[st.val] = { n: n + 4, status: 'CF', factors: [], timestamp: longAgo };
  }
  for (const [k, list] of Object.entries(sandbox.fdbCheckSets(31))) {
    const order = list.map(e => e.n);
    ok(order.length >= 2, '"' + k + '" holds several entries here, so its order is actually tested');
    eq(order, order.slice().sort((a, b) => a - b), '"' + k + '" comes out in n order, matching its labels file');
  }

  // ── what is not a factor ──────────────────────────────────────────────────
  add(312, 80000, 'partial', ['1']);
  ok(!sandbox.fdbCheckSets(31).submitted.some(e => e.n === 312),
     'a placeholder "1" does not qualify as a factor FactorDB lacks');
  add(2, 40, 'partial', ['3']);
  ok(!sandbox.fdbCheckSets(31).submitted.some(e => e.n === 2), 'and the trivial low entries are skipped');
  sandbox.__ls = {};
});

// ── the six check scopes behind the single Check button ─────────────────────
// These were six toolbar buttons, each with its target list written inline. The
// button is now one prompt, and the prompt shows a COUNT beside each scope — so a
// count computed from a copy of the rule would be a number that quietly disagrees
// with what pressing the button actually does. Extracting them is what makes the
// two the same thing; these assertions are what keep them that way.
// ── who supplied these factors? ─────────────────────────────────────────────
// `source: 'fdb'` means "FactorDB already holds everything we do", and it is read
// as a positive claim in two places that matter: exportFDBSubmission skips those
// entries, and so does the check list's 'ours' set. A wrong 'fdb' therefore does
// not show up as a visible error — it shows up as a factor that is never offered
// for submission, quietly, forever.
//
// THE BUG: with no factors in hand, `merged.every(...)` is vacuously true, so
// every entry FactorDB knew nothing about was cached as source 'fdb'. Harmless
// while the factor list stayed empty. Then the sieve found a small prime, updated
// the record's factors and status but not its source — and a factor FactorDB
// demonstrably did not have was marked as having come from FactorDB, and withheld
// from the one export whose whole job is sending it.
group('factor-source-attribution', () => {
  const VAL = '600851475143';                 // 71 x 839 x 1471 x 6857
  const setup = (status, factors) => {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.__discoveries.length = 0;
    const e = { n: 5000, val: VAL, status: 'unknown', factors: factors || [] };
    sandbox.allEntries.push(e);
    sandbox.applyFdbResult({ status, factors: [] }, 5000, VAL);
    return e;
  };

  // ── no factors means no claim ────────────────────────────────────────────
  {
    setup('U');
    eq(sandbox.fdbCache[VAL].source, null,
       "FactorDB knowing nothing does not make it the source of factors we do not have");
    setup('C');
    eq(sandbox.fdbCache[VAL].source, null,
       'and neither does a bare composite verdict with no factors attached');
  }

  // ── with factors of our own, FactorDB is not the source ──────────────────
  {
    setup('U', ['71']);
    eq(sandbox.fdbCache[VAL].source, 'import',
       'holding a factor FactorDB did not supply is attributed to us, not to it');
  }

  // ── the reported sequence, end to end ────────────────────────────────────
  // FactorDB has nothing; we sieve; we find 71. The record must not claim
  // FactorDB supplied it.
  {
    const e = setup('U');
    eq(e.status, 'fdb-unknown', 'the entry is FDB-undetermined to begin with');
    sandbox.__setPendingSieve([{ n: 5000, hits: [{ p: '71', exp: 1 }] }]);
    sandbox.applySieveFindings();

    eq(sandbox.allEntries[0].factors, ['71'], 'the sieve records the factor it found');
    ok(sandbox.fdbCache[VAL].source !== 'fdb',
       'and does NOT attribute it to FactorDB, which had nothing to give');
    eq(sandbox.fdbCache[VAL].source, 'sieve', 'it is attributed to the sieve that found it');
  }

  // ── the consequence that made it matter ──────────────────────────────────
  // Both the submission export and the check list's 'ours' set skip source 'fdb'.
  // This is the assertion that would have caught the bug as a user sees it.
  {
    const e = setup('U');
    sandbox.__setPendingSieve([{ n: 5000, hits: [{ p: '71', exp: 1 }] }]);
    sandbox.applySieveFindings();
    const cached = sandbox.fdbCache[VAL];
    ok(!(cached && cached.source === 'fdb'),
       'so a sieve hit on an entry FactorDB knows nothing about IS offered for submission');
  }

  // ── a stale 'fdb' claim is corrected, not merely avoided on fresh records ─
  // The record already exists and already says 'fdb' — from a check made back when
  // there was nothing to describe. Adding a factor has to overwrite that.
  {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.allEntries.push({ n: 5002, val: VAL, status: 'fdb-unknown', factors: [] });
    sandbox.fdbCache[VAL] = { n: 5002, status: 'U', factors: [], timestamp: 1, source: 'fdb' };
    sandbox.__setPendingSieve([{ n: 5002, hits: [{ p: '839', exp: 1 }] }]);
    sandbox.applySieveFindings();
    eq(sandbox.fdbCache[VAL].source, 'sieve',
       'an existing record claiming fdb is corrected when we add a factor to it');
    eq(sandbox.fdbCache[VAL].factors, ['839'], 'with the factor recorded alongside');
  }

  // ── FactorDB genuinely supplying everything still reads as 'fdb' ─────────
  // The fix must not make the claim unreachable — 'fdb' is what stops us
  // re-submitting factors FactorDB already has.
  {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.allEntries.push({ n: 5004, val: VAL, status: 'unknown', factors: [] });
    sandbox.applyFdbResult({ status: 'CF', factors: ['71', '839'] }, 5004, VAL);
    eq(sandbox.fdbCache[VAL].source, 'fdb',
       'factors FactorDB actually supplied are still attributed to FactorDB');
  }

  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
});

// ── a factor we found ourselves must never be attributed to FactorDB ─────────
// `source` is not a label, it is a claim with consequences: exportFDBSubmission
// SKIPS an entry whose source is 'fdb', and so does the check list's 'ours' set.
// Get it wrong in that direction and the factor is never offered to FactorDB —
// silently, permanently, and precisely for the numbers where our factors are the
// only ones that exist.
//
// The dangerous shape is a factor arriving AFTER a FactorDB record already exists.
// The record's source describes what FactorDB held at the time it was written, and
// nothing about it is true any more once we add something of our own.
//
// These walk the real sequence — query, then find — rather than checking each
// function alone, because the bug lives in the handover between them.
group('own-factors-are-never-fdb-sourced', () => {
  const V = '600851475143';                          // 71 × 839 × 1471 × 6857
  const setup = (status, factors) => {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    sandbox.__discoveries.length = 0;
    const e = { n: 900, val: V, status, factors: factors || [] };
    sandbox.allEntries.push(e);
    return e;
  };
  const sieve = (n, p) => { sandbox.__setPendingSieve([{ n, hits: [{ p, exp: 1 }] }]);
                            sandbox.applySieveFindings(); };

  // ── FactorDB has nothing, then the sieve finds something ─────────────────
  // The reported case. With no factors in hand, `merged.every(...)` is vacuously
  // true, so the natural way to write the source test returns 'fdb' for an entry
  // FactorDB has said nothing about — a claim about a factor list that does not
  // exist yet, sitting there waiting for the sieve to make it false.
  {
    const e = setup('unknown');
    sandbox.applyFdbResult({ status: 'U', factors: [] }, 900, V);
    eq(e.status, 'fdb-unknown', 'a U response leaves the entry FDB-undetermined');
    ok(sandbox.fdbCache[V].source !== 'fdb',
       'and with nothing in hand it claims no source at all, rather than "fdb"');

    sieve(900, '71');
    eq(sandbox.fdbCache[V].source, 'sieve',
       'a sieve hit on an entry FactorDB knows nothing about is OURS');
    ok((sandbox.allEntries[0].factors || []).includes('71'), 'and the factor is on the entry');
  }

  // ── FactorDB has nothing, then ECM finds something ───────────────────────
  {
    const e = setup('unknown');
    sandbox.applyFdbResult({ status: 'U', factors: [] }, 900, V);
    sandbox.recordEcmFactor(e, '839');
    eq(sandbox.fdbCache[V].source, 'import', 'an ECM factor is ours too, not FactorDB\'s');
  }

  // ── FactorDB HAD something, then we find more ────────────────────────────
  // The harder half. Here the 'fdb' claim was true when written, and stays sitting
  // in the record while the factor list moves out from under it.
  {
    const e = setup('unknown');
    sandbox.applyFdbResult({ status: 'CF', factors: [['71', 1], ['839', 1]] }, 900, V);
    eq(sandbox.fdbCache[V].source, 'fdb', 'FactorDB supplied everything we hold, so far');

    sieve(900, '1471');
    ok(sandbox.fdbCache[V].source !== 'fdb',
       'once the sieve adds a factor FactorDB did not give us, the claim is withdrawn');
  }
  {
    const e = setup('unknown');
    sandbox.applyFdbResult({ status: 'CF', factors: [['71', 1], ['839', 1]] }, 900, V);
    sandbox.recordEcmFactor(sandbox.allEntries[0], '1471');
    ok(sandbox.fdbCache[V].source !== 'fdb',
       'and the same when the new factor comes from ECM');
  }

  // ── a later FactorDB check must not re-claim what we found ───────────────
  // FactorDB answering again with only ITS factors, while we hold one it does not,
  // is the last place the claim could creep back.
  {
    const e = setup('unknown');
    sieve(900, '1471');
    sandbox.applyFdbResult({ status: 'CF', factors: [['71', 1], ['839', 1]] }, 900, V);
    ok(sandbox.fdbCache[V].source !== 'fdb',
       're-querying FactorDB does not let it claim a factor it never returned');
    const f = sandbox.fdbCache[V].factors || [];
    ok(f.includes('1471') && f.includes('71'),
       'and both sides\' factors survive the re-query');
  }

  // ── what FactorDB reported is recorded, not just merged away ─────────────
  // The merged factor list cannot answer "does FactorDB have this one?", because it
  // is the union of both sides. fdbHas keeps FactorDB's own list, which is what the
  // submission export needs so it stops offering FactorDB its own factors back.
  {
    setup('unknown');
    sandbox.applyFdbResult({ status: 'CF', factors: [['71', 1], ['839', 1]] }, 900, V);
    eq((sandbox.fdbCache[V].fdbHas || []).slice().sort(), ['71', '839'],
       'the factors FactorDB reported are recorded as its own');

    // A factor we found ourselves must NOT end up in it, however it merged.
    setup('unknown');
    sieve(900, '1471');
    sandbox.applyFdbResult({ status: 'CF', factors: [['71', 1]] }, 900, V);
    const has = sandbox.fdbCache[V].fdbHas || [];
    ok(has.includes('71'), "FactorDB's own factor is in the list");
    ok(!has.includes('1471'), 'and one it never reported is not, even though we hold it');
  }

  // ── and the screen must not claim FactorDB verified them either ──────────
  // `source` was right in every case above; what was wrong was the flag the modal
  // reads. replayFDBCache runs after every rebuild, and its CF branch set
  // _fdbVerified = true unconditionally — undoing, on every render, the fix
  // applyFdbResult carries on its own CF branch. Since a sieve or ECM find writes
  // a CF record, the modal ended up printing "all prime, verified by FactorDB"
  // over factors FactorDB has never seen.
  {
    const e = setup('unknown');
    sandbox.applyFdbResult({ status: 'U', factors: [] }, 900, V);
    sieve(900, '71');
    eq(e._fdbVerified, false, 'a sieve find is not marked FactorDB-verified when applied');
    // The state that matters is after a rebuild, since that is when replay runs
    // and what every render therefore sees.
    sandbox.replayFDBCache();
    eq(sandbox.allEntries[0]._fdbVerified, false,
       'and is still not FactorDB-verified after a replay');
  }
  {
    const e = setup('unknown');
    sandbox.applyFdbResult({ status: 'U', factors: [] }, 900, V);
    sandbox.recordEcmFactor(e, '839');
    sandbox.replayFDBCache();
    eq(sandbox.allEntries[0]._fdbVerified, false, 'same for a factor found by ECM');
  }
  // A real FF from FactorDB still is verified — the flag has to keep meaning
  // something, or this trades a false signal for a lost true one.
  {
    setup('unknown');
    sandbox.applyFdbResult({ status: 'FF', factors: [['71', 1], ['839', 1], ['1471', 1], ['6857', 1]] }, 900, V);
    sandbox.replayFDBCache();
    eq(sandbox.allEntries[0]._fdbVerified, true,
       'an actual FF from FactorDB is still marked verified after replay');
  }
  // CF from FactorDB itself is likewise not a verification: CF means it has NOT
  // declared the listed factors prime.
  {
    setup('unknown');
    sandbox.applyFdbResult({ status: 'CF', factors: [['71', 1], ['839', 1]] }, 900, V);
    sandbox.replayFDBCache();
    eq(sandbox.allEntries[0]._fdbVerified, false,
       'and a CF response is not a verification even when FactorDB supplied every factor');
  }

  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
});

// ── ECM yield by level ──────────────────────────────────────────────────────
// The report answers one question per row: for this level of effort, what did a
// find cost? Numerator and denominator therefore have to describe the same level,
// and for a long time they did not.
//
// Effort can only be bucketed one way: by the B1 a run used. Finds were bucketed
// by the found factor's own digit count. Those coincide only when a run turns up a
// factor of exactly the size its B1 targets — not the normal case, since running
// at t35 also clears smaller factors and usually that is what it finds. Every
// other time, the cost landed on one row and the credit on another, and BOTH rows
// reported nothing usable.
//
// The existing test above could not see this: its fixture pairs a 29-digit factor
// with B1=250,000, and b1ToDigits(250000) and bucketForDigits(29) both come out at
// 30. The one case where the two rules agree.
group('yield-by-level', () => {
  if (!M) return;
  const setup = (entries, ecm, hist) => {
    sb2.__ls = {};
    sb2.__ls['eulerFDB_histStart_v1'] = String(Math.floor(new Date('2026-01-01').getTime() / 1000));
    M.saveHistory(hist || []);
    sb2.fdbCache = {};
    sb2.allEntries = entries;
    sb2.loadECM = () => ecm;
  };
  const TS = (d) => Math.floor(new Date(d).getTime() / 1000);
  const V = '9'.repeat(200);
  const PURE_B1_10 = PURE.ecmTableB1(10);   // what the engine recommends for t10
  const run35 = { method: 'ECM', b1: '1000000', curves: '2000', date: '2026-05-03', lastRun: '2026-05-03' };
  const lvl = (y, d) => y.levels.find(L => L.d === d);

  // ── the axis ─────────────────────────────────────────────────────────────
  // A t35 run that finds a 25-digit factor. Cost and credit must both land on 35.
  {
    setup([{ n: 100, val: V, status: 'partial', factors: ['61'] }],
          { '100': [{ ...run35 }] },
          [[100, TS('2026-05-04'), 25, 'e', 'h1']]);
    const y = M.computeYieldByLevel();
    eq(lvl(y, 35).finds, 1, 'a find is credited to the level of effort that produced it');
    eq(lvl(y, 25).finds, 0, 'not to the level matching the size of the factor found');
    ok(lvl(y, 35).tCpuSec > 0, 'and that level carries the cost as well');
    ok(lvl(y, 35).cpuPerFind > 0, 'so cost per find is an actual number');
    eq(lvl(y, 25).cpuPerFind, null, 'while a level with neither effort nor finds reports nothing');
  }

  // ── work on a finished entry still costs what it cost ────────────────────
  // getCofactorDigits returns null for a full entry — correct for display, there
  // is no cofactor left — and feeding that to the cost model priced the run at
  // ZERO. Backwards in the worst direction: finished entries are the ones the
  // effort paid off on, so their cost left the denominator while their finds
  // stayed in the numerator, and the levels that had actually succeeded reported
  // free factors.
  {
    const mk = (status, factors) => [{ n: 100, val: V, status, factors }];
    setup(mk('partial', ['61']), { '100': [{ ...run35 }] }, [[100, TS('2026-05-04'), 25, 'e', 'h1']]);
    const openCpu = lvl(M.computeYieldByLevel(), 35).tCpuSec;
    setup(mk('full', ['61', '7']), { '100': [{ ...run35 }] }, [[100, TS('2026-05-04'), 25, 'e', 'h1']]);
    const doneCpu = lvl(M.computeYieldByLevel(), 35).tCpuSec;
    ok(openCpu > 0, 'an unfinished entry prices its runs');
    ok(doneCpu > 0, 'and so does a finished one — the run happened either way');
    eq(Math.round(doneCpu), Math.round(openCpu),
       'identical work on identical numbers costs the same whether or not it finished the job');
  }
  // A measured ms needs no digit count at all, so it must survive regardless.
  {
    setup([{ n: 100, val: V, status: 'full', factors: ['61', '7'] }],
          { '100': [{ ...run35, ms: 42000 }] }, [[100, TS('2026-05-04'), 25, 'e', 'h1']]);
    eq(Math.round(lvl(M.computeYieldByLevel(), 35).tCpuSec), 42,
       'a measured runtime is used verbatim, not re-estimated or discarded');
  }

  // ── finds with no recorded cost are unknown, not free ────────────────────
  // `tCpuSec / finds` with a zero numerator is 0, which the report renders as a
  // cost of nothing. The honest answer is that we do not know.
  {
    setup([{ n: 100, val: V, status: 'partial', factors: ['61'] }],
          { '100': [{ method: 'ECM', b1: '1000000', curves: '2000', date: '2020-01-01', lastRun: '2020-01-01' }] },
          [[100, TS('2026-05-04'), 25, 'e', 'h1']]);
    const L = lvl(M.computeYieldByLevel(), 35);
    eq(L.finds, 1, 'the find is still counted');
    eq(L.tCpuSec, 0, 'with no tracked effort behind it');
    eq(L.cpuPerFind, null, 'so cost per find is null — unknown — rather than zero');
  }

  // ── a sieve find is not ECM yield ────────────────────────────────────────
  // The sieve costs no ECM time. Counting its finds as ECM finds credited free
  // factors to whichever ECM level happened to have run on the same number,
  // flattering precisely the levels that had done least for them.
  {
    setup([{ n: 100, val: V, status: 'partial', factors: ['61'] }],
          { '100': [{ ...run35 }] },
          [[100, TS('2026-05-04'), 7, 's', 'h1']]);
    const y = M.computeYieldByLevel();
    eq(y.sieveFinds, 1, 'a sieve find is tallied on its own');
    eq(lvl(y, 35).finds, 0, 'and does not inflate the ECM level that happened to share the number');
    eq(y.totalFinds, 1, 'while still counting as our own work overall');
  }

  // ── attribution respects when the run happened ───────────────────────────
  // A find dated before a later, higher run belongs to the level that was actually
  // going at the time.
  {
    setup([{ n: 100, val: V, status: 'partial', factors: ['61'] }],
          { '100': [
            { method: 'ECM', b1: '250000',  curves: '500',  date: '2026-03-01', lastRun: '2026-03-01' },
            { method: 'ECM', b1: '1000000', curves: '2000', date: '2026-08-01', lastRun: '2026-08-01' },
          ] },
          [[100, TS('2026-04-01'), 25, 'e', 'h1']]);
    const y = M.computeYieldByLevel();
    eq(lvl(y, 30).finds, 1, 'a find is credited to the level running at the time, not the highest ever run');
    eq(lvl(y, 35).finds, 0, 'a run that had not happened yet gets no credit for it');
  }

  // ── with several levels eligible, the highest wins ───────────────────────
  // Both runs predate the find, so both could have produced it. The higher B1 is
  // overwhelmingly the likelier source — that is what raising B1 is for — and it
  // is also the one carrying most of the cost, so crediting the lower level would
  // leave the expensive row looking barren. Needs two eligible levels to be
  // observable at all; the case above has only one.
  {
    setup([{ n: 100, val: V, status: 'partial', factors: ['61'] }],
          { '100': [
            { method: 'ECM', b1: '250000',  curves: '500',  date: '2026-03-01', lastRun: '2026-03-01' },
            { method: 'ECM', b1: '1000000', curves: '2000', date: '2026-04-01', lastRun: '2026-04-01' },
          ] },
          [[100, TS('2026-05-01'), 25, 'e', 'h1']]);
    const y2 = M.computeYieldByLevel();
    eq(lvl(y2, 35).finds, 1, 'the highest level run before the find takes the credit');
    eq(lvl(y2, 30).finds, 0, 'and the lower one does not');
  }

  // ── the factor sizes are kept, just not as the axis ──────────────────────
  {
    setup([{ n: 100, val: V, status: 'partial', factors: ['61'] }],
          { '100': [{ ...run35 }] },
          [[100, TS('2026-05-04'), 25, 'e', 'h1']]);
    const y = M.computeYieldByLevel();
    eq(y.findSizes[25], 1, 'how big the factors were is still reported, as its own distribution');
  }

  // ── a t10 run reaches its own row, end to end ────────────────────────────
  // Two separate questions behind "I ran t10 and see no curves": does the import
  // persist the run at all, and does the report file it under t10? The first was
  // fine — processEcmLogText calls saveECM — and the second was not: b1ToDigits
  // could not return anything below 20, so the curves landed on the level-20 row
  // while the t10 row the report draws stayed empty.
  {
    const b1 = String(Math.round(PURE_B1_10));
    setup([{ n: 100, val: V, status: 'partial', factors: ['61'] }],
          { '100': [{ method: 'ECM', b1, curves: '30', date: '2026-05-03', lastRun: '2026-05-03' }] },
          [[100, TS('2026-05-04'), 9, 'e', 'h1']]);
    const y = M.computeYieldByLevel();
    eq(lvl(y, 10).curves, 30, 'a t10 run is counted on the t10 row');
    eq(lvl(y, 20).curves, 0, 'and not silently rolled into t20');
    eq(lvl(y, 10).finds, 1, 'its find lands there too, so the row is self-consistent');
    ok(lvl(y, 10).tCpuSec > 0, 'with the cost beside it');
  }

  // ── expected finds must come from the SAME window as the finds ───────────
  // Effort is known for all time; finds are attributable only from the tracking
  // start — which is why this table has two column groups at all. Accumulating the
  // model's expectation over ALL work while counting finds over the tracked window
  // compares a numerator and denominator from different periods.
  //
  // Not a small error: on the real dataset t20 had 236,728 curves all time and 146
  // inside the window, so the ratio came out 1,621x too low, and every level whose
  // work predates tracking would have been calibrated down to the clamp.
  {
    setup([{ n: 500, val: V, status: 'partial', factors: ['61'] }],
          { '500': [
            // Old work, outside the window: effort counts, expectation must not.
            { method: 'ECM', b1: '11000', curves: '5000', date: '2020-01-01', lastRun: '2020-01-01' },
            // Recent work, inside it: both count.
            { method: 'ECM', b1: '11000', curves: '10',   date: '2026-05-03', lastRun: '2026-05-03' },
          ] },
          [[500, TS('2026-05-04'), 9, 'e', 'h1']]);
    const y = M.computeYieldByLevel();
    const row = lvl(y, 20);
    eq(row.curves, 5010, 'all-time curves include the old work');
    eq(row.tCurves, 10, 'while the tracked column counts only what is inside the window');

    // Compared against what the model says for each candidate curve count.
    //
    // A first version of this divided expFinds by tCurves and by curves and
    // compared those — which is always exactly curves/tCurves whatever the
    // numerator is, so it tested the divisors and would have passed against the
    // bug. The value itself has to be checked.
    const dig = V.length;
    const expFor = (curves) => PURE.pFactorExists(20, dig) * PURE.ecmProbability(20, curves, 11000);
    const wantTracked = expFor(10);      // the 10 curves inside the window
    const wantAll     = expFor(5010);    // what an all-time accumulation would give

    ok(row.expFinds > 0, 'the tracked work produces an expectation');
    ok(Math.abs(row.expFinds - wantTracked) < wantTracked * 0.01 + 1e-12,
       'the expectation matches the TRACKED curves');
    ok(row.expFinds < wantAll * 0.5,
       'and is nowhere near what all-time accumulation would have given');
    const c = PURE.yieldCalibration([row]);
    ok(c[20].ratio > 0, 'so a ratio can be formed at all');
  }

  sb2.loadECM = M.loadECM;    // restore — see no-stub-leaks
  sb2.__ls = {};
});

// ── importing a GMP-ECM log actually changes the ECM log ────────────────────
// processEcmLogText is the largest function in the app and was entirely untested,
// which left "did my import actually record anything?" unanswerable except by
// reading the source. It touches no DOM, so the only thing keeping it untested was
// that nobody had tried.
//
// This drives it with a real GMP-ECM verbose log for a t10 run and checks the run
// lands in the store, at the right B1, with the right curve count.
// ── ROUND TRIP: an expression input, through REAL GMP-ECM, back through import ──
// The export now writes "E(n)/PRODUCT" and lets GMP-ECM divide, instead of
// resolving every cofactor in the browser (~10 ms each, nearly all of the wait for a
// large export). That changes what GMP-ECM receives AND what it echoes back, so this
// proves the whole loop on a log captured from a real GMP-ECM run of exactly the
// line the export writes — not a hand-written imitation of one.
groupAsync('expression-input-round-trip', async () => {
  if (!sandbox.processEcmLogText || !sandbox.ecmInputFor) return;
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.__ecm = {};
  const V = '71000213497001491';                    // 71 x 1000003 x 1000000007
  const e = { n: 402, val: V, status: 'partial', factors: ['71'] };
  sandbox.allEntries.push(e);
  sandbox.eulerValues[402] = V;

  // 1. What the export writes for this entry.
  const line = sandbox.ecmInputFor(e);
  eq(line, V + '/71', 'the export writes E(n)/PRODUCT, not a resolved cofactor');
  eq(sandbox.ecmInputFor({ n: 1, val: V, factors: [] }), V,
     'with nothing known it writes E(n) itself');
  ok(/^\d+(\/\d+)?$/.test(line),
     'only digits and one "/", so neither cmd nor PowerShell can misread it');

  // 2. What a REAL GMP-ECM printed for exactly that line, plus the tag the Windows
  //    worker writes into the import file before the run.
  const log = [
    '# run ECM B1=3000 E(402) 16d - ECM target 10d - ~1 s - +50.00%',
    'Input number is ' + V + '/71 (16 digits)',
    'Using B1=3000, B2=224406, polynomial x^1, sigma=1:1174973966',
    'Step 1 took 1ms',
    '********** Factor found in step 1: 1000000007',
    'Found prime factor of 10 digits: 1000000007',
  ].join('\n');
  await sandbox.processEcmLogText(log, 'roundtrip.log');

  // 3. The find lands on the RIGHT entry, identified from the tag because the
  //    number line is no longer plain digits.
  const after = sandbox.allEntries.find(x => x.n === 402);
  const bases = (after.factors || []).map(f => String(f).split('^')[0]);
  ok(bases.includes('1000000007'),
     'the factor GMP-ECM found is recorded on E(402) — attribution survives the '
     + 'expression input');
  ok(bases.includes('71'), 'and the factor that was already known is still there');
  const stored = sandbox.__ecm['402'] || [];
  ok(stored.length >= 1, 'the run itself is recorded against E(402)');

  // …and the EXPORT must actually use it. A correct ecmInputFor that the export
  // never calls would leave every cofactor still being resolved in the browser —
  // and pass everything above.
  const src2 = fs.readFileSync('index.html', 'utf8');
  const i = src2.indexOf('const cofValCache = new Map();');
  const loop = src2.slice(i, i + 400);
  ok(/v = ecmInputFor\(r\.entry\);/.test(loop),
     'the export builds each run\'s input with ecmInputFor');
  ok(!/getCofactor\(r\.entry\)/.test(loop),
     'and no longer resolves the cofactor in the browser');
});

// A factor is labelled by the method that found it. Every log find used to be
// recorded as ECM, so one a P-1 run found said "your ECM"; and a factor added by hand
// said "your P±1".
groupAsync('finds-are-labelled-by-method', async () => {
  if (!sandbox.processEcmLogText) return;
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.__ecm = {}; sandbox.__saved = null;
  const V = String(71n * 1000000007n * 10000000019n);
  sandbox.allEntries.push({ n: 404, val: V, status: 'partial', factors: ['71'] });
  sandbox.eulerValues[404] = V;
  // This sandbox keeps no discovery history, so watch the recording call itself.
  const realRecord = sandbox.recordDiscovery, recorded = [];
  sandbox.recordDiscovery = (n, f, code) => { recorded.push({ n, digits: String(f).length, code }); return true; };
  const log = (method, f, x) => [
    '# run m1c1 1/1 E(404) ' + V.length + 'd - ' + method + ' - B1=3000',
    'Input number is ' + V + ' (' + V.length + ' digits)',
    'Using B1=3000, B2=224406, polynomial x^1, ' + x,
    'Step 1 took 1ms',
    '********** Factor found in step 1: ' + f,
    'Found prime factor of ' + f.length + ' digits: ' + f,
  ].join('\n');
  await sandbox.processEcmLogText(log('P-1', '1000000007', 'x0=1234567'), 'pm1.log');
  await sandbox.processEcmLogText(log('ECM', '10000000019', 'sigma=1:1174973966'), 'ecm.log');
  sandbox.recordDiscovery = realRecord;
  const codeFor = (digits) => (recorded.find(r => r.n === 404 && r.digits === digits) || {}).code;
  eq(codeFor(10), 'p', 'a factor a P-1 run found is recorded as P±1');
  eq(codeFor(11), 'e', 'one an ECM run found is recorded as ECM');
  sandbox.__ecm = {};
});

// FactorDB answers an unfactored composite ("C") with the number itself as its only
// factor. The cached record keeps that; replayed on the next load, it turned the entry
// into "partially factored", its whole value its one factor.
group('replay-ignores-the-number-itself', () => {
  if (typeof applyFdbResult !== 'function' || typeof replayFDBCache !== 'function') return;
  const N = '221';                                  // 13 × 17 — FactorDB does not know that here
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.allEntries.push({ n: 900, val: N, status: 'unknown', factors: [] });
  applyFdbResult({ status: 'C', factors: [[N, 1]] }, 900, N);
  const e = sandbox.allEntries[0];
  e.factors = []; e.status = 'unknown';             // a reload: entries are rebuilt, records replayed
  replayFDBCache();
  eq([e.status, JSON.stringify(e.factors)], ['composite', '[]'], 'an unfactored composite comes back from a reload as a composite, with no factors');
  // A record that also holds a real factor keeps it.
  const M2 = '2431';                                // 11 × 13 × 17
  sandbox.allEntries.push({ n: 902, val: M2, status: 'partial', factors: [] });
  sandbox.fdbCache[M2] = { n: 902, status: 'CF', factors: ['11', M2], source: 'fdb' };
  const e2 = sandbox.allEntries[1];
  replayFDBCache();
  eq(JSON.stringify(e2.factors), '["11"]', 'a real factor beside it is kept — only the number itself is dropped');
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
});

groupAsync('ecm-log-import', async () => {
  if (!sandbox.processEcmLogText) return;
  sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  sandbox.__ecm = {};
  sandbox.__saved = null;
  const V = '600851475143';
  sandbox.allEntries.push({ n: 400, val: V, status: 'partial', factors: ['71'] });
  // The importer resolves a run-comment's E(n) against eulerValues, which is how it
  // survives a log whose number line got garbled in transit.
  sandbox.eulerValues[400] = V;

  // Shape of a real GMP-ECM verbose run, including the batch's own run-comment
  // line, which is the authoritative method + E(n) source.
  const b1 = String(Math.round(PURE.ecmTableB1(10)));
  const log = [
    `# run m1c1 1/250 E(400) 12d - ECM - B1=${b1}`,
    `Input number is ${V} (12 digits)`,
    `Using B1=${b1}, B2=100000, polynomial x^1, sigma=1:1111111111`,
    'Step 1 took 120ms',
    'Step 2 took 80ms',
    `Run 2 out of 3: Using B1=${b1}, B2=100000, polynomial x^1, sigma=1:2222222222`,
    'Step 1 took 110ms',
    'Step 2 took 70ms',
  ].join('\n');

  await sandbox.processEcmLogText(log, 'test.log');

  const stored = sandbox.__ecm['400'] || [];
  eq(stored.length, 1, 'importing a log records an attempt against the right E(n)');
  ok(!!sandbox.__saved, 'and persists it — saveECM is actually called, not just the in-memory copy');
  if (stored.length) {
    const a = stored[0];
    eq(a.method, 'ECM', 'with the method taken from the run comment');
    eq(String(a.b1), b1, 'and the B1 it was actually run at');
    eq(a.curves, '2', 'curves counted from the distinct sigmas seen, not the "out of 3" it was aiming for');
    ok(a.ms >= 380, 'the measured runtime is summed from the Step lines');
    ok(!!a.date && !!a.lastRun, 'and it is dated, so the yield report can place it in time');

    // The point of the whole exercise: a t10 import is reportable AS t10.
    eq(PURE.b1ToDigits(String(a.b1)), 10,
       'and a t10 import is recognised as t10, not rounded up to the table floor');
  }

  // A second import of the same log must not double-count: the sigmas identify the
  // curves, and re-importing the same file is something people do.
  await sandbox.processEcmLogText(log, 'test.log');
  eq((sandbox.__ecm['400'] || []).length, 1, 're-importing the same log does not add a second attempt');
  eq((sandbox.__ecm['400'] || [])[0].curves, '2', 'nor inflate the curve count');

  // ── the same, for a log with NO sigma lines ──────────────────────────────
  // Not all logs carry sigmas, and that case took a different branch: "count it if
  // we cannot tell", which is true for every sigma-less block. So re-importing one
  // added its measured time again and re-stamped it as worked-on-today, every
  // time. The visible symptom is the yield report's two halves collapsing —
  // re-import an old log and its effort is dated today, so "all time" and "since
  // tracking began" show identical numbers and the historical work stops reading
  // as historical.
  {
    sandbox.__ecm = {};
    const plain = [
      `# run m1c1 1/250 E(400) 12d - ECM - B1=${b1}`,
      `Input number is ${V} (12 digits)`,
      `Using B1=${b1}, B2=100000, polynomial x^1`,
      'Run 4 out of 4: Step 1 took 500ms',
      'Step 2 took 250ms',
    ].join('\n');

    await sandbox.processEcmLogText(plain, 'plain.log');
    const first = (sandbox.__ecm['400'] || [])[0];
    ok(!!first, 'a log with no sigma lines still records an attempt');
    const msAfterFirst = first.ms;
    const curvesAfterFirst = first.curves;
    first.lastRun = '2020-01-01';           // pretend this was old work

    await sandbox.processEcmLogText(plain, 'plain.log');
    const again = (sandbox.__ecm['400'] || [])[0];
    eq((sandbox.__ecm['400'] || []).length, 1, 're-importing it adds no second attempt');
    eq(again.curves, curvesAfterFirst, 'and no extra curves');
    eq(again.ms, msAfterFirst, 'and does not add its measured time a second time');
    eq(again.lastRun, '2020-01-01',
       'and does not re-date old work as recent — which is what collapsed the two halves of the yield report');
  }

  // ── a log import must not duplicate a RESTORED attempt ───────────────────
  // The duplicate check keys on method + B1 + `source === 'log'`, and `source:
  // 'log'` is set by this importer and nowhere else. Every attempt that arrived
  // any other way — a results_ecm.json restore, an older export, a GitHub pull —
  // carries no source at all, so the check cannot see it and pushes a SECOND
  // attempt at the same method and B1.
  //
  // The yield report sums curves per attempt, so two rows for one piece of work is
  // a straight double count. In a real restored store 15,083 of 21,355 attempts
  // carry no source, making this the common case rather than a corner one.
  //
  // normalizeEcmAttempts and mergeEcmData both key on method|B1 with no source
  // filter. Two of the three agreed; this was the one that did not.
  {
    sandbox.__ecm = {};
    const b1b = String(Math.round(PURE.ecmTableB1(20)));
    sandbox.__ecm['400'] = [{ method: 'ECM', b1: b1b, curves: '200', b2: '', note: 'restored' }];
    const sameB1 = [
      `# run m1c1 1/250 E(400) 12d - ECM - B1=${b1b}`,
      `Input number is ${V} (12 digits)`,
      `Using B1=${b1b}, B2=100000, polynomial x^1, sigma=1:5555555555`,
      'Step 1 took 100ms',
      'Step 2 took 50ms',
    ].join('\n');

    await sandbox.processEcmLogText(sameB1, 'same-b1.log');
    const atThisB1 = (sandbox.__ecm['400'] || []).filter(a => a.method === 'ECM' && String(a.b1) === b1b);
    eq(atThisB1.length, 1,
       'a log import merges into a restored attempt at the same B1 rather than adding a second row');
    if (atThisB1.length === 1) {
      eq(atThisB1[0].curves, '200', 'and a larger restored curve count is not reduced by a smaller log');
    }
  }

  // ── a store that ALREADY has duplicates repairs itself ───────────────────
  // Anyone who imported a log after restoring a backup is carrying duplicate rows
  // right now. They are collapsed the next time a log touches that number, rather
  // than needing a migration nobody would remember to run.
  {
    sandbox.__ecm = {};
    const b1c = String(Math.round(PURE.ecmTableB1(25)));
    sandbox.__ecm['400'] = [
      { method: 'ECM', b1: b1c, curves: '200', note: 'restored' },
      { method: 'ECM', b1: b1c, curves: '30', sigmas: ['aa', 'bb'], source: 'log' },
    ];
    const more = [
      `# run m1c1 1/250 E(400) 12d - ECM - B1=${b1c}`,
      `Input number is ${V} (12 digits)`,
      `Using B1=${b1c}, B2=100000, polynomial x^1, sigma=1:7777777777`,
      'Step 1 took 100ms',
      'Step 2 took 50ms',
    ].join('\n');
    await sandbox.processEcmLogText(more, 'more.log');
    const rows = (sandbox.__ecm['400'] || []).filter(a => String(a.b1) === b1c);
    eq(rows.length, 1, 'duplicate rows left by an earlier import are collapsed into one');
    eq(rows[0].curves, '200', 'keeping the largest curve count rather than summing them');
    eq((rows[0].sigmas || []).slice().sort(), ['aa', 'bb', sandbox._hashStr('7777777777')].sort(),
       'and unioning every sigma either row held, plus the new one');
  }

  // ── the opposite error: different B1 levels must stay apart ──────────────
  // Loosening the duplicate check is how the double-count was fixed, and loosening
  // it too far costs just as much in the other direction: t20 and t30 work folded
  // into one row would erase a whole level of effort from the yield report and
  // leave the recommendation engine thinking a level had been covered when it had
  // not. Only method AND B1 together identify an attempt.
  {
    sandbox.__ecm = {};
    const b1lo = String(Math.round(PURE.ecmTableB1(20)));
    const b1hi = String(Math.round(PURE.ecmTableB1(30)));
    sandbox.__ecm['400'] = [{ method: 'ECM', b1: b1lo, curves: '100', note: 'restored' }];
    const higher = [
      `# run m1c1 1/250 E(400) 12d - ECM - B1=${b1hi}`,
      `Input number is ${V} (12 digits)`,
      `Using B1=${b1hi}, B2=100000, polynomial x^1, sigma=1:8888888888`,
      'Step 1 took 100ms',
      'Step 2 took 50ms',
    ].join('\n');
    await sandbox.processEcmLogText(higher, 'higher.log');
    const rows2 = sandbox.__ecm['400'] || [];
    eq(rows2.length, 2, 'a run at a different B1 is a separate attempt, not a merge');
    eq(rows2.find(a => String(a.b1) === b1lo).curves, '100', 'the existing level keeps its curves');
    ok(!!rows2.find(a => String(a.b1) === b1hi), 'and the new level is recorded in its own right');
  }
});

// ── a level with finds must have runs behind it ─────────────────────────────
// Structural invariant, and the quickest way to tell which build a report came
// from. Finds are credited to the level of effort that produced them, so a level
// showing finds while showing no runs is impossible — under the old rule, where
// finds were bucketed by the FOUND FACTOR's size, it was the normal case: t10 and
// t15 collected small factors while every recorded run sat on t20.
group('yield-finds-imply-effort', () => {
  if (!M) return;
  sb2.__ls = {};
  sb2.__ls['eulerFDB_histStart_v1'] = String(Math.floor(new Date('2026-01-01').getTime() / 1000));
  M.saveHistory([]);
  sb2.fdbCache = {};
  const V = '9'.repeat(200);
  const hist = [];
  const ecm = {};
  sb2.allEntries = [];
  // 44 entries, every run at t20, factors of 10 and 15 digits — the shape that
  // produced "t10: 41 finds, 0 runs" before the fix.
  for (let i = 0; i < 44; i++) {
    const n = 100 + i * 2;
    sb2.allEntries.push({ n, val: V, status: 'partial', factors: ['61'] });
    ecm[String(n)] = [{ method: 'ECM', b1: '11000', curves: '25', date: '2026-05-03', lastRun: '2026-05-03' }];
    hist.push([n, Math.floor(new Date('2026-05-04').getTime() / 1000), i < 41 ? 10 : 15, 'e', 'h' + n]);
  }
  M.saveHistory(hist);
  sb2.loadECM = () => ecm;

  const y = M.computeYieldByLevel();
  const orphans = y.levels.filter(L => L.finds > 0 && L.runs === 0).map(L => 't' + L.d);
  eq(orphans, [], 'no level reports finds without any runs behind them');
  eq(y.levels.find(L => L.d === 20).finds, 44, 'all 44 finds land on the level that was actually run');
  eq(y.findSizes[10], 41, 'while the factor sizes are still reported separately');
  eq(y.findSizes[15], 3, 'for both sizes');

  sb2.loadECM = M.loadECM;
  sb2.__ls = {};
});

// ── restoring an ECM store from a results_ecm.json ──────────────────────────
// The file the sync pushes to GitHub is the only backup this data has, and until
// now the only way it could come back was a GitHub pull. If the browser copy was
// lost and the repo was not ahead, the export sitting on disk was unreadable:
// "Import ECM results" parses GMP-ECM console output, so feeding it this file
// matched no run blocks and imported nothing — silently, in a way that reads like
// the file was empty.
group('ecm-json-import', () => {
  if (!M) return;
  const wrap = (ecm) => JSON.stringify({ version: 3, ecm, updatedAt: '2026-01-01T00:00:00Z' });
  const att = (o) => Object.assign({ method: 'ECM', b1: '250000', curves: '10' }, o);

  // ── it MERGES, it does not replace ───────────────────────────────────────
  // The whole point is restoring lost history without discarding what is here.
  {
    M.saveECM({ '100': [att({ curves: '40', sigmas: ['a', 'b'] })],
                '102': [att({ b1: '1000000', curves: '5' })] });
    sb2.__alerts.length = 0;
    M.importEcmJson(wrap({ '100': [att({ curves: '9', sigmas: ['b', 'c'] })],
                           '104': [att({ curves: '7' })] }), 'results_ecm.json');
    const after = M.loadECM();
    eq(Object.keys(after).sort(), ['100', '102', '104'],
       'numbers only in the file are added, and numbers only here are kept');
    eq((after['100'][0].sigmas || []).slice().sort(), ['a', 'b', 'c'],
       'sigma sets union rather than one side winning');
    eq(after['100'][0].curves, '40', 'and a larger local curve count is not reduced by a smaller one');
    ok(sb2.__alerts.length === 1 && /attempts/.test(sb2.__alerts[0]),
       'and the import reports what actually changed');
  }

  // ── importing the same file twice does nothing the second time ───────────
  // This is a restore, so it will be run more than once by anyone unsure whether
  // the first attempt took.
  {
    M.saveECM({ '100': [att({ curves: '40', sigmas: ['a'] })] });
    const payload = wrap({ '100': [att({ curves: '9', sigmas: ['b'] })] });
    M.importEcmJson(payload, 'f.json');
    const once = JSON.stringify(M.loadECM());
    M.importEcmJson(payload, 'f.json');
    eq(JSON.stringify(M.loadECM()), once, 're-importing the same file changes nothing');
  }

  // ── shapes ───────────────────────────────────────────────────────────────
  {
    M.saveECM({});
    M.importEcmJson(JSON.stringify({ '100': [att({})] }), 'bare.json');
    eq(Object.keys(M.loadECM()), ['100'], 'a bare n → attempts map is accepted too');
  }
  {
    M.saveECM({ '100': [att({})] });
    const before = JSON.stringify(M.loadECM());
    sb2.__alerts.length = 0;
    M.importEcmJson('not json at all {{{', 'bad.json');
    eq(JSON.stringify(M.loadECM()), before, 'invalid JSON leaves the store untouched');
    ok(/not valid JSON/.test(sb2.__alerts[0] || ''), 'and says so');

    sb2.__alerts.length = 0;
    M.importEcmJson(JSON.stringify({ somethingElse: true }), 'wrong.json');
    eq(JSON.stringify(M.loadECM()), before, 'JSON with no ECM data leaves the store untouched');
    ok(/no ECM data/.test(sb2.__alerts[0] || ''), 'and says that too');
  }

  // ── dates decide what counts as historical ───────────────────────────────
  // An attempt with no date stays out of the "since tracking began" column, which
  // is exactly what makes restored old work read as old rather than as today's.
  {
    M.saveECM({});
    M.importEcmJson(wrap({ '100': [att({ curves: '40' })] }), 'old.json');
    const a = M.loadECM()['100'][0];
    ok(!a.date && !a.lastRun, 'an undated attempt is restored still undated, not stamped with today');
  }
});

// ── a repair may never claim a power the number does not have ───────────────
// Reported on E(634). It held [p, q, C] with C = p·q — the composite-as-factor
// artefact the integrity scan exists to find. The fix removed C and added its
// parts, p and q, which were ALREADY in the list, and the collapse SUMS exponents,
// so two correct prime factors came out as p² and q². The modal then displayed
// both as PRIME FDB with a square that is false about the number, and the
// submission export would have offered that false claim to FactorDB.
//
// The usual "the product must not change" guard cannot catch this: [p, q, C] was
// already claiming p²q² before the fix, which is precisely why it was flagged. The
// only authority is E(n) itself.
// ── the redundant-composite dedupe must never remove a genuine factor ───────
// The reconstruction test is now offered every factor regardless of size; it used
// to stop at 19 digits and assume anything larger was prime, which put the very
// composites it exists to remove out of reach — E(634)'s was 36 digits, so no
// merge or migration could ever clean it up.
//
// That cap was protecting real data, so with it gone the protection has to come
// from the test itself: a prime has no decomposition into the other listed
// factors, so it can never divide out to 1 and can never be dropped.
// ── E(n) itself recorded as one of its own factors ──────────────────────────
// Found by auditing a real results.json: 90 records held a 57,000-digit value
// alongside the genuine small primes, and it was divisible by every one of them —
// which is what gives it away, since a real cofactor shares no factors with them.
// It was E(n) itself, so the product of the list claims E(n) times the small
// primes.
//
// It slips past every existing check. It divides perfectly, so the exponent clamp
// keeps it. It is not the product of its neighbours, so the redundant-composite
// dedupe cannot reconstruct it. And the integrity scan misses it twice over: not a
// LONE factor, so "claims E(n) is prime" does not apply, and far too large to
// primality-test, so "stored factor is composite" never sees it.
group('self-as-factor', () => {
  const p = 156937982257994989n, q = 1626524294689195079n, r = 1000003n;
  const VAL = (p * q * r).toString();

  {
    const c = sandbox.clampExponentsToValue([String(p), String(q), VAL], VAL);
    eq(c.factors.slice().sort(), [String(p), String(q)].sort(),
       'the whole number is dropped when it sits alongside real factors');
    eq(c.dropped, 1, 'and the removal is counted');
  }

  // A number that really is prime lists itself as its only factor, and that is
  // correct — E(4)=5, E(6)=61. Only the presence of SIBLINGS makes it wrong.
  {
    const c = sandbox.clampExponentsToValue([VAL], VAL);
    eq(c.factors, [VAL], 'a lone self-factor is left alone — that is how a prime is recorded');
    eq(c.dropped, 0, 'and nothing is reported as removed');
  }

  // The genuine cofactor must survive: it divides, and it is NOT the whole number.
  {
    const cof = (q * r).toString();
    const c = sandbox.clampExponentsToValue([String(p), cof], VAL);
    eq(c.factors.slice().sort(), [String(p), cof].sort(),
       'a real cofactor is kept — it is not the number itself');
  }
});

group('dedupe-keeps-genuine-factors', () => {
  const M127 = (2n ** 127n - 1n).toString();          // Mersenne prime, 39 digits
  eq(sandbox.dedupeCompositeFactors(['3', '5', M127]).length, 3,
     'a large prime is kept — it cannot be reconstructed from the others');
  eq(sandbox.dedupeCompositeFactors(['3', '5', '1000003000000000000000000000000000000000009']).length, 3,
     'and so is a large composite that is not the product of its neighbours');
  eq(sandbox.dedupeCompositeFactors(['7', '13', '91']), ['7', '13'],
     'while one that IS the product of its neighbours goes');

  // The primality shortcut is not only an optimisation, which is what it looks
  // like. A repeated prime divides out to 1 against its own twin, so without the
  // shortcut [7,7] collapses to [7] — silently deleting a factor of 7 from a
  // number divisible by 49. Skipping anything provably prime is what stops the
  // reconstruction test from eating duplicates.
  eq(sandbox.dedupeCompositeFactors(['7', '7']), ['7', '7'],
     'a repeated prime is left alone — it is a multiplicity, not a redundancy');
  eq(sandbox.dedupeCompositeFactors(['7', '7', '13']).length, 3,
     'and stays left alone with other factors present');
  {
    const p2 = 156937982257994989n, q2 = 1626524294689195079n;
    eq(sandbox.dedupeCompositeFactors([String(p2), String(q2), (p2 * q2).toString()]).length, 2,
       'including at 36 digits, which the old size cap put out of reach');
  }
});

groupAsync('repair-never-overclaims', async () => {
  const p = 156937982257994989n, q = 1626524294689195079n;   // the two from the report
  const R = 1000003n;                                        // an unrelated cofactor
  const VAL = (p * q * R).toString();
  const C = (p * q).toString();

  // ── the clamp on its own ─────────────────────────────────────────────────
  {
    const c = sandbox.clampExponentsToValue([p + '^2', q + '^2'], VAL);
    eq(c.factors, [String(p), String(q)],
       'an exponent above the true multiplicity is clamped down to it');
    eq(c.clamped, 2, 'and both are reported as corrected');
  }
  {
    // A genuine square must survive — this is the case the summing collapse exists
    // for, and clamping must not undo it.
    const sq = (p * p * R).toString();
    const c = sandbox.clampExponentsToValue([p + '^2'], sq);
    eq(c.factors, [p + '^2'], 'a power that really does divide is left alone');
    eq(c.clamped, 0, 'and reported as unchanged');
  }
  {
    // Never invent: a base that divides twice but was only claimed once stays once.
    const sq = (p * p * R).toString();
    const c = sandbox.clampExponentsToValue([String(p)], sq);
    eq(c.factors, [String(p)], 'an exponent is never raised above what was claimed');
  }
  {
    const c = sandbox.clampExponentsToValue(['7', String(p)], VAL);
    eq(c.factors, [String(p)], 'a base that does not divide at all is dropped');
    eq(c.dropped, 1, 'and counted');
  }

  // ── the reported path, end to end through the real fixer ─────────────────
  {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    const e = { n: 634, val: VAL, status: 'partial',
                factors: [String(p), String(q), C] };
    sandbox.allEntries.push(e);

    // factorizeSmall cannot crack a balanced 36-digit semiprime; the real fixer
    // asks FactorDB. Stubbed to answer as FactorDB would.
    const realFdb = sandbox.tryResolveCompositeViaFDB;
    sandbox.tryResolveCompositeViaFDB = async (f) =>
      (String(f) === C ? [String(p), String(q)] : []);

    const res = await sandbox.fixIntegrityIssues(
      { issues: { compositeFactor: [{ n: 634, factor: C }] } });
    sandbox.tryResolveCompositeViaFDB = realFdb;

    eq(e.factors.slice().sort(), [String(p), String(q)].sort(),
       'splitting a composite whose parts are already present does not square them');
    ok(!e.factors.some(f => String(f).includes('^')),
       'and no exponent is written at all, because neither prime divides twice');
    ok((res.fixed.overclaimed || 0) >= 1, 'the correction is reported rather than made silently');

    // The invariant the whole exercise is about: every factor's FULL power divides
    // E(n). It is the same rule exportFDBSubmission applies before sending, and
    // fdb_submit.py before posting — a list that fails it is a false claim about
    // the number wherever it ends up.
    let allDivide = true;
    for (const f of e.factors) {
      const [b, x] = String(f).split('^');
      if (BigInt(VAL) % (BigInt(b) ** BigInt(x || 1)) !== 0n) allDivide = false;
    }
    ok(allDivide, 'and every factor left behind divides E(n) at the power written');
  }

  // ── the same check on the OTHER repair that writes exponents ─────────────
  // Step 3 collapses duplicate primes and guards with "the product must not
  // change" — which only says the collapse was faithful to the list it was handed.
  // A list recording p twice when E(n) holds p once passes that guard and comes out
  // as p², still false. The guard compares the fix to the old list; only E(n) can
  // say whether the old list was right.
  {
    sandbox.allEntries.length = 0;
    for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
    const e2 = { n: 636, val: VAL, status: 'partial', factors: [String(p), String(p), String(q)] };
    sandbox.allEntries.push(e2);
    await sandbox.fixIntegrityIssues({ issues: { duplicate: [{ n: 636 }] } });
    ok(!e2.factors.some(f => String(f) === p + '^2'),
       'a prime recorded twice is not collapsed into a square E(n) does not have');
    let ok2 = true;
    for (const f of e2.factors) {
      const [b, x] = String(f).split('^');
      if (BigInt(VAL) % (BigInt(b) ** BigInt(x || 1)) !== 0n) ok2 = false;
    }
    ok(ok2, 'and what is left divides E(n) at the power written');
  }
});

// ── the export sends only what FactorDB does not already have ───────────────
// fdb_submit.py posts one factor every 2s, so every factor on a line is a separate
// write to someone else's server. Re-sending FactorDB its own factors teaches it
// nothing and costs real time: an entry where we found one new prime among four
// known ones was four requests instead of one.
//
// Every factor FactorDB reports is recorded with provenance 'f' when it arrives,
// so the app already knows per factor who found it — this just stops ignoring that.
group('submission-withholds-fdb-factors', () => {
  if (!needs(M, 'exportFDBSubmission')) return;
  const p = 156937982257994989n, q = 1626524294689195079n, r = 1000003n;
  const VAL = (p * q * r).toString();
  let written = '';
  const realBlob = sb2.Blob, realURL = sb2.URL, realDoc = sb2.document;
  sb2.Blob = function (parts) { written = parts.join(''); };
  sb2.URL = { createObjectURL: () => 'blob:x', revokeObjectURL() {} };
  sb2.document = { createElement: () => ({ set href(v) {}, set download(v) {}, click() {} }) };
  const factorsOnLine = () => {
    const line = written.split('\n').filter(l => l && !l.startsWith('#'))[0];
    return line ? line.split('=')[1].split('*') : [];
  };
  const setup = (factors) => {
    sb2.__ls = {}; M.saveHistory([]);
    sb2.eulerValues[1] = 'x';
    sb2.allEntries.length = 0;
    for (const k of Object.keys(sb2.fdbCache)) delete sb2.fdbCache[k];
    sb2.allEntries.push({ n: 1, val: VAL, factors });
    written = '';
  };

  // ── FactorDB's own factors are held back, ours are sent ──────────────────
  {
    setup([String(p), String(q), String(r)]);
    M.recordDiscovery(1, String(p), 'f');    // FactorDB gave us this one
    M.recordDiscovery(1, String(q), 'f');    // and this one
    M.recordDiscovery(1, String(r), 'e');    // we found this one by ECM
    M.exportFDBSubmission();
    eq(factorsOnLine(), [String(r)],
       'only the factor we found ourselves is posted');
  }

  // ── unknown provenance is still sent ─────────────────────────────────────
  // Provenance only exists from the day tracking began, so a null means "cannot
  // tell", not "ours". Sending a factor FactorDB already holds wastes a request;
  // withholding one it lacks loses the factor. Those are not symmetric, so the
  // unknown case errs towards sending.
  {
    setup([String(p), String(q)]);
    M.recordDiscovery(1, String(p), 'f');    // known to be FactorDB's
    // q has no history record at all
    M.exportFDBSubmission();
    eq(factorsOnLine(), [String(q)], 'a factor with no provenance is still sent');
  }

  // ── a "factor" equal to E(n) itself is nothing to send ───────────────────
  // FactorDB lists a number it cannot factor as its own single factor. Counted as one,
  // every unfactored entry was reported as "already on FDB".
  {
    let shown = '';
    const realAlert = sb2.alert, realDialog = sb2.showRunDialog;
    sb2.alert = (m) => { shown = String(m); };
    // the full message is a dialog now: its text, in reading order
    sb2.showRunDialog = (title, intro, steps, outro) => {
      shown = [intro].concat((steps || []).map(st => st.label + '\n' + st.cmd)).concat([outro]).join('\n\n');
    };
    setup([VAL]);
    M.recordDiscovery(1, VAL, 'f');
    // …beside one entry that does have something to send, so the full message is built
    // (with nothing at all to send, the export stops early with a different message).
    sb2.allEntries.push({ n: 3, val: VAL, factors: [String(r)] });
    M.exportFDBSubmission();
    const sent = written.split('\n').filter(l => l && !l.startsWith('#'));
    ok(sent.length === 1 && sent[0].split('=')[1] === String(r),
       'an entry whose only "factor" is itself produces no line — only the real one is sent');
    ok(/^Exported 1 entry/.test(shown) && !/already has every factor/.test(shown),
       'and is not counted as FactorDB already having its factors (' + shown.split('\n')[0] + ')');
    setup([String(p), String(q), String(r)]);
    M.recordDiscovery(1, String(p), 'f');
    M.exportFDBSubmission();
    ok(/python3 euler\.py submit factordb_submission\.txt --commit/.test(shown) && /Without --commit it is a dry run/.test(shown),
       'the dialog gives the real command — --commit included, or it sends nothing');
    ok(/Export FDB check list → "submitted" → euler\.py check → Import FDB results/.test(shown) && !/Check submitted/.test(shown),
       'and the way to confirm that exists today — not the button that was removed');
    ok(/1 more were left out, because FactorDB reported them to us/.test(shown), "and says once why FactorDB's own factors were left out");
    sb2.alert = realAlert; sb2.showRunDialog = realDialog;
  }

  // ── an entry with nothing of ours is skipped entirely ────────────────────
  {
    setup([String(p), String(q), String(r)]);
    for (const f of [p, q, r]) M.recordDiscovery(1, String(f), 'f');
    M.exportFDBSubmission();
    eq(written, '', 'an entry whose every factor came from FactorDB produces no line at all');
  }

  // ── verification still applies to the WHOLE list ─────────────────────────
  // A factor that does not divide E(n) means the entry's data is wrong, and that
  // is true whether or not the bad factor is one we would have posted. The export
  // must still refuse the entry rather than quietly sending the rest.
  {
    sb2.__ls = {}; M.saveHistory([]);
    sb2.allEntries.length = 0;
    for (const k of Object.keys(sb2.fdbCache)) delete sb2.fdbCache[k];
    sb2.allEntries.push({ n: 1, val: VAL, factors: [String(p), '7', String(r)] });  // 7 does not divide
    M.recordDiscovery(1, '7', 'f');          // and it is one we would have withheld
    M.recordDiscovery(1, String(r), 'e');
    written = '';
    M.exportFDBSubmission();
    eq(written, '', 'a non-dividing factor still blocks the whole entry, withheld or not');
  }

  // ── the sequence that put 5s and 47s in a submission run ─────────────────
  // We sieve a small prime, so provenance is 's'. Later we check the number and
  // FactorDB reports the same prime — but recordDiscovery keeps the ORIGINAL
  // attribution, so provenance stays 's' forever. Provenance alone therefore says
  // "ours" about a factor FactorDB has just told us it holds, and the export
  // offered it straight back.
  //
  // `fdbHas` records what FactorDB reported, which is the question the export is
  // actually asking. No size heuristic: "FactorDB must already know a 1-digit
  // factor" is false for a number FactorDB has no record of, where even a 5 is new.
  {
    setup([String(p), String(q), String(r)]);
    M.recordDiscovery(1, String(r), 's');    // we sieved it first...
    M.recordDiscovery(1, String(r), 'f');    // ...and FactorDB later confirmed it
    eq(M.factorProvenance(1, String(r)), 's',
       'provenance still credits whoever found it first — that part is correct');
    sb2.fdbCache[VAL] = { n: 1, status: 'CF', source: 'import', timestamp: 1,
                          factors: [String(p), String(q), String(r)],
                          fdbHas: [String(r)] };
    M.exportFDBSubmission();
    ok(!factorsOnLine().includes(String(r)),
       'a factor FactorDB reported is withheld even though we found it first');
    eq(factorsOnLine().slice().sort(), [String(p), String(q)].sort(),
       'and the ones it has not seen are still sent');
  }

  // ── no record means everything is worth sending ──────────────────────────
  // The tempting shortcut — "skip anything under N digits, FactorDB must have it"
  // — is wrong exactly where submitting matters most. For a number FactorDB has
  // never processed, a single-digit factor is new information.
  {
    setup([String(r), String(p)]);
    sb2.fdbCache[VAL] = { n: 1, status: 'U', source: null, timestamp: 1 };  // no fdbHas
    M.exportFDBSubmission();
    eq(factorsOnLine().slice().sort(), [String(p), String(r)].sort(),
       'with no FactorDB record, even the smallest factor is submitted');
  }

  // ── it has to survive a reload ───────────────────────────────────────────
  // The slim save writes a whitelist of fields, so a new one is dropped unless it
  // is added explicitly. Lose it here and the export goes back to re-submitting
  // FactorDB's own factors the next time the page is opened — the same symptom,
  // one reload later.
  {
    sb2.__ls = {};
    sb2.eulerValues[1] = VAL;
    for (const k of Object.keys(sb2.fdbCache)) delete sb2.fdbCache[k];
    for (const k of Object.keys(sb2.fdbFactors)) delete sb2.fdbFactors[k];
    M.saveFDBCache({ [VAL]: { n: 1, status: 'CF', source: 'import', timestamp: 1,
                              factors: [String(p), String(r)], fdbHas: [String(r)] } });
    for (const k of Object.keys(sb2.fdbFactors)) delete sb2.fdbFactors[k];   // force the slim path
    const back = M.loadFDBCache()[VAL];
    eq((back.fdbHas || []).slice(), [String(r)],
       "FactorDB's own factor list survives the slim save and reload");
  }

  // ── the line is ordered ──────────────────────────────────────────────────
  {
    setup([String(q), String(r), String(p)]);
    M.exportFDBSubmission();
    const onLine = factorsOnLine();
    const sorted = onLine.slice().sort((a, b) => (a.length - b.length) || (a < b ? -1 : 1));
    eq(onLine, sorted, 'factors are written smallest first, so the submit log reads in order');
  }

  sb2.Blob = realBlob; sb2.URL = realURL; sb2.document = realDoc;
  sb2.__ls = {};
});

// ── "ahead of FDB": which of our factors FactorDB does not have ─────────────
// One rule, `factorsFdbLacks`, used by the filter to decide what to SHOW and by
// the submission export to decide what to SEND. They agree by construction rather
// than by two pieces of code happening to match — which is the failure this
// project keeps finding (the export threshold existed three times; the sieve and
// Check prompts used "unknown" for different sets).
// ── the Check button can reach the ahead-of-FDB set ─────────────────────────
// The other half of the submission loop: post the factors, then re-check those
// numbers so FactorDB's answer is recorded, fdbHas fills in, and they drop out of
// the ahead list. Without this scope the only way to close that loop was "Check
// submitted", which covers only what was exported since the last reconcile.
//
// Size-gated, unlike every other scope. Past the query cap a check falls back to a
// POST and a failure stops the run, so a scope defined by "we hold factors" would
// routinely drag in 50,000-digit entries and fail — which is what makes the gate
// part of the feature rather than a refinement of it.
// ── the request cap, which six copies of shared and none tested ────────────
// Found by a blind mutation survey rather than by reasoning: changing the
// Math.max to a Math.min in a poll starter caps every run at one number, and
// nothing failed — six times over, because the expression was duplicated in every
// starter and each copy was untestable for the same reason (it reads the DOM).
// ── the route diagnostic ────────────────────────────────────────────────────
// "All query routes failed (1d number)" names no route and no reason, and its
// digit count invites a size reading — which is exactly wrong when a ONE-digit
// number fails. The three routes fail for different causes and only this tells
// them apart.
// ── the offline route must be able to REPLACE the browser, not just help it ──
// The three original check-list sets all start from entries ABOVE the browser's
// query limit, because the browser could handle the rest itself. That reason only
// holds while the browser can reach FactorDB at all — and it reaches it solely
// through third-party CORS proxies, both of which stopped working: corsproxy.io
// now answers 401 and allorigins times out.
//
// "everything" makes euler.py check a substitute rather than a fallback. It needs
// no proxy, has no URL-length limit, and does not care about CORS.
// ── the two FactorDB prompts must offer the same scopes ────────────────────
// The Check button and the check-list export asked different questions with
// different vocabularies, so a scope you could check in the browser had no offline
// equivalent. With the browser reaching FactorDB only through proxies that are all
// currently down, that gap is the difference between doing the work and not.
group('fdb-scope-parity', () => {
  if (!needs(sandbox, 'fdbCheckSets')) return;
  sandbox.__ls = {}; sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  const V = (n) => '9'.repeat(40) + n;
  const e = (n, status, factors) => ({ n, val: V(n), status, factors: factors || [] });
  sandbox.allEntries.push(
    e(100, 'partial',     ['3']),
    e(102, 'composite',   []),
    e(104, 'unknown',     []),
    e(106, 'fdb-unknown', []),
    e(108, 'full',        ['3', '5']),
    e(2,   'partial',     ['3']),     // trivial, always excluded
  );
  const day = 86400000;   // 100 last checked 40 days ago, 102 two days ago
  sandbox.fdbCache[V(100)] = { n: 100, status: 'CF', factors: ['3'], timestamp: Date.now() - 40 * day };
  sandbox.fdbCache[V(102)] = { n: 102, status: 'C',  factors: [],    timestamp: Date.now() - 2 * day };
  const sc = sandbox.fdbCheckSets(31);
  const ns = (k) => sc[k].map(x => x.n);
  eq(Object.keys(sc).sort(), ['everything', 'fdb', 'never', 'old', 'submitted'], 'five sets — there were eleven');
  eq(ns('everything'), [100, 102, 104, 106], 'everything = every unfinished entry');
  eq(ns('never'), [104], 'never = FactorDB has not been asked');
  eq(ns('fdb'), [106], 'fdb = asked, and FactorDB had nothing');
  eq(ns('old'), [100], 'old = unfinished and not re-checked in 31 days');
  ok(!ns('everything').includes(108) && !ns('everything').includes(2), 'finished and trivial entries are in none');
  const inAll = new Set(ns('everything'));
  for (const k of ['never', 'old', 'fdb']) ok(sc[k].every(x => inAll.has(x.n)), '"' + k + '" is a subset of "everything"');

  // ── the keyword table ─────────────────────────────────────────────────────
  // The prompt picks with find(o => o.match.test(answer)), so first match wins: a
  // word shared by two sets makes the later unreachable by it, silently.
  const table = sandbox.FDB_CHECK_SET_MATCH;
  ok(!!table, 'the keyword table is data, not restated in the prompt');
  const keys = Object.keys(table);
  eq(keys.slice().sort(), Object.keys(sc).sort(), 'every set has a keyword and every keyword has a set');
  const words = [];
  for (const k of keys) for (const w of table[k].source.replace(/^\^\(|\)\$$/g, '').split('|')) words.push(w);
  eq(words.filter(w => keys.filter(k => table[k].test(w)).length !== 1), [], 'each keyword selects exactly one set');
  for (const k of keys) ok(table[k].test(k), '"' + k + '" selects itself');
  // The old names still reach the right set, so nothing already typed changes.
  const reaches = (w) => keys.filter(k => table[k].test(w));
  eq(reaches('ours'), ['submitted'], '"ours" now reaches submitted');
  eq(reaches('ahead'), ['submitted'], 'as does "ahead"');
  eq(reaches('all'), ['everything'], '"all" reaches everything — it no longer means "above the browser limit"');
  eq(reaches('stale'), ['old'], 'and the other aliases carry over');
  sandbox.__ls = {};
});

group('check-list-everything', () => {
  if (!needs(sandbox, 'fdbCheckSets')) return;
  sandbox.__ls = {}; sandbox.allEntries.length = 0;
  for (const k of Object.keys(sandbox.fdbCache)) delete sandbox.fdbCache[k];
  const small = { n: 100, val: '9'.repeat(50),    status: 'partial', factors: ['3'] };
  const big   = { n: 102, val: '9'.repeat(80000), status: 'partial', factors: ['7'] };
  const done  = { n: 104, val: '9'.repeat(60),    status: 'full',    factors: ['3'] };
  const tiny  = { n: 2,   val: '9'.repeat(40),    status: 'partial', factors: [] };
  sandbox.allEntries.push(small, big, done, tiny);
  const sets = sandbox.fdbCheckSets(31);
  eq(sets.everything.map(e => e.n), [100, 102], 'everything covers small and huge alike — there is no size gate');
  ok(!sets.everything.some(e => e.n === 104), 'a finished entry is not re-checked');
  ok(!sets.everything.some(e => e.n === 2), 'nor a trivial one');
  sandbox.__ls = {};
});

// ── the ECM export takes a TIME budget, not just a count ────────────────────
// A number of runs is not the thing anyone has. You have an evening, or a machine
// free until Monday — picking 500 and finding out it is nineteen hours is the
// wrong way round.
// ── the hybrid yield model, and saying which half is in play ────────────────
// pFactorExists was pure theory sitting next to 27,959 measured discoveries. But
// only the low levels have enough of them: measured on the real dataset, t10 has
// 2,713 finds and t15 has 370, t20 has TEN across 236,582 curves, and t25 upward
// have none at all across 287,650. Replacing the model wholesale would trade a
// known approximation for noise.
//
// So each level uses whichever it has grounds for, and the row says which — a
// number carrying a measured correction and a number resting on an unchecked model
// should not look alike.
// ── the ECM frontier: where the work has GOT TO ─────────────────────────────
// The yield table answers "what did effort at level L return". This answers
// "where has the work reached", which is the question that decides what to do
// next, and nothing in the app answered it. On the real dataset the distribution
// is strikingly uneven — a third of entries have never been past t10 — so a
// backlog of the cheapest available runs was sitting invisible.
// ── run statistics: where the time actually went ────────────────────────────
// The yield table aggregates by LEVEL, which answers "was this level worth it"
// and hides everything about individual numbers. These answer what comes next:
// which runs were longest, which entries are absorbing the time, and which have
// absorbed it for nothing.
// ── attribution survives the submit/retrieve cycle ──────────────────────────
// The worry is real: find a factor with ECM, post it to FactorDB, re-check, and
// FactorDB reports it back. If that second sighting were recorded the count would
// double; if it OVERWROTE the attribution, your own find would vanish into
// FactorDB's column.
//
// Neither happens, because recordDiscovery refuses a known (n, factor) pair and
// keeps the FIRST finder. Verified against the real history: 0 duplicate pairs
// across 27,959 records. This pins the behaviour that makes that true.
//
// Sandbox 2, because sandbox 1 stubs recordDiscovery to observe CALLS — a stub that
// cannot refuse anything, which is the whole property under test here.
group('find-attribution-survives-resubmission', () => {
  if (!needs(M, 'recordDiscovery', 'loadHistory', 'saveHistory')) return;
  sb2.__ls = {};
  M.saveHistory([]);
  const F = '156937982257994989';
  ok(M.recordDiscovery(300, F, 'e'), 'our ECM records the find');
  ok(!M.recordDiscovery(300, F, 'f'),
     'FactorDB reporting the SAME factor back is refused, not appended');
  eq(M.loadHistory().length, 1, 'so the history holds one record, not two');
  eq(M.loadHistory()[0][3], 'e',
     'and it is still attributed to us — submitting does not hand it to FactorDB');

  // The reverse: a factor FactorDB had first stays theirs even if our ECM reaches
  // it later. That is why a 0 in the finds column means "your ECM found nothing
  // NEW", not "this number has no known factors" — worth stating, because the two
  // read the same on screen.
  const G = '1626524294689195079';
  ok(M.recordDiscovery(302, G, 'f'), 'FactorDB records one first');
  ok(!M.recordDiscovery(302, G, 'e'), 'and our later ECM find does not displace it');
  eq(M.loadHistory().filter(r => r[0] === 302)[0][3], 'f', 'it stays theirs');

  // Different factors of the same n are separate records — the refusal is keyed on
  // the factor, not the number.
  ok(M.recordDiscovery(300, G, 'e'), 'a different factor of the same n is recorded');
  eq(M.loadHistory().filter(r => r[0] === 300).length, 2, 'giving two records for it');

  M.saveHistory([]);
  sb2.__ls = {};
});

// ── bulk-logged ECM goes through the same normaliser as everything else ─────
// applyBulkECM had its OWN dedup, wrong twice over: normNum used bare parseFloat,
// so "250k" became 250 and logging it beside 250000 made a second row for the same
// work; and its key was method+B1+B2+curves, while the rest of the project
// identifies an attempt by method+B1 alone, so logging 100 curves and then 200 at
// one bound made two rows. Both double-count curves in the yield report.
// ── an unknown target size is not coverage ──────────────────────────────────
// rho(0) = 1 is mathematically right for a zero-digit target and catastrophic as
// an answer here: `digits` is 0 exactly when an entry's value failed to load — a
// state that genuinely happens, since the values arrive in 45 chunks and any one
// of them can fail. Reporting certainty made that entry look FINISHED: fully
// covered at every level, nothing left to do, worthless to the ranking. It would
// vanish from the work queue rather than showing as unavailable.
//
// Found by property fuzzing, not by reading — every call site happens to guard
// with `e.val &&`, so no example test would have reached it.
group('unknown-size-is-not-coverage', () => {
  const { ecmProbability, pm1Probability, pFactorExists } = PURE;
  for (const d of [0, -1, NaN, undefined, null]) {
    eq(ecmProbability(d, 1000, 1e6), 0,
       'ECM coverage of a ' + String(d) + '-digit target is 0, not 1');
    eq(pm1Probability(d, 1e6, null, 'P-1'), 0,
       'and so is P-1 coverage');
    eq(pm1Probability(d, 1e6, null, 'P+1'), 0, 'and P+1');
  }
  // A real size is unaffected — this is a guard, not a rescale.
  ok(ecmProbability(20, 1000, 11000) > 0.5, 'a real target still reports real coverage');
  ok(pm1Probability(20, 1e6, null, 'P-1') > 0, 'and so does P-1');

  // Everything the fuzzer asserts, on the values that are actually reachable:
  // digits 0 (value not loaded), curves 0 (parseInt('') || 0), b1 0 (parseB1 of a
  // bad bound). None may produce NaN or Infinity — those propagate into a sort
  // order and turn it into nonsense without ever throwing.
  const finite = (v) => typeof v === 'number' && isFinite(v);
  ok(finite(ecmProbability(20, 0, 0)), 'zero curves at a zero bound is a finite number');
  ok(finite(pm1Probability(20, 0, null, 'P-1')), 'and so is P-1 at a zero bound');
  ok(finite(pFactorExists(20, 0)), 'and pFactorExists with no size');
  ok(finite(pFactorExists(0, 0)), 'and with neither');
});

// ── ranking for COMPLETION rather than for factors found ────────────────────
// The default objective maximises factors, which is right for contributing to
// FactorDB and wrong for finishing a number. A 20-digit factor of a 57,000-digit
// cofactor leaves 56,980 digits — a real contribution, and no measurable progress
// toward "fully factored".
//
// An entry completes when what remains is PRIME, so one find completes it only if
// C/f is prime: about 1/ln(C/f) by the prime number theorem. That single term is
// the whole difference between the two objectives.
// ── what a curve count CONFIDENTLY clears ───────────────────────────────────
// "t25" is a curve count giving about 63% odds on a 25-digit factor — the
// convention is 1-1/e, not certainty. Reasoning from the nominal level claims far
// more than the run established. The same curves detect smaller factors much more
// reliably, so there is a real depth the run IS confident about, and it is lower:
//
//     t25 curve count  ->  10d: 100%   18d: 98.8%   20d: 94.5%   25d: 63.2%
group('confidently-cleared-depth', () => {
  if (!needs(PURE, 'confidentlyCleared', 'ecmOptimalCurves', 'ecmTableB1')) return;
  const cc = (t) => PURE.confidentlyCleared(PURE.ecmOptimalCurves(t), PURE.ecmTableB1(t));

  // Always BELOW the nominal level — that is the whole point.
  for (const t of [15, 20, 25, 30, 35]) {
    ok(cc(t) < t, 't' + t + ' confidently clears less than ' + t + ' (got ' + cc(t) + ')');
    ok(cc(t) > 0, 'but it does clear something');
  }
  eq(cc(25), 19, 'a t25 run clears t19 at 95% — not t25');

  // Monotone: more work clears more.
  ok(cc(30) > cc(25) && cc(25) > cc(20), 'deeper runs clear deeper');

  // No curves clears nothing. Claiming otherwise would let an untouched entry
  // inherit a cleared depth it never earned.
  eq(PURE.confidentlyCleared(0, 11000), 0, 'zero curves clears nothing');
  eq(PURE.confidentlyCleared(100, 0), 0, 'and neither does a zero bound');
  eq(PURE.confidentlyCleared(-5, 11000), 0, 'nor a negative count');

  // The threshold has to mean something: at 1% confidence almost anything
  // "clears", which would hand back the overstatement by another route.
  const strict = PURE.confidentlyCleared(PURE.ecmOptimalCurves(25), PURE.ecmTableB1(25), 0.95);
  const loose  = PURE.confidentlyCleared(PURE.ecmOptimalCurves(25), PURE.ecmTableB1(25), 0.01);
  ok(loose > strict,
     'a lax threshold claims more, which is why the default is 0.95 and not lower');
  ok(PURE.COMPLETION_CONF >= 0.9,
     'and the default threshold is a confidence worth calling one');
});

// ── sieve depth: a PROVEN exclusion, unlike ECM's ───────────────────────────
// Trial division to 10^9 proves there is no factor below 10^9. ECM proves nothing —
// the standard curve count for level t finds a t-digit factor about 63% of the
// time, which is why confidentlyCleared backs a t25 job down to t19.
//
// So for the low end the sieve is strictly better evidence than the ECM run that
// nominally covers the same ground, and it was being discarded: completionOdds only
// ever saw the curve count.
// ── every persisted key is either synced or deliberately not ────────────────
// The sieve depth was added, wired into the probability model, and NOT put in the
// sync payload. Nothing else derives it, so a machine pulling without it silently
// reverted to "nothing proven" and went back to valuing levels arithmetic had
// cleared. Found by accident while checking something else.
//
// This makes it findable on purpose: a new _KEY must be listed below as travelling
// or as deliberately local, with the reason. An unclassified one fails.
group('sync-coverage-of-persisted-keys', () => {
  const src2 = fs.readFileSync('index.html', 'utf8');
  const js2 = src2.match(/<script>([\s\S]*)<\/script>/)[1];
  const i = js2.indexOf('function buildSyncPayload');
  const payload = js2.slice(i, js2.indexOf('\nfunction ', i + 10));

  // Deliberately NOT synced, with the reason each is local.
  const local = {
    COOLDOWN_KEY:      'per-machine poll timing; sharing it would throttle one machine for another',
    DEBUG_KEY:         'a local debug flag',
    FDBW_KEY:          'a per-machine ranking preference',
    FDB_ROUTE_KEY:     'the proxy route that works from THIS network',
    GH_SETTINGS_KEY:   'contains the GitHub token — must never leave the machine',
    ECM_KEY:           'synced separately as its own file (pushECMFile/pullECMFile) because it is by far the biggest',
    HISTORY_START_KEY: 'marks where THIS machine began recording; the history itself travels',
    SUBMITTED_KEY:     'per-machine submission workflow state; reconcileSubmitted clears it from FactorDB',
    DELETED_HERE_KEY:  'deletions made in THIS browser and not yet pushed — once pushed, they are on GitHub',
    SYNC_BASE_KEY:     'what GitHub held at THIS browser\'s last sync — it describes this browser, not the data',
    NEW_SINCE_KEY:     'what changed since YOU last looked, in this browser — it is about you, not the data',
    FF_SEEN_KEY:       'which newly fully factored entries THIS browser has announced — each browser tells you once',
  };

  const keys = [...js2.matchAll(/^const (\w*_KEY)\s*=\s*'([^']+)'/gm)].map(m => m[1]);
  ok(keys.length > 10, 'found the persisted key constants (' + keys.length + ')');

  const unclassified = [];
  for (const k of keys) {
    const loader = new RegExp('function (load\\w+)\\(\\)[^}]{0,400}' + k).exec(js2);
    const travels = payload.includes(k) || (loader && payload.includes(loader[1] + '()'));
    if (!travels && !(k in local)) unclassified.push(k);
  }
  eq(unclassified, [],
     'every persisted key either travels in the sync payload or is listed above as '
     + 'deliberately local — a new one must be classified, not forgotten');

  // And the reverse: the exemption list must not name keys that no longer exist,
  // or it quietly stops covering anything.
  const stale = Object.keys(local).filter(k => !keys.includes(k));
  eq(stale, [], 'the exemption list names only keys that still exist');
});

// ── external text must be escaped before it reaches innerHTML ──────────────
// The activity log rendered its messages as HTML, and those messages carry text
// from OUTSIDE the app — network errors, GitHub API failures, file names. An
// "<img onerror=...>" in any of them would run, and because the log is PERSISTED it
// would run again on every load.
group('external-text-is-escaped', () => {
  if (!needs(PURE, 'escHtml')) return;
  const E = PURE.escHtml;
  eq(E('<img src=x onerror=alert(1)>'), '&lt;img src=x onerror=alert(1)&gt;',
     'markup is neutralised');
  eq(E('a & b'), 'a &amp; b', 'ampersands first, so nothing is double-escaped');
  eq(E(`"'`), '&quot;&#39;', 'both quote kinds, since type lands in an attribute');
  eq(E('E(206) found 1,234'), 'E(206) found 1,234', 'ordinary text passes untouched');
  eq(E(null), '', 'null is empty, not the string "null"');
  eq(E(12345), '12345', 'and numbers are stringified');

  const src2 = fs.readFileSync('index.html', 'utf8');
  ok(/const msg = escHtml\(l\.msg\)/.test(src2),
     'the log escapes each message before rendering it');
  ok(/log-\$\{escHtml\(l\.type\)\}/.test(src2) && /\$\{escHtml\(l\.t\)\}/.test(src2),
     'and the stored type and time too — a tampered store is the case this is for');
  ok(/escHtml\(err\.message\)/.test(src2),
     'the add-factor error escapes the message it echoes back');
  // ── a failed push must report the failure, not a parse error ──────────
  // GitHub serves an HTML page on 502/503. The error path parsed the body as JSON
  // unguarded, so an outage surfaced as "Unexpected token < in JSON" instead of
  // "HTTP 502". The retry loop above it already tolerated a non-JSON body, and
  // pushECMFile already guarded the same parse with .catch — githubPush did not.
  { const i = src2.indexOf('async function ghApi'); const apiFn = src2.slice(i, src2.indexOf('\n}\n', i));
    ok(/const data = await r\.json\(\)\.catch\(\(\) => \(\{\}\)\);/.test(apiFn), 'the push error path tolerates an HTML error body');
    ok(/\(data && data\.message\) \|\| \('HTTP ' \+ r\.status\)/.test(apiFn), 'and falls back to the HTTP status, which is what an outage should say'); }
  ok(!/const err = await r\.json\(\);\s*\n\s*throw new Error\(err\.message/.test(src2),
     'the unguarded form is gone');

  // None of the literal log messages use markup, so escaping loses nothing. If one
  // ever needs it, this fails and the choice gets made deliberately.
  ok(!/addLog\((['`"])[^'`"]*<\w/.test(src2),
     'no log message relies on HTML, so escaping them all is safe');
});

group('sieve-depth', () => {
  if (!needs(M, 'recordSieveDepth', 'loadSieveDepth', 'sieveDepthDigits')) return;
  sb2.__ls = {};
  try {
    eq(M.sieveDepthDigits(500), 0, 'an unsieved entry has no proven depth');

    M.recordSieveDepth([500, 502], 1e6);
    eq(Math.round(M.sieveDepthDigits(500)), 6, '10^6 reads as six digits of proof');

    // DEEPEST wins. A later shallow pass must not undo what a deep one proved —
    // the whole value of this number is that it is a floor nobody can lower.
    M.recordSieveDepth([500], 1e9);
    eq(Math.round(M.sieveDepthDigits(500)), 9, 'a deeper pass raises it');
    M.recordSieveDepth([500], 1e3);
    eq(Math.round(M.sieveDepthDigits(500)), 9, 'and a shallower one leaves it alone');
    eq(Math.round(M.sieveDepthDigits(502)), 6, 'while untouched entries keep theirs');

    // Degenerate inputs must not write nonsense into a value treated as proof.
    eq(M.recordSieveDepth([], 1e6), 0, 'no entries, nothing recorded');
    eq(M.recordSieveDepth([504], 0), 0, 'no limit, nothing recorded');
    eq(M.sieveDepthDigits(9999), 0, 'and an unknown entry is simply unproven');

    // ── a proven depth must ZERO the probabilities below it ──────────────
    // This is the half that was missing. Trial division to 10^9 means a 5-digit
    // factor is ABSENT, not unlikely — but pFactorExists knew only the number's
    // size, so the model kept assigning value to ECM levels the sieve had cleared
    // and the ranking paid for curves that could not find anything.
    if (PURE.pFactorExists) {
      ok(PURE.pFactorExists(5, 1000) > 0, 'without a proven depth, a 5-digit factor is possible');
      eq(PURE.pFactorExists(5, 1000, 9), 0, 'with 10^9 proven, it is impossible — not merely unlikely');
      eq(PURE.pFactorExists(9, 1000, 9), 0, 'the boundary itself is covered');
      ok(PURE.pFactorExists(10, 1000, 9) > 0, 'and the first level ABOVE it is untouched');
      ok(PURE.pFactorExists(5, 1000, 0) > 0, 'a zero depth changes nothing');
      ok(PURE.pFactorExists(5, 1000, -3) > 0, 'nor does a nonsensical one');
    }
    // The calibrated wrapper must pass it through, or the correction is applied to
    // a prior that still believes in impossible factors.
    if (PURE.pFactorExistsCalibrated) {
      eq(PURE.pFactorExistsCalibrated(5, 1000, 9), 0,
         'the calibrated estimator honours the proven depth too');
    }

    // The modal must not print rows for levels the sieve cleared. A "0.0%" beside
    // real estimates reads as "ECM tried and failed there", when the truth is that
    // nothing could be there to find.
    {
      const src2 = fs.readFileSync('index.html', 'utf8');
      ok(/if \(sieveK && d <= sieveK\) return '<td style="color:var\(--green\);font-size:10px">none<\/td>'/.test(src2),
         'coverage rows mark levels a sieve has proven empty "none", not 0%');
      // The sieve is shown as a METHOD row in the attempts table, beside ECM and
      // P±1 — it is one — rather than as a sentence above the probability grid.
      ok(!/Trial-divided to <span/.test(src2) && !/Not yet trial-divided/.test(src2),
         'and the old sentence above the probability grid is gone');

      // ── the attempts GRID: one column per level, rows always aligned ──────
      // The per-level probabilities used to be one cell of running text per row
      // ("10d:10.69% 15d:3.83% …"), so no two runs could be compared at a level.
      // As a grid the property that matters is ALIGNMENT: every row, including the
      // Sieve row, must have exactly as many cells as the header, however many
      // optional columns are showing. Rendered from the real code with fake inputs.
      {
        const bm = src2.indexOf('function buildECMSection');
        const sec = src2.slice(bm, src2.indexOf('\nfunction ', bm + 10));
        const body = (sec.match(/\(\(\) => \{\s*(\/\/ ONE COLUMN PER LEVEL[\s\S]*?)\n    \}\)\(\);/) || [])[1];
        ok(!!body, 'the grid builder can be located for rendering');
        if (body) {
          // Fake coverage rows: have=0.42 everywhere, so Total can be told apart from
          // any product of the run cells above it (each fake run cell is 50% or 25%).
          const covRows = (have) => [10,15,20,25,30,35,40,45,50,55,60,65].map((d, i) => ({
            d, have, pe: 0.1, cLo: 3600 * (i + 1), cHi: 7200 * (i + 1), nextC: i === 1 ? 600 : 3600 * (i + 1),
            perHr: i === 3 ? null : 0.05, calibrated: i < 2, calibRatio: 25.4, calibLo: 20.1,
            calibHi: 31.7, calibFinds: 400, calibVerdict: 'too few finds' }));
          const render = (attempts, sieveDigits, opts = {}) => new Function(
            'ecmLevels','digits','attempts','fmtPct','parseB1','b1ToDigits','ecmProbability',
            'ecmProbabilityWithI','pm1ToDigits','pm1Probability','sieveDepthDigits','n',
            'fmtCpuTime','attemptCpuSeconds','computeCostToFinish','e','logSwallowed',
            'YIELD_CALIB_MIN_FINDS', '_gridSort', 'escHtml', body)(
            () => [10,15,20,25,30,35,40,45,50,55,60,65], 70000, attempts,
            (p) => (p * 100).toFixed(2) + '%', (x) => Number(x), () => 25,
            opts.ecmP || (() => 0.5), () => 0.5, () => 16, () => 0.25, () => sieveDigits, 402,
            () => '1 s', opts.cpu || (() => 1), () => covRows(0.42), {}, () => {}, 30, opts.sort, M.escHtml);
          // Cells counted by COLSPAN: the summary rows span their label across the
          // first columns, and a plain tag count would call them misaligned.
          const cells = (html, tag) => (html.match(new RegExp('<' + tag + '(?:\\s[^>]*)?>', 'g')) || [])
            .reduce((n, t) => n + (Number((t.match(/colspan="(\d+)"/) || [])[1]) || 1), 0);
          const rowsOf = (html) => html.split('<tbody>')[1].split('</tr>').filter(r => /<td/.test(r));
          const runs = [{ method: 'ECM', b1: '50000', b2: '13000000', curves: '214' },
                        { method: 'P-1', b1: '2500000', b2: '1300000000' }];
          const h = render(runs, 12);
          const headN = cells(h.split('<tbody>')[0], 'th');
          eq(headN, 4 + 2 + 12 + 1 + 1 + 1 + 1,
             'the header has the fixed columns plus ONE PER LEVEL — twelve here');
          const rs = rowsOf(h);
          eq(rs.length, 1 + 2 + 6, 'a Sieve row, one row per run, and six summary rows');
          // ── a run's fields cannot inject markup ────────────────────────────────
          // Run data comes from files — your logs, GitHub, or someone else's. Every field
          // is escaped: unescaped, a note of <img src=x onerror=…> would run code as the
          // entry opened, with the GitHub token readable from the same page. The dates
          // also go inside a title="…" attribute, where a quote alone would break out.
          {
            const evil = [{ method: 'ECM<img src=x onerror=a()>', b1: '50000"><script>b()</script>', b2: '<svg onload=c()>',
                            curves: '<i>9</i>', tool: '<iframe src=//x>', note: '<b onmouseover=d()>hi</b>',
                            date: '2026-01-01"><img src=x onerror=e()>', lastRun: '2026-02-02' }];
            const hx = render(evil, 12);
            ok(!/<(img|script|svg|iframe|b|i)[\s>]/i.test(hx.split('<tbody>')[1]),
               "no field of a run can inject markup — every one is escaped");
            ok(/&lt;img src=x onerror=a\(\)&gt;/.test(hx) && /&lt;b onmouseover=d\(\)&gt;hi&lt;\/b&gt;/.test(hx),
               'the text is shown as text instead');
            ok(!/title="First run 2026-01-01">/.test(hx) && /2026-01-01&quot;&gt;/.test(hx),
               'and a quote in a date cannot break out of its title attribute');
          }
          ok(rs.every(r => cells(r, 'td') === headN),
             'every row has exactly as many cells as the header — the grid stays aligned');
          ok(/<strong>Sieve<\/strong>/.test(rs[0]), 'the Sieve row comes first');
          // A sieve to 10^12 clears t10: that cell reads "none", proven.
          ok(/>none</.test(rs[0]) && (rs[0].match(/>none</g) || []).length === 1,
             'levels the sieve has cleared read "none" — only t10 at a depth of 12');
          // Optional columns appear when used, and alignment still holds.
          const withAll = render([{ method: 'ECM', b1: '50000', curves: '1', poly: 'x^1', I: '2', date: '2026-09-01' }], 0);
          const hn2 = cells(withAll.split('<tbody>')[0], 'th');
          eq(hn2, headN + 2, 'Poly and -I appear once a run uses them (Date is always there)');
          ok(rowsOf(withAll).every(r => cells(r, 'td') === hn2), 'and the rows stay aligned with them');
          // …and are hidden when nothing uses them, which is the usual case.
          ok(!/<th>Poly<\/th>/.test(h) && />Date<\/th>/.test(h),
             'unused Poly/-I are hidden, but Date always shows — undated runs used to hide it');

          // ── sorting by clicking a heading ─────────────────────────────────
          // Each row keeps its ORIGINAL index for ✕: after a sort, the row on screen is
          // no longer the i-th stored run, and deleting by screen position would delete
          // the wrong one. Reading the delete indices back checks both at once.
          const sruns = [
            { method: 'ECM', b1: '1000000', curves: '842', lastRun: '2026-09-18' },   // stored 0
            { method: 'ECM', b1: '50000',   curves: '214' },                          // stored 1, undated
            { method: 'ECM', b1: '250000',  curves: '410', lastRun: '2026-09-02' },   // stored 2
          ];
          const ecmP = (d, cv, b1v) => Math.min(1, b1v / 1e6), cpu = (a) => parseInt(a.curves) || 0;
          const order = (sort) => rowsOf(render(sruns, 0, { ecmP, cpu, sort }))
            .filter(r => /ecm-delete/.test(r)).map(r => +(r.match(/deleteECMAttempt\(402, (\d+)\)/) || [])[1]);
          eq(order(undefined), [0, 1, 2], 'unsorted, the runs keep the order they were logged');
          eq(order({ key: 't30', dir: -1 }), [0, 2, 1], 'sorted by t30, highest coverage first');
          eq(order({ key: 'cpu', dir: 1 }), [1, 2, 0], 'sorted by CPU time, cheapest first');
          eq(order({ key: 'date', dir: 1 }), [2, 0, 1], 'by date — with the undated run last');
          eq(order({ key: 'date', dir: -1 }), [0, 2, 1], 'last in either direction');
          ok(/>t30 ▼<\/th>/.test(render(sruns, 0, { ecmP, cpu, sort: { key: 't30', dir: -1 } })),
             'the sorted column shows which way it is sorted');
          // ── the Date column ───────────────────────────────────────────────
          const dr = rowsOf(render(sruns, 0, { ecmP, cpu }));
          ok(/>2026-09-18</.test(dr[0]), 'a dated run shows when it was last extended');
          ok(/title="Logged before dates were recorded">—</.test(dr[1]), 'an undated run says why it has no date');
          // ── continuous shading ────────────────────────────────────────────
          const cell = (p) => rowsOf(render([{ method: 'ECM', b1: '1', curves: '1' }], 0, { ecmP: () => p }))[0];
          ok(/var\(--green\) 50%, transparent/.test(cell(1)), 'a certain level is shaded at full strength');
          ok(/var\(--green\) 25%, transparent/.test(cell(0.25)), 'a quarter-covered one at half — square-root scaling');
          ok(/var\(--green\) 5%, transparent/.test(cell(0.01)), 'so even 1% stays visible');
          ok(!/class="prob-/.test(render(sruns, 0)), 'the three colour bands are gone');
          ok(!/<strong>Sieve<\/strong>/.test(render(runs, 0)), 'no sieve, no Sieve row');

          // ── the summary rows ──────────────────────────────────────────────
          const labels = rs.slice(3).map(r => (r.match(/<strong>([^<]+)<\/strong>/) || [])[1]);
          // Found directly beneath Exists — they belong together: Found is Total x Exists.
          eq(labels, ['Total', 'Exists', 'Found', 'To 63%', 'To 95%', 'Value'],
             'Total, then Exists with Found right beneath it, then the cost rows');
          // TOTAL IS THE COVERAGE MODEL, NOT A PRODUCT OF THE CELLS ABOVE. Each fake
          // run cell is 50% (ECM) or 25% (P-1); multiplying their misses would give
          // 62.50%. The model says 42%, and Total must show the model — P-1 is
          // deterministic, so a naive product double-counts overlapping P-1 runs.
          const total = rs[3];
          ok(/>42\.00%</.test(total) && !/>62\.50%</.test(total),
             'Total shows the coverage model\'s figure, not a naive product of the runs');
          ok(/>1 s</.test(total), 'and carries the total CPU in the CPU column');
          const exists = rs[4];
          ok(/multiplied by 25\.40 \(95% interval 20\.10–31\.70\)/.test(exists),
             'a measured Exists cell carries its ratio and interval on hover');
          ok(/font-style:italic/.test(exists) && /Model estimate, not yet calibrated/.test(exists),
             'and a model-only one looks different, saying so on hover');
          ok(/easy win/.test(rs[8]), 'Value flags the easy win');
          // A level the sieve cleared reads "none" in the summary rows too.
          ok((total.match(/>none</g) || []).length === 1,
             'a sieve-cleared level reads "none" in the summary, not a percentage');
        }
        // The no-attempts branch is unchanged: a sieved entry still shows its result.
        const elseBody = (sec.match(/\} else \{\s*(\/\/ No ECM or P±1 yet[\s\S]*?)\n  \}/) || [])[1];
        if (elseBody) {
          const noAtt = (depth) => new Function('sieveDepthDigits', 'n',
            'let tableHtml;' + elseBody + '; return tableHtml;')(() => depth, 402);
          ok(/none below\s+8d/.test(noAtt(8)), 'a sieved entry with no attempts still shows its sieve result');
        }
      }
    }

    // ── parsed ONCE, not per lookup ───────────────────────────────────────
    // Unmemoised, every lookup JSON-parsed the whole store — 168 KB once a sieve had
    // recorded all 9,865 entries. The completion score reached it from inside the
    // export's sort comparator: ~570,000 parses, about five minutes, per export.
    // Harmless while the store was empty, which is why it went unnoticed.
    {
      let reads = 0;
      const realGet = sb2.kvGet;
      sb2.kvGet = (k) => { if (k === 'eulerFDB_sieveDepth_v1') reads++; return realGet(k); };
      try {
        sb2._sieveDepthMemo = null;
        vm.runInContext('_sieveDepthMemo = null;', sb2);
        for (let i = 0; i < 50; i++) M.sieveDepthDigits(500 + 2 * (i % 5));
        ok(reads <= 1, 'fifty lookups read the store once, not fifty times (read ' + reads + ')');
      } finally { sb2.kvGet = realGet; }
      // …and a write must be visible straight away, or the memo hides it.
      M.recordSieveDepth([998], 1e7);
      eq(Math.round(M.sieveDepthDigits(998)), 7, 'a recorded depth is visible immediately');
      // Every current caller mutates the object loadSieveDepth handed back — which
      // IS the memo — so it stays current by accident. Saving a FRESH object is the
      // case that would expose a save that forgot to refresh the memo.
      M.saveSieveDepth({ 1002: 1e9 });
      eq(Math.round(M.sieveDepthDigits(1002)), 9,
         'saving a brand-new object is visible too, not hidden behind the old memo');
      eq(M.sieveDepthDigits(998), 0,
         'and it REPLACES the store, so the old entry is gone rather than lingering');
    }

    // ── it must SURVIVE a sync ────────────────────────────────────────────
    // Nothing else derives this. A machine that pulls without it silently reverts
    // to "nothing proven", and the probability model starts valuing ECM levels
    // that arithmetic had already cleared.
    if (M.buildSyncPayload && M.mergeSyncPayload) {
      M.recordSieveDepth([700, 702], 1e6);
      const payload = M.buildSyncPayload();
      ok(payload.sieveDepth && Number(payload.sieveDepth[700]) === 1e6,
         'the proven depth travels in the sync payload');

      // DEEPEST wins on merge, whichever side is deeper. Last-writer-wins would let
      // a shallow machine erase a deep machine's proof; max is commutative, so the
      // two converge whichever pulls first.
      M.recordSieveDepth([700], 1e9);          // local is now deeper
      M.mergeSyncPayload({ version: payload.version, fdbCache: {},
                           sieveDepth: { 700: 1e3, 702: 1e9, 704: 1e6 } });
      eq(Math.round(M.sieveDepthDigits(700)), 9, 'a shallower remote cannot lower it');
      eq(Math.round(M.sieveDepthDigits(702)), 9, 'a deeper remote raises it');
      eq(Math.round(M.sieveDepthDigits(704)), 6, 'and an entry only the remote sieved arrives');
    }

    // It feeds completionOdds on the same scale as the ECM depth.
    if (PURE.completionOdds) {
      const shallow = PURE.completionOdds(200, 0, 3);
      const deep    = PURE.completionOdds(200, 0, 9);
      ok(deep > shallow, 'a deeper proven exclusion raises the completion odds');
    }
  } finally {
    sb2.__ls = {};
  }
});

// ── Dickman's rho, against PUBLISHED values ─────────────────────────────────
// rho sits under every probability in the app. It was rebuilt from a per-u
// recompute — which solved the delay equation from 0 on every cache miss and made
// a cold export take ~5 minutes — into one table built once in ~20 ms.
//
// Agreeing with the OLD function would prove nothing: its grid step was
// u/ceil(u*200), varying non-smoothly with u, so it wobbled by up to 15% between
// neighbouring values. These are the literature values instead.
group('dickman-rho-reference-values', () => {
  if (!needs(PURE, 'dickmanRho')) return;
  const R = PURE.dickmanRho;
  eq(R(0.5), 1, 'rho is 1 below u=1');
  eq(R(1), 1, 'and at u=1');
  ok(Math.abs(R(2) - (1 - Math.log(2))) < 1e-12, 'rho(2) = 1 - ln 2 exactly');
  const ref = [[3, 0.0486083882], [4, 0.0049109256], [5, 0.0003547247],
               [6, 1.9649696e-5], [8, 3.2324e-8], [10, 2.7702e-11]];
  // 1.5%, not a loose 2%: the table achieves 0.18-0.88% on these, so a looser bound
  // let a grid 30x coarser pass unnoticed.
  for (const [u, v] of ref) {
    const rel = Math.abs(R(u) - v) / v;
    ok(rel < 0.015, 'rho(' + u + ') within 1.5% of the published ' + v + ' (off ' + (100*rel).toFixed(2) + '%)');
  }
  // OFF-GRID points. The integers above are all exact grid points (u*600 is whole),
  // where the interpolation fraction is ZERO — so a broken interpolation formula
  // cannot show there. These sit mid-cell, against a 3000-step reference.
  const offGrid = [[3.3337, 2.364428e-2], [4.7501, 7.033058e-4],
                   [6.2508, 9.186264e-6], [8.1004, 2.302308e-8]];
  for (const [u, v] of offGrid) {
    const rel = Math.abs(R(u) - v) / v;
    ok(rel < 0.015, 'rho(' + u + ') mid-cell within 1.5% of a fine reference (off '
       + (100*rel).toFixed(2) + '%)');
  }
  // Strictly decreasing — a table indexing slip would show up as a step or a bump.
  let prev = R(2), mono = true;
  for (let u = 2.01; u <= 30; u += 0.013) { const r = R(u); if (!(r < prev)) mono = false; prev = r; }
  ok(mono, 'strictly decreasing across the whole range, with no steps from interpolation');
  ok(R(50) === 0 && R(1e6) === 0, 'beyond the table it is nothing, not garbage');
  ok(R(40) > 0 && isFinite(R(40)), 'and just inside the table it is still a real value');
});

// ── a factorless cofactor is E(n) itself — no BigInt round trip ─────────────
// getCofactor used to parse E(n), divide by nothing, and toString it back to the
// identical string: ~10 ms per 40,000-digit entry to produce e.val. The shortcut
// must return EXACTLY what the long way did, or it is a behaviour change dressed as
// a speedup.
group('cofactor-shortcut-is-exact', () => {
  if (!needs(M, 'getCofactor')) return;
  const long = (val) => { const b = BigInt(val); return { str: b.toString(), digits: b.toString().length, big: b }; };
  for (const val of ['7', '600851475143', '9'.repeat(4000), '1' + '0'.repeat(3000) + '7']) {
    const got = M.getCofactor({ val, factors: [], status: 'partial' });
    const ref = long(val);
    ok(got.str === ref.str && got.digits === ref.digits && got.big === ref.big,
       'a factorless ' + val.length + '-digit entry matches the long path exactly');
  }
  // Non-canonical input must NOT take the shortcut: BigInt normalises it, and the
  // shortcut would hand back the unnormalised text.
  const padded = M.getCofactor({ val: '000123', factors: [], status: 'partial' });
  eq(padded && padded.str, '123', 'a value with leading zeros still comes back normalised');
  // .big is computed at most once, even when a caller reads it twice.
  let parses = 0;
  const realBigInt = sb2.BigInt;
  const cof = M.getCofactor({ val: '600851475143', factors: [], status: 'partial' });
  sb2.BigInt = (x) => { parses++; return realBigInt(x); };
  try { const a = cof.big, b = cof.big; ok(a === b, 'both reads agree'); }
  finally { sb2.BigInt = realBigInt; }
  ok(parses <= 1, 'and it parsed at most once for two reads (' + parses + ')');
  // Entries WITH factors still take the full path.
  const withF = M.getCofactor({ val: '600851475143', factors: ['71'], status: 'partial' });
  eq(withF.str, String(600851475143n / 71n), 'an entry with factors is still divided');
});

// ── curve counts in full ────────────────────────────────────────────────────
// "~2k" hid the figure that decides whether to run it, callers added their own "~"
// to print "~~2k", and the export's fallback turned "~2k" into 2 curves.
// ── cost table targets: 63% and 95%, and VALUE on the next one not reached ────
// The targets moved from 90%/99% to 63% (one expected find) and 95%. VALUE had
// been the payoff of reaching the LOWER target, which would blank it the moment a
// level passed 63% — erasing it for exactly the levels between the two targets,
// where whether to keep going is the live question. It now follows whichever
// target is next.
group('cost-targets-63-95', () => {
  if (!needs(PURE, 'computeCostToFinish')) return;
  const src3 = fs.readFileSync('index.html', 'utf8');
  ok(/const COST_TARGET_LO = 0\.63;/.test(src3) && /const COST_TARGET_HI = 0\.95;/.test(src3),
     'the targets are 63% and 95%');
  ok(/sumRow\('To 63%',/.test(src3) && /sumRow\('To 95%',/.test(src3) && !/TO 90%|TO 99%/.test(src3),
     'and the summary rows are labelled with them');
  // Drive real rows: a big composite with a moderate amount of t15 work, so one
  // level lands between the targets.
