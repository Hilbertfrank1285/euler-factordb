// ── the push guard ──────────────────────────────────────────────────────────
// A push REPLACES GitHub's files, so anything GitHub holds that this browser lacks
// is destroyed. The guard merges when GitHub changed since the last sync, and stops
// to ask when this browser is missing things it did not delete.
group('push-guard-losses', () => {
  if (!needs(PURE, 'pushLosses', 'applyDeletionsToEcm', 'factorsFromPayload', 'ecmRunId', 'lossMessage')) return;
  const { pushLosses, applyDeletionsToEcm, factorsFromPayload } = PURE;
  const run = (b1, curves) => ({ method: 'ECM', b1, curves });
  const none = { runs: new Set(), entries: new Set() };
  const base = (ecm, factors) => ({ ecm, factors: factors || {} });
  const gh = { '10': [run('250000', '100')], '12': [run('1000000', '50')] };
  const copy = (x) => JSON.parse(JSON.stringify(x));
  let L = pushLosses(base(gh), copy(gh), {}, none);
  eq([L.runs.length, L.factors.length], [0, 0], 'nothing is lost when this browser has everything GitHub has');
  L = pushLosses(base(gh), { '10': [run('250000', '140')], '12': [run('1000000', '50')] }, {}, none);
  eq(L.runs.length, 0, 'a run with MORE curves here is the same run grown — not a loss');
  L = pushLosses(base(gh), Object.assign({ '14': [run('11000', '74')] }, copy(gh)), {}, none);
  eq(L.runs.length, 0, 'runs only here are additions, not losses');
  L = pushLosses(base(gh), { '10': [run('250000', '100')] }, {}, none);
  eq(L.runs.map(r => r.n + ':' + r.why), ['12:missing'], 'a run GitHub has and this browser lacks is a loss');
  L = pushLosses(base(gh), { '10': [run('250000', '60')], '12': [run('1000000', '50')] }, {}, none);
  eq(L.runs.map(r => r.n + ':' + r.why + ':' + r.curves), ['10:fewer curves:40'],
     'fewer curves than GitHub is recorded work lost — and how much');
  eq(PURE.ecmRunId(12, run('1000000', '50')), '12|ECM|1000000', "a run is identified by entry, method and B1 — the merge's own rule");
  const delRun = { runs: new Set(['12|ECM|1000000']), entries: new Set() };
  L = pushLosses(base(gh), { '10': [run('250000', '100')] }, {}, delRun);
  eq(L.runs.length, 0, 'a run deleted HERE is deliberate, not a loss');

  const p = '1000003', q = '1000033', pq = String(1000003n * 1000033n);
  L = pushLosses(base({}, { '10': [pq] }), {}, { '10': [p, q] }, none);
  eq(L.factors.length, 0, 'a composite factor on GitHub, split into its primes here, is not a loss');
  L = pushLosses(base({}, { '10': [p, '1000037'] }), {}, { '10': [p] }, none);
  eq(L.factors.map(x => x.n + ':' + x.f), ['10:1000037'], 'a factor this browser neither has nor implies IS a loss');
  L = pushLosses(base({ '10': [run('250000', '100')] }, { '10': [p] }), {}, {}, { runs: new Set(), entries: new Set(['10']) });
  eq([L.runs.length, L.factors.length], [0, 0], 'an entry reset HERE loses nothing — its runs and factors went deliberately');
  L = pushLosses(base(gh, { '10': [p], '12': [q] }), {}, {}, none);
  eq([L.runs.length, L.factors.length], [2, 2], 'a browser whose storage was cleared would lose everything — all of it reported');
  eq(pushLosses(null, {}, {}, none).runs.length, 0, 'with no record of GitHub at all, nothing is claimed lost (the guard pulls first instead)');

  const a1 = JSON.stringify(gh), loc = { '10': [run('250000', '60')] }, a2 = JSON.stringify(loc);
  pushLosses(base(gh), loc, {}, none);
  ok(JSON.stringify(gh) === a1 && JSON.stringify(loc) === a2, 'checking changes neither copy — the merge core is pure');

  eq(Object.keys(applyDeletionsToEcm(gh, delRun)), ['10'], 'deleted runs are removed, and an entry left empty goes with them');
  ok(applyDeletionsToEcm(gh, none) === gh, 'with nothing deleted, the store comes back as it was');
  eq(JSON.stringify(factorsFromPayload({ fdbCache: { '10': { n: 10, factors: ['3', '1', 'x'] }, '12': { n: 12, status: 'C' } } })),
     JSON.stringify({ '10': ['3'] }), 'factors are read per entry; placeholders and non-numbers are skipped');

  const msg = PURE.lossMessage({ runs: [{ n: 12 }, { n: 12 }, { n: 14 }], factors: [{ n: 10, f: '7' }] });
  ok(/• 3 ECM runs on 2 entries/.test(msg) && /• 1 factor on 1 entry/.test(msg) && /\(E\(10\), E\(12\), E\(14\)\)/.test(msg),
     'the question says what would go, how much, and where');
  ok(/OK — restore them from GitHub first, then push \(recommended\)/.test(msg) && /Cancel — do not push/.test(msg),
     'and what each answer does');
});

groupAsync('git-blob-sha', () => {
  const src9 = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const m = src9.match(/async function gitBlobSha\(bytes\) \{[\s\S]*?\n\}/);
  ok(!!m, 'gitBlobSha can be located');
  if (!m) return;
  const sha = new Function(m[0] + '\nreturn gitBlobSha;')();
  const enc = (t) => new TextEncoder().encode(t);
  return (async () => {
    // The ID GitHub reports is git's blob hash; these are real `git hash-object` outputs.
    eq(await sha(enc('hello\n')), 'ce013625030ba8dba906f756967f9e9ca394464a', 'matches git for "hello\\n"');
    eq(await sha(new Uint8Array(0)), 'e69de29bb2d1d6434b8b29ae775ad8c2e48c5391', 'and for the empty file');
    // Hashed over BYTES: "é\n" is 2 characters but 3 bytes, and git counts bytes.
    eq(await sha(enc('é\n')), 'c6003325155f475bd7c87731607525dce73be9cf', 'and counts bytes, not characters');
  })();
});

// A brand-new, empty data repository: neither file exists yet. The first push must be
// able to create them — the pull that finds nothing is a completed pull, not a failure.
groupAsync('push-guard-fresh-repo', () => {
  const srcF = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const grabF = (name) => { const at = srcF.indexOf('function ' + name + '(');
    if (at < 0) return '';
    for (let j = srcF.indexOf('{', at), d = 0; j < srcF.length; j++) {
      if (srcF[j] === '{') d++; else if (srcF[j] === '}' && --d === 0) return (srcF.slice(at - 6, at) === 'async ' ? 'async ' : '') + srcF.slice(at, j + 1); }
    return ''; };
  const code = ['githubPull', 'pullBothFromGitHub', 'setSyncBase', 'loadSyncBase', 'repoKeyNow', 'compactEcm',
                'localHasMainData', 'remoteShaOf', 'dataListing'].map(grabF);
  ok(code.every(Boolean), 'the real pull and pullBothFromGitHub can be located');
  if (!code.every(Boolean)) return;
  const world = (ecmPull) => new Function('loadGHSettings', 'setGHBtns', 'setGHStatus', 'addLog', 'fetch', 'GH_DATA_FILE',
      'pullECMFile', 'logSwallowed', 'kvGet', 'kvSet', 'fdbCache', 'hasDeletionsPending', 'markDirty',
      'let _syncBase = null; let _ecmPullPromise = null;\n' + (srcF.match(/const SYNC_BASE_KEY = '[^']+';/) || [''])[0] + '\n'
      + (srcF.match(/const DATA_DIR = '[^']+';/) || [''])[0] + '\n' + code.join('\n') + '\nreturn { pullBothFromGitHub, base: () => _syncBase };')(
      () => ({}), () => {}, () => {}, () => {}, async () => ({ status: 404, ok: false }), 'results.json', ecmPull, () => {},
      () => null, () => {}, {}, () => false, () => {});
  return (async () => {
    let w = world(async () => false);              // pullECMFile on a 404: "no file yet — nothing changed"
    ok(await w.pullBothFromGitHub(), 'an empty repository counts as read, so the first push can create the files');
    eq(w.base() && w.base().mainSha, null, 'and the guard knows GitHub holds nothing yet');
    w = world(async () => { throw new Error('HTTP 500 pulling ECM file'); });
    ok(!(await w.pullBothFromGitHub()), 'while a real error reading the ECM file still stops the push');
  })();
});

// A file GitHub has not changed since this browser merged it is not downloaded again:
// one small request for its ID replaces 8 MB (results.json) or 5 MB (the ECM file).
groupAsync('pull-skips-unchanged', () => {
  const srcA = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const grabA = (name) => { const at = srcA.indexOf('function ' + name + '(');
    if (at < 0) return '';
    for (let j = srcA.indexOf('{', at), d = 0; j < srcA.length; j++) {
      if (srcA[j] === '{') d++; else if (srcA[j] === '}' && --d === 0) return (srcA.slice(at - 6, at) === 'async ' ? 'async ' : '') + srcA.slice(at, j + 1); }
    return ''; };
  const code = ['githubPull', 'pullECMFile', 'setSyncBase', 'loadSyncBase', 'repoKeyNow', 'compactEcm', 'remoteShaOf',
                'localHasMainData', 'localHasEcmData', 'dataListing'].map(grabA);
  ok(code.every(Boolean), 'the real pulls and their helpers can be located');
  if (!code.every(Boolean)) return;
  const world = (o) => {
    const kv = { eulerFDB_syncBase_v1: JSON.stringify({ repoKey: 'u/r@main', mainSha: 'M1', ecmSha: 'E1', factors: {}, ecm: {} }) };
    const calls = [], shas = Object.assign({ 'results.json': 'M1', 'results_ecm.json': 'E1' }, o.gh || {});
    const settings = Object.assign({ user: 'u', repo: 'r', branch: 'main', token: 't' }, o.settings || {});
    // A fake GitHub: an ID request gets the file's ID; a download fails at once, since
    // all these tests need to know is whether one was ATTEMPTED.
    const fakeFetch = async (url, opts) => {
      const file = /contents\/([^?]+)/.exec(url)[1], raw = /raw/.test(((opts || {}).headers || {}).Accept || '');
      if (file === 'data') return { ok: false, status: 404, json: async () => ({}) };   // not migrated: the old files
      calls.push({ file, raw });
      return raw ? { ok: false, status: 500, json: async () => ({}) } : { ok: true, status: 200, json: async () => ({ sha: shas[file] }) };
    };
    const api = new Function('loadGHSettings', 'setGHBtns', 'setGHStatus', 'addLog', 'fetch', 'GH_DATA_FILE', 'GH_ECM_FILE',
      'logSwallowed', 'kvGet', 'kvSet', 'fdbCache', 'loadECM', 'renderStats', 'applyFilters', 'hasDeletionsPending', 'markDirty',
      'let _syncBase = null; let _ecmPullPromise = null;\n' + (srcA.match(/const SYNC_BASE_KEY = '[^']+';/) || [''])[0] + '\n'
      + (srcA.match(/const DATA_DIR = '[^']+';/) || [''])[0] + '\n' + code.join('\n')
      + '\nreturn { githubPull, pullECMFile, setSyncBase, loadSyncBase, ecm: () => _ecmPullPromise };')(
      () => settings, () => {}, () => {}, () => {}, fakeFetch, 'results.json', 'results_ecm.json', () => {},
      (k) => (k in kv ? kv[k] : null), (k, v) => { kv[k] = v; }, o.cleared ? {} : { V: { n: 4 } },
      () => (o.cleared ? {} : { '4': [{ method: 'ECM', b1: '11000', curves: '1' }] }), () => {}, () => {}, () => false, () => {});
    return { api, calls, kv };
  };
  const raw = (w, file) => w.calls.filter(c => c.raw && c.file === file).length;
  const ecmDirect = async (w) => { try { await w.api.pullECMFile(); } catch (e) { /* the fake download fails on purpose */ } };
  return (async () => {
    let w = world({});
    ok(await w.api.githubPull(true), 'an unchanged GitHub still counts as a successful pull');
    await w.api.ecm();
    eq([raw(w, 'results.json'), raw(w, 'results_ecm.json')], [0, 0], 'neither file is downloaded when GitHub has not changed');
    eq(w.calls.filter(c => !c.raw).length, 2, 'just two small requests, for their IDs');

    w = world({ gh: { 'results.json': 'M2' } });
    await w.api.githubPull(true); await ecmDirect(w);
    eq([raw(w, 'results.json'), raw(w, 'results_ecm.json')], [1, 0], 'a changed file is downloaded — and only that one');

    w = world({ gh: { 'results_ecm.json': 'E2' } });
    await w.api.githubPull(true); await w.api.ecm();
    eq([raw(w, 'results.json'), raw(w, 'results_ecm.json')], [0, 1], 'the same holds for the ECM file on its own');

    w = world({ cleared: true });
    await w.api.githubPull(true); await ecmDirect(w);
    eq([raw(w, 'results.json'), raw(w, 'results_ecm.json')], [1, 1],
       'after local data is cleared, both are downloaded — whatever IDs are remembered');

    w = world({ settings: { repo: 'other' } });
    await w.api.githubPull(true);
    eq(raw(w, 'results.json'), 1, 'another repository or branch never reuses what this one held');
    eq(w.api.loadSyncBase(), null, "and a remembered version from another repository is not even loaded");

    w = world({});
    w.api.setSyncBase({ ecmSha: 'E9', ecm: { '4': [{ method: 'ECM', b1: '11000', curves: '3', sigmas: ['a', 'b', 'c'] }] } });
    const saved = JSON.parse(w.kv.eulerFDB_syncBase_v1);
    ok(saved.ecmSha === 'E9' && saved.mainSha === 'M1', "what GitHub holds is remembered for the next visit, alongside what was there");
    ok(!('sigmas' in saved.ecm['4'][0]) && saved.ecm['4'][0].curves === '3', 'as a compact record — counts, not every sigma');
  })();
});

// ── the data, in chunks ────────────────────────────────────────────────────────
// Pushes and pulls move only the blocks that changed. Splitting must lose nothing and
// any subset of the files must be a valid partial payload for the unchanged merge.
group('chunks-split-and-join', () => {
  if (!needs(PURE, 'splitMainPayload', 'joinMainParts', 'splitEcm', 'joinEcmParts', 'replaceRanges', 'chunkRange')) return;
  const P = PURE;
  const payload = {
    version: 3, updatedAt: '2026-09-30T00:00:00Z',
    fdbCache: { '4': { n: 4, status: 'FF' }, '998': { n: 998, status: 'CF', factors: ['7'] }, '1000': { n: 1000, status: 'C' }, 'odd': { n: 0 } },
    cofactorDigits: { '998': [300, 'h1'], '1002': [310, 'h2'] },
    sieveDepth: { '1000': 12 },
    history: [[998, 1, 1, 'e', 'a'], [1000, 2, 2, 's', 'b'], ['x', 3, 3, 'e', 'c']],
    changelog: [{ n: 998, ts: 5 }], calib: [[5.2, 'm1c1', 1]], fdbUnknown: [1000],
  };
  const files = P.splitMainPayload(payload);
  eq(Object.keys(files).sort(), ['data/main-00000.json', 'data/main-01000.json', 'data/meta.json'],
     'one file per block of 1,000 entries, plus meta');
  eq(Object.keys(files['data/main-00000.json'].fdbCache).sort(), ['4', '998'], 'E(998) belongs to the first block…');
  eq(Object.keys(files['data/main-01000.json'].fdbCache), ['1000'], '…and E(1000) to the next');
  ok(!('updatedAt' in files['data/meta.json']), 'no timestamp — it would change every file on every push');
  eq(Object.keys(files['data/meta.json']).sort(), ['calib', 'changelog', 'fdbCache', 'fdbUnknown', 'history', 'version'],
     'global parts go to meta, and anything unexpected is kept there rather than dropped');
  const back = P.joinMainParts(Object.values(files));
  const want = JSON.parse(JSON.stringify(payload)); delete want.updatedAt;
  const norm = (x) => JSON.stringify(x, Object.keys(x).sort());
  eq(norm(back.fdbCache), norm(want.fdbCache), 'split then joined, the FactorDB records come back whole');
  eq(JSON.stringify(back.history.slice().sort()), JSON.stringify(want.history.slice().sort()), 'and so does the discovery history');
  eq([JSON.stringify(back.cofactorDigits), JSON.stringify(back.sieveDepth), JSON.stringify(back.changelog)],
     [JSON.stringify(want.cofactorDigits), JSON.stringify(want.sieveDepth), JSON.stringify(want.changelog)], 'and everything else');
  const onlyFirst = P.joinMainParts([files['data/main-00000.json']]);
  ok(!('changelog' in onlyFirst) && Object.keys(onlyFirst.fdbCache).length === 2, 'one block alone is just that block — a valid partial payload');
  const ecm = { '4': [{ method: 'ECM', b1: '11000', curves: '5' }], '1998': [{ method: 'P-1', b1: '1e6', curves: '1' }] };
  const ef = P.splitEcm(ecm);
  eq(Object.keys(ef).sort(), ['data/ecm-00000.json', 'data/ecm-01000.json'], 'runs are split the same way');
  eq(JSON.stringify(P.joinEcmParts(Object.values(ef))), JSON.stringify(ecm), 'and join back exactly');
  eq(JSON.stringify(P.chunkRange('data/ecm-01000.json')), '[1000,2000]', 'a file knows the block it holds');
  eq(Object.keys(P.replaceRanges({ '4': 1, '1002': 2, '2004': 3 }, { '1006': 9 }, [[1000, 2000]])).sort(), ['1006', '2004', '4'],
     'what GitHub holds is updated block by block — only the blocks just pulled are replaced');
});

groupAsync('chunks-push-plan', () => {
  const srcB = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const grabB = (name) => { const at = srcB.indexOf('function ' + name + '(');
    if (at < 0) return '';
    for (let j = srcB.indexOf('{', at), d = 0; j < srcB.length; j++) {
      if (srcB[j] === '{') d++; else if (srcB[j] === '}' && --d === 0) return (srcB.slice(at - 6, at) === 'async ' ? 'async ' : '') + srcB.slice(at, j + 1); }
    return ''; };
  const consts = ['DATA_DIR', 'CHUNK_N', 'META_PATH', 'PER_N_MAPS', 'PER_N_ROWS'].map(n => (srcB.match(new RegExp('const ' + n + ' *= *[^;]+;')) || [''])[0]);
  const code = ['planChunkedPush', 'splitMainPayload', 'splitEcm', 'chunkStart', 'chunkName', 'isMainChunk', 'isEcmChunk',
                'serializeSyncPayload', 'gitBlobSha'].map(grabB);
  ok(code.every(Boolean) && consts.every(Boolean), 'the push planner can be located');
  if (!code.every(Boolean)) return;
  const plan = new Function(consts.join('\n') + '\n' + code.join('\n') + '\nreturn planChunkedPush;')();
  // A changelog line with an arrow, as real ones have: characters and UTF-8 bytes differ.
  const payload = { version: 3, fdbCache: { '4': { n: 4, status: 'FF' }, '1002': { n: 1002, status: 'C' } }, changelog: [{ n: 4, ts: 1, msg: 'E(4) → FF' }] };
  const ecm = { '4': [{ method: 'ECM', b1: '11000', curves: '5' }], '1002': [{ method: 'ECM', b1: '50000', curves: '9' }] };
  return (async () => {
    const all = await plan(payload, ecm, null);
    eq(all.map(x => x.path).sort(), ['data/ecm-00000.json', 'data/ecm-01000.json', 'data/main-00000.json', 'data/main-01000.json', 'data/meta.json'],
       'the first push writes every file — the migration from the two old files');
    const listing = Object.fromEntries(all.map(x => [x.path, x.sha]));
    eq((await plan(payload, ecm, listing)).length, 0, 'when GitHub already holds exactly this, nothing is sent');
    const more = JSON.parse(JSON.stringify(ecm)); more['1002'][0].curves = '12';
    eq((await plan(payload, more, listing)).map(x => x.path), ['data/ecm-01000.json'],
       'three more curves on E(1002): only that block is sent — not 12 MB');
    const gone = { '4': ecm['4'] };
    const emptied = (await plan(payload, gone, listing)).find(x => x.path === 'data/ecm-01000.json');
    ok(emptied && JSON.parse(emptied.text).ecm && Object.keys(JSON.parse(emptied.text).ecm).length === 0,
       'a block emptied here is written empty — or its old runs would stay on GitHub');
    ok(all.every(x => /^[0-9a-f]{40}$/.test(x.sha)), 'every file carries the git blob ID it will have');
    ok(all.every(x => x.bytes === Buffer.byteLength(x.text, 'utf8')), 'and its exact size in bytes, for the push log');
  })();
});

groupAsync('chunks-pull', () => {
  const srcP = fs.readFileSync(path.join(__dirname, 'index.html'), 'utf8');
  const grabP = (name) => { const at = srcP.indexOf('function ' + name + '(');
    if (at < 0) return '';
    for (let j = srcP.indexOf('{', at), d = 0; j < srcP.length; j++) {
      if (srcP[j] === '{') d++; else if (srcP[j] === '}' && --d === 0) return (srcP.slice(at - 6, at) === 'async ' ? 'async ' : '') + srcP.slice(at, j + 1); }
    return ''; };
  const consts = ['DATA_DIR', 'CHUNK_N', 'META_PATH', 'PER_N_MAPS', 'PER_N_ROWS', 'SYNC_BASE_KEY', 'inRanges']
    .map(n => (srcP.match(new RegExp('const ' + n + ' *= *[^\\n]+;')) || [''])[0]);
  const code = ['pullChunked', 'pullEcmChunks', 'fetchDataFiles', 'fetchDataFile', 'joinMainParts', 'joinEcmParts', 'replaceRanges',
                'chunkRange', 'isMainChunk', 'isEcmChunk', 'setSyncBase', 'loadSyncBase', 'repoKeyNow', 'compactEcm',
                'localHasMainData', 'localHasEcmData', 'factorsFromPayload', 'gitBlobSha', 'fmtSecs', 'fmtTransfer'].map(grabP);
  ok(code.every(Boolean) && consts.every(Boolean), 'the chunked pull can be located');
  if (!code.every(Boolean) || !consts.every(Boolean)) return;
  const enc = (o) => new TextEncoder().encode(JSON.stringify(o));
  const shaOf = new Function(grabP('gitBlobSha') + '\nreturn gitBlobSha;')();
  const repo = {
    'data/meta.json': { version: 3, changelog: [] },
    'data/main-00000.json': { fdbCache: { '4': { n: 4, status: 'FF', factors: ['61'] } } },
    'data/ecm-00000.json': { ecm: { '4': [{ method: 'ECM', b1: '11000', curves: '5' }] } },
  };
  return (async () => {
    const shas = {};
    for (const [p, o] of Object.entries(repo)) shas[p] = await shaOf(enc(o));
    const world = async (o) => {
      const kv = {}, urls = [], merged = { main: [], ecm: [] }, logs = [];
      if (o.known) kv.eulerFDB_syncBase_v1 = JSON.stringify({ repoKey: 'u/r@main', files: o.known, factors: {}, ecm: {} });
      const served = Object.assign({}, repo, o.served || {});
      const fakeFetch = async (url) => {
        urls.push(url);
        const path = /contents\/([^?]+)/.exec(url) ? /contents\/([^?]+)/.exec(url)[1] : url.split('/main/')[1];
        return { ok: true, status: 200, arrayBuffer: async () => enc(served[path]).buffer };
      };
      const api = new Function('fetch', 'kvGet', 'kvSet', 'loadGHSettings', 'fdbCache', 'loadECM', 'mergePulledMain', 'mergePulledEcm',
        'addLog', 'setGHStatus', 'renderStats', 'applyFilters', 'hasDeletionsPending', 'markDirty', 'logSwallowed', '_decodeFactor',
        'let _syncBase = null; let _ecmPullPromise = null;\n' + consts.join('\n') + '\n' + code.join('\n')
        + '\nreturn { pullChunked, base: () => _syncBase, ecmDone: () => _ecmPullPromise };')(
        fakeFetch, (k) => (k in kv ? kv[k] : null), (k, v) => { kv[k] = v; }, () => ({ user: 'u', repo: 'r', branch: 'main', token: o.token || '' }),
        o.cleared ? {} : { V: { n: 4 } }, () => (o.cleared ? {} : { '4': [{ method: 'ECM', b1: '11000', curves: '5' }] }),
        (payload, skip, recordBase) => { merged.main.push(payload); recordBase(); }, (e, ranges) => { merged.ecm.push(e); return false; },
        (msg) => logs.push(msg), () => {}, () => {}, () => {}, () => false, () => {}, () => {}, (x) => x);
      const ctx = { user: 'u', repo: 'r', branch: 'main', token: o.token || '', t0: Date.now() };
      await api.pullChunked(o.listing || shas, true, ctx);
      await api.ecmDone();
      return { urls, merged, base: api.base(), logs };
    };
    let w = await world({ known: shas, token: 't' });
    eq(w.urls.length, 0, 'nothing downloaded when no file changed since the last sync');
    w = await world({ known: Object.assign({}, shas, { 'data/main-00000.json': 'old' }), token: 't' });
    eq(w.urls.length, 1, 'one changed block: one download');
    ok(w.merged.main.length === 1 && w.merged.main[0].fdbCache['4'], 'and it is merged through the same merge step as always');
    eq(w.base.files['data/main-00000.json'], shas['data/main-00000.json'], 'its ID is remembered, so the next visit skips it');
    ok(/api\.github\.com/.test(w.urls[0]), 'with a token, fetched through the API — always fresh');
    ok(w.logs.some(m => /^Pulled results from GitHub: 1 file, \d+ KB, in \d+\.\d s$/.test(m)),
       'and the pull logs what it moved and how long it took (' + w.logs.filter(m => /Pulled/.test(m)).join(' | ') + ')');
    w = await world({ cleared: true, known: shas, token: 't' });
    eq(w.urls.length, 3, 'with no local data, every file is downloaded — even with every ID remembered as current');
    w = await world({ known: {}, token: '' });
    ok(w.urls.length === 3 && w.urls.every(u => /^https:\/\/raw\.githubusercontent\.com\/u\/r\/main\/data\//.test(u)),
       "a visitor downloads from GitHub's CDN, which is not rate-limited");
    const dl = new Function('fetch', (srcP.match(/const DATA_DIR = '[^']+';/) || [''])[0] + '\n' + grabP('dataListing') + '\nreturn dataListing;');
    const ctx0 = { user: 'u', repo: 'r', branch: 'main', token: '' };
    eq(await dl(async () => ({ status: 404, ok: false }))(ctx0), null, 'no data/ folder yet: the old files are read');
    let threw = false;
    try { await dl(async () => ({ status: 500, ok: false }))(ctx0); } catch (e) { threw = true; }
    ok(threw, 'but any other failure stops the pull — falling back would merge the frozen old files');
    eq(JSON.stringify(await dl(async () => ({ status: 200, ok: true, json: async () => [{ type: 'file', name: 'meta.json', sha: 'x' }, { type: 'dir', name: 'y', sha: 'z' }] }))(ctx0)),
       JSON.stringify({ 'data/meta.json': 'x' }), 'the listing maps each data file to its ID');
    const stale = { 'data/main-00000.json': { fdbCache: {} } };
    w = await world({ known: {}, token: '', served: stale });
    ok(w.base.files['data/main-00000.json'] !== shas['data/main-00000.json'],
       'a lagging CDN copy is recorded as what it is — so it is fetched again, not taken for the new version');
  })();
});

// ── new since your last visit ─────────────────────────────────────────────────
group('new-since-last-visit', () => {
  if (!needs(PURE, 'pullNews', 'addNewsTo', 'newSinceText')) return;
  const P = PURE;
  const news = P.pullNews({ '10': ['3'], '12': [] }, { '10': ['3', '1000003'], '12': [], '14': ['7'] });
  eq(JSON.stringify(news), JSON.stringify({ '10': { factors: ['1000003'] }, '14': { factors: ['7'] } }),
     'a pull brought a factor on E(10) and one on E(14) — and nothing on E(12)');
  eq(JSON.stringify(P.pullNews({ '10': ['3'] }, { '10': ['3'] })), '{}', 'a pull that brought nothing marks nothing');
  let marks = P.addNewsTo({}, { '10': { factors: ['1000003'] } }, 1);
  marks = P.addNewsTo(marks, { '10': { factors: ['1000003', '1000033'] } }, 2);
  eq([JSON.stringify(marks['10'].factors), marks['10'].at], ['["1000003","1000033"]', 2], 'marks build up until seen — the new factors, as a set');
  eq(JSON.stringify(P.addNewsTo({}, { '10': { curves: 150 } }, 1)), '{}', 'curves alone are not news');
